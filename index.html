<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      --bg: #fff;
      --edge: #111;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: rgba(0, 0, 0, 0.14);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.45);
      --track: rgba(0, 0, 0, 0.12);
      --track-disabled: rgba(0, 0, 0, 0.06);
      --thumb: rgba(0, 0, 0, 0.72);
      --peer-blue: #2f78ff;
    }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --edge: #fafafa;
    --panel-bg: rgba(0, 0, 0, 0.82);
    --panel-border: rgba(255, 255, 255, 0.16);
    --text: #f5f5f5;
    --muted: rgba(245, 245, 245, 0.45);
    --track: rgba(255, 255, 255, 0.14);
    --track-disabled: rgba(255, 255, 255, 0.07);
    --thumb: rgba(255, 255, 255, 0.78);
  }
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color-scheme: light dark;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body {
  position: relative;
  background: var(--bg);
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}
.gear-btn,
.peer-btn {
  position: fixed;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1.7px solid var(--edge);
  background: transparent;
  color: transparent;
  padding: 0;
  display: grid;
  place-items: center;
  cursor: pointer;
  z-index: 20;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  box-sizing: border-box;
  text-shadow: none;
}
.gear-btn {
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: calc(env(safe-area-inset-right, 0px) + 10px);
}
.peer-btn {
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  border-color: var(--edge);
}
.gear-btn span,
.peer-btn .peer-icon {
  font-size: 20px;
  font-weight: 400;
  line-height: 1;
  transform: translateY(-0.5px);
  color: var(--edge);
  -webkit-text-stroke: 0;
  text-shadow: none;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
}
.gear-btn:active,
.peer-btn:active {
  transform: scale(0.97);
}
.peer-btn.hidden {
  display: none;
}
.peer-btn.searching {
  border-color: var(--peer-blue);
  color: var(--peer-blue);
}
.peer-btn.searching .peer-icon {
  display: none;
}
.peer-btn.searching .peer-spinner {
  display: block;
}
.peer-btn.connected {
  border-color: var(--peer-blue);
  color: var(--peer-blue);
}
.peer-btn.connected .peer-icon {
  color: var(--peer-blue);
}
.peer-btn.connected .peer-spinner {
  display: none;
}
.peer-icon {
  display: block;
  width: 20px;
  text-align: center;
}
.peer-spinner {
  display: none;
  position: relative;
  width: 20px;
  height: 20px;
  color: var(--peer-blue);
  animation: peer-spin 0.9s linear infinite;
}
.peer-spinner span {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4px;
  height: 4px;
  margin: -2px 0 0 -2px;
  border-radius: 50%;
  background: currentColor;
  transform-origin: 0 0;
}
.peer-spinner span:nth-child(1) { transform: translate(0, -8px); opacity: 1; }
.peer-spinner span:nth-child(2) { transform: translate(5.5px, -5.5px); opacity: 0.82; }
.peer-spinner span:nth-child(3) { transform: translate(8px, 0); opacity: 0.64; }
.peer-spinner span:nth-child(4) { transform: translate(5.5px, 5.5px); opacity: 0.46; }
.peer-spinner span:nth-child(5) { transform: translate(0, 8px); opacity: 0.34; }
.peer-spinner span:nth-child(6) { transform: translate(-5.5px, 5.5px); opacity: 0.46; }
.peer-spinner span:nth-child(7) { transform: translate(-8px, 0); opacity: 0.64; }
.peer-spinner span:nth-child(8) { transform: translate(-5.5px, -5.5px); opacity: 0.82; }
@keyframes peer-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.26);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 18px;
  box-sizing: border-box;
}
.overlay.open {
  display: flex;
}
.panel {
  width: min(92vw, 460px);
  max-height: min(84vh, 680px);
  overflow: auto;
  border-radius: 26px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
  color: var(--text);
  padding: 18px 18px 16px;
  box-sizing: border-box;
}
.panel-header {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: -18px -18px 18px;
  padding: 18px 18px 14px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.92), rgba(255,255,255,0.82));
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-top-left-radius: 26px;
  border-top-right-radius: 26px;
}
@media (prefers-color-scheme: dark) {
  .panel-header {
    background: linear-gradient(to bottom, rgba(0,0,0,0.92), rgba(0,0,0,0.82));
  }
}
.panel-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.close-btn {
  appearance: none;
  border: 1.5px solid var(--edge);
  background: transparent;
  color: var(--text);
  border-radius: 999px;
  min-width: 42px;
  height: 36px;
  padding: 0 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.close-btn:active {
  transform: scale(0.98);
}
.setting-block {
  padding: 14px 0 4px;
  border-top: 1px solid rgba(127, 127, 127, 0.16);
}
.setting-block:first-of-type {
  border-top: 0;
  padding-top: 0;
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.setting-label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.setting-label .main {
  font-size: 15px;
  font-weight: 650;
  line-height: 1.2;
}
.setting-label .sub {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
}
.switch {
  position: relative;
  width: 56px;
  height: 34px;
  flex: 0 0 auto;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
  position: absolute;
}
.slider {
  position: absolute;
  inset: 0;
  background: rgba(127, 127, 127, 0.18);
  border: 1px solid var(--panel-border);
  border-radius: 999px;
  transition: 0.2s ease;
  cursor: pointer;
}
.slider::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--thumb);
  transition: 0.2s ease;
}
.switch input:checked + .slider {
  background: rgba(55, 180, 90, 0.22);
}
.switch input:checked + .slider::before {
  transform: translateX(22px);
}
.control-row {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
  margin-top: 10px;
}
.mode-select {
  width: 128px;
  height: 36px;
  border-radius: 12px;
  border: 1px solid var(--panel-border);
  background: transparent;
  color: var(--text);
  padding: 0 10px;
  font-size: 14px;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
}
.hex-input {
  width: 100%;
  box-sizing: border-box;
  height: 38px;
  border-radius: 12px;
  border: 1px solid var(--panel-border);
  background: transparent;
  color: var(--text);
  padding: 0 12px;
  font-size: 14px;
  outline: none;
}
.hex-input::placeholder {
  color: var(--muted);
}
.sub-input-wrap {
  margin-top: 10px;
}
.disabled {
  opacity: 0.34;
  pointer-events: none;
}
.range-wrap {
  margin-top: 12px;
  padding-left: 2px;
}
.range-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.range-title {
  font-size: 13px;
  font-weight: 650;
}
.range-value {
  font-size: 12px;
  color: var(--muted);
}
input[type="range"] {
  width: 100%;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  height: 28px;
  outline: none;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 7px;
  border-radius: 999px;
  background: var(--track);
}
.disabled input[type="range"]::-webkit-slider-runnable-track {
  background: var(--track-disabled);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  margin-top: -7.5px;
  background: var(--thumb);
  border: 0;
  box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
}
input[type="range"]::-moz-range-track {
  height: 7px;
  border-radius: 999px;
  background: var(--track);
}
.disabled input[type="range"]::-moz-range-track {
  background: var(--track-disabled);
}
input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--thumb);
  border: 0;
  box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
}
.effect-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 12px;
}
.effect-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 0 0;
}
.effect-item + .effect-item {
  border-top: 1px solid rgba(127, 127, 127, 0.12);
  padding-top: 12px;
}
.effect-name {
  font-size: 13px;
  font-weight: 650;
}
.effect-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.35;
}
.footer-actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.danger-btn {
  appearance: none;
  border: 1.5px solid rgba(220, 40, 40, 0.55);
  background: transparent;
  color: #d23636;
  border-radius: 14px;
  min-width: 0;
  height: 40px;
  padding: 0 14px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  flex: 1 1 auto;
}
.danger-btn:active {
  transform: scale(0.98);
}
.hidden {
  display: none !important;
}
.peer-menu-overlay,
.peer-wizard-overlay {
  position: fixed;
  inset: 0;
  z-index: 35;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.22);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  overflow: hidden;
  padding: 18px;
  box-sizing: border-box;
}
.peer-menu-overlay.open,
.peer-wizard-overlay.open {
  display: flex;
}
.peer-anim-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.peer-ghost {
  position: absolute;
  left: calc(env(safe-area-inset-left, 0px) + 10px);
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1.7px solid var(--peer-blue);
  color: var(--peer-blue);
  background: transparent;
  opacity: 1;
  transform: translate(0, 0) scale(1);
}
.peer-ghost span {
  font-size: 20px;
  font-weight: 400;
  line-height: 1;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
  color: var(--peer-blue);
}
.peer-menu-overlay.animating .peer-ghost {
  animation: ghost-fly 1.5s ease forwards;
}
@keyframes ghost-fly {
  0%   { opacity: 1; transform: translate(0, 0) scale(1); }
  33%  { opacity: 0; transform: translate(16vw, 12vh) scale(0.94); }
  50%  { opacity: 0; transform: translate(30vw, 18vh) scale(0.88); }
  100% { opacity: 1; transform: translate(calc(50vw - 23px), calc(30vh - 23px)) scale(1); }
}
.split-orb {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 20px;
  height: 20px;
  margin-left: -10px;
  margin-top: -10px;
  border-radius: 50%;
  border: 2px solid rgba(47, 120, 255, 0.82);
  background: rgba(47, 120, 255, 0.15);
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.4);
}
.peer-menu-overlay.animating .orb-a {
  animation: orb-a 1s ease forwards;
}
.peer-menu-overlay.animating .orb-b {
  animation: orb-b 1s ease forwards;
}
.peer-menu-overlay.animating .orb-c {
  animation: orb-c 1s ease forwards;
}
@keyframes orb-a {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
  20%  { opacity: 0.75; transform: translate(-50%, -50%) scale(0.7); }
  100% { opacity: 0; transform: translate(-50%, -170%) scale(2.2); }
}
@keyframes orb-b {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
  20%  { opacity: 0.75; transform: translate(-50%, -50%) scale(0.7); }
  100% { opacity: 0; transform: translate(-165%, 80%) scale(2.2); }
}
@keyframes orb-c {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
  20%  { opacity: 0.75; transform: translate(-50%, -50%) scale(0.7); }
  100% { opacity: 0; transform: translate(65%, 80%) scale(2.2); }
}
.peer-menu-card {
  position: relative;
  width: min(92vw, 420px);
  border-radius: 28px;
  border: 1px solid rgba(127, 127, 127, 0.16);
  background: var(--panel-bg);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
  color: var(--text);
  padding: 18px;
  box-sizing: border-box;
  opacity: 0;
  transform: translateY(18px) scale(0.96);
  transition: opacity 0.38s ease, transform 0.38s ease;
  pointer-events: none;
}
.peer-menu-overlay.ready .peer-menu-card {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.peer-menu-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
}
.peer-menu-sub {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 14px;
  line-height: 1.4;
}
.peer-menu-list {
  display: grid;
  gap: 10px;
}
.peer-choice-btn {
  appearance: none;
  border: 1.5px solid rgba(127, 127, 127, 0.22);
  background: transparent;
  color: var(--text);
  border-radius: 16px;
  height: 48px;
  padding: 0 14px;
  font-size: 15px;
  font-weight: 650;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.peer-choice-btn:active {
  transform: scale(0.99);
}
.peer-choice-btn.primary {
  border-color: rgba(47, 120, 255, 0.45);
  color: var(--peer-blue);
}
.peer-choice-btn.danger {
  border-color: rgba(220, 40, 40, 0.48);
  color: #d23636;
}
.peer-wizard-panel {
  width: min(92vw, 460px);
  max-height: min(84vh, 700px);
  overflow: auto;
  border-radius: 28px;
  border: 1px solid rgba(127, 127, 127, 0.16);
  background: var(--panel-bg);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.24);
  color: var(--text);
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
.peer-wizard-header {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 18px 14px;
  border-top-left-radius: 28px;
  border-top-right-radius: 28px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.92), rgba(255,255,255,0.82));
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(127, 127, 127, 0.12);
}
@media (prefers-color-scheme: dark) {
  .peer-wizard-header {
    background: linear-gradient(to bottom, rgba(0,0,0,0.92), rgba(0,0,0,0.82));
  }
}
.peer-wizard-title {
  font-size: 18px;
  font-weight: 700;
}
.peer-wizard-body {
  padding: 18px;
  display: grid;
  gap: 14px;
}
.peer-wizard-note {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}
.qr-box {
  display: grid;
  gap: 10px;
  justify-items: center;
}
.qr-image {
  width: 256px;
  height: 256px;
  border-radius: 20px;
  border: 1px solid rgba(127, 127, 127, 0.18);
  background: rgba(255,255,255,0.92);
  object-fit: cover;
}
.code-area {
  width: 100%;
  min-height: 92px;
  box-sizing: border-box;
  border-radius: 16px;
  border: 1px solid rgba(127, 127, 127, 0.18);
  background: transparent;
  color: var(--text);
  font-size: 12px;
  line-height: 1.35;
  padding: 12px;
  resize: none;
  outline: none;
}
.wizard-actions {
  display: grid;
  gap: 10px;
}
.wizard-btn {
  appearance: none;
  height: 46px;
  border-radius: 16px;
  border: 1.5px solid rgba(127, 127, 127, 0.22);
  background: transparent;
  color: var(--text);
  font-size: 15px;
  font-weight: 650;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.wizard-btn.primary {
  border-color: rgba(47, 120, 255, 0.45);
  color: var(--peer-blue);
}
.wizard-btn.danger {
  border-color: rgba(220, 40, 40, 0.48);
  color: #d23636;
}
.wizard-btn:active {
  transform: scale(0.99);
}
.scan-wrap {
  display: grid;
  gap: 12px;
  justify-items: center;
}
.scan-video-box {
  position: relative;
  width: min(100%, 340px);
  aspect-ratio: 1 / 1;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(127, 127, 127, 0.18);
  background: rgba(0,0,0,0.12);
}
.scan-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
}
.scan-frame {
  position: absolute;
  inset: 14%;
  border-radius: 18px;
  border: 2px solid rgba(47, 120, 255, 0.72);
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.06);
  pointer-events: none;
}
.scan-fallback {
  width: 100%;
  min-height: 88px;
  box-sizing: border-box;
  border-radius: 16px;
  border: 1px solid rgba(127, 127, 127, 0.18);
  background: transparent;
  color: var(--text);
  font-size: 12px;
  line-height: 1.35;
  padding: 12px;
  resize: vertical;
  outline: none;
}
.mini-status {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}
.tiny-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.tiny-row .wizard-btn {
  flex: 1 1 0;
  min-width: 0;
}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button class="gear-btn" id="openSettings" aria-label="設定を開く">
    <span>⛭</span>
  </button>
  <button class="peer-btn hidden" id="peerButton" aria-label="ローカル通信">
    <span class="peer-icon">☋</span>
    <span class="peer-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </span>
  </button>
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="設定">
      <div class="panel-header">
        <div class="panel-title">設定</div>
        <button class="close-btn" id="closeSettings">戻る</button>
      </div>
  <div class="setting-block">
    <div class="setting-row">
      <div class="setting-label">
        <div class="main">背景色</div>
        <div class="sub">システム / 白 / 黒 / カスタム</div>
      </div>
      <select class="mode-select" id="bgMode">
        <option value="system">システム</option>
        <option value="white">白</option>
        <option value="black">黒</option>
        <option value="custom">カスタム</option>
      </select>

        createSwipeEffect(p.x, p.y, dx, dy);
      }
    }
    activePointerId = null;
    strokePoints = [];
    pointerHadLoop = false;
    e.preventDefault();
  }
  canvas.addEventListener('pointerup', finishPointer, { passive: false });
  canvas.addEventListener('pointercancel', finishPointer, { passive: false });
  canvas.addEventListener('lostpointercapture', () => {
    activePointerId = null;
    strokePoints = [];
    pointerHadLoop = false;
  });
  const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function updateThemeAndRenderBg() {
    updateTheme();
    document.body.style.background = getBgColor();
  }
  function initPeerUi() {
    updatePeerButtonUi();
  }
  loadSettings();
  updateThemeAndRenderBg();
  resize();
  syncSettingsUi();
  initPeerUi();
  if (darkMql) {
    if (typeof darkMql.addEventListener === 'function') {
      darkMql.addEventListener('change', updateThemeAndRenderBg);
    } else if (typeof darkMql.addListener === 'function') {
      darkMql.addListener(updateThemeAndRenderBg);
    }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('storage', (ev) => {
    if (ev.key !== PEER_SIGNAL_KEY || !ev.newValue) return;
    try {
      const packet = JSON.parse(ev.newValue);
      handleSignalPacket(packet);
    } catch (_) {}
  });
  const peerChannel = 'BroadcastChannel' in window ? new BroadcastChannel(PEER_CHANNEL_NAME) : null;
  if (peerChannel) {
    peerChannel.onmessage = (ev) => handleSignalPacket(ev.data);
  }
  function sendSignalPacket(packet) {
    const payload = {
      ...packet,
      sender: getSenderId(),
      ts: nowDate(),
      id: Math.random().toString(36).slice(2) + Date.now().toString(36)
    };
    if (peerChannel) {
      try {
        peerChannel.postMessage(payload);
      } catch (_) {}
    }
    try {
      localStorage.setItem(PEER_SIGNAL_KEY, JSON.stringify(payload));
    } catch (_) {}
  }
  let senderId = null;
  function getSenderId() {
    if (!senderId) senderId = Math.random().toString(36).slice(2) + Date.now().toString(36);
    return senderId;
  }
  function handleSignalPacket(packet) {
    if (!packet || typeof packet !== 'object') return;
    if (packet.sender && packet.sender === getSenderId()) return;
    if (packet.type === 'intent') {
      rememberIntentMessage(packet.kind, packet.ts, true);
      return;
    }
    if (packet.type === 'effect' && peerState === 'connected') {
      if (packet.kind === 'tap') {
        addTapEffect(packet.x, packet.y, false);
        return;
      }
      if (packet.kind === 'swipe') {
        createSwipeEffect(
          packet.from?.x ?? 0,
          packet.from?.y ?? 0,
          packet.dir?.x ?? 1,
          packet.dir?.y ?? 0,
          false,
          {
            forceFrom: packet.from,
            forceTo: packet.to,
            forceRadius: packet.radius
          }
        );
        return;
      }
      if (packet.kind === 'loop') {
        createLoopEffect(packet.points || [], false);
        return;
      }
    }
    if (packet.type === 'settings-snapshot' && packet.snapshot) {
      applySnapshot(packet.snapshot);
      return;
    }
    if (packet.type === 'disconnect') {
      disconnectPeer(false);
    }
  }
  updatePeerButtonUi();
  document.body.style.background = getBgColor();
  requestAnimationFrame(render);
})();
  </script>
</body>
