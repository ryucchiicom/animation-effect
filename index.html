<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      --bg: #fff;
      --edge: #111;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: rgba(0, 0, 0, 0.14);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.45);
      --track: rgba(0, 0, 0, 0.12);
      --track-disabled: rgba(0, 0, 0, 0.06);
      --thumb: rgba(0, 0, 0, 0.72);
      --peer-blue: #2f78ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --edge: #fafafa;
        --panel-bg: rgba(0, 0, 0, 0.82);
        --panel-border: rgba(255, 255, 255, 0.16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, 0.45);
        --track: rgba(255, 255, 255, 0.14);
        --track-disabled: rgba(255, 255, 255, 0.07);
        --thumb: rgba(255, 255, 255, 0.78);
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color-scheme: light dark;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
      background: var(--bg);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .gear-btn,
    .peer-btn {
      position: fixed;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.7px solid var(--edge);
      background: transparent;
      color: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      text-shadow: none;
    }

    .gear-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
    }

    .peer-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 10px);
    }

    .gear-btn span,
    .peer-btn .peer-icon {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      transform: translateY(-0.5px);
      color: var(--edge);
      -webkit-text-stroke: 0;
      text-shadow: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
    }

    .gear-btn:active,
    .peer-btn:active {
      transform: scale(0.97);
    }

    .peer-btn.hidden {
      display: none;
    }

    .peer-btn.searching,
    .peer-btn.connected {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
    }

    .peer-btn.connected .peer-icon {
      color: var(--peer-blue);
    }

    .peer-icon {
      display: block;
      width: 20px;
      text-align: center;
    }

    .peer-spinner {
      display: none;
      position: relative;
      width: 20px;
      height: 20px;
      color: var(--peer-blue);
    }

    .peer-btn.searching .peer-icon {
      display: none;
    }

    .peer-btn.searching .peer-spinner {
      display: block;
      animation: peer-spin 0.9s linear infinite;
    }

    .peer-spinner span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: currentColor;
      transform-origin: 0 0;
    }

    .peer-spinner span:nth-child(1) { transform: translate(0, -8px); opacity: 1; }
    .peer-spinner span:nth-child(2) { transform: translate(5.5px, -5.5px); opacity: 0.82; }
    .peer-spinner span:nth-child(3) { transform: translate(8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(4) { transform: translate(5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(5) { transform: translate(0, 8px); opacity: 0.34; }
    .peer-spinner span:nth-child(6) { transform: translate(-5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(7) { transform: translate(-8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(8) { transform: translate(-5.5px, -5.5px); opacity: 0.82; }

    @keyframes peer-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 18px;
      box-sizing: border-box;
    }

    .overlay.open {
      display: flex;
    }

    .panel {
      width: min(92vw, 460px);
      max-height: min(84vh, 680px);
      overflow: auto;
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 18px 18px 16px;
      box-sizing: border-box;
      scrollbar-width: thin;
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -18px -18px 18px;
      padding: 18px 18px 14px;
      background: linear-gradient(to bottom, var(--panel-bg) 78%, rgba(0,0,0,0));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(127, 127, 127, 0.12);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .close-btn {
      appearance: none;
      border: 1.5px solid var(--edge);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      min-width: 42px;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .close-btn:active {
      transform: scale(0.98);
    }

    .setting-block {
      padding: 14px 0 4px;
      border-top: 1px solid rgba(127, 127, 127, 0.16);
    }

    .setting-block:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .setting-label .main {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }

    .setting-label .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }

    .switch {
      position: relative;
      width: 56px;
      height: 34px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(127, 127, 127, 0.18);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--thumb);
      transition: 0.2s ease;
    }

    .switch input:checked + .slider {
      background: rgba(55, 180, 90, 0.22);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .mode-select {
      width: 128px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .hex-input,
    .text-input {
      width: 100%;
      box-sizing: border-box;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    .text-input {
      text-transform: none;
    }

    .hex-input::placeholder,
    .text-input::placeholder {
      color: var(--muted);
    }

    .sub-input-wrap {
      margin-top: 10px;
    }

    .disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .range-wrap {
      margin-top: 12px;
      padding-left: 2px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .range-title {
      font-size: 13px;
      font-weight: 650;
    }

    .range-value {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      height: 28px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-webkit-slider-runnable-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-top: -7.5px;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-moz-range-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    .effect-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .effect-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 0 0;
    }

    .effect-item + .effect-item {
      border-top: 1px solid rgba(127, 127, 127, 0.12);
      padding-top: 12px;
    }

    .effect-name {
      font-size: 13px;
      font-weight: 650;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .danger-btn {
      appearance: none;
      border: 1.5px solid rgba(220, 40, 40, 0.55);
      background: transparent;
      color: #d23636;
      border-radius: 14px;
      min-width: 0;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex: 1 1 auto;
    }

    .danger-btn:active {
      transform: scale(0.98);
    }

    .peer-menu-overlay,
    .connect-overlay,
    .qr-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
      box-sizing: border-box;
    }

    .peer-menu-overlay.open,
    .connect-overlay.open,
    .qr-overlay.open {
      display: flex;
    }

    .peer-menu-stage {
      position: relative;
      width: min(92vw, 420px);
      height: min(84vh, 420px);
      pointer-events: none;
    }

    .peer-name-strip {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 520px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      pointer-events: none;
      z-index: 2;
    }

    .peer-name-chip {
      border: 1px solid rgba(47, 120, 255, 0.42);
      color: #2f78ff;
      background: rgba(255,255,255,0.06);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .peer-burst-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1.8px solid rgba(47, 120, 255, 0.35);
      transform: translate(-50%, -50%) scale(0.25);
      opacity: 0;
      transition: transform 1s ease, opacity 0.5s ease;
      pointer-events: none;
    }

    .peer-menu-overlay.open .peer-burst-ring {
      transform: translate(-50%, -50%) scale(2.45);
      opacity: 1;
    }

    .peer-choice {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 122px;
      height: 122px;
      border: 1.7px solid rgba(47, 120, 255, 0.82);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      transform:
        translate(-50%, -50%)
        translate(var(--from-x), var(--from-y))
        scale(0.12);
      opacity: 0;
      transition:
        transform 1s cubic-bezier(.2,.8,.2,1),
        opacity 0.5s ease;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      color: #2f78ff;
    }

    .peer-menu-overlay.open .peer-choice {
      transform:
        translate(-50%, -50%)
        translate(var(--to-x), var(--to-y))
        scale(1);
      opacity: 1;
    }

    .peer-choice:active {
      transform:
        translate(-50%, -50%)
        translate(var(--to-x), var(--to-y))
        scale(0.97);
    }

    .peer-choice:disabled {
      opacity: 0.38;
      pointer-events: none;
      filter: grayscale(0.2);
    }

    .peer-choice .peer-choice-label {
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      line-height: 1.35;
      padding: 0 12px;
      color: #2f78ff;
      opacity: 0;
      transition: opacity 0.5s ease;
      transition-delay: 1.0s;
      word-break: keep-all;
      white-space: pre-line;
    }

    .peer-menu-overlay.open .peer-choice .peer-choice-label {
      opacity: 1;
    }

    .peer-choice::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 1px solid rgba(47, 120, 255, 0.2);
      background: rgba(47, 120, 255, 0.03);
      pointer-events: none;
    }

    .peer-choice.wifi {
      --to-x: 0px;
      --to-y: -118px;
    }

    .peer-choice.qr-show {
      --to-x: -118px;
      --to-y: 108px;
    }

    .peer-choice.online {
      --to-x: 118px;
      --to-y: 108px;
    }

    .peer-choice.disconnect {
      --to-x: 0px;
      --to-y: -118px;
    }

    .peer-choice.send {
      --to-x: -118px;
      --to-y: 108px;
    }

    .peer-choice.receive {
      --to-x: 118px;
      --to-y: 108px;
    }

    .dialog {
      width: min(92vw, 520px);
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 18px;
      box-sizing: border-box;
      max-height: min(86vh, 720px);
      overflow: auto;
    }

    .dialog-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .dialog-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .dialog-sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      margin-top: 8px;
    }

    .qr-box {
      width: min(72vw, 320px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 12px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0,0,0,0.08);
      display: grid;
      place-items: center;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .dialog-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ghost-btn {
      appearance: none;
      border: 1.5px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      border-radius: 14px;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .ghost-btn:active {
      transform: scale(0.98);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      transform: translateX(-50%) translateY(12px);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: min(90vw, 420px);
      text-align: center;
      box-sizing: border-box;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <button class="gear-btn" id="openSettings" aria-label="設定を開く">
    <span>⛭</span>
  </button>

  <button class="peer-btn hidden" id="peerButton" aria-label="ローカル通信">
    <span class="peer-icon">☋</span>
    <span class="peer-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </span>
  </button>

  <div class="overlay" id="settingsOverlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="設定">
      <div class="panel-header">
        <div class="panel-title">設定</div>
        <button class="close-btn" id="closeSettings">戻る</button>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">背景色</div>
            <div class="sub">システム / 白 / 黒 / カスタム</div>
          </div>
          <select class="mode-select" id="bgMode">
            <option value="system">システム</option>
            <option value="white">白</option>
            <option value="black">黒</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
        <div class="sub-input-wrap hidden" id="bgCustomWrap">
          <input class="hex-input" id="bgCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ffffff" />
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">名前</div>
            <div class="sub">ローカル通信 / Firebase で表示されます</div>
          </div>
        </div>
        <div class="sub-input-wrap" id="displayNameWrap">
          <input class="text-input" id="displayNameInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="名前" />
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-label">
          <div class="main">色</div>
          <div class="sub">タップ / スワイプ / 囲い の色をカラーコードで指定</div>
        </div>

        <div class="effect-grid">
          <div class="effect-item">
            <div class="effect-name">タップの色</div>
            <input class="hex-input" id="tapColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#46ff78" />
          </div>
          <div class="effect-item">
            <div class="effect-name">スワイプの色</div>
            <input class="hex-input" id="swipeColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#6ea5ff" />
          </div>
          <div class="effect-item">
            <div class="effect-name">囲いの色</div>
            <input class="hex-input" id="loopColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ff4e4e" />
          </div>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">グリッドを表示</div>
            <div class="sub">ONで背景に格子を出します</div>
          </div>
          <label class="switch" aria-label="グリッドを表示">
            <input type="checkbox" id="gridToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div id="gridDetails">
          <div class="range-wrap">
            <div class="range-head">
              <div class="range-title">間隔</div>
              <div class="range-value"><span id="spacingValue">36</span>px</div>
            </div>

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        const bytes = new Uint8Array(16);
        (window.crypto || window.msCrypto).getRandomValues(bytes);
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      }

      function makeRoomCode() {
        const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const bytes = new Uint8Array(6);
        (window.crypto || window.msCrypto).getRandomValues(bytes);
        let out = '';
        for (let i = 0; i < bytes.length; i++) {
          out += alphabet[bytes[i] % alphabet.length];
        }
        return out;
      }

      function sanitizeRoomCode(raw) {
        let s = String(raw || '').trim().toUpperCase();
        s = s.replace(/\s+/g, '');
        s = s.replace(/[^A-Z0-9_-]/g, '');
        if (!s) s = makeRoomCode();
        return s.slice(0, 18);
      }

      function normalizeDisplayName(raw) {
        let s = String(raw || '').trim();
        if (!s) s = effectiveDefaultName;
        if (s.length > 20) s = s.slice(0, 20);

      function clamp(v, min, max) {
        return Math.min(max, Math.max(min, v));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function nowMs() {
        return performance.now();
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function distance(ax, ay, bx, by) {
        return Math.hypot(ax - bx, ay - by);
      }

      function pointToSegmentDistance(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const apx = px - ax;
        const apy = py - ay;
        const abLen2 = abx * abx + aby * aby;

        if (abLen2 === 0) return Math.hypot(px - ax, py - ay);

        let t = (apx * abx + apy * aby) / abLen2;
        t = clamp(t, 0, 1);

        const cx = ax + abx * t;
        const cy = ay + aby * t;
        return Math.hypot(px - cx, py - cy);
      }

      function isValidMode(value) {
        return value === 'system' || value === 'white' || value === 'black' || value === 'custom';
      }

      function normalizeHexColor(raw) {
        if (typeof raw !== 'string') return null;
        let s = raw.trim();
        if (!s) return null;
        if (s[0] === '#') s = s.slice(1);
        if (!/^[0-9a-fA-F]+$/.test(s)) return null;

        if (s.length === 3 || s.length === 4) {
          s = s.split('').map(ch => ch + ch).join('');
        }

        if (s.length !== 6 && s.length !== 8) return null;
        return '#' + s.toLowerCase();
      }

      function hexToRgba(rawHex, alphaOverride = 1) {
        const hex = normalizeHexColor(rawHex);
        if (!hex) return null;

        const s = hex.slice(1);
        const r = parseInt(s.slice(0, 2), 16);
        const g = parseInt(s.slice(2, 4), 16);
        const b = parseInt(s.slice(4, 6), 16);
        const a = s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1;
        return `rgba(${r}, ${g}, ${b}, ${clamp(a * alphaOverride, 0, 1)})`;
      }

      function resolveModeColor(mode, customRaw, lightHex, darkHex) {
        const fallback = darkMode ? darkHex : lightHex;
        if (mode === 'system') return fallback;
        if (mode === 'white') return '#ffffff';
        if (mode === 'black') return '#000000';
        if (mode === 'custom') return normalizeHexColor(customRaw) || fallback;
        return fallback;
      }

          const data = JSON.parse(raw);

          if (isValidMode(data.bgMode)) settings.bgMode = data.bgMode;
          if (typeof data.bgCustom === 'string') settings.bgCustom = data.bgCustom;

          if (typeof data.displayName === 'string') settings.displayName = data.displayName;
          if (typeof data.lastRoomCode === 'string') settings.lastRoomCode = data.lastRoomCode;

          if (typeof data.tapColor === 'string') settings.tapColor = data.tapColor;

          if (typeof data.loopColor === 'string') settings.loopColor = data.loopColor;

          if (typeof data.gridEnabled === 'boolean') settings.gridEnabled = data.gridEnabled;
          if (isValidMode(data.gridMode)) settings.gridMode = data.gridMode;
          if (typeof data.gridCustom === 'string') settings.gridCustom = data.gridCustom;
          if (typeof data.gridSpacing === 'number' && isFinite(data.gridSpacing)) {
            settings.gridSpacing = clamp(Math.round(data.gridSpacing), 18, 100);
          }

          if (typeof data.peerButtonVisible === 'boolean') settings.peerButtonVisible = data.peerButtonVisible;
          if (!settings.displayName) settings.displayName = effectiveDefaultName;
          if (!settings.lastRoomCode) settings.lastRoomCode = makeRoomCode();

        if (!unique.includes(getEffectiveDisplayName())) {

        roomCodeInput.focus();
        roomCodeInput.select();
      }

      function closeConnectDialog() {
        connectOverlay.classList.remove('open');
        connectOverlay.setAttribute('aria-hidden', 'true');
      }

      function openQrDialog() {
        const code = sanitizeRoomCode(settings.lastRoomCode || makeRoomCode());
        qrRoomCodeInput.value = code;
        updateQrImage(code);
        qrOverlay.classList.add('open');
        qrOverlay.setAttribute('aria-hidden', 'false');
      }

      function closeQrDialog() {
        qrOverlay.classList.remove('open');
        qrOverlay.setAttribute('aria-hidden', 'true');
      }

      function updateQrImage(code) {
        const safe = sanitizeRoomCode(code);
        qrImage.src = qrApiBase + encodeURIComponent(safe);
        qrImage.alt = `QRコード: ${safe}`;
      }

      function captureSettingsSnapshot() {
        return {
          bgMode: settings.bgMode,
          bgCustom: settings.bgCustom,
          displayName: getEffectiveDisplayName(),
          tapColor: settings.tapColor,
          swipeColor: settings.swipeColor,
          loopColor: settings.loopColor,
          gridEnabled: settings.gridEnabled,
          gridMode: settings.gridMode,
          gridCustom: settings.gridCustom,
          gridSpacing: settings.gridSpacing
        };
      }

      function applySettingsSnapshot(snapshot) {
        if (!snapshot || typeof snapshot !== 'object') return;

        if (isValidMode(snapshot.bgMode)) settings.bgMode = snapshot.bgMode;
        if (typeof snapshot.bgCustom === 'string') settings.bgCustom = snapshot.bgCustom;
        if (typeof snapshot.displayName === 'string') settings.displayName = normalizeDisplayName(snapshot.displayName);

        if (typeof snapshot.tapColor === 'string') settings.tapColor = snapshot.tapColor;
        if (typeof snapshot.swipeColor === 'string') settings.swipeColor = snapshot.swipeColor;
        if (typeof snapshot.loopColor === 'string') settings.loopColor = snapshot.loopColor;

        if (typeof snapshot.gridEnabled === 'boolean') settings.gridEnabled = snapshot.gridEnabled;
        if (isValidMode(snapshot.gridMode)) settings.gridMode = snapshot.gridMode;
        if (typeof snapshot.gridCustom === 'string') settings.gridCustom = snapshot.gridCustom;
        if (typeof snapshot.gridSpacing === 'number' && isFinite(snapshot.gridSpacing)) {
          settings.gridSpacing = clamp(Math.round(snapshot.gridSpacing), 18, 100);
        }

        syncSettingsUi();
        document.body.style.background = getBgColor();
        saveSettings();
      }

      function getBgColor() {
        return resolveModeColor(settings.bgMode, settings.bgCustom, '#ffffff', '#000000');
      }

      function getGridBaseColor() {
        return resolveModeColor(
          settings.gridMode,
          settings.gridCustom,
          darkMode ? '#262626' : '#e8e8e8',
          darkMode ? '#262626' : '#e8e8e8'
        );
      }

      function getTapBaseColor() {
        return normalizeHexColor(settings.tapColor) || defaults.tapColor;
      }

      function getSwipeBaseColor() {
        return normalizeHexColor(settings.swipeColor) || defaults.swipeColor;
      }

      function getLoopBaseColor() {
        return normalizeHexColor(settings.loopColor) || defaults.loopColor;
      }

      function rememberPacket(id) {
        if (!id || seenPackets.has(id)) return false;
        seenPackets.add(id);
        seenPacketQueue.push(id);
        if (seenPacketQueue.length > 350) {
          const old = seenPacketQueue.shift();
          if (old) seenPackets.delete(old);
        }
        return true;
      }

      function makePacket(base) {
        return {
          ...base,
          id: makeId(),
          senderId: selfPeerId,
          senderName: getEffectiveDisplayName(),
          roomCode: connection.roomCode || '',
          createdAt: Date.now()
        };
      }

      function pushConnectionParticipant(id, name) {
        if (!id) return;
        connection.participants.set(id, {
          id,
          name: normalizeDisplayName(name),
          lastSeen: Date.now()
        });
      }

      function clearConnectionParticipants() {
        connection.participants.clear();
        pushConnectionParticipant(selfPeerId, getEffectiveDisplayName());
      }

      function refreshConnectedState() {
        updatePeerButtonUi();
        if (peerMenuOpen && connectionState === 'connected') {
          refreshPeerMenu('connected');
        }
      }

      function setConnectionSearching() {
        connectionState = 'searching';
        updatePeerButtonUi();
      }

      function setConnectionConnected() {
        connectionState = 'connected';
        updatePeerButtonUi();
        if (peerMenuOpen) refreshPeerMenu('connected');
      }

      function setConnectionOff() {
        connectionState = 'off';
        updatePeerButtonUi();
      }

      function stopLocalTimers() {
        if (localHeartbeatTimer) {
          clearInterval(localHeartbeatTimer);
          localHeartbeatTimer = null;
        }
        if (localPurgeTimer) {
          clearInterval(localPurgeTimer);
          localPurgeTimer = null;
        }
      }

      function stopFirebaseTimers() {
        if (fbHeartbeatTimer) {
          clearInterval(fbHeartbeatTimer);
          fbHeartbeatTimer = null;
        }
      }

      function stopLocalConnection(sendLeave = true) {
        if (localChannel && sendLeave) {
          try {
            localChannel.postMessage(makePacket({ type: 'bye' }));
          } catch (_) {}
        }

        if (localChannel) {
          try {
            localChannel.close();
          } catch (_) {}
          localChannel = null;
        }

        window.removeEventListener('storage', onLocalStorageEvent);
        stopLocalTimers();
        connection.kind = 'none';
        connection.roomCode = '';
        connection.sendLockOwnerId = '';
        connection.sendLockOwnerName = '';
        connection.sendLockUntil = 0;
        connection.latestSettings = null;
        connection.latestSettingsAt = 0;
        connection.latestSettingsSenderId = '';
        connection.latestSettingsSenderName = '';
        clearConnectionParticipants();
        setConnectionOff();
      }

      async function stopFirebaseConnection(sendLeave = true) {
        if (sendLeave && fbSelfParticipantRef) {
          try {
            await deleteDoc(fbSelfParticipantRef);
          } catch (_) {}
        }

        if (fbRoomUnsub) {
          try { fbRoomUnsub(); } catch (_) {}
          fbRoomUnsub = null;
        }
        if (fbParticipantsUnsub) {
          try { fbParticipantsUnsub(); } catch (_) {}
          fbParticipantsUnsub = null;
        }
        if (fbEffectsUnsub) {
          try { fbEffectsUnsub(); } catch (_) {}
          fbEffectsUnsub = null;
        }

        stopFirebaseTimers();
        fbRoomRef = null;
        fbSelfParticipantRef = null;
        connection.kind = 'none';
        connection.roomCode = '';
        connection.sendLockOwnerId = '';
        connection.sendLockOwnerName = '';
        connection.sendLockUntil = 0;
        connection.latestSettings = null;
        connection.latestSettingsAt = 0;
        connection.latestSettingsSenderId = '';
        connection.latestSettingsSenderName = '';
        clearConnectionParticipants();
        setConnectionOff();
      }

      function stopAllConnections(sendLeave = true) {
        stopLocalConnection(sendLeave);
        void stopFirebaseConnection(sendLeave);
        receiveWindowUntil = 0;
      }

      function onLocalStorageEvent(ev) {
        if (!ev.key || !ev.key.startsWith(LOCAL_BUS_KEY_PREFIX)) return;
        if (!ev.newValue) return;
        try {
          const packet = JSON.parse(ev.newValue);
          handleIncomingPacket(packet, 'local');
        } catch (_) {}
      }

      function localBusKey(roomCode) {
        return `${LOCAL_BUS_KEY_PREFIX}${roomCode}`;
      }

      function postLocalPacket(roomCode, packet) {
        const key = localBusKey(roomCode);
        try {
          localChannel?.postMessage(packet);
        } catch (_) {}
        try {
          localStorage.setItem(key, JSON.stringify(packet));
        } catch (_) {}
      }

      function ensureLocalParticipantsSelf() {
        clearConnectionParticipants();
      }

      function startLocalHeartbeat() {
        stopLocalTimers();
        localHeartbeatTimer = setInterval(() => {
          if (connection.kind !== 'local' || !connection.roomCode) return;
          postLocalPacket(connection.roomCode, makePacket({ type: 'hello' }));
          postLocalPacket(connection.roomCode, makePacket({ type: 'keepalive' }));
        }, 3000);

        localPurgeTimer = setInterval(() => {
          if (connection.kind !== 'local') return;
          const now = Date.now();
          for (const [id, item] of connection.participants.entries()) {
            if (id === selfPeerId) continue;
            if (now - (item.lastSeen || 0) > 15000) {
              connection.participants.delete(id);
            }
          }
          if (peerMenuOpen) renderPeerNameStrip();
        }, 1000);
      }

      async function localConnectRoom(roomCode) {
        stopAllConnections(false);
        const code = sanitizeRoomCode(roomCode);
        connection.kind = 'local';
        connection.roomCode = code;
        settings.lastRoomCode = code;
        saveSettings();

        clearConnectionParticipants();
        pushConnectionParticipant(selfPeerId, getEffectiveDisplayName());

        localChannel = null;
        if ('BroadcastChannel' in window) {
          try {
            localChannel = new BroadcastChannel(localBusKey(code));
            localChannel.onmessage = (ev) => handleIncomingPacket(ev.data, 'local');
          } catch (_) {
            localChannel = null;
          }
        }

        window.addEventListener('storage', onLocalStorageEvent);
        startLocalHeartbeat();
        setConnectionSearching();
        postLocalPacket(code, makePacket({ type: 'hello' }));
        setConnectionConnected();
        showToast(`ローカルで接続: ${code}`);
      }

      async function fbConnectRoom(roomCode) {
        await stopFirebaseConnection(false);
        const code = sanitizeRoomCode(roomCode);
        connection.kind = 'firebase';
        connection.roomCode = code;
        settings.lastRoomCode = code;
        saveSettings();

        fbRoomRef = doc(db, 'rooms', code);
        fbSelfParticipantRef = doc(db, 'rooms', code, 'participants', selfPeerId);

        setConnectionSearching();
        clearConnectionParticipants();
        pushConnectionParticipant(selfPeerId, getEffectiveDisplayName());

        await setDoc(fbRoomRef, {
          roomCode: code,
          updatedAt: Date.now()
        }, { merge: true });

        await setDoc(fbSelfParticipantRef, {
          id: selfPeerId,
          name: getEffectiveDisplayName(),
          updatedAt: Date.now(),
          joinedAt: Date.now()
        }, { merge: true });

        fbRoomUnsub = onSnapshot(fbRoomRef, (snap) => {
          if (!snap.exists()) return;
          const data = snap.data() || {};
          connection.sendLockOwnerId = data.sendLockOwnerId || '';
          connection.sendLockOwnerName = data.sendLockOwnerName || '';
          connection.sendLockUntil = Number(data.sendLockUntil || 0);
          connection.latestSettings = data.latestSettings || null;
          connection.latestSettingsAt = Number(data.latestSettingsAt || 0);
          connection.latestSettingsSenderId = data.latestSettingsSenderId || '';
          connection.latestSettingsSenderName = data.latestSettingsSenderName || '';

          if (Date.now() > connection.sendLockUntil && connection.sendLockOwnerId && connection.sendLockOwnerId !== selfPeerId) {
            connection.sendLockOwnerId = '';
            connection.sendLockOwnerName = '';
          }

          if (peerMenuOpen) refreshPeerMenu('connected');
          maybeApplyLatestSettings();
        });

        fbParticipantsUnsub = onSnapshot(collection(db, 'rooms', code, 'participants'), (snap) => {
          const now = Date.now();
          const next = new Map();
          next.set(selfPeerId, {
            id: selfPeerId,
            name: getEffectiveDisplayName(),
            lastSeen: now
          });

          snap.forEach((docSnap) => {
            const d = docSnap.data() || {};
            const name = normalizeDisplayName(d.name || d.displayName || '名無し');
            const lastSeen = Number(d.updatedAt || d.lastSeen || 0);
            if (!docSnap.id) return;
            if (docSnap.id === selfPeerId) return;
            if (lastSeen && now - lastSeen > 15000) return;
            next.set(docSnap.id, {
              id: docSnap.id,
              name,
              lastSeen
            });
          });

          connection.participants = next;
          if (peerMenuOpen) renderPeerNameStrip();
        });

        fbEffectsUnsub = onSnapshot(query(collection(db, 'rooms', code, 'effects'), orderBy('createdAt', 'asc')), (snap) => {
          snap.docChanges().forEach((change) => {
            if (change.type !== 'added') return;
            const data = change.doc.data() || {};
            if (!rememberPacket(change.doc.id)) return;
            if (data.senderId === selfPeerId) return;
            handleIncomingPacket({
              id: change.doc.id,
              senderId: data.senderId,
              senderName: data.senderName,
              roomCode: code,
              type: data.kind,
              payload: data.payload,
              createdAt: data.createdAt
            }, 'firebase');
          });
        });

        fbHeartbeatTimer = setInterval(async () => {
          if (!fbSelfParticipantRef) return;
          try {
            await setDoc(fbSelfParticipantRef, {
              id: selfPeerId,
              name: getEffectiveDisplayName(),
              updatedAt: Date.now()
            }, { merge: true });
          } catch (_) {}
        }, 5000);

        setConnectionConnected();
        showToast(`Firebaseで接続: ${code}`);
      }

      function fbDisconnectRoom(sendLeave = true) {
        if (sendLeave && fbSelfParticipantRef) {
          void deleteDoc(fbSelfParticipantRef);
        }

        if (fbRoomUnsub) {
          try { fbRoomUnsub(); } catch (_) {}
          fbRoomUnsub = null;
        }
        if (fbParticipantsUnsub) {
          try { fbParticipantsUnsub(); } catch (_) {}
          fbParticipantsUnsub = null;
        }
        if (fbEffectsUnsub) {
          try { fbEffectsUnsub(); } catch (_) {}
          fbEffectsUnsub = null;
        }

        stopFirebaseTimers();
        fbRoomRef = null;
        fbSelfParticipantRef = null;
      }

      function handleIncomingPacket(packet, sourceKind) {
        if (!packet || typeof packet !== 'object') return;
        if (packet.senderId === selfPeerId) return;
        if (!rememberPacket(packet.id)) return;

        const now = Date.now();

        if (packet.type === 'hello' || packet.type === 'keepalive') {
          if (!packet.roomCode || packet.roomCode !== connection.roomCode) return;
          pushConnectionParticipant(packet.senderId, packet.senderName || '名無し');
          if (peerMenuOpen) renderPeerNameStrip();
          if (connectionState === 'searching' && connection.kind === 'local') {
            setConnectionConnected();
          }
          return;
        }

        if (packet.type === 'bye') {
          if (!packet.roomCode || packet.roomCode !== connection.roomCode) return;
          connection.participants.delete(packet.senderId);
          if (peerMenuOpen) renderPeerNameStrip();
          return;
        }

        if (packet.type === 'send-lock') {
          if (!packet.roomCode || packet.roomCode !== connection.roomCode) return;
          connection.sendLockOwnerId = packet.ownerId || '';
          connection.sendLockOwnerName = packet.ownerName || '';
          connection.sendLockUntil = Number(packet.until || 0);
          if (peerMenuOpen) refreshPeerMenu('connected');
          return;
        }

        if (packet.type === 'settings') {
          if (!packet.roomCode || packet.roomCode !== connection.roomCode) return;

          connection.latestSettings = packet.payload || null;
          connection.latestSettingsAt = Number(packet.createdAt || Date.now());
          connection.latestSettingsSenderId = packet.senderId || '';
          connection.latestSettingsSenderName = packet.senderName || '';

          if (receiveWindowUntil > 0 && now <= receiveWindowUntil) {
            const age = Date.now() - connection.latestSettingsAt;
            if (age <= 10000 && packet.senderId !== selfPeerId) {
              receiveWindowUntil = 0;
              applySettingsSnapshot(connection.latestSettings);
              showToast('設定を受信した');
            }
          }

          return;
        }

        if (packet.type === 'effect') {
          if (!packet.roomCode || packet.roomCode !== connection.roomCode) return;
          applyIncomingEffect(packet.kind, packet.payload);
          return;
        }
      }

      function applyIncomingEffect(kind, payload) {
        if (!payload || typeof payload !== 'object') return;

        if (kind === 'tap') {
          if (typeof payload.x === 'number' && typeof payload.y === 'number') {
            addTapEffect(payload.x, payload.y, false);
          }
          return;
        }

        if (kind === 'swipe') {
          const from = payload.from;
          const to = payload.to;
          const dir = payload.dir;
          if (
            from && to && dir &&
            typeof from.x === 'number' && typeof from.y === 'number' &&
            typeof to.x === 'number' && typeof to.y === 'number' &&
            typeof dir.x === 'number' && typeof dir.y === 'number'
          ) {
            createSwipeEffect(from.x, from.y, dir.x * 100, dir.y * 100, false, {
              forceFrom: from,
              forceTo: to,
              forceRadius: typeof payload.radius === 'number' ? payload.radius : undefined
            });
          }
          return;
        }

        if (kind === 'loop') {
          if (Array.isArray(payload.points)) {
            const points = payload.points
              .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number')
              .map(p => ({ x: p.x, y: p.y }));
            if (points.length >= 3) createLoopEffect(points, false);
          }
        }
      }

      function getCurrentSendLockLabel() {
        const now = Date.now();
        if (connection.sendLockUntil > now && connection.sendLockOwnerId && connection.sendLockOwnerId !== selfPeerId) {
          return `${connection.sendLockOwnerName || '誰か'}が\n送信中…`;
        }
        if (connection.sendLockUntil > now && connection.sendLockOwnerId === selfPeerId) {
          return '送信中…';
        }
        return '設定を\n送信';
      }

      function isSendLockedByOther() {
        const now = Date.now();
        return connection.sendLockUntil > now && connection.sendLockOwnerId && connection.sendLockOwnerId !== selfPeerId;
      }

      function maybeApplyLatestSettings() {
        if (!connection.latestSettings) return;
        const now = Date.now();
        const age = now - connection.latestSettingsAt;
        if (age <= 10000 && receiveWindowUntil > 0 && now <= receiveWindowUntil) {
          if (connection.latestSettingsSenderId !== selfPeerId) {
            receiveWindowUntil = 0;
            applySettingsSnapshot(connection.latestSettings);
            showToast('設定を受信した');
          }
        }
      }

      async function sendCurrentSettings() {
        const payload = captureSettingsSnapshot();

        if (connection.kind === 'local') {
          const lockUntil = Date.now() + 10000;
          connection.sendLockOwnerId = selfPeerId;
          connection.sendLockOwnerName = getEffectiveDisplayName();
          connection.sendLockUntil = lockUntil;
          connection.latestSettings = payload;
          connection.latestSettingsAt = Date.now();
          connection.latestSettingsSenderId = selfPeerId;
          connection.latestSettingsSenderName = getEffectiveDisplayName();

          postLocalPacket(connection.roomCode, makePacket({
            type: 'send-lock',
            ownerId: selfPeerId,
            ownerName: getEffectiveDisplayName(),
            until: lockUntil
          }));

          postLocalPacket(connection.roomCode, makePacket({
            type: 'settings',
            payload
          }));

          showToast('設定を送った');
          if (peerMenuOpen) refreshPeerMenu('connected');
          return;
        }

        if (connection.kind === 'firebase') {
          if (!fbRoomRef) return;
          const lockUntil = Date.now() + 10000;
          try {
            await runTransaction(db, async (tx) => {
              const snap = await tx.get(fbRoomRef);
              const data = snap.exists() ? (snap.data() || {}) : {};
              const until = Number(data.sendLockUntil || 0);
              const ownerId = String(data.sendLockOwnerId || '');
              if (until > Date.now() && ownerId && ownerId !== selfPeerId) {
                const ownerName = String(data.sendLockOwnerName || '誰か');
                throw new Error(`${ownerName}が送信中…`);
              }

              tx.set(fbRoomRef, {
                roomCode: connection.roomCode,
                sendLockOwnerId: selfPeerId,
                sendLockOwnerName: getEffectiveDisplayName(),
                sendLockUntil: lockUntil,
                latestSettings: payload,
                latestSettingsAt: Date.now(),
                latestSettingsSenderId: selfPeerId,
                latestSettingsSenderName: getEffectiveDisplayName(),
                updatedAt: Date.now()
              }, { merge: true });
            });

            connection.sendLockOwnerId = selfPeerId;
            connection.sendLockOwnerName = getEffectiveDisplayName();
            connection.sendLockUntil = lockUntil;
            connection.latestSettings = payload;
            connection.latestSettingsAt = Date.now();
            connection.latestSettingsSenderId = selfPeerId;
            connection.latestSettingsSenderName = getEffectiveDisplayName();

            showToast('設定を送った');
            if (peerMenuOpen) refreshPeerMenu('connected');
          } catch (err) {
            showToast(err?.message || '送信できない');
          }
          return;
        }

        showToast('接続してない');
      }

      function startConnectionFlow(mode) {
        closePeerMenu();
        openConnectDialog(mode);
      }

      function startLocalFlow(roomCode) {
        setConnectionSearching();
        void localConnectRoom(roomCode);
      }

      function startFirebaseFlow(roomCode) {
        setConnectionSearching();
        void fbConnectRoom(roomCode);
      }

      function stopUiOverlays() {
        closeConnectDialog();
        closeQrDialog();
        closeSettingsOverlay();
        closePeerMenu();
      }

      function openQrImageForCurrentCode() {
        const code = sanitizeRoomCode(qrRoomCodeInput.value || settings.lastRoomCode || makeRoomCode());
        qrRoomCodeInput.value = code;
        updateQrImage(code);
      }

      function addTapEffect(x, y, broadcast = true) {
        effects.push({
          type: 'tap',
          x,
          y,
          start: nowMs(),
          duration: 650
        });

        if (broadcast && connection.kind !== 'none' && connection.roomCode) {
          if (connection.kind === 'local') {
            postLocalPacket(connection.roomCode, makePacket({
              type: 'effect',
              kind: 'tap',
              payload: { x, y }
            }));
          } else if (connection.kind === 'firebase' && fbRoomRef) {
            void addDoc(collection(db, 'rooms', connection.roomCode, 'effects'), {
              kind: 'tap',
              payload: { x, y },
              senderId: selfPeerId,
              senderName: getEffectiveDisplayName(),
              roomCode: connection.roomCode,
              createdAt: Date.now()
            }).catch(() => {});
          }
        }
      }

      function createSwipeEffect(startX, startY, dirX, dirY, broadcast = true, forced = null) {
        const len = Math.hypot(dirX, dirY) || 1;
        dirX /= len;
        dirY /= len;

        const pad = 90;
        const minX = -pad;
        const minY = -pad;
        const maxX = w + pad;
        const maxY = h + pad;

        const hits = [];

        function pushCandidate(t, x, y) {
          if (x >= minX - 0.5 && x <= maxX + 0.5 && y >= minY - 0.5 && y <= maxY + 0.5) {
            hits.push({ t, x, y });
          }
        }

        if (forced && forced.forceFrom && forced.forceTo) {
          hits.push(
            { t: 0, x: forced.forceFrom.x, y: forced.forceFrom.y },
            { t: 1, x: forced.forceTo.x, y: forced.forceTo.y }
          );
        } else {
          if (Math.abs(dirX) > 1e-6) {
            let t = (minX - startX) / dirX;
            pushCandidate(t, minX, startY + dirY * t);
            t = (maxX - startX) / dirX;
            pushCandidate(t, maxX, startY + dirY * t);
          }

          if (Math.abs(dirY) > 1e-6) {
            let t = (minY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, minY);
            t = (maxY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, maxY);
          }

          if (hits.length < 2) {
            hits.push(
              { t: -400, x: startX - dirX * 400, y: startY - dirY * 400 },
              { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 }
            );
          } else {
            hits.sort((a, b) => a.t - b.t);
          }
        }

        const first = forced && forced.forceFrom ? forced.forceFrom : hits[0];
        const last = forced && forced.forceTo ? forced.forceTo : hits[hits.length - 1];
        const travel = distance(first.x, first.y, last.x, last.y);
        const duration = clamp(460 + travel * 0.12, 520, 900);

        const radius = typeof (forced && forced.forceRadius) === 'number'
          ? forced.forceRadius
          : clamp(Math.min(w, h) * 0.045, 18, 38);

        effects.push({
          type: 'swipe',
          start: nowMs(),
          duration,
          from: { x: first.x, y: first.y },
          to: { x: last.x, y: last.y },
          dir: { x: dirX, y: dirY },
          radius
        });

        if (broadcast && connection.kind !== 'none' && connection.roomCode) {
          if (connection.kind === 'local') {
            postLocalPacket(connection.roomCode, makePacket({
              type: 'effect',
              kind: 'swipe',
              payload: {
                from: { x: first.x, y: first.y },
                to: { x: last.x, y: last.y },
                dir: { x: dirX, y: dirY },
                radius
              }
            }));
          } else if (connection.kind === 'firebase' && fbRoomRef) {
            void addDoc(collection(db, 'rooms', connection.roomCode, 'effects'), {
              kind: 'swipe',
              payload: {
                from: { x: first.x, y: first.y },
                to: { x: last.x, y: last.y },
                dir: { x: dirX, y: dirY },
                radius
              },
              senderId: selfPeerId,
              senderName: getEffectiveDisplayName(),
              roomCode: connection.roomCode,
              createdAt: Date.now()
            }).catch(() => {});
          }
        }
      }

      function createLoopEffect(points, broadcast = true) {
        if (points.length < 3) return;

        const copy = points.map(p => ({ x: p.x, y: p.y }));
        effects.push({
          type: 'loop',
          start: nowMs(),
          duration: 420,
          points: copy
        });

        if (broadcast && connection.kind !== 'none' && connection.roomCode) {
          if (connection.kind === 'local') {
            postLocalPacket(connection.roomCode, makePacket({
              type: 'effect',
              kind: 'loop',
              payload: { points: copy }
            }));
          } else if (connection.kind === 'firebase' && fbRoomRef) {
            void addDoc(collection(db, 'rooms', connection.roomCode, 'effects'), {
              kind: 'loop',
              payload: { points: copy },
              senderId: selfPeerId,
              senderName: getEffectiveDisplayName(),
              roomCode: connection.roomCode,
              createdAt: Date.now()
            }).catch(() => {});
          }
        }
      }

      function detectLoop(points, currentX, currentY) {
        if (points.length < LASSO_MIN_POINTS) return false;

        const n = points.length;
        const safeEnd = Math.max(0, n - 1 - LASSO_IGNORE_RECENT_SEGMENTS);

        for (let i = 0; i < safeEnd - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const d = pointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
          if (d <= LASSO_HIT_RADIUS) {
            let traveled = 0;
            for (let k = i; k < n - 1; k++) {
              traveled += distance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
              if (traveled > 40) break;
            }
            if (traveled > 40) return true;
          }
        }

        return false;
      }

      function drawGrid() {
        if (!settings.gridEnabled) return;

        const baseColor = getGridBaseColor();
        const lineLow = hexToRgba(baseColor, 0.40) || (darkMode ? 'rgba(34,34,34,0.40)' : 'rgba(232,232,232,0.40)');
        const lineHigh = hexToRgba(baseColor, 0.56) || (darkMode ? 'rgba(58,58,58,0.56)' : 'rgba(210,210,210,0.56)');

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 1;

        for (let x = 0; x <= w + settings.gridSpacing; x += settings.gridSpacing) {
          const isAccent = Math.round(x / settings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(Math.floor(x) + 0.5, 0);
          ctx.lineTo(Math.floor(x) + 0.5, h);
          ctx.stroke();
        }

        for (let y = 0; y <= h + settings.gridSpacing; y += settings.gridSpacing) {
          const isAccent = Math.round(y / settings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(0, Math.floor(y) + 0.5);
          ctx.lineTo(w, Math.floor(y) + 0.5);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawTap(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = easeOutCubic(p);
        const radius = lerp(10, Math.max(w, h) * 0.22, e);
        const alpha = 0.34 * Math.pow(1 - p, 1.7);
        const baseColor = getTapBaseColor();

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = radius * 0.22;
        ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(70, 255, 120, 0.55)';

        const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
        g.addColorStop(0.00, hexToRgba(baseColor, 0.92) || 'rgba(70, 255, 120, 0.92)');
        g.addColorStop(0.28, hexToRgba(baseColor, 0.60) || 'rgba(60, 235, 110, 0.60)');
        g.addColorStop(0.68, hexToRgba(baseColor, 0.25) || 'rgba(50, 220, 100, 0.25)');
        g.addColorStop(1.00, hexToRgba(baseColor, 0.00) || 'rgba(50, 220, 100, 0)');

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawSwipe(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = easeOutCubic(p);
        const x = lerp(effect.from.x, effect.to.x, e);
        const y = lerp(effect.from.y, effect.to.y, e);

        const trailSteps = 16;
        const trailSpacing = effect.radius * 0.82;
        const baseColor = getSwipeBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';

        for (let i = trailSteps; i >= 0; i--) {
          const back = i * trailSpacing;
          const px = x - effect.dir.x * back;
          const py = y - effect.dir.y * back;
          const a = 0.24 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, 0.35);
          if (a <= 0.001) continue;

          const r = effect.radius * (1 + (trailSteps - i) * 0.02);

          ctx.globalAlpha = a;
          ctx.shadowBlur = r * 0.35;
          ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(90, 150, 255, 0.55)';
          ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 0.45 * Math.pow(1 - p, 0.7);
        ctx.shadowBlur = effect.radius * 0.6;
        ctx.shadowColor = hexToRgba(baseColor, 0.45) || 'rgba(110, 165, 255, 0.45)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
        ctx.beginPath();
        ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawLoop(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;
        if (effect.points.length < 3) return;

        const alpha = 0.36 * Math.pow(1 - p, 2.0);
        const blur = 8 * Math.pow(1 - p, 0.55);
        const baseColor = getLoopBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = blur;
        ctx.shadowColor = hexToRgba(baseColor, 0.40) || 'rgba(255, 60, 60, 0.40)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(255, 78, 78, 1)';

        ctx.beginPath();
        ctx.moveTo(effect.points[0].x, effect.points[0].y);
        for (let i = 1; i < effect.points.length; i++) {
          ctx.lineTo(effect.points[i].x, effect.points[i].y);
        }
        ctx.closePath();
        ctx.fill('evenodd');

        ctx.restore();
      }

      function render() {
        const t = nowMs();

        ctx.fillStyle = getBgColor();
        ctx.fillRect(0, 0, w, h);

        drawGrid();

        for (let i = 0; i < effects.length; i++) {
          const effect = effects[i];
          if (effect.type === 'tap') drawTap(effect, t);
          else if (effect.type === 'swipe') drawSwipe(effect, t);
          else if (effect.type === 'loop') drawLoop(effect, t);
        }

        for (let i = effects.length - 1; i >= 0; i--) {
          if (t - effects[i].start >= effects[i].duration) effects.splice(i, 1);
        }

        if (peerMenuOpen && connectionState === 'connected') {
          refreshPeerMenu('connected');
        }

        requestAnimationFrame(render);
      }

      function getPoint(e) {
        return { x: e.clientX, y: e.clientY };
      }

      function applyAndSave() {
        document.body.style.background = getBgColor();
        syncSettingsUi();
        updatePeerButtonUi();

        Object.assign(settings, defaults);

        try {

        } catch (_) {}

        stopAllConnections(true);

        showToast('設定をリセットした');

      function maybeApplyLatestSettings() {
        if (!connection.latestSettings) return;
        const now = Date.now();
        const age = now - connection.latestSettingsAt;
        if (age <= 10000 && receiveWindowUntil > 0 && now <= receiveWindowUntil) {
          if (connection.latestSettingsSenderId !== selfPeerId) {
            receiveWindowUntil = 0;
            applySettingsSnapshot(connection.latestSettings);
            showToast('設定を受信した');
          }
        }
      }

      function onLocalOrFirebaseNameChange() {

          }));

      async function localConnectRoom(roomCode) {
        stopAllConnections(false);
        const code = sanitizeRoomCode(roomCode);
        connection.kind = 'local';
        connection.roomCode = code;
        settings.lastRoomCode = code;
        saveSettings();

        clearConnectionParticipants();
        pushConnectionParticipant(selfPeerId, getEffectiveDisplayName());

        if ('BroadcastChannel' in window) {
          try {
            localChannel = new BroadcastChannel(`${LOCAL_BUS_KEY_PREFIX}${code}`);
            localChannel.onmessage = (ev) => handleIncomingPacket(ev.data, 'local');
          } catch (_) {
            localChannel = null;
          }
        }

        window.addEventListener('storage', onLocalStorageEvent);
        startLocalHeartbeat();
        setConnectionSearching();
        postLocalPacket(code, makePacket({ type: 'hello' }));
        setConnectionConnected();
        refreshConnectedState();
        showToast(`ローカルで接続: ${code}`);
      }

      async function fbConnectRoom(roomCode) {
        await stopFirebaseConnection(false);
        const code = sanitizeRoomCode(roomCode);
        connection.kind = 'firebase';
        connection.roomCode = code;
        settings.lastRoomCode = code;
        saveSettings();

        fbRoomRef = doc(db, 'rooms', code);
        fbSelfParticipantRef = doc(db, 'rooms', code, 'participants', selfPeerId);

        clearConnectionParticipants();
        pushConnectionParticipant(selfPeerId, getEffectiveDisplayName());

        setConnectionSearching();

        await setDoc(fbRoomRef, {
          roomCode: code,
          updatedAt: Date.now()
        }, { merge: true });

        await setDoc(fbSelfParticipantRef, {
          id: selfPeerId,
          name: getEffectiveDisplayName(),
          updatedAt: Date.now(),
          joinedAt: Date.now()
        }, { merge: true });

        fbRoomUnsub = onSnapshot(fbRoomRef, (snap) => {
          if (!snap.exists()) return;
          const data = snap.data() || {};
          connection.sendLockOwnerId = data.sendLockOwnerId || '';
          connection.sendLockOwnerName = data.sendLockOwnerName || '';
          connection.sendLockUntil = Number(data.sendLockUntil || 0);
          connection.latestSettings = data.latestSettings || null;
          connection.latestSettingsAt = Number(data.latestSettingsAt || 0);
          connection.latestSettingsSenderId = data.latestSettingsSenderId || '';
          connection.latestSettingsSenderName = data.latestSettingsSenderName || '';

          maybeApplyLatestSettings();
          if (peerMenuOpen) refreshPeerMenu('connected');
        });

        fbParticipantsUnsub = onSnapshot(collection(db, 'rooms', code, 'participants'), (snap) => {
          const now = Date.now();
          const next = new Map();
          next.set(selfPeerId, {
            id: selfPeerId,
            name: getEffectiveDisplayName(),
            lastSeen: now
          });

          snap.forEach((docSnap) => {
            const d = docSnap.data() || {};
            const name = normalizeDisplayName(d.name || d.displayName || '名無し');
            const lastSeen = Number(d.updatedAt || d.lastSeen || 0);
            if (!docSnap.id || docSnap.id === selfPeerId) return;
            if (lastSeen && now - lastSeen > 15000) return;
            next.set(docSnap.id, {
              id: docSnap.id,
              name,
              lastSeen
            });
          });

          connection.participants = next;
          if (peerMenuOpen) renderPeerNameStrip();
        });

        fbEffectsUnsub = onSnapshot(query(collection(db, 'rooms', code, 'effects'), orderBy('createdAt', 'asc')), (snap) => {
          snap.docChanges().forEach((change) => {
            if (change.type !== 'added') return;
            if (!rememberPacket(change.doc.id)) return;
            const data = change.doc.data() || {};
            if (data.senderId === selfPeerId) return;
            applyIncomingEffect(data.kind, data.payload);
          });
        });

        stopFirebaseTimers();
        fbHeartbeatTimer = setInterval(async () => {
          if (!fbSelfParticipantRef) return;
          try {
            await setDoc(fbSelfParticipantRef, {
              id: selfPeerId,
              name: getEffectiveDisplayName(),
              updatedAt: Date.now()
            }, { merge: true });
          } catch (_) {}
        }, 5000);

        setConnectionConnected();
        refreshConnectedState();
        showToast(`Firebaseで接続: ${code}`);
      }

      function startLocalHeartbeat() {
        stopLocalTimers();
        localHeartbeatTimer = setInterval(() => {
          if (connection.kind !== 'local' || !connection.roomCode) return;
          postLocalPacket(connection.roomCode, makePacket({ type: 'hello' }));
          postLocalPacket(connection.roomCode, makePacket({ type: 'keepalive' }));
        }, 3000);

        localPurgeTimer = setInterval(() => {
          if (connection.kind !== 'local') return;
          const now = Date.now();
          for (const [id, item] of connection.participants.entries()) {
            if (id === selfPeerId) continue;
            if (now - (item.lastSeen || 0) > 15000) {
              connection.participants.delete(id);
            }
          }
          if (peerMenuOpen) renderPeerNameStrip();
        }, 1000);
      }

      function stopLocalTimers() {
        if (localHeartbeatTimer) {
          clearInterval(localHeartbeatTimer);
          localHeartbeatTimer = null;
        }
        if (localPurgeTimer) {
          clearInterval(localPurgeTimer);
          localPurgeTimer = null;
        }
      }

      function stopFirebaseTimers() {
        if (fbHeartbeatTimer) {
          clearInterval(fbHeartbeatTimer);
          fbHeartbeatTimer = null;
        }
      }

      function postLocalPacket(roomCode, packet) {
        const key = `${LOCAL_BUS_KEY_PREFIX}${roomCode}`;
        try {
          localChannel?.postMessage(packet);
        } catch (_) {}
        try {
          localStorage.setItem(key, JSON.stringify(packet));
        } catch (_) {}
      }

      function onLocalStorageEvent(ev) {
        if (!ev.key || !ev.key.startsWith(LOCAL_BUS_KEY_PREFIX)) return;
        if (!ev.newValue) return;
        try {
          const packet = JSON.parse(ev.newValue);
          handleIncomingPacket(packet, 'local');
        } catch (_) {}
      }

      function stopLocalConnection(sendLeave = true) {
        if (localChannel && sendLeave && connection.roomCode) {
          try {
            localChannel.postMessage(makePacket({ type: 'bye' }));
          } catch (_) {}
        }

        if (localChannel) {
          try {
            localChannel.close();
          } catch (_) {}
          localChannel = null;
        }

        window.removeEventListener('storage', onLocalStorageEvent);
        stopLocalTimers();

        connection.kind = 'none';
        connection.roomCode = '';
        connection.sendLockOwnerId = '';
        connection.sendLockOwnerName = '';
        connection.sendLockUntil = 0;
        connection.latestSettings = null;
        connection.latestSettingsAt = 0;
        connection.latestSettingsSenderId = '';
        connection.latestSettingsSenderName = '';
        clearConnectionParticipants();
        setConnectionOff();
      }

      async function stopFirebaseConnection(sendLeave = true) {
        if (sendLeave && fbSelfParticipantRef) {
          try {
            await deleteDoc(fbSelfParticipantRef);
          } catch (_) {}
        }

        if (fbRoomUnsub) {
          try { fbRoomUnsub(); } catch (_) {}
          fbRoomUnsub = null;
        }
        if (fbParticipantsUnsub) {
          try { fbParticipantsUnsub(); } catch (_) {}
          fbParticipantsUnsub = null;
        }
        if (fbEffectsUnsub) {
          try { fbEffectsUnsub(); } catch (_) {}
          fbEffectsUnsub = null;
        }

        stopFirebaseTimers();

        fbRoomRef = null;
        fbSelfParticipantRef = null;
        connection.kind = 'none';
        connection.roomCode = '';
        connection.sendLockOwnerId = '';
        connection.sendLockOwnerName = '';
        connection.sendLockUntil = 0;
        connection.latestSettings = null;
        connection.latestSettingsAt = 0;
        connection.latestSettingsSenderId = '';
        connection.latestSettingsSenderName = '';
        clearConnectionParticipants();
        setConnectionOff();
      }

      function stopAllConnections(sendLeave = true) {
        stopLocalConnection(sendLeave);
        void stopFirebaseConnection(sendLeave);
        receiveWindowUntil = 0;
      }

      function openConnectionMenuFromButton() {
        if (!settings.peerButtonVisible) return;

        if (connectionState === 'searching') {
          stopAllConnections(true);
          showToast('キャンセルした');
          return;
        }

        if (connectionState === 'connected') {
          openPeerMenu('connected');
          startPeerMenuTicker();
          return;
        }

        openPeerMenu('off');
        startPeerMenuTicker();
      }

      function handlePeerMenuClickOutside(e) {
        if (e.target === peerMenuOverlay) closePeerMenu();
      }

      function handleConnectionOverlayClickOutside(e) {
        if (e.target === connectOverlay) closeConnectDialog();
      }

      function handleQrOverlayClickOutside(e) {
        if (e.target === qrOverlay) closeQrDialog();
      }

      function finishPointer(e) {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const elapsed = nowMs() - pointerDownTime;
        const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

        if (!pointerHadLoop) {
          if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
            addTapEffect(p.x, p.y);
          } else if (totalMove >= SWIPE_MIN_DISTANCE) {
            const dx = p.x - pointerDownPos.x;
            const dy = p.y - pointerDownPos.y;
            createSwipeEffect(p.x, p.y, dx, dy);
          }
        }

        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;

        e.preventDefault();
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (settingsOverlay.classList.contains('open')) return;
        if (peerMenuOverlay.classList.contains('open')) return;
        if (connectOverlay.classList.contains('open')) return;
        if (qrOverlay.classList.contains('open')) return;
        if (activePointerId !== null) return;

        activePointerId = e.pointerId;
        canvas.setPointerCapture(activePointerId);

        const p = getPoint(e);
        pointerDownTime = nowMs();
        pointerDownPos = { x: p.x, y: p.y };
        lastPos = { x: p.x, y: p.y };
        strokePoints = [p];
        pointerHadLoop = false;

        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const t = nowMs();

        if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
          strokePoints.push(p);
          lastPos = p;
        }

        if (t - lastLoopAt >= LASSO_COOLDOWN) {
          if (detectLoop(strokePoints, p.x, p.y)) {
            createLoopEffect(strokePoints);
            lastLoopAt = t;
            pointerHadLoop = true;
            strokePoints = [p];
          }
        }

        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('pointerup', finishPointer, { passive: false });
      canvas.addEventListener('pointercancel', finishPointer, { passive: false });
      canvas.addEventListener('lostpointercapture', () => {
        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;
      });

      peerButtonToggle.addEventListener('change', () => {

        }
        updateDisplayNameEnabledState();
        updatePeerButtonUi();
        saveSettings();
      });

      resetSettings.addEventListener('click', resetAllSettings);

      const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      loadSettings();
      if (!settings.displayName) settings.displayName = effectiveDefaultName;
      if (!settings.lastRoomCode) settings.lastRoomCode = makeRoomCode();

      displayNameInput.value = getEffectiveDisplayName();
      roomCodeInput.value = settings.lastRoomCode;
      qrRoomCodeInput.value = settings.lastRoomCode;

      updateTheme();
      resize();
      syncSettingsUi();
      document.body.style.background = getBgColor();
      updatePeerButtonUi();
      updateDisplayNameEnabledState();

      if (darkMql) {
        if (typeof darkMql.addEventListener === 'function') {
          darkMql.addEventListener('change', updateTheme);
        } else if (typeof darkMql.addListener === 'function') {
          darkMql.addListener(updateTheme);
        }
      }

      window.addEventListener('resize', resize);
      window.addEventListener('beforeunload', () => {
        stopAllConnections(true);
      });

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
