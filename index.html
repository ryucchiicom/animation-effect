<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root{
      --bg:#fff;
      --edge:#111;
      --panel-bg:rgba(255,255,255,.84);
      --panel-border:rgba(0,0,0,.14);
      --text:#101010;
      --muted:rgba(16,16,16,.45);
      --track:rgba(0,0,0,.12);
      --track-disabled:rgba(0,0,0,.06);
      --thumb:rgba(0,0,0,.72);
      --peer-blue:#2f78ff;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --bg:#000;
        --edge:#fafafa;
        --panel-bg:rgba(0,0,0,.82);
        --panel-border:rgba(255,255,255,.16);
        --text:#f5f5f5;
        --muted:rgba(245,245,245,.45);
        --track:rgba(255,255,255,.14);
        --track-disabled:rgba(255,255,255,.07);
        --thumb:rgba(255,255,255,.78);
      }
    }
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--bg);
      color-scheme:light dark;
      touch-action:none;
      user-select:none;
      -webkit-user-select:none;
      overscroll-behavior:none;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    body{ position:relative; background:var(--bg); }
    canvas{ display:block; width:100vw; height:100vh; touch-action:none; }

    .gear-btn,.peer-btn{
      position:fixed;
      width:46px;height:46px;
      border-radius:50%;
      border:1.7px solid var(--edge);
      background:transparent;
      color:transparent;
      padding:0;
      display:grid;
      place-items:center;
      cursor:pointer;
      z-index:20;
      -webkit-tap-highlight-color:transparent;
      -webkit-appearance:none;
      appearance:none;
      box-sizing:border-box;
      text-shadow:none;
    }
    .gear-btn{ top:calc(env(safe-area-inset-top,0px) + 10px); right:calc(env(safe-area-inset-right,0px) + 10px); }
    .peer-btn{ top:calc(env(safe-area-inset-top,0px) + 10px); left:calc(env(safe-area-inset-left,0px) + 10px); }
    .gear-btn span,.peer-btn .peer-icon{
      font-size:20px;
      font-weight:400;
      line-height:1;
      transform:translateY(-.5px);
      color:var(--edge);
      -webkit-text-stroke:0;
      text-shadow:none;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI Symbol",sans-serif;
    }
    .gear-btn:active,.peer-btn:active{ transform:scale(.97); }
    .peer-btn.hidden{ display:none; }
    .peer-btn.searching,.peer-btn.connected{ border-color:var(--peer-blue); color:var(--peer-blue); }
    .peer-btn.connected .peer-icon{ color:var(--peer-blue); }
    .peer-icon{ display:block; width:20px; text-align:center; }
    .peer-spinner{ display:none; position:relative; width:20px; height:20px; color:var(--peer-blue); }
    .peer-btn.searching .peer-icon{ display:none; }
    .peer-btn.searching .peer-spinner{ display:block; animation:peer-spin .9s linear infinite; }
    .peer-spinner span{
      position:absolute; left:50%; top:50%;
      width:4px; height:4px; margin:-2px 0 0 -2px;
      border-radius:50%;
      background:currentColor;
      transform-origin:0 0;
    }
    .peer-spinner span:nth-child(1){ transform:translate(0,-8px); opacity:1; }
    .peer-spinner span:nth-child(2){ transform:translate(5.5px,-5.5px); opacity:.82; }
    .peer-spinner span:nth-child(3){ transform:translate(8px,0); opacity:.64; }
    .peer-spinner span:nth-child(4){ transform:translate(5.5px,5.5px); opacity:.46; }
    .peer-spinner span:nth-child(5){ transform:translate(0,8px); opacity:.34; }
    .peer-spinner span:nth-child(6){ transform:translate(-5.5px,5.5px); opacity:.46; }
    .peer-spinner span:nth-child(7){ transform:translate(-8px,0); opacity:.64; }
    .peer-spinner span:nth-child(8){ transform:translate(-5.5px,-5.5px); opacity:.82; }
    @keyframes peer-spin{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

    .overlay,.peer-menu-overlay,.qr-overlay,.room-overlay{
      position:fixed;
      inset:0;
      z-index:40;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.34);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      padding:18px;
      box-sizing:border-box;
    }
    .overlay.open,.peer-menu-overlay.open,.qr-overlay.open,.room-overlay.open{ display:flex; }

    .panel{
      width:min(92vw,460px);
      max-height:min(84vh,680px);
      overflow:auto;
      border-radius:26px;
      background:var(--panel-bg);
      border:1px solid var(--panel-border);
      box-shadow:0 14px 40px rgba(0,0,0,.22);
      color:var(--text);
      padding:18px 18px 16px;
      box-sizing:border-box;
      scrollbar-width:thin;
    }
    .panel-header{
      position:sticky;
      top:0;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:-18px -18px 18px;
      padding:18px 18px 14px;
      background:linear-gradient(to bottom, var(--panel-bg) 80%, rgba(0,0,0,0));
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(127,127,127,.12);
    }
    .panel-title{ font-size:18px; font-weight:700; letter-spacing:.02em; }

    .close-btn,.ghost-btn,.danger-btn{
      appearance:none;
      -webkit-tap-highlight-color:transparent;
      cursor:pointer;
      border-radius:14px;
      font-weight:650;
    }
    .close-btn{
      border:1.5px solid var(--edge);
      background:transparent;
      color:var(--text);
      min-width:42px;
      height:36px;
      padding:0 14px;
      font-size:14px;
    }
    .close-btn:active,.ghost-btn:active,.danger-btn:active{ transform:scale(.98); }

    .setting-block{ padding:14px 0 4px; border-top:1px solid rgba(127,127,127,.16); }
    .setting-block:first-of-type{ border-top:0; padding-top:0; }
    .setting-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .setting-label{ display:flex; flex-direction:column; gap:4px; min-width:0; }
    .setting-label .main{ font-size:15px; font-weight:650; line-height:1.2; }
    .setting-label .sub{ font-size:12px; color:var(--muted); line-height:1.3; }

    .switch{ position:relative; width:56px; height:34px; flex:0 0 auto; }
    .switch input{ opacity:0; width:0; height:0; position:absolute; }
    .slider{
      position:absolute; inset:0; background:rgba(127,127,127,.18); border:1px solid var(--panel-border); border-radius:999px; transition:.2s ease; cursor:pointer;
    }
    .slider::before{
      content:"";
      position:absolute; left:4px; top:4px; width:24px; height:24px; border-radius:50%; background:var(--thumb); transition:.2s ease;
    }
    .switch input:checked + .slider{ background:rgba(55,180,90,.22); }
    .switch input:checked + .slider::before{ transform:translateX(22px); }

    .control-row{ display:flex; align-items:center; gap:10px; justify-content:space-between; margin-top:10px; }
    .mode-select{
      width:128px; height:36px; border-radius:12px; border:1px solid var(--panel-border); background:transparent; color:var(--text);
      padding:0 10px; font-size:14px; outline:none; appearance:none; -webkit-appearance:none;
    }
    .hex-input{
      width:100%; box-sizing:border-box; height:38px; border-radius:12px; border:1px solid var(--panel-border);
      background:transparent; color:var(--text); padding:0 12px; font-size:14px; outline:none;
    }
    .hex-input::placeholder{ color:var(--muted); }
    .sub-input-wrap{ margin-top:10px; }
    .disabled{ opacity:.34; pointer-events:none; }

    .range-wrap{ margin-top:12px; padding-left:2px; }
    .range-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .range-title{ font-size:13px; font-weight:650; }
    .range-value{ font-size:12px; color:var(--muted); }

    input[type="range"]{
      width:100%;
      margin:0;
      appearance:none;
      -webkit-appearance:none;
      background:transparent;
      height:28px;
      outline:none;
    }
    input[type="range"]::-webkit-slider-runnable-track{ height:7px; border-radius:999px; background:var(--track); }
    .disabled input[type="range"]::-webkit-slider-runnable-track{ background:var(--track-disabled); }
    input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%; margin-top:-7.5px; background:var(--thumb); border:0;
      box-shadow:0 0 0 3px rgba(127,127,127,.15);
    }
    input[type="range"]::-moz-range-track{ height:7px; border-radius:999px; background:var(--track); }
    .disabled input[type="range"]::-moz-range-track{ background:var(--track-disabled); }
    input[type="range"]::-moz-range-thumb{
      width:22px; height:22px; border-radius:50%; background:var(--thumb); border:0; box-shadow:0 0 0 3px rgba(127,127,127,.15);
    }

    .effect-grid{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px; }
    .effect-item{ display:flex; flex-direction:column; gap:6px; padding:10px 0 0; }
    .effect-item + .effect-item{ border-top:1px solid rgba(127,127,127,.12); padding-top:12px; }
    .effect-name{ font-size:13px; font-weight:650; }
    .effect-desc{ font-size:12px; color:var(--muted); line-height:1.35; }

    .footer-actions{ display:flex; gap:10px; margin-top:14px; }
    .danger-btn{
      border:1.5px solid rgba(220,40,40,.55);
      background:transparent;
      color:#d23636;
      min-width:0;
      height:40px;
      padding:0 14px;
      font-size:14px;
      flex:1 1 auto;
    }
    .ghost-btn{
      border:1.5px solid var(--panel-border);
      background:transparent;
      color:var(--text);
      height:40px;
      padding:0 14px;
      font-size:14px;
    }

    .dialog{
      width:min(92vw,520px);
      border-radius:26px;
      background:var(--panel-bg);
      border:1px solid var(--panel-border);
      box-shadow:0 14px 40px rgba(0,0,0,.22);
      color:var(--text);
      padding:18px;
      box-sizing:border-box;
      max-height:min(86vh,720px);
      overflow:auto;
    }
    .dialog-title{ font-size:18px; font-weight:700; margin-bottom:12px; }
    .dialog-text{ font-size:13px; color:var(--muted); line-height:1.45; margin-bottom:12px; }

    .qr-box{
      width:min(72vw,320px); aspect-ratio:1/1; margin:0 auto 12px; border-radius:18px; overflow:hidden;
      background:rgba(255,255,255,.95); border:1px solid rgba(0,0,0,.08); display:grid; place-items:center;
    }
    .qr-box img{ width:100%; height:100%; object-fit:cover; display:block; }

    .qr-actions,.room-actions{ display:flex; gap:10px; flex-wrap:wrap; }
    .room-code-list{ display:flex; gap:8px; flex-wrap:wrap; padding-top:12px; margin-bottom:8px; }
    .room-code-pill{
      border:1px solid rgba(47,120,255,.36);
      color:var(--peer-blue);
      border-radius:999px;
      padding:6px 10px;
      font-size:12px;
      line-height:1;
      background:rgba(47,120,255,.06);
      white-space:nowrap;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom, 0px) + 14px);
      transform:translateX(-50%) translateY(12px);
      background:rgba(0,0,0,.72);
      color:#fff;
      border-radius:999px;
      padding:10px 14px;
      font-size:13px;
      line-height:1;
      z-index:60;
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease, transform .2s ease;
      max-width:min(90vw,420px);
      text-align:center;
      box-sizing:border-box;
    }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
    .hidden{ display:none !important; }

    .peer-menu-stage{
      position:relative;
      width:min(92vw,460px);
      height:min(84vh,460px);
      pointer-events:none;
    }
    .peer-burst-ring{
      position:absolute;
      left:50%;
      top:50%;
      width:88px;
      height:88px;
      border-radius:50%;
      border:1.8px solid rgba(47,120,255,.35);
      transform:translate(-50%,-50%) scale(.25);
      opacity:0;
      transition:transform 1s ease, opacity .5s ease;
      pointer-events:none;
    }
    .peer-menu-overlay.open .peer-burst-ring{
      transform:translate(-50%,-50%) scale(2.45);
      opacity:1;
    }

    .peer-names-bar{
      position:absolute;
      left:50%;
      top:10px;
      transform:translateX(-50%);
      width:min(88vw,420px);
      display:none;
      gap:6px;
      flex-wrap:wrap;
      justify-content:center;
      pointer-events:none;
      z-index:2;
    }
    .peer-menu-overlay.connected .peer-names-bar{ display:flex; }
    .peer-name-chip{
      border:1px solid rgba(47,120,255,.32);
      background:rgba(47,120,255,.08);
      color:var(--peer-blue);
      padding:6px 10px;
      font-size:12px;
      border-radius:999px;
      line-height:1;
      white-space:nowrap;
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .peer-choice{
      position:absolute;
      left:50%;
      top:50%;
      width:122px;
      height:122px;
      border:1.7px solid rgba(47,120,255,.82);
      background:rgba(255,255,255,.08);
      border-radius:50%;
      padding:0;
      cursor:pointer;
      pointer-events:auto;
      -webkit-tap-highlight-color:transparent;
      transform:translate(-50%,-50%) translate(var(--from-x), var(--from-y)) scale(.12);
      opacity:0;
      transition:transform 1s cubic-bezier(.2,.8,.2,1), opacity .5s ease;
      display:grid;
      place-items:center;
      box-sizing:border-box;
      color:#2f78ff;
    }
    .peer-menu-overlay.open .peer-choice{
      transform:translate(-50%,-50%) translate(var(--to-x), var(--to-y)) scale(1);
      opacity:1;
    }
    .peer-choice:active{
      transform:translate(-50%,-50%) translate(var(--to-x), var(--to-y)) scale(.97);
    }
    .peer-choice:disabled{ opacity:.42; cursor:default; filter:grayscale(.15); }
    .peer-choice .peer-choice-label{
      font-size:14px;
      font-weight:700;
      text-align:center;
      line-height:1.25;
      padding:0 12px;
      color:#2f78ff;
      opacity:0;
      transition:opacity .5s ease;
      transition-delay:1s;
      word-break:keep-all;
      white-space:pre-line;
    }
    .peer-menu-overlay.open .peer-choice .peer-choice-label{ opacity:1; }
    .peer-choice::before{
      content:"";
      position:absolute;
      inset:7px;
      border-radius:50%;
      border:1px solid rgba(47,120,255,.2);
      background:rgba(47,120,255,.03);
      pointer-events:none;
    }
    .peer-choice.local{ --to-x:0px; --to-y:-118px; }
    .peer-choice.firebase{ --to-x:-118px; --to-y:108px; }
    .peer-choice.qr{ --to-x:118px; --to-y:108px; }
    .peer-choice.disconnect{ --to-x:0px; --to-y:-118px; }
    .peer-choice.send{ --to-x:-118px; --to-y:108px; }
    .peer-choice.receive{ --to-x:118px; --to-y:108px; }

    .name-input-wrap{ margin-top:10px; }
    .name-input-wrap.disabled{ opacity:.34; pointer-events:none; }
    .room-overlay .dialog{ max-width:520px; }
    .room-overlay .ghost-btn{ flex:1 1 140px; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import {
      getFirestore,
      doc,
      collection,
      setDoc,
      deleteDoc,
      onSnapshot,
      runTransaction,
      addDoc,
      query,
      orderBy,
      limit
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAYPZs5qIydcNiFs_2KQDgtkb9oNsnvI2E",
      authDomain: "effect-animation-2b30b.firebaseapp.com",
      projectId: "effect-animation-2b30b",
      storageBucket: "effect-animation-2b30b.firebasestorage.app",
      messagingSenderId: "647910459483",
      appId: "1:647910459483:web:150b791ae0d61fe18e977e",
      measurementId: "G-QX5C0SHB9Y"
    };

    initializeApp(firebaseConfig);
    const db = getFirestore();

    const el = {
      canvas: document.getElementById('c'),
      openSettings: document.getElementById('openSettings'),
      closeSettings: document.getElementById('closeSettings'),
      overlay: document.getElementById('overlay'),
      peerButton: document.getElementById('peerButton'),
      bgMode: document.getElementById('bgMode'),
      bgCustomWrap: document.getElementById('bgCustomWrap'),
      bgCustomInput: document.getElementById('bgCustomInput'),
      tapColorInput: document.getElementById('tapColorInput'),
      swipeColorInput: document.getElementById('swipeColorInput'),
      loopColorInput: document.getElementById('loopColorInput'),
      gridToggle: document.getElementById('gridToggle'),
      gridDetails: document.getElementById('gridDetails'),
      gridMode: document.getElementById('gridMode'),
      gridCustomWrap: document.getElementById('gridCustomWrap'),
      gridCustomInput: document.getElementById('gridCustomInput'),
      spacingRange: document.getElementById('spacingRange'),
      spacingValue: document.getElementById('spacingValue'),
      peerButtonToggle: document.getElementById('peerButtonToggle'),
      displayNameWrap: document.getElementById('displayNameWrap'),
      displayNameInput: document.getElementById('displayNameInput'),
      resetSettings: document.getElementById('resetSettings'),
      peerMenuOverlay: document.getElementById('peerMenuOverlay'),
      peerMenuStage: document.getElementById('peerMenuStage'),
      peerNamesBar: document.getElementById('peerNamesBar'),
      peerChoice1: document.getElementById('peerChoice1'),
      peerChoice2: document.getElementById('peerChoice2'),
      peerChoice3: document.getElementById('peerChoice3'),
      peerChoiceLabel1: document.getElementById('peerChoiceLabel1'),
      peerChoiceLabel2: document.getElementById('peerChoiceLabel2'),
      peerChoiceLabel3: document.getElementById('peerChoiceLabel3'),
      qrOverlay: document.getElementById('qrOverlay'),
      qrTitle: document.getElementById('qrTitle'),
      qrText: document.getElementById('qrText'),
      qrImage: document.getElementById('qrImage'),
      qrCloseButton: document.getElementById('qrCloseButton'),
      roomOverlay: document.getElementById('roomOverlay'),
      roomTitle: document.getElementById('roomTitle'),
      roomText: document.getElementById('roomText'),
      roomCodeInput: document.getElementById('roomCodeInput'),
      roomJoinButton: document.getElementById('roomJoinButton'),
      roomQrToggleButton: document.getElementById('roomQrToggleButton'),
      roomCancelButton: document.getElementById('roomCancelButton'),
      toast: document.getElementById('toast'),
    };

    const ctx = el.canvas.getContext('2d', { alpha: true });

    const STORAGE_KEY = 'touch_effect_settings_v6';
    const LOCAL_PREFIX = 'touch_effect_local_bus_';
    const QR_API = 'https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=10&data=';

    const defaults = {
      bgMode: 'system',
      bgCustom: '#ffffff',
      tapColor: '#46ff78',
      swipeColor: '#6ea5ff',
      loopColor: '#ff4e4e',
      gridEnabled: false,
      gridMode: 'system',
      gridCustom: '#e8e8e8',
      gridSpacing: 36,
      peerButtonVisible: false,
      displayName: '自分',
    };

    const settings = { ...defaults };

    const appState = {
      roomCode: '',
      roomMode: 'local',
      transport: 'none',
      peerState: 'off',
      showQrAfterJoin: false,
      roomMenuMode: 'off',
      localChannel: null,
      localBusKey: '',
      localHeartbeat: null,
      localStorageHandler: null,
      firebase: {
        roomRef: null,
        settingsRef: null,
        participantsRef: null,
        eventsRef: null,
        selfPresenceRef: null,
        unsubRoom: null,
        unsubSettings: null,
        unsubParticipants: null,
        unsubEvents: null,
        heartbeat: null,
      },
      participants: new Map(),
      sendLock: { byId: '', byName: '', until: 0, token: '' },
      receiveWindowUntil: 0,
      currentSettingsToken: '',
      seenPackets: new Set(),
      seenQueue: [],
      maybeConnectedToastShown: false,
      roomSyncTimer: null,
    };

    let darkMode = false;
    let w = 0, h = 0, dpr = 1;
    const effects = [];

    let pointerIdActive = null;
    let pointerDownTime = 0;
    let pointerDownPos = { x: 0, y: 0 };
    let lastPos = { x: 0, y: 0 };
    let strokePoints = [];
    let pointerHadLoop = false;
    let lastLoopAt = 0;

    const SWIPE_MIN_DISTANCE = 42;
    const TAP_MAX_DISTANCE = 12;
    const TAP_MAX_TIME = 320;
    const LASSO_MIN_POINTS = 20;
    const LASSO_HIT_RADIUS = 18;
    const LASSO_IGNORE_RECENT_SEGMENTS = 10;
    const LASSO_COOLDOWN = 140;

    function showToast(message, duration = 1600) {
      el.toast.textContent = message;
      el.toast.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.toast.classList.remove('show'), duration);
    }
    function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
    function nowMs() { return performance.now(); }
    function nowEpoch() { return Date.now(); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function distance(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
    function isValidMode(v) { return v === 'system' || v === 'white' || v === 'black' || v === 'custom'; }
    function makeId() {
      if (crypto.randomUUID) return crypto.randomUUID();
      const bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }
    function normalizeHexColor(raw) {
      if (typeof raw !== 'string') return null;
      let s = raw.trim();
      if (!s) return null;
      if (s[0] === '#') s = s.slice(1);
      if (!/^[0-9a-fA-F]+$/.test(s)) return null;
      if (s.length === 3 || s.length === 4) s = s.split('').map(ch => ch + ch).join('');
      if (s.length !== 6 && s.length !== 8) return null;
      return '#' + s.toLowerCase();
    }
    function hexToRgba(rawHex, alphaOverride = 1) {
      const hex = normalizeHexColor(rawHex);
      if (!hex) return null;
      const s = hex.slice(1);
      const r = parseInt(s.slice(0, 2), 16);
      const g = parseInt(s.slice(2, 4), 16);
      const b = parseInt(s.slice(4, 6), 16);
      const a = s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1;

    function addTapEffect(x, y, broadcast = true) {
      effects.push({ type: 'tap', x, y, start: nowMs(), duration: 650 });
      if (broadcast) sendEffectToRoom('tap', { x, y });
    }
    function createSwipeEffect(startX, startY, dirX, dirY, broadcast = true, forced = null) {
      const len = Math.hypot(dirX, dirY) || 1;
      dirX /= len;
      dirY /= len;

      const pad = 90;
      const minX = -pad, minY = -pad, maxX = w + pad, maxY = h + pad;
      const hits = [];
      const pushCandidate = (t, x, y) => {
        if (x >= minX - .5 && x <= maxX + .5 && y >= minY - .5 && y <= maxY + .5) hits.push({ t, x, y });
      };

      if (forced && forced.forceFrom && forced.forceTo) {
        hits.push({ t: 0, x: forced.forceFrom.x, y: forced.forceFrom.y }, { t: 1, x: forced.forceTo.x, y: forced.forceTo.y });
      } else {
        if (Math.abs(dirX) > 1e-6) {
          let t = (minX - startX) / dirX; pushCandidate(t, minX, startY + dirY * t);
          t = (maxX - startX) / dirX; pushCandidate(t, maxX, startY + dirY * t);
        }
        if (Math.abs(dirY) > 1e-6) {
          let t = (minY - startY) / dirY; pushCandidate(t, startX + dirX * t, minY);
          t = (maxY - startY) / dirY; pushCandidate(t, startX + dirX * t, maxY);
        }
        if (hits.length < 2) {
          hits.push({ t: -400, x: startX - dirX * 400, y: startY - dirY * 400 }, { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 });
        } else {
          hits.sort((a, b) => a.t - b.t);
        }
      }

      const first = forced && forced.forceFrom ? forced.forceFrom : hits[0];
      const last = forced && forced.forceTo ? forced.forceTo : hits[hits.length - 1];
      const travel = distance(first.x, first.y, last.x, last.y);
      const duration = clamp(460 + travel * 0.12, 520, 900);
      const radius = typeof (forced && forced.forceRadius) === 'number' ? forced.forceRadius : clamp(Math.min(w, h) * .045, 18, 38);

      effects.push({
        type: 'swipe',
        start: nowMs(),
        duration,
        from: { x: first.x, y: first.y },
        to: { x: last.x, y: last.y },
        dir: { x: dirX, y: dirY },
        radius
      });

      if (broadcast) sendEffectToRoom('swipe', {
        from: { x: first.x, y: first.y },
        to: { x: last.x, y: last.y },
        dir: { x: dirX, y: dirY },
        radius
      });
    }
    function createLoopEffect(points, broadcast = true) {
      if (points.length < 3) return;
      const copy = points.map(p => ({ x: p.x, y: p.y }));
      effects.push({ type: 'loop', start: nowMs(), duration: 420, points: copy });
      if (broadcast) sendEffectToRoom('loop', { points: copy });
    }

    function pointToSegmentDistance(px, py, ax, ay, bx, by) {
      const abx = bx - ax, aby = by - ay, apx = px - ax, apy = py - ay;
      const abLen2 = abx * abx + aby * aby;
      if (abLen2 === 0) return Math.hypot(px - ax, py - ay);
      let t = (apx * abx + apy * aby) / abLen2;
      t = clamp(t, 0, 1);
      const cx = ax + abx * t, cy = ay + aby * t;
      return Math.hypot(px - cx, py - cy);
    }
    function detectLoop(points, currentX, currentY) {
      if (points.length < LASSO_MIN_POINTS) return false;
      const n = points.length;
      const safeEnd = Math.max(0, n - 1 - LASSO_IGNORE_RECENT_SEGMENTS);
      for (let i = 0; i < safeEnd - 1; i++) {
        const a = points[i], b = points[i + 1];
        const d = pointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
        if (d <= LASSO_HIT_RADIUS) {
          let traveled = 0;
          for (let k = i; k < n - 1; k++) {
            traveled += distance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
            if (traveled > 40) break;
          }
          if (traveled > 40) return true;
        }
      }
      return false;
    }

    function drawGrid() {
      if (!settings.gridEnabled) return;
      const baseColor = getGridBaseColor();
      const lineLow = hexToRgba(baseColor, .40) || (darkMode ? 'rgba(34,34,34,.40)' : 'rgba(232,232,232,.40)');
      const lineHigh = hexToRgba(baseColor, .56) || (darkMode ? 'rgba(58,58,58,.56)' : 'rgba(210,210,210,.56)');

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = 1;
      for (let x = 0; x <= w + settings.gridSpacing; x += settings.gridSpacing) {
        const accent = Math.round(x / settings.gridSpacing) % 4 === 0;
        ctx.strokeStyle = accent ? lineHigh : lineLow;
        ctx.beginPath();
        ctx.moveTo(Math.floor(x) + 0.5, 0);
        ctx.lineTo(Math.floor(x) + 0.5, h);
        ctx.stroke();
      }
      for (let y = 0; y <= h + settings.gridSpacing; y += settings.gridSpacing) {
        const accent = Math.round(y / settings.gridSpacing) % 4 === 0;
        ctx.strokeStyle = accent ? lineHigh : lineLow;
        ctx.beginPath();
        ctx.moveTo(0, Math.floor(y) + 0.5);
        ctx.lineTo(w, Math.floor(y) + 0.5);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawTap(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;
      const e = easeOutCubic(p);
      const radius = lerp(10, Math.max(w, h) * .22, e);
      const alpha = .34 * Math.pow(1 - p, 1.7);
      const baseColor = getTapBaseColor();
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = radius * .22;
      ctx.shadowColor = hexToRgba(baseColor, .55) || 'rgba(70,255,120,.55)';
      const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
      g.addColorStop(0, hexToRgba(baseColor, .92) || 'rgba(70,255,120,.92)');
      g.addColorStop(.28, hexToRgba(baseColor, .60) || 'rgba(60,235,110,.60)');
      g.addColorStop(.68, hexToRgba(baseColor, .25) || 'rgba(50,220,100,.25)');
      g.addColorStop(1, hexToRgba(baseColor, 0) || 'rgba(50,220,100,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    function drawSwipe(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;
      const e = easeOutCubic(p);
      const x = lerp(effect.from.x, effect.to.x, e);
      const y = lerp(effect.from.y, effect.to.y, e);
      const trailSteps = 16;
      const trailSpacing = effect.radius * .82;
      const baseColor = getSwipeBaseColor();
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      for (let i = trailSteps; i >= 0; i--) {
        const back = i * trailSpacing;
        const px = x - effect.dir.x * back;
        const py = y - effect.dir.y * back;
        const a = .24 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, .35);
        if (a <= .001) continue;
        const r = effect.radius * (1 + (trailSteps - i) * .02);
        ctx.globalAlpha = a;
        ctx.shadowBlur = r * .35;
        ctx.shadowColor = hexToRgba(baseColor, .55) || 'rgba(90,150,255,.55)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110,165,255,1)';
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = .45 * Math.pow(1 - p, .7);
      ctx.shadowBlur = effect.radius * .6;
      ctx.shadowColor = hexToRgba(baseColor, .45) || 'rgba(110,165,255,.45)';
      ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110,165,255,1)';
      ctx.beginPath();
      ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    function drawLoop(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1 || effect.points.length < 3) return;
      const alpha = .36 * Math.pow(1 - p, 2.0);
      const blur = 8 * Math.pow(1 - p, .55);
      const baseColor = getLoopBaseColor();
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = blur;
      ctx.shadowColor = hexToRgba(baseColor, .40) || 'rgba(255,60,60,.40)';
      ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(255,78,78,1)';
      ctx.beginPath();
      ctx.moveTo(effect.points[0].x, effect.points[0].y);
      for (let i = 1; i < effect.points.length; i++) ctx.lineTo(effect.points[i].x, effect.points[i].y);
      ctx.closePath();
      ctx.fill('evenodd');
      ctx.restore();
    }
    function render() {
      const t = nowMs();
      ctx.fillStyle = getBgColor();
      ctx.fillRect(0, 0, w, h);
      drawGrid();
      for (const effect of effects) {
        if (effect.type === 'tap') drawTap(effect, t);
        else if (effect.type === 'swipe') drawSwipe(effect, t);
        else if (effect.type === 'loop') drawLoop(effect, t);
      }
      for (let i = effects.length - 1; i >= 0; i--) {
        if (t - effects[i].start >= effects[i].duration) effects.splice(i, 1);
      }
      requestAnimationFrame(render);
    }

    function localBusPost(packet) {
      if (!appState.localChannel) return;
      try { appState.localChannel.postMessage(packet); } catch {}
      try { localStorage.setItem(appState.localBusKey, JSON.stringify(packet)); } catch {}
    }

    function handleIncomingMessage(packet) {
      if (!packet || typeof packet !== 'object') return;
      if (packet.sender === 'self') return;
      if (!rememberPacket(packet.id)) return;

      if (packet.type === 'presence') {
        if (packet.id && packet.id !== 'self') {
          appState.participants.set(packet.id, {
            id: packet.id,
            name: (packet.name || '名無し').toString().slice(0, 20),
            lastSeen: typeof packet.lastSeen === 'number' ? packet.lastSeen : nowEpoch(),
            self: false,
          });
          updateConnectionStateFromParticipants();
        }
        return;
      }
      if (packet.type === 'leave') {
        if (packet.id) appState.participants.delete(packet.id);
        updateConnectionStateFromParticipants();
        return;
      }
      if (packet.type === 'lock') {
        appState.sendLock = {
          byId: packet.byId || '',
          byName: packet.byName || '',
          until: typeof packet.until === 'number' ? packet.until : 0,
          token: packet.token || '',
        };
        refreshPeerMenuUi();
        return;
      }
      if (packet.type === 'settings') {
        if (Date.now() <= appState.receiveWindowUntil) {
          appState.receiveWindowUntil = 0;
          applySettingsObject(packet.payload);
          showToast('設定を受信した');
        }
        return;
      }
      if (packet.type === 'effect') {
        applyEffectPacket(packet);
      }
    }
    function applyEffectPacket(packet) {
      const p = packet.payload || {};
      if (packet.kind === 'tap' && typeof p.x === 'number' && typeof p.y === 'number') {
        addTapEffect(p.x, p.y, false);
      } else if (packet.kind === 'swipe' && p.from && p.to && p.dir) {
        createSwipeEffect(p.from.x, p.from.y, p.dir.x * 100, p.dir.y * 100, false, {
          forceFrom: p.from,
          forceTo: p.to,
          forceRadius: p.radius
        });
      } else if (packet.kind === 'loop' && Array.isArray(p.points)) {
        const pts = p.points.filter(pt => pt && typeof pt.x === 'number' && typeof pt.y === 'number');
        if (pts.length >= 3) createLoopEffect(pts, false);
      }
    }

    async function acquireSendLock() {
      const now = nowEpoch();
      if (isLockActive(appState.sendLock) && appState.sendLock.byId !== 'self') return false;

      const nextLock = {
        byId: 'self',
        byName: currentDisplayName(),
        until: now + 10000,
        token: makeId(),
      };

      if (appState.transport === 'local') {
        appState.sendLock = nextLock;
        refreshPeerMenuUi();
        localBusPost({
          id: makeId(),
          sender: 'self',
          senderName: currentDisplayName(),
          type: 'lock',
          ...nextLock,
          ts: nowEpoch(),
        });
        return true;
      }

      if (appState.transport === 'firebase' && appState.firebase.roomRef) {
        try {
          await runTransaction(db, async tx => {
            const snap = await tx.get(appState.firebase.roomRef);
            const data = snap.data() || {};
            const existing = data.sendLock || null;
            if (existing && typeof existing.until === 'number' && existing.until > now && existing.byId !== 'self') {
              throw new Error('locked');
            }
            tx.set(appState.firebase.roomRef, { sendLock: nextLock, updatedAt: nowEpoch() }, { merge: true });
          });
          appState.sendLock = nextLock;
          refreshPeerMenuUi();
          return true;
        } catch {
          return false;
        }
      }
      return false;
    }

    function canvasPointerBindings() {
      el.canvas.addEventListener('pointerdown', e => {
        if (el.overlay.classList.contains('open') || el.peerMenuOverlay.classList.contains('open') || el.qrOverlay.classList.contains('open') || el.roomOverlay.classList.contains('open')) return;
        if (pointerIdActive !== null) return;
        pointerIdActive = e.pointerId;
        el.canvas.setPointerCapture(pointerIdActive);
        const p = { x: e.clientX, y: e.clientY };
        pointerDownTime = nowMs();
        pointerDownPos = { ...p };
        lastPos = { ...p };
        strokePoints = [p];
        pointerHadLoop = false;
        e.preventDefault();
      }, { passive: false });

      el.canvas.addEventListener('pointermove', e => {
        if (pointerIdActive !== e.pointerId) return;
        const p = { x: e.clientX, y: e.clientY };
        const t = nowMs();
        if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
          strokePoints.push(p);
          lastPos = p;
        }
        if (t - lastLoopAt >= LASSO_COOLDOWN) {
          if (detectLoop(strokePoints, p.x, p.y)) {
            createLoopEffect(strokePoints);
            lastLoopAt = t;
            pointerHadLoop = true;
            strokePoints = [p];
          }
        }
        e.preventDefault();
      }, { passive: false });

      const endPointer = e => {
        if (pointerIdActive !== e.pointerId) return;
        const p = { x: e.clientX, y: e.clientY };
        const elapsed = nowMs() - pointerDownTime;
        const move = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);
        if (!pointerHadLoop) {
          if (move <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) addTapEffect(p.x, p.y);
          else if (move >= SWIPE_MIN_DISTANCE) createSwipeEffect(p.x, p.y, p.x - pointerDownPos.x, p.y - pointerDownPos.y);
        }
        pointerIdActive = null;
        strokePoints = [];
        pointerHadLoop = false;
        e.preventDefault();
      };

      el.canvas.addEventListener('pointerup', endPointer, { passive: false });
      el.canvas.addEventListener('pointercancel', endPointer, { passive: false });
      el.canvas.addEventListener('lostpointercapture', () => { pointerIdActive = null; strokePoints = []; pointerHadLoop = false; });
    }

      el.roomOverlay.addEventListener('click', e => { if (e.target === el.roomOverlay) closeRoomOverlay(); });

      el.peerChoice1.addEventListener('click', () => { if (appState.peerState === 'connected') { closePeerMenu(); disconnectCurrentRoom(true); showToast('切断した'); } });
      el.peerChoice2.addEventListener('click', () => { if (appState.peerState === 'connected') { closePeerMenu(); sendCurrentSettings(); } });
      el.peerChoice3.addEventListener('click', () => { if (appState.peerState === 'connected') { closePeerMenu(); appState.receiveWindowUntil = nowEpoch() + 10000; showToast('10秒以内の設定を待ってる'); } });

      el.roomJoinButton.addEventListener('click', joinRoomFromOverlay);
      el.roomCancelButton.addEventListener('click', closeRoomOverlay);
      el.roomQrToggleButton.addEventListener('click', () => { appState.showQrAfterJoin = !appState.showQrAfterJoin; updateRoomOverlayText(); });
      el.qrCloseButton.addEventListener('click', closeQrOverlay);

      el.bgMode.addEventListener('change', () => { handleSettingsChange(); syncUi(); });
      el.bgCustomInput.addEventListener('input', () => { handleSettingsChange(); syncUi(); });
      el.tapColorInput.addEventListener('input', handleSettingsChange);
      el.swipeColorInput.addEventListener('input', handleSettingsChange);
      el.loopColorInput.addEventListener('input', handleSettingsChange);
      el.gridToggle.addEventListener('change', () => { handleSettingsChange(); syncUi(); });
      el.gridMode.addEventListener('change', () => { handleSettingsChange(); syncUi(); });
      el.gridCustomInput.addEventListener('input', handleSettingsChange);
      el.spacingRange.addEventListener('input', handleSettingsChange);
      el.peerButtonToggle.addEventListener('change', () => { handlePeerToggleChange(); syncUi(); });
      el.displayNameInput.addEventListener('input', () => { handleDisplayNameChange(); syncUi(); });
      el.resetSettings.addEventListener('click', resetAllSettings);

      el.roomCodeInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') {
          e.preventDefault();
          joinRoomFromOverlay();
        }
      });

      window.addEventListener('beforeunload', () => {
        try { disconnectCurrentRoom(false); } catch {}
      });

      canvasPointerBindings();
    }

    function openPeerButtonMenu() { handlePeerButtonClick(); }
    function updatePeerButtonForState() { updatePeerButtonUi(); refreshPeerMenuUi(); }

    function init() {
      loadSettings();
      updateTheme();
      resize();
      syncUi();
      setEventHandlers();
      startRoomSyncTimer();
      requestAnimationFrame(render);
    }
    init();

    function onWindowResize() { resize(); }
    window.addEventListener('resize', onWindowResize);

    const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    if (darkMql) {
      if (typeof darkMql.addEventListener === 'function') darkMql.addEventListener('change', updateTheme);
      else if (typeof darkMql.addListener === 'function') darkMql.addListener(updateTheme);
    }

    function openPeerMenuFromButton() { handlePeerButtonClick(); }
    el.peerButton.addEventListener('click', openPeerMenuFromButton);

    function refreshAll() {
      syncUi();
      updateTheme();
      updatePeerButtonUi();
      refreshPeerMenuUi();
    }

    function updateConnectionAndUi() {
      updateConnectionStateFromParticipants();
      refreshAll();
    }

    function cleanupLoop() {
      if (appState.transport === 'none') return;
      cleanupParticipants();
      if (isLockActive(appState.sendLock) && appState.sendLock.until < nowEpoch()) {
        appState.sendLock = { byId:'', byName:'', until:0, token:'' };
        refreshPeerMenuUi();
      }
      maybeShowConnectedToast();
    }

    setInterval(cleanupLoop, 1000);
  </script>
</body>
</html>
