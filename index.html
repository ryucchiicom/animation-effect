<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #fff;
      --edge: #111;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: rgba(0, 0, 0, 0.14);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.45);
      --track: rgba(0, 0, 0, 0.12);
      --track-disabled: rgba(0, 0, 0, 0.06);
      --thumb: rgba(0, 0, 0, 0.72);
      --peer-blue: #2f78ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --edge: #fafafa;
        --panel-bg: rgba(0, 0, 0, 0.82);
        --panel-border: rgba(255, 255, 255, 0.16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, 0.45);
        --track: rgba(255, 255, 255, 0.14);
        --track-disabled: rgba(255, 255, 255, 0.07);
        --thumb: rgba(255, 255, 255, 0.78);
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color-scheme: light dark;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
      background: var(--bg);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .gear-btn,
    .peer-btn {
      position: fixed;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.7px solid var(--edge);
      background: transparent;
      color: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      text-shadow: none;
    }

    .gear-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
    }

    .peer-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 10px);
    }

    .gear-btn span,
    .peer-btn .peer-icon {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      transform: translateY(-0.5px);
      color: var(--edge);
      -webkit-text-stroke: 0;
      text-shadow: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
    }

    .gear-btn:active,
    .peer-btn:active {
      transform: scale(0.97);
    }

    .peer-btn.hidden {
      display: none;
    }

    .peer-btn.searching,
    .peer-btn.connected {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
      background: transparent;
    }

    .peer-btn.connected .peer-icon {
      color: var(--peer-blue);
    }

    .peer-icon {
      display: block;
      width: 20px;
      text-align: center;
    }

    .peer-spinner {
      display: none;
      position: relative;
      width: 20px;
      height: 20px;
    }

    .peer-btn.searching .peer-icon {
      display: none;
    }

    .peer-btn.searching .peer-spinner {
      display: block;
      animation: peer-spin 0.9s linear infinite;
      color: var(--peer-blue);
    }

    .peer-spinner span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: currentColor;
      transform-origin: 0 0;
    }

    .peer-spinner span:nth-child(1) { transform: translate(0, -8px); opacity: 1; }
    .peer-spinner span:nth-child(2) { transform: translate(5.5px, -5.5px); opacity: 0.82; }
    .peer-spinner span:nth-child(3) { transform: translate(8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(4) { transform: translate(5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(5) { transform: translate(0, 8px); opacity: 0.34; }
    .peer-spinner span:nth-child(6) { transform: translate(-5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(7) { transform: translate(-8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(8) { transform: translate(-5.5px, -5.5px); opacity: 0.82; }

    @keyframes peer-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 18px;
      box-sizing: border-box;
    }

    .overlay.open {
      display: flex;
    }

    .panel {
      width: min(92vw, 460px);
      max-height: min(84vh, 680px);
      overflow: auto;
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 18px 18px 16px;
      box-sizing: border-box;
    }

    .panel.sticky-header .panel-header {
      position: sticky;
      top: -18px;
      z-index: 3;
      margin: -18px -18px 16px;
      padding: 18px 18px 14px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--panel-border);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .close-btn {
      appearance: none;
      border: 1.5px solid var(--edge);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      min-width: 42px;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .close-btn:active {
      transform: scale(0.98);
    }

    .setting-block {
      padding: 14px 0 4px;
      border-top: 1px solid rgba(127, 127, 127, 0.16);
    }

    .setting-block:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .setting-label .main {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }

    .setting-label .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }

    .switch {
      position: relative;
      width: 56px;
      height: 34px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(127, 127, 127, 0.18);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--thumb);
      transition: 0.2s ease;
    }

    .switch input:checked + .slider {
      background: rgba(55, 180, 90, 0.22);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .mode-select {
      width: 128px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .hex-input {
      width: 100%;
      box-sizing: border-box;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    .hex-input::placeholder {
      color: var(--muted);
    }

    .sub-input-wrap {
      margin-top: 10px;
    }

    .disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .range-wrap {
      margin-top: 12px;
      padding-left: 2px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .range-title {
      font-size: 13px;
      font-weight: 650;
    }

    .range-value {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      height: 28px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-webkit-slider-runnable-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-top: -7.5px;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-moz-range-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    .effect-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .effect-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 0 0;
    }

    .effect-item + .effect-item {
      border-top: 1px solid rgba(127, 127, 127, 0.12);
      padding-top: 12px;
    }

    .effect-name {
      font-size: 13px;
      font-weight: 650;
    }

    .effect-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .danger-btn {
      appearance: none;
      border: 1.5px solid rgba(220, 40, 40, 0.55);
      background: transparent;
      color: #d23636;
      border-radius: 14px;
      min-width: 0;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex: 1 1 auto;
    }

    .danger-btn:active {
      transform: scale(0.98);
    }

    .sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 12px;
      box-sizing: border-box;
    }

    .sheet-overlay.open {
      display: flex;
    }

    .sheet {
      width: min(96vw, 480px);
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 14px;
      box-sizing: border-box;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .sheet-title {
      font-size: 16px;
      font-weight: 700;
    }

    .sheet-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sheet-item {
      appearance: none;
      width: 100%;
      text-align: left;
      border-radius: 18px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 14px 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .sheet-item:active {
      transform: scale(0.99);
    }

    .sheet-item .main {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }

    .sheet-item .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      margin-top: 4px;
    }

    .qr-panel {
      width: min(92vw, 430px);
    }

    .qr-box {
      width: 240px;
      height: 240px;
      margin: 12px auto 8px;
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .qr-code {
      width: 240px;
      height: 240px;
      display: grid;
      place-items: center;
      font-size: 11px;
      line-height: 1.35;
      color: #111;
      word-break: break-all;
      padding: 12px;
      box-sizing: border-box;
      white-space: pre-wrap;
      text-align: center;
    }

    .qr-video {
      width: 100%;
      max-height: 46vh;
      border-radius: 18px;
      background: #000;
      display: none;
      margin-top: 12px;
    }

    .qr-video.active {
      display: block;
    }

    .qr-status {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 8px;
    }

    .qr-manual {
      margin-top: 10px;
      width: 100%;
      min-height: 78px;
      box-sizing: border-box;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
      resize: vertical;
    }

    .qr-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .qr-actions button {
      flex: 1 1 auto;
      height: 40px;
      border-radius: 14px;
      border: 1.5px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .qr-actions button:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <button class="gear-btn" id="openSettings" aria-label="設定を開く">
    <span>⛭</span>
  </button>

  <button class="peer-btn hidden" id="peerButton" aria-label="ローカル通信">
    <span class="peer-icon">☋</span>
    <span class="peer-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </span>
  </button>

  <div class="sheet-overlay" id="peerSheetOverlay" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="接続方法を選択">
      <div class="sheet-header">
        <div class="sheet-title" id="peerSheetTitle">接続方法を選ぶ</div>
        <button class="close-btn" id="peerSheetClose">閉じる</button>
      </div>
      <div class="sheet-list" id="peerSheetList"></div>
    </div>
  </div>

  <div class="overlay" id="qrOverlay" aria-hidden="true">
    <div class="panel qr-panel sticky-header" role="dialog" aria-modal="true" aria-label="QRコード">
      <div class="panel-header">
        <div class="panel-title" id="qrTitle">QRコード</div>
        <button class="close-btn" id="qrClose">戻る</button>
      </div>
      <div id="qrShowArea" class="hidden">
        <div class="qr-box">
          <div id="qrCode" class="qr-code"></div>
        </div>
        <div class="qr-status" id="qrShowStatus"></div>
        <div class="qr-status" id="qrRoomText"></div>
      </div>
      <div id="qrScanArea" class="hidden">
        <video id="qrVideo" class="qr-video" playsinline autoplay muted></video>
        <div class="qr-status" id="qrScanStatus"></div>
        <textarea id="qrManualInput" class="qr-manual" placeholder="QRの文字列をここに貼り付けても使えます"></textarea>
        <div class="qr-actions">
          <button id="qrManualApply">読み取る</button>
          <button id="qrManualClear">消す</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="settingsOverlay" aria-hidden="true">
    <div class="panel sticky-header" role="dialog" aria-modal="true" aria-label="設定">
      <div class="panel-header">
        <div class="panel-title">設定</div>
        <button class="close-btn" id="closeSettings">戻る</button>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">背景色</div>
            <div class="sub">システム / 白 / 黒 / カスタム</div>
          </div>
          <select class="mode-select" id="bgMode">
            <option value="system">システム</option>
            <option value="white">白</option>
            <option value="black">黒</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
        <div class="sub-input-wrap hidden" id="bgCustomWrap">
          <input class="hex-input" id="bgCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ffffff" />
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-label">
          <div class="main">色</div>
          <div class="sub">タップ / スワイプ / 囲い の色をカラーコードで指定</div>
        </div>

        <div class="effect-grid">
          <div class="effect-item">
            <div class="effect-name">タップの色</div>
            <input class="hex-input" id="tapColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#46ff78" />
          </div>
          <div class="effect-item">
            <div class="effect-name">スワイプの色</div>
            <input class="hex-input" id="swipeColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#6ea5ff" />
          </div>
          <div class="effect-item">
            <div class="effect-name">囲いの色</div>
            <input class="hex-input" id="loopColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ff4e4e" />
          </div>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">グリッドを表示</div>
            <div class="sub">ONで背景に格子を出します</div>
          </div>
          <label class="switch" aria-label="グリッドを表示">
            <input type="checkbox" id="gridToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div id="gridDetails">
          <div class="range-wrap">
            <div class="range-head">
              <div class="range-title">間隔</div>
              <div class="range-value"><span id="spacingValue">36</span>px</div>
            </div>
            <input type="range" id="spacingRange" min="18" max="100" step="1" value="36" />
          </div>

          <div class="control-row">
            <div class="setting-label">
              <div class="main" style="font-size: 13px;">グリッド色</div>
              <div class="sub">システム / 白 / 黒 / カスタム</div>
            </div>
            <select class="mode-select" id="gridMode">
              <option value="system">システム</option>
              <option value="white">白</option>
              <option value="black">黒</option>
              <option value="custom">カスタム</option>
            </select>
          </div>

          <div class="sub-input-wrap hidden" id="gridCustomWrap">
            <input class="hex-input" id="gridCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#e8e8e8" />
          </div>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">ローカル通信ボタンを表示</div>
            <div class="sub">左上に通信ボタンを出します</div>
          </div>
          <label class="switch" aria-label="ローカル通信ボタンを表示">
            <input type="checkbox" id="peerButtonToggle" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="setting-block">
        <div class="footer-actions">
          <button class="danger-btn" id="resetSettings">設定をリセット</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: true });

      const openSettings = document.getElementById('openSettings');
      const settingsOverlay = document.getElementById('settingsOverlay');
      const closeSettings = document.getElementById('closeSettings');

      const peerButton = document.getElementById('peerButton');
      const peerSheetOverlay = document.getElementById('peerSheetOverlay');
      const peerSheetClose = document.getElementById('peerSheetClose');
      const peerSheetTitle = document.getElementById('peerSheetTitle');
      const peerSheetList = document.getElementById('peerSheetList');

      const qrOverlay = document.getElementById('qrOverlay');
      const qrClose = document.getElementById('qrClose');
      const qrTitle = document.getElementById('qrTitle');

        bgMode: 'system',

      };

      const settings = { ...defaults };

      let w = 0;
      let h = 0;
      let dpr = 1;
      let darkMode = false;

      const effects = [];

      let activePointerId = null;
      let pointerDownTime = 0;
      let pointerDownPos = { x: 0, y: 0 };
      let lastPos = { x: 0, y: 0 };
      let strokePoints = [];
      let pointerHadLoop = false;
      let lastLoopAt = 0;

      const SWIPE_MIN_DISTANCE = 42;
      const TAP_MAX_DISTANCE = 12;
      const TAP_MAX_TIME = 320;
      const LASSO_MIN_POINTS = 20;
      const LASSO_HIT_RADIUS = 18;

      const selfPeerId = makeId();

      let peerFlow = 'none';
      let remotePeerId = null;
      let peerRoomId = '';
      let peerChannel = null;
      let peerPulseTimer = null;
      let peerWatchTimer = null;
      let peerLastSeenAt = 0;
      let peerReceiveArmedAt = 0;
      let latestRemoteSettingsPacket = null;
      let qrScanActive = false;
      let qrScanStream = null;
      let qrScanDetector = null;
      let qrScanLoopHandle = 0;
      const seenPackets = new Set();
      const seenPacketQueue = [];

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        const bytes = new Uint8Array(16);
        (window.crypto || window.msCrypto).getRandomValues(bytes);
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      }

      function makeRoomId() {
        return Math.random().toString(36).slice(2, 8).toUpperCase();
      }

      function clamp(v, min, max) {
        return Math.min(max, Math.max(min, v));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function nowMs() {
        return performance.now();
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function distance(ax, ay, bx, by) {
        return Math.hypot(ax - bx, ay - by);
      }

      function pointToSegmentDistance(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const apx = px - ax;
        const apy = py - ay;
        const abLen2 = abx * abx + aby * aby;

        if (abLen2 === 0) return Math.hypot(px - ax, py - ay);

        let t = (apx * abx + apy * aby) / abLen2;
        t = clamp(t, 0, 1);

        const cx = ax + abx * t;
        const cy = ay + aby * t;
        return Math.hypot(px - cx, py - cy);
      }

      function isValidMode(value) {
        return value === 'system' || value === 'white' || value === 'black' || value === 'custom';
      }

      function normalizeHexColor(raw) {
        if (typeof raw !== 'string') return null;
        let s = raw.trim();
        if (!s) return null;
        if (s[0] === '#') s = s.slice(1);
        if (!/^[0-9a-fA-F]+$/.test(s)) return null;

        if (s.length === 3 || s.length === 4) {
          s = s.split('').map(ch => ch + ch).join('');
        }

        if (s.length !== 6 && s.length !== 8) return null;
        return '#' + s.toLowerCase();
      }

      function hexToRgba(rawHex, alphaOverride = 1) {
        const hex = normalizeHexColor(rawHex);
        if (!hex) return null;

        const s = hex.slice(1);
        const r = parseInt(s.slice(0, 2), 16);
        const g = parseInt(s.slice(2, 4), 16);
        const b = parseInt(s.slice(4, 6), 16);
        const a = s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1;
        return `rgba(${r}, ${g}, ${b}, ${clamp(a * alphaOverride, 0, 1)})`;
      }

      function resolveModeColor(mode, customRaw, lightHex, darkHex) {
        const fallback = darkMode ? darkHex : lightHex;
        if (mode === 'system') return fallback;
        if (mode === 'white') return '#ffffff';
        if (mode === 'black') return '#000000';
        if (mode === 'custom') return normalizeHexColor(customRaw) || fallback;
        return fallback;
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (_) {}
      }

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);

          if (isValidMode(data.bgMode)) settings.bgMode = data.bgMode;
          if (typeof data.bgCustom === 'string') settings.bgCustom = data.bgCustom;

          if (typeof data.tapColor === 'string') settings.tapColor = data.tapColor;
          if (typeof data.swipeColor === 'string') settings.swipeColor = data.swipeColor;
          if (typeof data.loopColor === 'string') settings.loopColor = data.loopColor;

          if (typeof data.gridEnabled === 'boolean') settings.gridEnabled = data.gridEnabled;
          if (isValidMode(data.gridMode)) settings.gridMode = data.gridMode;
          if (typeof data.gridCustom === 'string') settings.gridCustom = data.gridCustom;
          if (typeof data.gridSpacing === 'number' && isFinite(data.gridSpacing)) {
            settings.gridSpacing = clamp(Math.round(data.gridSpacing), 18, 100);
          }

          if (typeof data.peerButtonVisible === 'boolean') settings.peerButtonVisible = data.peerButtonVisible;
        } catch (_) {}
      }

      function updateTheme() {
        darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        document.documentElement.style.setProperty('--bg', darkMode ? '#000' : '#fff');
        document.documentElement.style.setProperty('--edge', darkMode ? '#fafafa' : '#111');
        document.documentElement.style.setProperty('--panel-bg', darkMode ? 'rgba(0, 0, 0, 0.82)' : 'rgba(255, 255, 255, 0.84)');
        document.documentElement.style.setProperty('--panel-border', darkMode ? 'rgba(255, 255, 255, 0.16)' : 'rgba(0, 0, 0, 0.14)');
        document.documentElement.style.setProperty('--text', darkMode ? '#f5f5f5' : '#101010');
        document.documentElement.style.setProperty('--muted', darkMode ? 'rgba(245, 245, 245, 0.45)' : 'rgba(16, 16, 16, 0.45)');
        document.documentElement.style.setProperty('--track', darkMode ? 'rgba(255, 255, 255, 0.14)' : 'rgba(0, 0, 0, 0.12)');
        document.documentElement.style.setProperty('--track-disabled', darkMode ? 'rgba(255, 255, 255, 0.07)' : 'rgba(0, 0, 0, 0.06)');
        document.documentElement.style.setProperty('--thumb', darkMode ? 'rgba(255, 255, 255, 0.78)' : 'rgba(0, 0, 0, 0.72)');

        document.body.style.background = getBgColor();
      }

      function resize() {
        dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function syncSettingsUi() {
        bgMode.value = settings.bgMode;
        bgCustomInput.value = settings.bgCustom;
        bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');

        tapColorInput.value = settings.tapColor;

      }

      function updatePeerButtonUi() {
        peerButton.classList.toggle('hidden', !settings.peerButtonVisible);
        peerButton.classList.toggle('searching', peerState === 'searching');
        peerButton.classList.toggle('connected', peerState === 'connected');

        if (peerState === 'searching') {
          peerButton.setAttribute('aria-label', 'ローカル通信を停止');
        } else if (peerState === 'connected') {
          peerButton.setAttribute('aria-label', 'ローカル通信を切断');
        } else {
          peerButton.setAttribute('aria-label', 'ローカル通信');
        }
      }

      function openPeerSheet(mode) {

        ] : [

      function openQrOverlay(mode) {

      function getBgColor() {
        return resolveModeColor(settings.bgMode, settings.bgCustom, '#ffffff', '#000000');
      }

      function getGridBaseColor() {
        return resolveModeColor(
          settings.gridMode,
          settings.gridCustom,
          darkMode ? '#262626' : '#e8e8e8',
          darkMode ? '#262626' : '#e8e8e8'
        );
      }

      function getTapBaseColor() {
        return normalizeHexColor(settings.tapColor) || defaults.tapColor;
      }

      function getSwipeBaseColor() {
        return normalizeHexColor(settings.swipeColor) || defaults.swipeColor;
      }

      function getLoopBaseColor() {
        return normalizeHexColor(settings.loopColor) || defaults.loopColor;
      }

      function applySnapshotToSettings(snapshot, persist = true) {
        if (!snapshot || typeof snapshot !== 'object') return;

        if (isValidMode(snapshot.bgMode)) settings.bgMode = snapshot.bgMode;
        if (typeof snapshot.bgCustom === 'string') settings.bgCustom = snapshot.bgCustom;

        if (typeof snapshot.tapColor === 'string') settings.tapColor = snapshot.tapColor;
        if (typeof snapshot.swipeColor === 'string') settings.swipeColor = snapshot.swipeColor;
        if (typeof snapshot.loopColor === 'string') settings.loopColor = snapshot.loopColor;

        if (typeof snapshot.gridEnabled === 'boolean') settings.gridEnabled = snapshot.gridEnabled;
        if (isValidMode(snapshot.gridMode)) settings.gridMode = snapshot.gridMode;
        if (typeof snapshot.gridCustom === 'string') settings.gridCustom = snapshot.gridCustom;
        if (typeof snapshot.gridSpacing === 'number' && isFinite(snapshot.gridSpacing)) {
          settings.gridSpacing = clamp(Math.round(snapshot.gridSpacing), 18, 100);
        }

        document.body.style.background = getBgColor();
        syncSettingsUi();
        updatePeerButtonUi();
        if (persist) saveSettings();
      }

      function snapshotSettings() {
        return {
          bgMode: settings.bgMode,
          bgCustom: settings.bgCustom,
          tapColor: settings.tapColor,
          swipeColor: settings.swipeColor,
          loopColor: settings.loopColor,
          gridEnabled: settings.gridEnabled,
          gridMode: settings.gridMode,
          gridCustom: settings.gridCustom,
          gridSpacing: settings.gridSpacing
        };
      }

      function sendRoomPacket(payload) {
        if (!peerRoomId) return null;
        const packet = {
          ...payload,
          id: makeId(),
          sender: selfPeerId,
          room: peerRoomId,
          ts: Date.now()
        };

        if (peerChannel) {
          try {
            peerChannel.postMessage(packet);
          } catch (_) {}
        } else {
          try {
            localStorage.setItem(roomStorageKey(), JSON.stringify(packet));
          } catch (_) {}
        }

        return packet;
      }

      function roomStorageKey() {
        return `${ROOM_PREFIX}${peerRoomId}`;
      }

      function rememberPacket(id) {
        if (!id || seenPackets.has(id)) return false;
        seenPackets.add(id);
        seenPacketQueue.push(id);
        if (seenPacketQueue.length > 300) {
          const old = seenPacketQueue.shift();
          if (old) seenPackets.delete(old);
        }
        return true;
      }

      function startPeerTimers() {
        stopPeerTimers();

        peerPulseTimer = window.setInterval(() => {
          if (peerState === 'searching') {
            sendRoomPacket({ type: 'hello' });
          } else if (peerState === 'connected') {
            sendRoomPacket({ type: 'keepalive' });
          }
        }, 1000);

        peerWatchTimer = window.setInterval(() => {
          if (peerState !== 'connected') return;
          if (!peerLastSeenAt) return;
          if (Date.now() - peerLastSeenAt > 6500) {
            remotePeerId = null;
            if (peerFlow !== 'none') {
              peerState = 'searching';
              updatePeerButtonUi();
              sendRoomPacket({ type: 'hello' });
            } else {
              peerState = 'off';
              updatePeerButtonUi();
            }
          }
        }, 1000);
      }

      function stopPeerTimers() {
        if (peerPulseTimer) {
          clearInterval(peerPulseTimer);
          peerPulseTimer = null;
        }
        if (peerWatchTimer) {
          clearInterval(peerWatchTimer);
          peerWatchTimer = null;
        }
      }

      function closePeerTransport(sendGoodbye = true) {
        if (sendGoodbye && remotePeerId) {
          sendRoomPacket({ type: 'goodbye' });
        }

        remotePeerId = null;
        peerLastSeenAt = 0;
        peerReceiveArmedAt = 0;
        latestRemoteSettingsPacket = null;
        peerState = 'off';
        peerFlow = 'none';
        stopPeerTimers();

        if (peerChannel) {
          try {
            peerChannel.close();
          } catch (_) {}
          peerChannel = null;
        }

        peerRoomId = '';
        updatePeerButtonUi();
      }

      function joinPeerRoom(roomId) {
        peerRoomId = roomId;

        if (peerChannel) {
          try {
            peerChannel.close();
          } catch (_) {}
          peerChannel = null;
        }

        const channelName = roomStorageKey();

        if ('BroadcastChannel' in window) {
          try {
            peerChannel = new BroadcastChannel(channelName);
            peerChannel.onmessage = (ev) => handlePeerPacket(ev.data);
          } catch (_) {
            peerChannel = null;
          }
        }

        if (!storageListenerAdded) {
          storageListenerAdded = true;
          window.addEventListener('storage', (ev) => {
            if (ev.key !== roomStorageKey() || !ev.newValue) return;
            try {
              handlePeerPacket(JSON.parse(ev.newValue));
            } catch (_) {}
          });
        }

        peerLastSeenAt = Date.now();
        peerState = 'searching';
        updatePeerButtonUi();
        startPeerTimers();
        sendRoomPacket({ type: 'hello' });
      }

      function connectPeer(remoteId) {
        remotePeerId = remoteId;
        peerLastSeenAt = Date.now();
        peerState = 'connected';
        updatePeerButtonUi();
        closeQrOverlay();
        startPeerTimers();
      }

      function handlePeerPacket(packet) {
        if (!packet || typeof packet !== 'object') return;
        if (packet.sender === selfPeerId) return;
        if (packet.room !== peerRoomId) return;
        if (!rememberPacket(packet.id)) return;

        const now = Date.now();

        if (packet.type === 'hello') {
          peerLastSeenAt = now;
          if (peerState !== 'connected') {
            connectPeer(packet.sender);
          }
          return;
        }

        if (packet.type === 'keepalive') {
          peerLastSeenAt = now;
          if (peerState !== 'connected') {
            connectPeer(packet.sender);
          }
          return;
        }

        if (packet.type === 'goodbye') {
          if (remotePeerId && packet.sender === remotePeerId) {
            if (peerFlow !== 'none') {
              peerState = 'searching';
              remotePeerId = null;
              updatePeerButtonUi();
              sendRoomPacket({ type: 'hello' });
            } else {
              closePeerTransport(false);
            }
          }
          return;
        }

        if (packet.type === 'settings') {
          latestRemoteSettingsPacket = packet;
          peerLastSeenAt = now;
          if (
            peerReceiveArmedAt &&
            now - peerReceiveArmedAt <= 10000 &&
            now - packet.ts <= 10000 &&
            packet.payload &&
            typeof packet.payload === 'object' &&
            packet.sender === remotePeerId
          ) {
            applySnapshotToSettings(packet.payload, true);
            peerReceiveArmedAt = 0;
          }
          return;
        }

        if (packet.type === 'effect') {
          peerLastSeenAt = now;
          if (packet.payload && typeof packet.payload === 'object') {
            applyRemoteEffect(packet.payload);
          }
        }
      }

      function startWiFiMode() {
        peerFlow = 'wifi';
        joinPeerRoom('WIFI');
        openQrOverlay('show');
        qrShowStatus.textContent = 'Wi-Fi通信の待機中です。相手も同じ操作をするとつながります。';
        qrRoomText.textContent = '部屋コード: WIFI';
        renderInviteQr();
      }

      function startQrShowMode() {
        peerFlow = 'qr-show';
        peerRoomId = makeRoomId();
        joinPeerRoom(peerRoomId);
        openQrOverlay('show');
        renderInviteQr();
      }

      async function startQrScanMode() {
        peerFlow = 'qr-scan';
        openQrOverlay('scan');
        peerState = 'searching';
        updatePeerButtonUi();
        await startQrScan();
      }

      function cancelPeerFlow() {
        stopQrScan();
        closeQrOverlay();
        closePeerSheet();
        closePeerTransport(false);
      }

      function handlePeerMenuAction(action) {
        if (action === 'cancel') return;

        if (action === 'wifi') {
          startWiFiMode();
          return;
        }

        if (action === 'qr-show') {
          startQrShowMode();
          return;
        }

        if (action === 'qr-scan') {
          startQrScanMode();
          return;
        }

        if (action === 'disconnect') {
          cancelPeerFlow();
          return;
        }

        if (action === 'send-settings') {
          sendCurrentSettings();
          return;
        }

        if (action === 'receive-settings') {
          armReceiveSettings();
        }
      }

      function applyRemoteEffect(payload) {
        if (!payload || typeof payload !== 'object') return;

        if (payload.kind === 'tap') {
          if (typeof payload.x === 'number' && typeof payload.y === 'number') {
            addTapEffect(payload.x, payload.y, false);
          }
          return;
        }

        if (payload.kind === 'swipe') {
          const from = payload.from;
          const to = payload.to;
          const dir = payload.dir;
          if (
            from && to && dir &&
            typeof from.x === 'number' && typeof from.y === 'number' &&
            typeof to.x === 'number' && typeof to.y === 'number' &&
            typeof dir.x === 'number' && typeof dir.y === 'number'
          ) {
            createSwipeEffect(from.x, from.y, dir.x * 100, dir.y * 100, false, {
              forceFrom: from,
              forceTo: to,
              forceRadius: typeof payload.radius === 'number' ? payload.radius : undefined
            });
          }
          return;
        }

        if (payload.kind === 'loop') {
          if (Array.isArray(payload.points)) {
            const points = payload.points
              .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number')
              .map(p => ({ x: p.x, y: p.y }));
            if (points.length >= 3) createLoopEffect(points, false);
          }
        }
      }

      function sendCurrentSettings() {
        if (peerState !== 'connected' || !remotePeerId || !peerRoomId) return;
        sendRoomPacket({
          type: 'settings',
          payload: snapshotSettings()
        });
      }

      function armReceiveSettings() {
        peerReceiveArmedAt = Date.now();

        if (
          latestRemoteSettingsPacket &&
          latestRemoteSettingsPacket.payload &&
          typeof latestRemoteSettingsPacket.payload === 'object' &&
          Date.now() - latestRemoteSettingsPacket.ts <= 10000
        ) {
          applySnapshotToSettings(latestRemoteSettingsPacket.payload, true);
          peerReceiveArmedAt = 0;
        }
      }

      function drawGrid() {
        if (!settings.gridEnabled) return;

        const baseColor = getGridBaseColor();
        const lineLow = hexToRgba(baseColor, 0.40) || (darkMode ? 'rgba(34,34,34,0.40)' : 'rgba(232,232,232,0.40)');
        const lineHigh = hexToRgba(baseColor, 0.56) || (darkMode ? 'rgba(58,58,58,0.56)' : 'rgba(210,210,210,0.56)');

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 1;

        for (let x = 0; x <= w + settings.gridSpacing; x += settings.gridSpacing) {
          const isAccent = Math.round(x / settings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(Math.floor(x) + 0.5, 0);
          ctx.lineTo(Math.floor(x) + 0.5, h);
          ctx.stroke();
        }

        for (let y = 0; y <= h + settings.gridSpacing; y += settings.gridSpacing) {
          const isAccent = Math.round(y / settings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(0, Math.floor(y) + 0.5);
          ctx.lineTo(w, Math.floor(y) + 0.5);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawTap(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = easeOutCubic(p);
        const radius = lerp(10, Math.max(w, h) * 0.22, e);
        const alpha = 0.34 * Math.pow(1 - p, 1.7);
        const baseColor = effect.color || getTapBaseColor();

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = radius * 0.22;
        ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(70, 255, 120, 0.55)';

        const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
        g.addColorStop(0.00, hexToRgba(baseColor, 0.92) || 'rgba(70, 255, 120, 0.92)');
        g.addColorStop(0.28, hexToRgba(baseColor, 0.60) || 'rgba(60, 235, 110, 0.60)');
        g.addColorStop(0.68, hexToRgba(baseColor, 0.25) || 'rgba(50, 220, 100, 0.25)');
        g.addColorStop(1.00, hexToRgba(baseColor, 0.00) || 'rgba(50, 220, 100, 0)');

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawSwipe(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = easeOutCubic(p);
        const x = lerp(effect.from.x, effect.to.x, e);
        const y = lerp(effect.from.y, effect.to.y, e);

        const trailSteps = 16;
        const trailSpacing = effect.radius * 0.82;
        const baseColor = effect.color || getSwipeBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';

        for (let i = trailSteps; i >= 0; i--) {
          const back = i * trailSpacing;
          const px = x - effect.dir.x * back;
          const py = y - effect.dir.y * back;
          const a = 0.24 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, 0.35);
          if (a <= 0.001) continue;

          const r = effect.radius * (1 + (trailSteps - i) * 0.02);

          ctx.globalAlpha = a;
          ctx.shadowBlur = r * 0.35;
          ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(90, 150, 255, 0.55)';
          ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 0.45 * Math.pow(1 - p, 0.7);
        ctx.shadowBlur = effect.radius * 0.6;
        ctx.shadowColor = hexToRgba(baseColor, 0.45) || 'rgba(110, 165, 255, 0.45)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
        ctx.beginPath();
        ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawLoop(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;
        if (effect.points.length < 3) return;

        const alpha = 0.36 * Math.pow(1 - p, 2.0);
        const blur = 8 * Math.pow(1 - p, 0.55);
        const baseColor = effect.color || getLoopBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = blur;
        ctx.shadowColor = hexToRgba(baseColor, 0.40) || 'rgba(255, 60, 60, 0.40)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(255, 78, 78, 1)';

        ctx.beginPath();
        ctx.moveTo(effect.points[0].x, effect.points[0].y);
        for (let i = 1; i < effect.points.length; i++) {
          ctx.lineTo(effect.points[i].x, effect.points[i].y);
        }
        ctx.closePath();
        ctx.fill('evenodd');

        ctx.restore();
      }

      function render() {
        const t = nowMs();

        ctx.fillStyle = getBgColor();
        ctx.fillRect(0, 0, w, h);

        drawGrid();

        for (let i = 0; i < effects.length; i++) {
          const effect = effects[i];
          if (effect.type === 'tap') drawTap(effect, t);
          else if (effect.type === 'swipe') drawSwipe(effect, t);
          else if (effect.type === 'loop') drawLoop(effect, t);
        }

        for (let i = effects.length - 1; i >= 0; i--) {
          if (t - effects[i].start >= effects[i].duration) effects.splice(i, 1);
        }

        requestAnimationFrame(render);
      }

      function getPoint(e) {
        return { x: e.clientX, y: e.clientY };
      }

      function applyAndSave() {
        document.body.style.background = getBgColor();
        syncSettingsUi();
        updatePeerButtonUi();
        saveSettings();
      }

      function resetAllSettings() {
        const ok = window.confirm('設定を初期状態に戻します。よろしいですか？');
        if (!ok) return;

        Object.assign(settings, defaults);
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
        if (peerState !== 'off') cancelPeerFlow();
        applyAndSave();
      }

      function openQrShowFromPayload(payloadText) {
        qrCode.innerHTML = '';
        if (window.QRCode) {
          try {
            new QRCode(qrCode, {
              text: payloadText,
              width: 240,
              height: 240,
              colorDark: '#111111',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.M
            });
          } catch (_) {
            qrCode.textContent = payloadText;
          }
        } else {
          qrCode.textContent = payloadText;
        }
      }

      function renderInviteQr() {
        const payload = JSON.stringify({
          app: 'touch-effects',
          kind: 'invite',
          room: peerRoomId,
          ts: Date.now()
        });
        openQrShowFromPayload(payload);
        qrShowStatus.textContent = 'このQRを相手に読み取ってもらってください。';
        qrRoomText.textContent = peerRoomId ? `部屋コード: ${peerRoomId}` : '';
      }

      function parseQrPayload(text) {
        if (typeof text !== 'string') return null;
        const trimmed = text.trim();
        if (!trimmed) return null;

        try {
          return JSON.parse(trimmed);
        } catch (_) {}

        const params = new URLSearchParams(trimmed.replace(/^[?#]/, ''));
        if (params.has('room')) {
          return {
            app: 'touch-effects',
            kind: 'invite',
            room: params.get('room')
          };
        }

        return null;
      }

      function handleQrPayload(text) {
        const payload = parseQrPayload(text);
        if (!payload) {
          qrScanStatus.textContent = '読み取れませんでした。もう一度試してください。';
          return;
        }

        if (payload.app !== 'touch-effects') {
          qrScanStatus.textContent = '別のデータでした。';
          return;
        }

        if (payload.kind === 'invite' && payload.room) {
          peerRoomId = String(payload.room);
          joinPeerRoom(peerRoomId);
          qrScanStatus.textContent = `読み取りました。部屋 ${peerRoomId} に接続中です。`;
          closeQrOverlay();
          return;
        }

        if (payload.kind === 'settings' && payload.settings) {
          applySnapshotToSettings(payload.settings, true);
          qrScanStatus.textContent = '設定を受け取りました。';
          closeQrOverlay();
        }
      }

      async function startQrScan() {
        stopQrScan();
        qrScanActive = true;
        qrManualInput.value = '';
        qrScanStatus.textContent = 'カメラを起動しています...';

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          qrScanStatus.textContent = 'この端末はカメラ読み取りに対応していません。下の欄に文字列を貼り付けてください。';
          return;
        }

        try {
          qrScanStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
          });
          qrVideo.srcObject = qrScanStream;
          qrVideo.classList.add('active');
          await qrVideo.play();

          if ('BarcodeDetector' in window) {
            qrScanDetector = new BarcodeDetector({ formats: ['qr_code'] });
            qrScanLoop();
          } else {
            qrScanStatus.textContent = '自動読み取り非対応です。下の欄にQR文字列を貼り付けてください。';
          }
        } catch (err) {
          qrScanStatus.textContent = 'カメラを開けませんでした。下の欄に文字列を貼り付けてください。';
        }
      }

      async function qrScanLoop() {
        if (!qrScanActive || !qrScanDetector || !qrVideo) return;

        try {
          const codes = await qrScanDetector.detect(qrVideo);
          if (codes && codes.length > 0 && codes[0].rawValue) {
            handleQrPayload(codes[0].rawValue);
            return;
          }
        } catch (_) {}

        qrScanLoopHandle = requestAnimationFrame(qrScanLoop);
      }

      function stopQrScan() {
        qrScanActive = false;
        if (qrScanLoopHandle) {
          cancelAnimationFrame(qrScanLoopHandle);
          qrScanLoopHandle = 0;
        }

        qrScanDetector = null;

        if (qrScanStream) {
          const tracks = qrScanStream.getTracks();
          for (const track of tracks) track.stop();
          qrScanStream = null;
        }

        if (qrVideo) {
          qrVideo.srcObject = null;
          qrVideo.classList.remove('active');
        }
      }

      bgMode.addEventListener('change', () => {
        settings.bgMode = bgMode.value;
        bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');
        applyAndSave();
      });

      bgCustomInput.addEventListener('input', () => {
        settings.bgCustom = bgCustomInput.value.trim();
        applyAndSave();
      });

      tapColorInput.addEventListener('input', () => {
        settings.tapColor = tapColorInput.value.trim();
        saveSettings();
      });

      swipeColorInput.addEventListener('input', () => {
        settings.swipeColor = swipeColorInput.value.trim();
        saveSettings();
      });

      loopColorInput.addEventListener('input', () => {
        settings.loopColor = loopColorInput.value.trim();
        saveSettings();
      });

      gridToggle.addEventListener('change', () => {
        settings.gridEnabled = gridToggle.checked;
        gridDetails.classList.toggle('disabled', !settings.gridEnabled);
        saveSettings();
      });

      gridMode.addEventListener('change', () => {
        settings.gridMode = gridMode.value;
        gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');
        saveSettings();
      });

      gridCustomInput.addEventListener('input', () => {
        settings.gridCustom = gridCustomInput.value.trim();
        saveSettings();
      });

      spacingRange.addEventListener('input', () => {
        settings.gridSpacing = clamp(Number(spacingRange.value) || 36, 18, 100);
        spacingValue.textContent = String(settings.gridSpacing);
        saveSettings();
      });

      peerButtonToggle.addEventListener('change', () => {
        settings.peerButtonVisible = peerButtonToggle.checked;
        if (!settings.peerButtonVisible && peerState !== 'off') cancelPeerFlow();
        updatePeerButtonUi();
        saveSettings();
      });

      resetSettings.addEventListener('click', () => {
        resetAllSettings();
      });

      openSettings.addEventListener('click', () => {
        openSettings();
      });

      closeSettings.addEventListener('click', () => {
        closeSettings();
      });

      peerButton.addEventListener('click', () => {
        if (peerState === 'searching') {
          cancelPeerFlow();
          return;
        }

        if (peerState === 'connected') {
          openPeerSheet('connected');
          return;
        }

        openPeerSheet('off');
      });

      peerSheetClose.addEventListener('click', () => {
        closePeerSheet();
      });

      peerSheetOverlay.addEventListener('click', (e) => {
        if (e.target === peerSheetOverlay) closePeerSheet();
      });

      qrClose.addEventListener('click', () => {
        cancelPeerFlow();
      });

      qrOverlay.addEventListener('click', (e) => {
        if (e.target === qrOverlay) cancelPeerFlow();
      });

      qrManualApply.addEventListener('click', () => {
        handleQrPayload(qrManualInput.value);
      });

      qrManualClear.addEventListener('click', () => {
        qrManualInput.value = '';
        qrManualInput.focus();
      });

      canvas.addEventListener('pointerdown', (e) => {
        if (settingsOverlay.classList.contains('open') || peerSheetOverlay.classList.contains('open') || qrOverlay.classList.contains('open')) return;
        if (activePointerId !== null) return;

        activePointerId = e.pointerId;
        canvas.setPointerCapture(activePointerId);

        const p = getPoint(e);
        pointerDownTime = nowMs();
        pointerDownPos = { x: p.x, y: p.y };
        lastPos = { x: p.x, y: p.y };
        strokePoints = [p];
        pointerHadLoop = false;

        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const t = nowMs();

        if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
          strokePoints.push(p);
          lastPos = p;
        }

        if (t - lastLoopAt >= LASSO_COOLDOWN) {
          if (detectLoop(strokePoints, p.x, p.y)) {
            createLoopEffect(strokePoints);
            lastLoopAt = t;
            pointerHadLoop = true;
            strokePoints = [p];
          }
        }

        e.preventDefault();
      }, { passive: false });

      function finishPointer(e) {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const elapsed = nowMs() - pointerDownTime;
        const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

        if (!pointerHadLoop) {
          if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
            addTapEffect(p.x, p.y, true);
          } else if (totalMove >= SWIPE_MIN_DISTANCE) {
            const dx = p.x - pointerDownPos.x;
            const dy = p.y - pointerDownPos.y;
            createSwipeEffect(p.x, p.y, dx, dy, true);
          }
        }

        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;

        e.preventDefault();
      }

      canvas.addEventListener('pointerup', finishPointer, { passive: false });
      canvas.addEventListener('pointercancel', finishPointer, { passive: false });
      canvas.addEventListener('lostpointercapture', () => {
        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;
      });

      function createLoopEffect(points, broadcast = true, color = null) {
        if (points.length < 3) return;

        const copy = points.map(p => ({ x: p.x, y: p.y }));
        effects.push({
          type: 'loop',
          start: nowMs(),
          duration: 420,
          points: copy,
          color
        });

        if (broadcast && peerState === 'connected' && remotePeerId && peerRoomId) {
          sendRoomPacket({
            type: 'effect',
            payload: {
              kind: 'loop',
              points: copy,
              color
            }
          });
        }
      }

      function addTapEffect(x, y, broadcast = true, color = null) {
        effects.push({
          type: 'tap',
          x,
          y,
          start: nowMs(),
          duration: 650,
          color
        });

        if (broadcast && peerState === 'connected' && remotePeerId && peerRoomId) {
          sendRoomPacket({
            type: 'effect',
            payload: {
              kind: 'tap',
              x,
              y,
              color
            }
          });
        }
      }

      function createSwipeEffect(startX, startY, dirX, dirY, broadcast = true, forced = null, color = null) {
        const len = Math.hypot(dirX, dirY) || 1;
        dirX /= len;
        dirY /= len;

        const pad = 90;
        const minX = -pad;
        const minY = -pad;
        const maxX = w + pad;
        const maxY = h + pad;

        const hits = [];

        function pushCandidate(t, x, y) {
          if (x >= minX - 0.5 && x <= maxX + 0.5 && y >= minY - 0.5 && y <= maxY + 0.5) {
            hits.push({ t, x, y });
          }
        }

        if (forced && forced.forceFrom && forced.forceTo) {
          hits.push(
            { t: 0, x: forced.forceFrom.x, y: forced.forceFrom.y },
            { t: 1, x: forced.forceTo.x, y: forced.forceTo.y }
          );
        } else {
          if (Math.abs(dirX) > 1e-6) {
            let t = (minX - startX) / dirX;
            pushCandidate(t, minX, startY + dirY * t);
            t = (maxX - startX) / dirX;
            pushCandidate(t, maxX, startY + dirY * t);
          }

          if (Math.abs(dirY) > 1e-6) {
            let t = (minY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, minY);
            t = (maxY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, maxY);
          }

          if (hits.length < 2) {
            hits.push(
              { t: -400, x: startX - dirX * 400, y: startY - dirY * 400 },
              { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 }
            );
          } else {
            hits.sort((a, b) => a.t - b.t);
          }
        }

        const first = forced && forced.forceFrom ? forced.forceFrom : hits[0];
        const last = forced && forced.forceTo ? forced.forceTo : hits[hits.length - 1];
        const travel = distance(first.x, first.y, last.x, last.y);
        const duration = clamp(460 + travel * 0.12, 520, 900);

        effects.push({
          type: 'swipe',
          start: nowMs(),
          duration,
          from: { x: first.x, y: first.y },
          to: { x: last.x, y: last.y },
          dir: { x: dirX, y: dirY },
          radius: typeof (forced && forced.forceRadius) === 'number'
            ? forced.forceRadius
            : clamp(Math.min(w, h) * 0.045, 18, 38),
          color
        });

        if (broadcast && peerState === 'connected' && remotePeerId && peerRoomId) {
          sendRoomPacket({
            type: 'effect',
            payload: {
              kind: 'swipe',
              from: { x: first.x, y: first.y },
              to: { x: last.x, y: last.y },
              dir: { x: dirX, y: dirY },
              radius: typeof (forced && forced.forceRadius) === 'number'
                ? forced.forceRadius
                : clamp(Math.min(w, h) * 0.045, 18, 38),
              color
            }
          });
        }
      }

      function detectLoop(points, currentX, currentY) {
        if (points.length < LASSO_MIN_POINTS) return false;

        const n = points.length;
        const safeEnd = Math.max(0, n - 1 - LASSO_IGNORE_RECENT_SEGMENTS);

        for (let i = 0; i < safeEnd - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const d = pointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
          if (d <= LASSO_HIT_RADIUS) {
            let traveled = 0;
            for (let k = i; k < n - 1; k++) {
              traveled += distance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
              if (traveled > 40) break;
            }
            if (traveled > 40) return true;
          }
        }

        return false;
      }

      function applyIncomingSettingsFromPacket(packet) {
        if (!packet || !packet.payload || typeof packet.payload !== 'object') return;
        if (Date.now() - packet.ts > 10000) return;
        if (peerReceiveArmedAt && Date.now() - peerReceiveArmedAt <= 10000) {
          applySnapshotToSettings(packet.payload, true);
          peerReceiveArmedAt = 0;
        } else {
          latestRemoteSettingsPacket = packet;
        }
      }

      function handlePeerPacket(packet) {
        if (!packet || typeof packet !== 'object') return;
        if (packet.sender === selfPeerId) return;
        if (packet.room !== peerRoomId) return;
        if (!rememberPacket(packet.id)) return;

        const now = Date.now();

        if (packet.type === 'hello') {
          peerLastSeenAt = now;
          if (peerState !== 'connected') connectPeer(packet.sender);
          return;
        }

        if (packet.type === 'keepalive') {
          peerLastSeenAt = now;
          if (peerState !== 'connected') connectPeer(packet.sender);
          return;
        }

        if (packet.type === 'goodbye') {
          if (remotePeerId && packet.sender === remotePeerId) {
            if (peerFlow !== 'none') {
              peerState = 'searching';
              remotePeerId = null;
              updatePeerButtonUi();
              sendRoomPacket({ type: 'hello' });
            } else {
              closePeerTransport(false);
            }
          }
          return;
        }

        if (packet.type === 'settings') {
          latestRemoteSettingsPacket = packet;
          peerLastSeenAt = now;
          applyIncomingSettingsFromPacket(packet);
          return;
        }

        if (packet.type === 'effect') {
          peerLastSeenAt = now;
          applyRemoteEffect(packet.payload);
        }
      }

      function startWiFiMode() {
        peerFlow = 'wifi';
        peerRoomId = 'WIFI';
        joinPeerRoom(peerRoomId);
        openQrOverlay('show');
        renderInviteQr();
      }

      function startQrShowMode() {
        peerFlow = 'qr-show';
        peerRoomId = makeRoomId();
        joinPeerRoom(peerRoomId);
        openQrOverlay('show');
        renderInviteQr();
      }

      async function startQrScanMode() {
        peerFlow = 'qr-scan';
        peerState = 'searching';
        updatePeerButtonUi();
        openQrOverlay('scan');
        await startQrScan();
      }

      function cancelPeerFlow() {
        stopQrScan();
        closeQrOverlay();
        closePeerSheet();
        closePeerTransport(false);
      }

      function handlePeerMenuAction(action) {
        if (action === 'cancel') return;

        if (action === 'wifi') {
          startWiFiMode();
          return;
        }

        if (action === 'qr-show') {
          startQrShowMode();
          return;
        }

        if (action === 'qr-scan') {
          startQrScanMode();
          return;
        }

        if (action === 'disconnect') {
          cancelPeerFlow();
          return;
        }

        if (action === 'send-settings') {
          sendCurrentSettings();
          return;
        }

        if (action === 'receive-settings') {
          armReceiveSettings();
        }
      }

      const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      loadSettings();
      updateTheme();
      resize();
      syncSettingsUi();
      document.body.style.background = getBgColor();
      updatePeerButtonUi();

      if (darkMql) {
        if (typeof darkMql.addEventListener === 'function') {
          darkMql.addEventListener('change', updateTheme);
        } else if (typeof darkMql.addListener === 'function') {
          darkMql.addListener(updateTheme);
        }
      }

      window.addEventListener('resize', () => {
        resize();
      });

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
