<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      --bg: #fff;
      --edge: #111;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: rgba(0, 0, 0, 0.14);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.45);
      --track: rgba(0, 0, 0, 0.12);
      --track-disabled: rgba(0, 0, 0, 0.06);
      --thumb: rgba(0, 0, 0, 0.72);
      --peer-blue: #2f78ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --edge: #fafafa;
        --panel-bg: rgba(0, 0, 0, 0.82);
        --panel-border: rgba(255, 255, 255, 0.16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, 0.45);
        --track: rgba(255, 255, 255, 0.14);
        --track-disabled: rgba(255, 255, 255, 0.07);
        --thumb: rgba(255, 255, 255, 0.78);
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color-scheme: light dark;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
      background: var(--bg);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .gear-btn,
    .peer-btn {
      position: fixed;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.7px solid var(--edge);
      background: transparent;
      color: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      text-shadow: none;
    }

    .gear-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
    }

    .peer-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 10px);
    }

    .gear-btn span,
    .peer-btn .peer-icon {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      transform: translateY(-0.5px);
      color: var(--edge);
      -webkit-text-stroke: 0;
      text-shadow: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
    }

    .gear-btn:active,
    .peer-btn:active {
      transform: scale(0.97);
    }

    .peer-btn.hidden,
    .peer-top-strip.hidden {
      display: none;
    }

    .peer-btn.searching {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
    }

    .peer-btn.connected {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
    }

    .peer-btn.connected .peer-icon {
      color: var(--peer-blue);
    }

    .peer-icon {
      display: block;
      width: 20px;
      text-align: center;
    }

    .peer-spinner {
      display: none;
      position: relative;
      width: 20px;
      height: 20px;
      color: var(--peer-blue);
    }

    .peer-btn.searching .peer-icon {
      display: none;
    }

    .peer-btn.searching .peer-spinner {
      display: block;
      animation: peer-spin 0.9s linear infinite;
    }

    .peer-spinner span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: currentColor;
      transform-origin: 0 0;
    }

    .peer-spinner span:nth-child(1) { transform: translate(0, -8px); opacity: 1; }
    .peer-spinner span:nth-child(2) { transform: translate(5.5px, -5.5px); opacity: 0.82; }
    .peer-spinner span:nth-child(3) { transform: translate(8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(4) { transform: translate(5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(5) { transform: translate(0, 8px); opacity: 0.34; }
    .peer-spinner span:nth-child(6) { transform: translate(-5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(7) { transform: translate(-8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(8) { transform: translate(-5.5px, -5.5px); opacity: 0.82; }

    @keyframes peer-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .peer-top-strip {
      position: fixed;
      left: 50%;
      top: calc(env(safe-area-inset-top, 0px) + 62px);
      transform: translateX(-50%);
      width: min(94vw, 760px);
      z-index: 18;
      pointer-events: none;
    }

    .peer-top-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-radius: 18px;
      background: rgba(127, 127, 127, 0.12);
      border: 1px solid rgba(127, 127, 127, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 10px 12px;
      box-sizing: border-box;
    }

    .peer-top-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .peer-top-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .peer-top-room {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 66vw;
    }

    .peer-top-names {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .peer-top-names::-webkit-scrollbar {
      display: none;
    }

    .peer-chip {
      flex: 0 0 auto;
      border-radius: 999px;
      border: 1px solid rgba(127, 127, 127, 0.22);
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      font-size: 12px;
      line-height: 1.2;
      color: var(--text);
      white-space: nowrap;
    }

    .peer-chip.self {
      border-color: rgba(47, 120, 255, 0.65);
      color: var(--peer-blue);
    }

    .peer-chip.sending {
      border-color: rgba(47, 120, 255, 0.85);
      background: rgba(47, 120, 255, 0.14);
      color: var(--peer-blue);
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 18px;
      box-sizing: border-box;
    }

    .overlay.open {
      display: flex;
    }

    .panel {
      width: min(92vw, 460px);
      max-height: min(84vh, 680px);
      overflow: auto;
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 18px 18px 16px;
      box-sizing: border-box;
      scrollbar-width: thin;
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -18px -18px 18px;
      padding: 18px 18px 14px;
      background: linear-gradient(to bottom, var(--panel-bg) 80%, rgba(0,0,0,0));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(127, 127, 127, 0.12);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .close-btn {
      appearance: none;
      border: 1.5px solid var(--edge);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      min-width: 42px;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .close-btn:active {
      transform: scale(0.98);
    }

    .setting-block {
      padding: 14px 0 4px;
      border-top: 1px solid rgba(127, 127, 127, 0.16);
    }

    .setting-block:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .setting-label .main {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }

    .setting-label .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }

    .switch {
      position: relative;
      width: 56px;
      height: 34px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(127, 127, 127, 0.18);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--thumb);
      transition: 0.2s ease;
    }

    .switch input:checked + .slider {
      background: rgba(55, 180, 90, 0.22);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .mode-select {
      width: 128px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .hex-input {
      width: 100%;
      box-sizing: border-box;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    .hex-input::placeholder {
      color: var(--muted);
    }

    .sub-input-wrap {
      margin-top: 10px;
    }

    .disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .range-wrap {
      margin-top: 12px;
      padding-left: 2px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .range-title {
      font-size: 13px;
      font-weight: 650;
    }

    .range-value {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      height: 28px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-webkit-slider-runnable-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-top: -7.5px;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-moz-range-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    .effect-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .effect-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 0 0;
    }

    .effect-item + .effect-item {
      border-top: 1px solid rgba(127, 127, 127, 0.12);
      padding-top: 12px;
    }

    .effect-name {
      font-size: 13px;
      font-weight: 650;
    }

    .effect-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .danger-btn {
      appearance: none;
      border: 1.5px solid rgba(220, 40, 40, 0.55);
      background: transparent;
      color: #d23636;
      border-radius: 14px;
      min-width: 0;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex: 1 1 auto;
    }

    .danger-btn:active {
      transform: scale(0.98);
    }

    .peer-menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
      box-sizing: border-box;
    }

    .peer-menu-overlay.open {
      display: flex;
    }

    .peer-menu-stage {
      position: relative;
      width: min(92vw, 420px);
      height: min(84vh, 420px);
      pointer-events: none;
    }

    .peer-burst-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1.8px solid rgba(47, 120, 255, 0.35);
      transform: translate(-50%, -50%) scale(0.25);
      opacity: 0;
      transition: transform 1s ease, opacity 0.5s ease;
      pointer-events: none;
    }

    .peer-menu-overlay.open .peer-burst-ring {
      transform: translate(-50%, -50%) scale(2.45);
      opacity: 1;
    }

    .peer-choice {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 126px;
      height: 126px;
      border: 1.7px solid rgba(47, 120, 255, 0.82);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      transform:
        translate(-50%, -50%)
        translate(var(--from-x), var(--from-y))
        scale(0.12);
      opacity: 0;
      transition:
        transform 1s cubic-bezier(.2,.8,.2,1),
        opacity 0.5s ease;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      color: #2f78ff;
    }

    .peer-menu-overlay.open .peer-choice {
      transform:
        translate(-50%, -50%)
        translate(var(--to-x), var(--to-y))
        scale(1);
      opacity: 1;
    }

    .peer-choice:active {
      transform:
        translate(-50%, -50%)
        translate(var(--to-x), var(--to-y))
        scale(0.97);
    }

    .peer-choice:disabled {
      opacity: 0.34;
      pointer-events: none;
      filter: saturate(0.7);
    }

    .peer-choice .peer-choice-label {
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      line-height: 1.35;
      padding: 0 12px;
      color: #2f78ff;
      opacity: 0;
      transition: opacity 0.5s ease;
      transition-delay: 1.0s;
      word-break: keep-all;
      white-space: pre-line;
    }

    .peer-menu-overlay.open .peer-choice .peer-choice-label {
      opacity: 1;
    }

    .peer-choice::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 1px solid rgba(47, 120, 255, 0.2);
      background: rgba(47, 120, 255, 0.03);
      pointer-events: none;
    }

    .peer-choice.wifi {
      --to-x: 0px;
      --to-y: -118px;
    }

    .peer-choice.fb {
      --to-x: -118px;
      --to-y: 108px;
    }

    .peer-choice.solo {
      --to-x: 118px;
      --to-y: 108px;
    }

    .peer-choice.disconnect {
      --to-x: 0px;
      --to-y: -118px;
    }

    .peer-choice.send {
      --to-x: -118px;
      --to-y: 108px;
    }

    .peer-choice.receive {
      --to-x: 118px;
      --to-y: 108px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      transform: translateX(-50%) translateY(12px);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: min(90vw, 420px);
      text-align: center;
      box-sizing: border-box;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <button class="gear-btn" id="openSettings" aria-label="設定を開く">
    <span>⛭</span>
  </button>

  <button class="peer-btn hidden" id="peerButton" aria-label="ローカル通信">
    <span class="peer-icon">☋</span>
    <span class="peer-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </span>
  </button>

  <div class="peer-top-strip hidden" id="peerTopStrip">
    <div class="peer-top-card">
      <div class="peer-top-head">
        <div class="peer-top-title" id="peerTopTitle">通信</div>
        <div class="peer-top-room" id="peerTopRoom">room</div>
      </div>
      <div class="peer-top-names" id="peerTopNames"></div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="設定">
      <div class="panel-header">
        <div class="panel-title">設定</div>
        <button class="close-btn" id="closeSettings">戻る</button>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">背景色</div>
            <div class="sub">システム / 白 / 黒 / カスタム</div>
          </div>
          <select class="mode-select" id="bgMode">
            <option value="system">システム</option>
            <option value="white">白</option>
            <option value="black">黒</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
        <div class="sub-input-wrap hidden" id="bgCustomWrap">
          <input class="hex-input" id="bgCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ffffff" />
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-label">
          <div class="main">色</div>
          <div class="sub">タップ / スワイプ / 囲い の色をカラーコードで指定</div>
        </div>

        <div class="effect-grid">
          <div class="effect-item">
            <div class="effect-name">タップの色</div>
            <input class="hex-input" id="tapColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#46ff78" />
          </div>
          <div class="effect-item">
            <div class="effect-name">スワイプの色</div>
            <input class="hex-input" id="swipeColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#6ea5ff" />
          </div>
          <div class="effect-item">
            <div class="effect-name">囲いの色</div>
            <input class="hex-input" id="loopColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ff4e4e" />
          </div>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">グリッドを表示</div>
            <div class="sub">ONで背景に格子を出します</div>
          </div>
          <label class="switch" aria-label="グリッドを表示">
            <input type="checkbox" id="gridToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div id="gridDetails">
          <div class="range-wrap">
            <div class="range-head">
              <div class="range-title">間隔</div>
              <div class="range-value"><span id="spacingValue">36</span>px</div>
            </div>
            <input type="range" id="spacingRange" min="18" max="100" step="1" value="36" />
          </div>

          <div class="control-row">
            <div class="setting-label">
              <div class="main" style="font-size: 13px;">グリッド色</div>
              <div class="sub">システム / 白 / 黒 / カスタム</div>
            </div>
            <select class="mode-select" id="gridMode">
              <option value="system">システム</option>
              <option value="white">白</option>

      let appToastTimer = null;

      function appMakeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        const bytes = new Uint8Array(16);
        (window.crypto || window.msCrypto).getRandomValues(bytes);
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      }

      function appClamp(v, min, max) {
        return Math.min(max, Math.max(min, v));
      }

      function appLerp(a, b, t) {
        return a + (b - a) * t;
      }

      function appNowMs() {
        return performance.now();
      }

      function appEaseOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function appDistance(ax, ay, bx, by) {
        return Math.hypot(ax - bx, ay - by);
      }

      function appPointToSegmentDistance(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const apx = px - ax;
        const apy = py - ay;
        const abLen2 = abx * abx + aby * aby;

        if (abLen2 === 0) return Math.hypot(px - ax, py - ay);

        let t = (apx * abx + apy * aby) / abLen2;
        t = appClamp(t, 0, 1);

        const cx = ax + abx * t;
        const cy = ay + aby * t;
        return Math.hypot(px - cx, py - cy);
      }

      function appNormalizeText(raw, fallback, limit = 40) {
        let s = String(raw ?? '').trim();
        if (!s) s = fallback;
        if (s.length > limit) s = s.slice(0, limit);
        return s;
      }

      function appIsValidMode(value) {
        return value === 'system' || value === 'white' || value === 'black' || value === 'custom';
      }

      function appNormalizeHexColor(raw) {
        if (typeof raw !== 'string') return null;
        let s = raw.trim();
        if (!s) return null;
        if (s[0] === '#') s = s.slice(1);
        if (!/^[0-9a-fA-F]+$/.test(s)) return null;

        if (s.length === 3 || s.length === 4) {
          s = s.split('').map(ch => ch + ch).join('');
        }

        if (s.length !== 6 && s.length !== 8) return null;
        return '#' + s.toLowerCase();
      }

      function appHexToRgba(rawHex, alphaOverride = 1) {
        const hex = appNormalizeHexColor(rawHex);
        if (!hex) return null;

        const s = hex.slice(1);
        const r = parseInt(s.slice(0, 2), 16);
        const g = parseInt(s.slice(2, 4), 16);
        const b = parseInt(s.slice(4, 6), 16);
        const a = s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1;
        return `rgba(${r}, ${g}, ${b}, ${appClamp(a * alphaOverride, 0, 1)})`;
      }

      function appResolveModeColor(mode, customRaw, lightHex, darkHex) {
        const fallback = appIsDark ? darkHex : lightHex;
        if (mode === 'system') return fallback;
        if (mode === 'white') return '#ffffff';
        if (mode === 'black') return '#000000';
        if (mode === 'custom') return appNormalizeHexColor(customRaw) || fallback;
        return fallback;
      }

      function appToast(message, duration = 1700) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(appToastTimer);
        appToastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, duration);
      }

      function appSaveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appSettings));
        } catch (_) {}
      }

      function appLoadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);

          if (appIsValidMode(data.bgMode)) appSettings.bgMode = data.bgMode;
          if (typeof data.bgCustom === 'string') appSettings.bgCustom = data.bgCustom;

          if (typeof data.tapColor === 'string') appSettings.tapColor = data.tapColor;
          if (typeof data.swipeColor === 'string') appSettings.swipeColor = data.swipeColor;
          if (typeof data.loopColor === 'string') appSettings.loopColor = data.loopColor;

          if (typeof data.gridEnabled === 'boolean') appSettings.gridEnabled = data.gridEnabled;
          if (appIsValidMode(data.gridMode)) appSettings.gridMode = data.gridMode;
          if (typeof data.gridCustom === 'string') appSettings.gridCustom = data.gridCustom;
          if (typeof data.gridSpacing === 'number' && isFinite(data.gridSpacing)) {
            appSettings.gridSpacing = appClamp(Math.round(data.gridSpacing), 18, 100);
          }

          if (typeof data.peerButtonVisible === 'boolean') appSettings.peerButtonVisible = data.peerButtonVisible;
          if (typeof data.displayName === 'string') appSettings.displayName = appNormalizeText(data.displayName, 'あなた', 24);
          if (typeof data.firebaseRoomText === 'string') appSettings.firebaseRoomText = appNormalizeText(data.firebaseRoomText, 'room', 40);
        } catch (_) {}
      }

      function appGetBgColor() {
        return appResolveModeColor(appSettings.bgMode, appSettings.bgCustom, '#ffffff', '#000000');
      }

      function appGetGridBaseColor() {
        return appResolveModeColor(
          appSettings.gridMode,
          appSettings.gridCustom,
          appIsDark ? '#262626' : '#e8e8e8',
          appIsDark ? '#262626' : '#e8e8e8'
        );
      }

      function appGetTapBaseColor() {
        return appNormalizeHexColor(appSettings.tapColor) || appDefaults.tapColor;
      }

      function appGetSwipeBaseColor() {
        return appNormalizeHexColor(appSettings.swipeColor) || appDefaults.swipeColor;
      }

      function appGetLoopBaseColor() {
        return appNormalizeHexColor(appSettings.loopColor) || appDefaults.loopColor;
      }

      function appCurrentDisplayName() {
        return appNormalizeText(appSettings.displayName, 'あなた', 24);
      }

      function appCurrentFirebaseRoomText() {
        return appNormalizeText(appSettings.firebaseRoomText, 'room', 40);
      }

      function appUpdateTheme() {
        appIsDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        document.documentElement.style.setProperty('--bg', appIsDark ? '#000' : '#fff');
        document.documentElement.style.setProperty('--edge', appIsDark ? '#fafafa' : '#111');
        document.documentElement.style.setProperty('--panel-bg', appIsDark ? 'rgba(0, 0, 0, 0.82)' : 'rgba(255, 255, 255, 0.84)');
        document.documentElement.style.setProperty('--panel-border', appIsDark ? 'rgba(255, 255, 255, 0.16)' : 'rgba(0, 0, 0, 0.14)');
        document.documentElement.style.setProperty('--text', appIsDark ? '#f5f5f5' : '#101010');
        document.documentElement.style.setProperty('--muted', appIsDark ? 'rgba(245, 245, 245, 0.45)' : 'rgba(16, 16, 16, 0.45)');
        document.documentElement.style.setProperty('--track', appIsDark ? 'rgba(255, 255, 255, 0.14)' : 'rgba(0, 0, 0, 0.12)');
        document.documentElement.style.setProperty('--track-disabled', appIsDark ? 'rgba(255, 255, 255, 0.07)' : 'rgba(0, 0, 0, 0.06)');
        document.documentElement.style.setProperty('--thumb', appIsDark ? 'rgba(255, 255, 255, 0.78)' : 'rgba(0, 0, 0, 0.72)');

        document.body.style.background = appGetBgColor();
      }

      function appResizeCanvas() {
        appDpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        appWidth = window.innerWidth;
        appHeight = window.innerHeight;
        canvas.width = Math.floor(appWidth * appDpr);
        canvas.height = Math.floor(appHeight * appDpr);
        canvas.style.width = appWidth + 'px';
        canvas.style.height = appHeight + 'px';
        ctx.setTransform(appDpr, 0, 0, appDpr, 0, 0);
      }

      function appSyncSettingsUi() {
        bgMode.value = appSettings.bgMode;
        bgCustomInput.value = appSettings.bgCustom;
        bgCustomWrap.classList.toggle('hidden', appSettings.bgMode !== 'custom');

        tapColorInput.value = appSettings.tapColor;
        swipeColorInput.value = appSettings.swipeColor;

        gridToggle.checked = appSettings.gridEnabled;

      function appUpdatePeerButtonUi() {
        peerButton.classList.toggle('hidden', !appSettings.peerButtonVisible);
        peerButton.classList.toggle('searching', appPeerState === 'searching');
        peerButton.classList.toggle('connected', appPeerState === 'connected');

        if (appPeerState === 'searching') {
          peerButton.setAttribute('aria-label', 'ローカル通信をキャンセル');
        } else if (appPeerState === 'connected') {
          peerButton.setAttribute('aria-label', '接続メニューを開く');
        } else {
          peerButton.setAttribute('aria-label', 'ローカル通信');
        }
      }

      function appGetJoinedLabel() {
        return appJoinedRoomLabel || (appTransportKind === 'local' ? LOCAL_ROOM_LABEL : appCurrentFirebaseRoomText());
      }

      function appRenderPeerTopStrip() {
        const joined = appTransportKind !== 'none';
        peerTopStrip.classList.toggle('hidden', !joined);
        if (!joined) return;

        peerTopTitle.textContent = appTransportKind === 'firebase' ? 'Firebase通信' : 'ローカル通信';
        peerTopRoom.textContent = appTransportKind === 'firebase'
          ? `部屋: ${appGetJoinedLabel()}`
          : '同じ端末内';

        const activeSender = appGetActiveSenderInfo();
        const displayList = appBuildRosterForDisplay();
        peerTopNames.innerHTML = '';

        if (displayList.length === 0) {
          const empty = document.createElement('span');
          empty.className = 'peer-chip';
          empty.textContent = '待機中';
          peerTopNames.appendChild(empty);
          return;
        }

        for (const member of displayList) {
          const chip = document.createElement('span');
          chip.className = 'peer-chip';
          if (member.id === appSelfId) chip.classList.add('self');
          if (activeSender && member.id === activeSender.id) chip.classList.add('sending');
          chip.textContent = member.name;
          peerTopNames.appendChild(chip);
        }
      }

      function appBuildRosterForDisplay() {
        const fresh = [];
        const seenIds = new Set();
        const now = Date.now();

        const addMember = (member) => {
          if (!member || !member.id || seenIds.has(member.id)) return;
          seenIds.add(member.id);
          fresh.push({
            id: member.id,
            name: appNormalizeText(member.name, '名無し', 24),
            updatedAtMs: Number(member.updatedAtMs) || 0
          });
        };

        addMember({
          id: appSelfId,
          name: appCurrentDisplayName(),
          updatedAtMs: Date.now()
        });

        for (const member of appMemberRoster) {
          const updatedAtMs = Number(member.updatedAtMs) || 0;
          if (updatedAtMs && now - updatedAtMs > 10000) continue;
          addMember(member);
        }

        fresh.sort((a, b) => {
          if (a.id === appSelfId) return -1;
          if (b.id === appSelfId) return 1;
          return a.name.localeCompare(b.name, 'ja');
        });

        return fresh;
      }

      function appGetActiveSenderInfo() {
        const info = appSharedRoomState || {};
        const untilMs = Number(info.activeSenderUntilMs) || 0;
        const now = Date.now();
        if (!info.activeSenderId || !untilMs || untilMs <= now) return null;
        return {
          id: info.activeSenderId,
          name: appNormalizeText(info.activeSenderName, '送信者', 24),
          untilMs
        };
      }

      function appRefreshPeerStateFromTransport() {
        if (appTransportKind === 'none') {
          appPeerState = 'off';

        const roster = appBuildRosterForDisplay();
        const others = roster.filter(member => member.id !== appSelfId && member.updatedAtMs > 0);
        appPeerState = others.length > 0 ? 'connected' : 'searching';
      }

      function appRefreshPeerUi() {
        const wasOpenConnectedMenu = appMenuOpen && appMenuMode === 'connected';
        appRefreshPeerStateFromTransport();
        appUpdatePeerButtonUi();
        appRenderPeerTopStrip();

        if (wasOpenConnectedMenu && appPeerState !== 'connected') {
          appClosePeerMenu();
          return;

        if (appMenuOpen) {
          appRefreshPeerMenuLabels();

      function appSyncPeerMenuLocation() {
        const rect = peerButton.getBoundingClientRect();
        const stageRect = peerMenuStage.getBoundingClientRect();
        const stageW = stageRect.width || window.innerWidth;
        const stageH = stageRect.height || window.innerHeight;

        const anchorX = rect.left + rect.width / 2 - stageW / 2;
        const anchorY = rect.top + rect.height / 2 - stageH / 2;

        const applyVars = (button, toX, toY) => {
          button.style.setProperty('--from-x', `${anchorX}px`);
          button.style.setProperty('--from-y', `${anchorY}px`);
          button.style.setProperty('--to-x', `${toX}px`);
          button.style.setProperty('--to-y', `${toY}px`);
        };

        applyVars(peerChoice1, 0, -118);
        applyVars(peerChoice2, -118, 108);
        applyVars(peerChoice3, 118, 108);
      }

      function appRefreshPeerMenuLabels() {
        if (!appMenuOpen) return;

        appSyncPeerMenuLocation();

        if (appMenuMode === 'off') {
          peerChoice1.className = 'peer-choice wifi';
          peerChoice2.className = 'peer-choice fb';
          peerChoice3.className = 'peer-choice solo';

          peerChoiceLabel1.textContent = 'ローカル\n通信';
          peerChoiceLabel2.textContent = 'Firebaseで\nマッチング';
          peerChoiceLabel3.textContent = 'ひとりで\n遊ぶ';

          peerChoice1.disabled = false;
          peerChoice2.disabled = false;
          peerChoice3.disabled = false;
        } else {
          const activeSender = appGetActiveSenderInfo();
          const busyByOther = !!activeSender && activeSender.id !== appSelfId;
          const busyBySelf = !!activeSender && activeSender.id === appSelfId;

          peerChoice1.className = 'peer-choice disconnect';
          peerChoice2.className = 'peer-choice send';
          peerChoice3.className = 'peer-choice receive';

          peerChoiceLabel1.textContent = '接続を\n切断';
          peerChoiceLabel2.textContent = busyByOther
            ? `${activeSender.name}\nが送信中…`
            : busyBySelf
              ? '送信中…'
              : '設定を\n送信';
          peerChoiceLabel3.textContent = '設定を\n受信';

          peerChoice1.disabled = false;
          peerChoice2.disabled = busyByOther || busyBySelf;
          peerChoice3.disabled = false;
        }
      }

      function appOpenPeerMenu(mode) {
        appMenuMode = mode;
        appMenuOpen = true;

        appRefreshPeerMenuLabels();
        peerMenuOverlay.classList.add('open');

      function appClosePeerMenu() {
        appMenuOpen = false;
        peerMenuOverlay.classList.remove('open');
        peerMenuOverlay.setAttribute('aria-hidden', 'true');
      }

      function appOpenSettings() {
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
      }

      function appCloseSettings() {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
      }

      function appSetJoinedLabelFromLocal() {
        appJoinedRoomLabel = LOCAL_ROOM_LABEL;
      }

      function appSetJoinedLabelFromFirebase() {
        appJoinedRoomLabel = appCurrentFirebaseRoomText();
      }

      function appGetLocalStateDefault() {
        return {
          version: 1,
          members: {},
          activeSenderId: '',
          activeSenderName: '',
          activeSenderUntilMs: 0,
          latestSettingsPacket: null,
          latestEffectPacket: null
        };
      }

      function appLocalReadState() {
        try {
          const raw = localStorage.getItem(LOCAL_STATE_KEY);
          if (!raw) return appGetLocalStateDefault();
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== 'object') return appGetLocalStateDefault();
          return {
            version: 1,
            members: parsed.members && typeof parsed.members === 'object' ? parsed.members : {},
            activeSenderId: typeof parsed.activeSenderId === 'string' ? parsed.activeSenderId : '',
            activeSenderName: typeof parsed.activeSenderName === 'string' ? parsed.activeSenderName : '',
            activeSenderUntilMs: Number(parsed.activeSenderUntilMs) || 0,

            const activeId = typeof data.activeSenderId === 'string' ? data.activeSenderId : '';

                ? data.activeSenderName
                : '他の人';
              throw new Error(`${activeName}が送信中`);
            }

            tx.set(appFirebaseRoomRef, {
              activeSenderId: appSelfId,
              activeSenderName: appCurrentDisplayName(),
              activeSenderUntilMs: now + 10000,
              latestSettingsPacket: packet,
              updatedAtMs: now
            }, { merge: true });

      function appStoreSeenPacketId(packetId) {
        if (!packetId) return false;
        if (appSeenPacketIds.has(packetId)) return false;
        appSeenPacketIds.add(packetId);
        appSeenPacketQueue.push(packetId);
        if (appSeenPacketQueue.length > 500) {
          const old = appSeenPacketQueue.shift();
          if (old) appSeenPacketIds.delete(old);
        }
        return true;

      function appMaybeApplyLatestSharedPackets() {
        const settingsPacket = appSharedRoomState.latestSettingsPacket;
        if (settingsPacket && settingsPacket.id && appStoreSeenPacketId(settingsPacket.id)) {
          appHandleSharedPacket(settingsPacket);
        }

        const effectPacket = appSharedRoomState.latestEffectPacket;
        if (effectPacket && effectPacket.id && appStoreSeenPacketId(effectPacket.id)) {
          appHandleSharedPacket(effectPacket);
        }

      function appHandleSharedPacket(packet) {
        if (!packet || typeof packet !== 'object') return;
        if (packet.senderId === appSelfId) return;

        if (packet.kind === 'settings') {
          appHandleIncomingSettingsPacket(packet);
          return;
        }

        if (packet.kind === 'tap' || packet.kind === 'swipe' || packet.kind === 'loop') {
          appHandleIncomingEffectPacket(packet);
        }
      }

      function appHandleIncomingSettingsPacket(packet) {
        if (!packet || typeof packet !== 'object') return;
        if (packet.senderId === appSelfId) return;

        const sentAtMs = Number(packet.sentAtMs) || 0;
        const withinReceiveWindow = Date.now() <= appReceiveWindowUntilMs;
        const withinPacketAge = Date.now() - sentAtMs <= 10000;

        if (withinReceiveWindow && withinPacketAge && packet.id !== appLastAppliedSettingsPacketId) {
          appLastAppliedSettingsPacketId = packet.id;
          appApplySettingsSnapshot(packet.payload);
          appToast('設定を受信した');
        }
      }

      function appHandleIncomingEffectPacket(packet) {
        if (!packet || typeof packet !== 'object') return;
        if (packet.senderId === appSelfId) return;
        if (packet.id === appLastAppliedEffectPacketId) return;
        appLastAppliedEffectPacketId = packet.id;

        const payload = packet.payload || {};
        if (packet.kind === 'tap') {
          if (typeof payload.x === 'number' && typeof payload.y === 'number') {
            appCreateTapEffect(payload.x, payload.y, false);
          }
          return;
        }

        if (packet.kind === 'swipe') {
          const from = payload.from || {};
          const to = payload.to || {};
          const dir = payload.dir || {};
          if (
            typeof from.x === 'number' && typeof from.y === 'number' &&
            typeof to.x === 'number' && typeof to.y === 'number' &&
            typeof dir.x === 'number' && typeof dir.y === 'number'
          ) {
            appCreateSwipeEffect(from.x, from.y, dir.x * 100, dir.y * 100, false, {
              forceFrom: from,
              forceTo: to,
              forceRadius: typeof payload.radius === 'number' ? payload.radius : undefined
            });
          }
          return;
        }

        if (packet.kind === 'loop') {
          if (Array.isArray(payload.points)) {
            const points = payload.points
              .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number')
              .map(p => ({ x: p.x, y: p.y }));
            if (points.length >= 3) appCreateLoopEffect(points, false);
          }
        }
      }

      function appLeaveCurrentTransport(sendMessage) {

          appLocalMutateState((stateObj) => {
            if (stateObj.members && stateObj.members[appSelfId]) {
              delete stateObj.members[appSelfId];
            }
            if (stateObj.activeSenderId === appSelfId) {
              stateObj.activeSenderId = '';

              stateObj.activeSenderUntilMs = 0;

          appTransportKind = 'none';

          appSharedRoomState = {
            activeSenderId: '',
            activeSenderName: '',
            activeSenderUntilMs: 0,

          };

          appPeerState = 'off';

      async function appFirebaseWriteSharedSettings(settingsSnapshot) {
        if (!firebaseDb || !appFirebaseRoomRef) {
          appToast('Firebaseが使えない');

        const now = Date.now();
        const packet = {
          id: appMakeId(),
          kind: 'settings',
          senderId: appSelfId,
          senderName: appCurrentDisplayName(),
          sentAtMs: now,
          payload: settingsSnapshot

        try {
          await runTransaction(firebaseDb, async (tx) => {
            const snap = await tx.get(appFirebaseRoomRef);
            const data = snap.data() || {};
            const activeUntil = Number(data.activeSenderUntilMs) || 0;
            const activeId = typeof data.activeSenderId === 'string' ? data.activeSenderId : '';

            if (activeUntil > Date.now() && activeId && activeId !== appSelfId) {
              const activeName = typeof data.activeSenderName === 'string' && data.activeSenderName
                ? data.activeSenderName
                : '他の人';
              throw new Error(`${activeName}が送信中`);
            }

            tx.set(appFirebaseRoomRef, {
              activeSenderId: appSelfId,
              activeSenderName: appCurrentDisplayName(),
              activeSenderUntilMs: now + 10000,
              latestSettingsPacket: packet,
              updatedAtMs: now
            }, { merge: true });
          });

          appToast('設定を送った');

        appEffects.push({

      function appCreateSwipeEffect(startX, startY, dirX, dirY, broadcast = true, forced = null) {
        const len = Math.hypot(dirX, dirY) || 1;
        dirX /= len;
        dirY /= len;

        const pad = 90;
        const minX = -pad;
        const minY = -pad;
        const maxX = appWidth + pad;
        const maxY = appHeight + pad;

        const hits = [];

        function pushCandidate(t, x, y) {
          if (x >= minX - 0.5 && x <= maxX + 0.5 && y >= minY - 0.5 && y <= maxY + 0.5) {
            hits.push({ t, x, y });
          }
        }

        let first;
        let last;

        if (forced && forced.forceFrom && forced.forceTo) {
          first = forced.forceFrom;
          last = forced.forceTo;
        } else {
          if (Math.abs(dirX) > 1e-6) {
            let t = (minX - startX) / dirX;
            pushCandidate(t, minX, startY + dirY * t);
            t = (maxX - startX) / dirX;
            pushCandidate(t, maxX, startY + dirY * t);
          }

          if (Math.abs(dirY) > 1e-6) {
            let t = (minY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, minY);
            t = (maxY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, maxY);
          }

          if (hits.length < 2) {
            hits.push(
              { t: -400, x: startX - dirX * 400, y: startY - dirY * 400 },
              { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 }
            );
          } else {
            hits.sort((a, b) => a.t - b.t);
          }

          first = hits[0];
          last = hits[hits.length - 1];
        }

        const travel = appDistance(first.x, first.y, last.x, last.y);
        const duration = appClamp(460 + travel * 0.12, 520, 900);
        const radius = typeof (forced && forced.forceRadius) === 'number'
          ? forced.forceRadius
          : appClamp(Math.min(appWidth, appHeight) * 0.045, 18, 38);

        appEffects.push({
          type: 'swipe',
          start: appNowMs(),
          duration,
          from: { x: first.x, y: first.y },
          to: { x: last.x, y: last.y },
          dir: { x: dirX, y: dirY },
          radius
        });

        if (broadcast) {
          if (appTransportKind === 'local') {
            appLocalWriteSharedEffect('swipe', {
              from: { x: first.x, y: first.y },
              to: { x: last.x, y: last.y },
              dir: { x: dirX, y: dirY },
              radius
            });
          } else if (appTransportKind === 'firebase') {
            appFirebaseWriteSharedEffect('swipe', {
              from: { x: first.x, y: first.y },
              to: { x: last.x, y: last.y },
              dir: { x: dirX, y: dirY },
              radius
            });
          }
        }
      }

      function appCreateLoopEffect(points, broadcast = true) {
        if (!points || points.length < 3) return;

        const copy = points.map(p => ({ x: p.x, y: p.y }));
        appEffects.push({
          type: 'loop',
          start: appNowMs(),
          duration: 420,
          points: copy
        });

        if (broadcast) {
          if (appTransportKind === 'local') {
            appLocalWriteSharedEffect('loop', { points: copy });
          } else if (appTransportKind === 'firebase') {
            appFirebaseWriteSharedEffect('loop', { points: copy });
          }
        }
      }

      function appDetectLoop(points, currentX, currentY) {
        if (points.length < APP_LASSO_MIN_POINTS) return false;

        const n = points.length;
        const safeEnd = Math.max(0, n - 1 - APP_LASSO_IGNORE_RECENT_SEGMENTS);

        for (let i = 0; i < safeEnd - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const d = appPointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
          if (d <= APP_LASSO_HIT_RADIUS) {
            let traveled = 0;
            for (let k = i; k < n - 1; k++) {
              traveled += appDistance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
              if (traveled > 40) break;
            }
            if (traveled > 40) return true;
          }
        }

        return false;
      }

      function appDrawGrid() {
        if (!appSettings.gridEnabled) return;

        const baseColor = appGetGridBaseColor();
        const lineLow = appHexToRgba(baseColor, 0.40) || (appIsDark ? 'rgba(34,34,34,0.40)' : 'rgba(232,232,232,0.40)');
        const lineHigh = appHexToRgba(baseColor, 0.56) || (appIsDark ? 'rgba(58,58,58,0.56)' : 'rgba(210,210,210,0.56)');

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 1;

        for (let x = 0; x <= appWidth + appSettings.gridSpacing; x += appSettings.gridSpacing) {
          const isAccent = Math.round(x / appSettings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(Math.floor(x) + 0.5, 0);
          ctx.lineTo(Math.floor(x) + 0.5, appHeight);
          ctx.stroke();
        }

        for (let y = 0; y <= appHeight + appSettings.gridSpacing; y += appSettings.gridSpacing) {
          const isAccent = Math.round(y / appSettings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(0, Math.floor(y) + 0.5);
          ctx.lineTo(appWidth, Math.floor(y) + 0.5);
          ctx.stroke();
        }

        ctx.restore();
      }

      function appDrawTap(effect, t) {
        const p = appClamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = appEaseOutCubic(p);
        const radius = appLerp(10, Math.max(appWidth, appHeight) * 0.22, e);
        const alpha = 0.34 * Math.pow(1 - p, 1.7);
        const baseColor = appGetTapBaseColor();

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = radius * 0.22;
        ctx.shadowColor = appHexToRgba(baseColor, 0.55) || 'rgba(70, 255, 120, 0.55)';

        const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
        g.addColorStop(0.00, appHexToRgba(baseColor, 0.92) || 'rgba(70, 255, 120, 0.92)');
        g.addColorStop(0.28, appHexToRgba(baseColor, 0.60) || 'rgba(60, 235, 110, 0.60)');
        g.addColorStop(0.68, appHexToRgba(baseColor, 0.25) || 'rgba(50, 220, 100, 0.25)');
        g.addColorStop(1.00, appHexToRgba(baseColor, 0.00) || 'rgba(50, 220, 100, 0)');

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function appDrawSwipe(effect, t) {
        const p = appClamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = appEaseOutCubic(p);
        const x = appLerp(effect.from.x, effect.to.x, e);
        const y = appLerp(effect.from.y, effect.to.y, e);

        const trailSteps = 16;
        const trailSpacing = effect.radius * 0.82;
        const baseColor = appGetSwipeBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';

        for (let i = trailSteps; i >= 0; i--) {
          const back = i * trailSpacing;
          const px = x - effect.dir.x * back;
          const py = y - effect.dir.y * back;
          const a = 0.24 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, 0.35);
          if (a <= 0.001) continue;

          const r = effect.radius * (1 + (trailSteps - i) * 0.02);

          ctx.globalAlpha = a;
          ctx.shadowBlur = r * 0.35;
          ctx.shadowColor = appHexToRgba(baseColor, 0.55) || 'rgba(90, 150, 255, 0.55)';
          ctx.fillStyle = appHexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 0.45 * Math.pow(1 - p, 0.7);
        ctx.shadowBlur = effect.radius * 0.6;
        ctx.shadowColor = appHexToRgba(baseColor, 0.45) || 'rgba(110, 165, 255, 0.45)';
        ctx.fillStyle = appHexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
        ctx.beginPath();
        ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function appDrawLoop(effect, t) {
        const p = appClamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;
        if (effect.points.length < 3) return;

        const alpha = 0.36 * Math.pow(1 - p, 2.0);
        const blur = 8 * Math.pow(1 - p, 0.55);
        const baseColor = appGetLoopBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = blur;
        ctx.shadowColor = appHexToRgba(baseColor, 0.40) || 'rgba(255, 60, 60, 0.40)';
        ctx.fillStyle = appHexToRgba(baseColor, 1) || 'rgba(255, 78, 78, 1)';

        ctx.beginPath();
        ctx.moveTo(effect.points[0].x, effect.points[0].y);
        for (let i = 1; i < effect.points.length; i++) {
          ctx.lineTo(effect.points[i].x, effect.points[i].y);
        }
        ctx.closePath();
        ctx.fill('evenodd');

        ctx.restore();
      }

      function appRenderFrame() {
        const t = appNowMs();

        ctx.fillStyle = appGetBgColor();
        ctx.fillRect(0, 0, appWidth, appHeight);

        appDrawGrid();

        for (let i = 0; i < appEffects.length; i++) {
          const effect = appEffects[i];
          if (effect.type === 'tap') appDrawTap(effect, t);
          else if (effect.type === 'swipe') appDrawSwipe(effect, t);
          else if (effect.type === 'loop') appDrawLoop(effect, t);
        }

        for (let i = appEffects.length - 1; i >= 0; i--) {
          if (t - appEffects[i].start >= appEffects[i].duration) appEffects.splice(i, 1);
        }

        requestAnimationFrame(appRenderFrame);
      }

        appTransportKind = 'firebase';
        appSetJoinedLabelFromFirebase();

        appFirebaseRoomRef = doc(firebaseDb, 'rooms', roomKey);
        appFirebaseMembersColRef = collection(firebaseDb, 'rooms', roomKey, 'members');
        appFirebaseSelfMemberRef = doc(firebaseDb, 'rooms', roomKey, 'members', appSelfId);

        (async () => {
          try {
            await setDoc(appFirebaseRoomRef, { updatedAtMs: Date.now() }, { merge: true });
            await setDoc(appFirebaseSelfMemberRef, {
              name: appCurrentDisplayName(),
              updatedAtMs: Date.now(),

            appRefreshPeerUi();
            return;

          appFirebaseRoomUnsub = onSnapshot(appFirebaseRoomRef, (snap) => {
            const data = snap.data() || {};
            appSharedRoomState = {
              activeSenderId: typeof data.activeSenderId === 'string' ? data.activeSenderId : '',
              activeSenderName: typeof data.activeSenderName === 'string' ? data.activeSenderName : '',
              activeSenderUntilMs: Number(data.activeSenderUntilMs) || 0,
              latestSettingsPacket: data.latestSettingsPacket && typeof data.latestSettingsPacket === 'object' ? data.latestSettingsPacket : null,
              latestEffectPacket: data.latestEffectPacket && typeof data.latestEffectPacket === 'object' ? data.latestEffectPacket : null
            };
            appMaybeApplyLatestSharedPackets();
            appRefreshPeerUi();
          });

          appFirebaseMembersUnsub = onSnapshot(appFirebaseMembersColRef, (snap) => {
            const now = Date.now();
            const roster = [];
            snap.forEach((d) => {
              const data = d.data() || {};
              const updatedAtMs = Number(data.updatedAtMs) || 0;
              if (updatedAtMs && now - updatedAtMs > 10000) return;
              roster.push({
                id: d.id,
                name: appNormalizeText(data.name, '名無し', 24),
                updatedAtMs
              });
            });

            if (!roster.some(member => member.id === appSelfId)) {
              roster.push({
                id: appSelfId,
                name: appCurrentDisplayName(),
                updatedAtMs: Date.now()
              });
            }

            appMemberRoster = roster;
            appRefreshPeerUi();
          });

          appStartCurrentPresenceHeartbeat();
          appToast('Firebaseで待機中');
        })();
      }

          if (appMenuMode === 'off') {
            appOnPeerChoiceLocal();
            return;
          }
          appOnPeerChoiceDisconnect();
        };

        peerChoice2.onclick = () => {
          if (appMenuMode === 'off') {
            appOnPeerChoiceFirebase();
            return;
          }
          appOnPeerChoiceSend();
        };

        peerChoice3.onclick = () => {
          if (appMenuMode === 'off') {
            appOnPeerChoiceSolo();
            return;
          }
          appOnPeerChoiceReceive();
        };
      }

      function appRebuildPeerMenuTextByState() {
        appRefreshPeerMenuLabels();
      }

      function appUpdateDisplayNamePresenceMaybe() {
        if (!appSettings.peerButtonVisible) return;
        appUpdateOwnPresenceNow();
        if (appTransportKind !== 'none') appRefreshPeerUi();
      }

      function appUpdateFirebaseRoomTextSetting() {
        appSettings.firebaseRoomText = appNormalizeText(firebaseRoomInput.value, 'room', 40);
        firebaseRoomInput.value = appSettings.firebaseRoomText;
        appSaveSettings();
      }

      function appApplyUiDependencies() {
        const commEnabled = appSettings.peerButtonVisible;
        commConfigBlock.classList.toggle('disabled', !commEnabled);
        displayNameInput.disabled = !commEnabled;
        firebaseRoomInput.disabled = !commEnabled;
      }

      function appInitUiEvents() {
        openSettings.addEventListener('click', appOpenSettings);
        closeSettings.addEventListener('click', appCloseSettings);

        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) appCloseSettings();
        });

        peerButton.addEventListener('click', appHandlePeerButtonClick);

        peerMenuOverlay.addEventListener('click', (e) => {
          if (e.target === peerMenuOverlay) appClosePeerMenu();
        });

        bgMode.addEventListener('change', () => {
          appSettings.bgMode = bgMode.value;
          bgCustomWrap.classList.toggle('hidden', appSettings.bgMode !== 'custom');
          appSaveSettings();
          appUpdateAllUiFromSettings();
        });

        bgCustomInput.addEventListener('input', () => {
          appSettings.bgCustom = bgCustomInput.value.trim();
          appSaveSettings();
          appUpdateAllUiFromSettings();
        });

        tapColorInput.addEventListener('input', () => {
          appSettings.tapColor = tapColorInput.value.trim();
          appSaveSettings();
        });

        swipeColorInput.addEventListener('input', () => {
          appSettings.swipeColor = swipeColorInput.value.trim();
          appSaveSettings();
        });

        loopColorInput.addEventListener('input', () => {
          appSettings.loopColor = loopColorInput.value.trim();
          appSaveSettings();
        });

        gridToggle.addEventListener('change', () => {
          appSettings.gridEnabled = gridToggle.checked;
          gridDetails.classList.toggle('disabled', !appSettings.gridEnabled);
          appSaveSettings();
        });

        gridMode.addEventListener('change', () => {
          appSettings.gridMode = gridMode.value;
          gridCustomWrap.classList.toggle('hidden', appSettings.gridMode !== 'custom');
          appSaveSettings();
        });

        gridCustomInput.addEventListener('input', () => {
          appSettings.gridCustom = gridCustomInput.value.trim();
          appSaveSettings();
        });

        spacingRange.addEventListener('input', () => {
          appSettings.gridSpacing = appClamp(Number(spacingRange.value) || 36, 18, 100);
          spacingValue.textContent = String(appSettings.gridSpacing);
          appSaveSettings();
        });

        peerButtonToggle.addEventListener('change', () => {
          appSettings.peerButtonVisible = peerButtonToggle.checked;
          appApplyUiDependencies();
          if (!appSettings.peerButtonVisible) {
            appLeaveCurrentTransport(false);
          }
          appUpdatePeerButtonUi();
          appSaveSettings();
        });

        displayNameInput.addEventListener('input', () => {
          appSettings.displayName = appNormalizeText(displayNameInput.value, 'あなた', 24);
          displayNameInput.value = appSettings.displayName;
          appSaveSettings();
          appUpdateDisplayNamePresenceMaybe();
          appRefreshPeerUi();
        });

        firebaseRoomInput.addEventListener('input', () => {
          appSettings.firebaseRoomText = appNormalizeText(firebaseRoomInput.value, 'room', 40);
          firebaseRoomInput.value = appSettings.firebaseRoomText;
          appSaveSettings();
        });

        resetSettings.addEventListener('click', appResetAllSettings);

        peerChoice1.addEventListener('click', () => {});
        peerChoice2.addEventListener('click', () => {});
        peerChoice3.addEventListener('click', () => {});

        window.addEventListener('resize', () => {
          appResizeCanvas();
          appRefreshPeerUi();
        });

        window.addEventListener('beforeunload', () => {
          if (appTransportKind !== 'none') {
            appLeaveCurrentTransport(false);
          }
        });

        window.addEventListener('storage', (ev) => {
          if (ev.key !== LOCAL_STATE_KEY) return;
          if (appTransportKind !== 'local') return;
          const stateObj = appLocalReadState();
          appLocalApplyStateObject(stateObj, false);
        });

        const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        if (darkMql) {
          if (typeof darkMql.addEventListener === 'function') {
            darkMql.addEventListener('change', () => {
              appUpdateTheme();
              appRefreshPeerUi();
            });
          } else if (typeof darkMql.addListener === 'function') {
            darkMql.addListener(() => {
              appUpdateTheme();
              appRefreshPeerUi();
            });
          }
        }

        canvas.addEventListener('pointerdown', (e) => {
          if (overlay.classList.contains('open')) return;
          if (peerMenuOverlay.classList.contains('open')) return;
          if (appActivePointerId !== null) return;

          appActivePointerId = e.pointerId;
          canvas.setPointerCapture(appActivePointerId);

          const p = appGetPoint(e);
          appPointerDownTime = appNowMs();
          appPointerDownPos = { x: p.x, y: p.y };
          appLastPos = { x: p.x, y: p.y };
          appStrokePoints = [p];
          appPointerHadLoop = false;

          e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('pointermove', (e) => {
          if (appActivePointerId !== e.pointerId) return;

          const p = appGetPoint(e);
          const t = appNowMs();

          if (appDistance(p.x, p.y, appLastPos.x, appLastPos.y) >= 2.2) {
            appStrokePoints.push(p);
            appLastPos = p;
          }

          if (t - appLastLoopAt >= APP_LASSO_COOLDOWN) {
            if (appDetectLoop(appStrokePoints, p.x, p.y)) {
              appCreateLoopEffect(appStrokePoints);
              appLastLoopAt = t;
              appPointerHadLoop = true;
              appStrokePoints = [p];
            }
          }

          e.preventDefault();
        }, { passive: false });

        function finishPointer(e) {
          if (appActivePointerId !== e.pointerId) return;

          const p = appGetPoint(e);
          const elapsed = appNowMs() - appPointerDownTime;
          const totalMove = appDistance(appPointerDownPos.x, appPointerDownPos.y, p.x, p.y);

          if (!appPointerHadLoop) {
            if (totalMove <= APP_TAP_MAX_DISTANCE && elapsed <= APP_TAP_MAX_TIME) {
              appAddTapEffect(p.x, p.y, true);
            } else if (totalMove >= APP_SWIPE_MIN_DISTANCE) {
              const dx = p.x - appPointerDownPos.x;
              const dy = p.y - appPointerDownPos.y;
              appCreateSwipeEffect(p.x, p.y, dx, dy, true);
            }
          }

          appActivePointerId = null;
          appStrokePoints = [];
          appPointerHadLoop = false;

          e.preventDefault();
        }

        canvas.addEventListener('pointerup', finishPointer, { passive: false });
        canvas.addEventListener('pointercancel', finishPointer, { passive: false });
        canvas.addEventListener('lostpointercapture', () => {
          appActivePointerId = null;
          appStrokePoints = [];
          appPointerHadLoop = false;
        });
      }

      function appSetupFirebaseListenersIfNeeded() {
        // listeners are created on join
      }

      function appApplyCurrentSettingsUiAndState() {
        appSyncSettingsUi();
        appApplyUiDependencies();
        appUpdateTheme();
        document.body.style.background = appGetBgColor();
        appUpdatePeerButtonUi();
        appRefreshPeerUi();
      }

      function appInit() {
        appLoadSettings();
        appUpdateTheme();
        appResizeCanvas();
        appApplyCurrentSettingsUiAndState();
        appInitMenuChoiceHandlers();
        appInitUiEvents();
        appAttachLocalStorageListener();
        requestAnimationFrame(appRenderFrame);
      }

      function appApplyCurrentRoomStateFromLocalOrFirebase(stateObj, modeLabel) {
        appSharedRoomState = {
          activeSenderId: stateObj.activeSenderId || '',
          activeSenderName: stateObj.activeSenderName || '',
          activeSenderUntilMs: Number(stateObj.activeSenderUntilMs) || 0,
          latestSettingsPacket: stateObj.latestSettingsPacket || null,
          latestEffectPacket: stateObj.latestEffectPacket || null
        };
        appJoinedRoomLabel = modeLabel;
        appMaybeApplyLatestSharedPackets();
        appRefreshPeerUi();
      }

      function appLocalApplyStateObject(stateObj, fromSelf = false) {
        appLocalPruneState(stateObj);
        appSharedRoomState = {
          activeSenderId: stateObj.activeSenderId || '',
          activeSenderName: stateObj.activeSenderName || '',
          activeSenderUntilMs: Number(stateObj.activeSenderUntilMs) || 0,
          latestSettingsPacket: stateObj.latestSettingsPacket || null,
          latestEffectPacket: stateObj.latestEffectPacket || null
        };

        appMemberRoster = Object.entries(stateObj.members || {}).map(([id, member]) => ({
          id,
          name: appNormalizeText(member && member.name, '名無し', 24),
          updatedAtMs: Number(member && member.updatedAtMs) || 0
        }));

        appMaybeApplyLatestSharedPackets();
        appRefreshPeerUi();

        if (fromSelf && appTransportKind === 'local') {
          appUpdateOwnPresenceNow();
        }
      }

      function appSyncLocalStateNowAndApply() {
        if (appTransportKind !== 'local') return;
        const stateObj = appLocalReadState();
        appLocalApplyStateObject(stateObj, false);
      }

      function appUpdatePeerMenuOnStateChange() {
        if (!appMenuOpen) return;
        appRefreshPeerMenuLabels();
      }

      function appGetRosterCount() {
        return appBuildRosterForDisplay().filter(member => member.id !== appSelfId).length;
      }

      function appRefreshPeerUiFull() {
        appRefreshPeerUi();
        appUpdatePeerMenuOnStateChange();
      }

      // Wire up peer menu actions now that functions exist
      peerChoice1.onclick = () => {
        if (appMenuMode === 'off') {
          appOnPeerChoiceLocal();
        } else {
          appOnPeerChoiceDisconnect();
        }
      };
      peerChoice2.onclick = () => {
        if (appMenuMode === 'off') {
          appOnPeerChoiceFirebase();
        } else {
          appOnPeerChoiceSend();
        }
      };
      peerChoice3.onclick = () => {
        if (appMenuMode === 'off') {
          appOnPeerChoiceSolo();
        } else {
          appOnPeerChoiceReceive();
        }
      };

      // Keep labels consistent even when state changes
      const originalRefreshPeerUi = appRefreshPeerUi;
      appRefreshPeerUi = function () {
        originalRefreshPeerUi();
        if (appMenuOpen) {
          appRefreshPeerMenuLabels();
        }
      };

      // Update visible names when input changes while connected
      const originalUpdateOwnPresenceNow = appUpdateOwnPresenceNow;
      appUpdateOwnPresenceNow = function () {
        originalUpdateOwnPresenceNow();
        appRefreshPeerUi();
      };

      // Scroll/resize safety for menu position
      window.addEventListener('resize', () => {
        if (appMenuOpen) {
          appSyncPeerMenuLocationNow();
        }
      });

      // Peer button open/close behavior
      peerButton.addEventListener('click', appHandlePeerButtonClick);

      // Use existing settings UI input handlers
      appInit();

      // Extra safety: expose nothing
    })();
  </script>
</body>
</html>
