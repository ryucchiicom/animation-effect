      state.currentSettingsToken = '';
      updateFromRoomSnapshot();
      syncSettingsUi();
      document.body.style.background = getBgColor();
    }

    function disconnectRoom(sendLeave = true) {
      if (state.transport === 'local') {
        if (sendLeave) {
          localPostMessage({
            type: 'leave',
            id: selfId,
            sender: selfId,
            ts: nowEpoch()
          });
        }
      } else if (state.transport === 'firebase') {
        if (sendLeave && state.firebase.selfPresenceRef) {
          deleteDoc(state.firebase.selfPresenceRef).catch(() => {});
        }
      }

      if (state.localHeartbeat) {
        clearInterval(state.localHeartbeat);
        state.localHeartbeat = null;
      }
      if (state.localChannel) {
        try { state.localChannel.close(); } catch (_) {}
        state.localChannel = null;
      }
      window.removeEventListener('storage', onLocalStorage);

      if (state.firebase.unsubRoom) state.firebase.unsubRoom();
      if (state.firebase.unsubSettings) state.firebase.unsubSettings();
      if (state.firebase.unsubParticipants) state.firebase.unsubParticipants();
      if (state.firebase.unsubEvents) state.firebase.unsubEvents();
      if (state.firebase.heartbeat) {
        clearInterval(state.firebase.heartbeat);
        state.firebase.heartbeat = null;
      }

      state.firebase.roomRef = null;
      state.firebase.settingsRef = null;
      state.firebase.participantsCol = null;
      state.firebase.eventsCol = null;
      state.firebase.selfPresenceRef = null;
      state.firebase.unsubRoom = null;
      state.firebase.unsubSettings = null;
      state.firebase.unsubParticipants = null;
      state.firebase.unsubEvents = null;

      state.transport = 'none';
      state.localBusKey = '';
      state.peerState = 'off';
      cleanupAfterDisconnect();
      closePeerMenu();
      closeRoomOverlay();
      closeQrOverlay();
      stopRoomSyncTimer();
    }

    function onLocalStorage(ev) {
      if (ev.key !== state.localBusKey || !ev.newValue) return;
      try {
        handleIncomingMessage(JSON.parse(ev.newValue), 'local');
      } catch (_) {}
    }

    function openLocalRoom(roomCode) {
      disconnectRoom(false);
      state.roomCode = roomCode;
      state.transport = 'local';
      state.localBusKey = getLocalBusKey();
      state.participants.clear();
      state.participants.set(selfId, {
        id: selfId,
        name: currentDisplayName(),
        lastSeen: nowEpoch(),
        self: true
      });
      state.peerState = 'searching';
      updatePeerButtonUi();
      updatePeerMenuUi();

      try {
        state.localChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('touch_effect_local_' + roomCode) : null;
        if (state.localChannel) {
          state.localChannel.onmessage = (ev) => handleIncomingMessage(ev.data, 'local');
        }
      } catch (_) {
        state.localChannel = null;
      }

      window.addEventListener('storage', onLocalStorage);
      state.localHeartbeat = setInterval(() => {
        sendCurrentPresenceToRoom();
        cleanupParticipants();
      }, 2000);

      sendCurrentPresenceToRoom();
      updateConnectionStateFromParticipants();
      showToast('ローカルで待機中');
      startRoomSyncTimer();

      if (state.showQrAfterJoin) {
        openQrForLocalRoom(roomCode);
      }
    }

    function openFirebaseRoom(roomCode) {
      disconnectRoom(false);
      state.roomCode = roomCode;
      state.transport = 'firebase';
      state.participants.clear();
      state.participants.set(selfId, {
        id: selfId,
        name: currentDisplayName(),
        lastSeen: nowEpoch(),
        self: true
      });
      state.peerState = 'searching';
      updatePeerButtonUi();
      updatePeerMenuUi();

      const roomRef = doc(db, firebaseRoomBase, roomCode);
      const settingsRef = doc(db, firebaseRoomBase, roomCode, 'meta', 'settings');
      const participantsCol = collection(db, firebaseRoomBase, roomCode, 'participants');
      const eventsCol = collection(db, firebaseRoomBase, roomCode, 'events');
      const selfPresenceRef = doc(db, firebaseRoomBase, roomCode, 'participants', selfId);

      state.firebase.roomRef = roomRef;
      state.firebase.settingsRef = settingsRef;
      state.firebase.participantsCol = participantsCol;
      state.firebase.eventsCol = eventsCol;
      state.firebase.selfPresenceRef = selfPresenceRef;

      state.firebase.unsubRoom = onSnapshot(roomRef, (snap) => {
        const data = snap.data() || {};
        if (data.sendLock && typeof data.sendLock === 'object') {
          state.sendLock = {
            byId: data.sendLock.byId || '',
            byName: data.sendLock.byName || '',
            until: typeof data.sendLock.until === 'number' ? data.sendLock.until : 0,
            token: data.sendLock.token || ''
          };
        } else {
          state.sendLock = { byId: '', byName: '', until: 0, token: '' };
        }
        updatePeerMenuUi();
        updateConnectionStateFromParticipants();
      });

      state.firebase.unsubSettings = onSnapshot(settingsRef, (snap) => {
        if (!snap.exists()) return;
        const data = snap.data() || {};
        if (data.senderId === selfId) return;
        if (Date.now() <= state.receiveWindowUntil) {
          applySettingsSnapshot(data);
        }
      });

      state.firebase.unsubParticipants = onSnapshot(participantsCol, (snap) => {
        const list = [];
        snap.forEach((d) => {
          const data = d.data() || {};
          list.push({
            id: d.id,
            name: (data.name || '名無し').toString().slice(0, 20),
            lastSeen: typeof data.lastSeen === 'number' ? data.lastSeen : 0,
            self: d.id === selfId
          });
        });
        updateRoomParticipantsFromSnapshot(list);
      });

      state.firebase.unsubEvents = onSnapshot(query(eventsCol, orderBy('createdAt', 'asc'), limit(200)), (snap) => {
        snap.docChanges().forEach((ch) => {
          if (ch.type !== 'added') return;
          const data = ch.doc.data() || {};
          if (data.sender === selfId) return;
          if (!pushSeenPacket(ch.doc.id)) return;
          applyEffectPacket({
            id: ch.doc.id,
            sender: data.sender,
            kind: data.kind,
            payload: data.payload
          });
        });
      });

      state.firebase.heartbeat = setInterval(() => {
        sendCurrentPresenceToRoom();
        cleanupParticipants();
      }, 2000);

      sendCurrentPresenceToRoom();
      updateConnectionStateFromParticipants();
      showToast('オンラインで待機中');
      startRoomSyncTimer();
    }

    function sendCurrentPresenceToRoom() {
      if (state.transport === 'none' || !state.roomCode) return;
      if (state.transport === 'local') {
        localPostMessage({
          type: 'presence',
          id: selfId,
          name: currentDisplayName(),
          lastSeen: nowEpoch(),
          self: true
        });
      } else if (state.transport === 'firebase') {
        setDoc(state.firebase.selfPresenceRef, {
          id: selfId,
          name: currentDisplayName(),
          lastSeen: nowEpoch(),
          mode: state.roomMode,
          self: true
        }, { merge: true }).catch(() => {});
      }
    }

    function applyIncomingPresence(packet) {
      if (!packet || typeof packet !== 'object' || !packet.id) return;
      if (packet.id === selfId) return;
      if (typeof packet.name !== 'string') return;
      setRoomParticipant(packet.id, {
        id: packet.id,
        name: packet.name.trim() || '名無し',
        lastSeen: typeof packet.lastSeen === 'number' ? packet.lastSeen : nowEpoch(),
        self: false
      });
      updateConnectionStateFromParticipants();
    }

    function applyIncomingLock(lockPacket) {
      if (!lockPacket || typeof lockPacket !== 'object') return;
      if (typeof lockPacket.byId !== 'string' || typeof lockPacket.byName !== 'string') return;
      state.sendLock = {
        byId: lockPacket.byId,
        byName: lockPacket.byName,
        until: typeof lockPacket.until === 'number' ? lockPacket.until : 0,
        token: lockPacket.token || ''
      };
      updatePeerMenuUi();
    }

    function applySettingsSnapshot(snapshot) {
      if (!snapshot || typeof snapshot !== 'object') return;
      if (typeof snapshot.token === 'string' && snapshot.token === state.currentSettingsToken) return;
      if (snapshot.senderId && snapshot.senderId === selfId) return;
      if (Date.now() > state.receiveWindowUntil) return;

      state.currentSettingsToken = typeof snapshot.token === 'string' ? snapshot.token : state.currentSettingsToken;
      state.receiveWindowUntil = 0;

      if (snapshot.payload && typeof snapshot.payload === 'object') {
        const p = snapshot.payload;
        if (isValidMode(p.bgMode)) settings.bgMode = p.bgMode;
        if (typeof p.bgCustom === 'string') settings.bgCustom = p.bgCustom;
        if (typeof p.tapColor === 'string') settings.tapColor = p.tapColor;
        if (typeof p.swipeColor === 'string') settings.swipeColor = p.swipeColor;
        if (typeof p.loopColor === 'string') settings.loopColor = p.loopColor;
        if (typeof p.gridEnabled === 'boolean') settings.gridEnabled = p.gridEnabled;
        if (isValidMode(p.gridMode)) settings.gridMode = p.gridMode;
        if (typeof p.gridCustom === 'string') settings.gridCustom = p.gridCustom;
        if (typeof p.gridSpacing === 'number' && isFinite(p.gridSpacing)) settings.gridSpacing = clamp(Math.round(p.gridSpacing), 18, 100);
        if (typeof p.displayName === 'string') settings.displayName = p.displayName.slice(0, 20) || settings.displayName;
      }

      syncSettingsUi();
      document.body.style.background = getBgColor();
      saveSettings();
      updatePeerMenuUi();
      showToast('設定を受信した');
    }

    function applyEffectPacket(packet) {
      if (!packet || typeof packet !== 'object') return;
      if (packet.sender === selfId) return;
      if (!pushSeenPacket(packet.id)) return;

      const kind = packet.kind;
      const payload = packet.payload || {};
      if (kind === 'tap' && typeof payload.x === 'number' && typeof payload.y === 'number') {
        addTapEffect(payload.x, payload.y, false);
      } else if (kind === 'swipe' && payload.from && payload.to && payload.dir) {
        createSwipeEffect(payload.from.x, payload.from.y, payload.dir.x * 100, payload.dir.y * 100, false, {
          forceFrom: payload.from,
          forceTo: payload.to,
          forceRadius: payload.radius
        });
      } else if (kind === 'loop' && Array.isArray(payload.points)) {
        const pts = payload.points.filter(p => p && typeof p.x === 'number' && typeof p.y === 'number');
        if (pts.length >= 3) createLoopEffect(pts, false);
      }
    }

    function disconnectAfterButton() {
      disconnectRoom(true);
      showToast('切断した');
    }

    function openPeerChoiceConnectionByMode(mode, qr = false) {
      if (mode === 'local') {
        handleRoomSelection('local', qr);
      } else {
        handleRoomSelection('firebase', false);
      }
    }

    function updatePeerButtonHidden() {
      peerButton.classList.toggle('hidden', !settings.peerButtonVisible);
      displayNameWrap.classList.toggle('disabled', !settings.peerButtonVisible);
      displayNameInput.disabled = !settings.peerButtonVisible;
    }

    function maybeShowConnectedToast() {
      if (state.peerState === 'connected' && !state.maybeConnectedToastShown) {
        state.maybeConnectedToastShown = true;
        showToast('接続した');
      }
      if (state.peerState !== 'connected') {
        state.maybeConnectedToastShown = false;
      }
    }

    function getRoomModeText() {
      return state.roomMode === 'firebase' ? 'オンラインで通信' : 'ローカルで通信';
    }

    function updateRoomOverlayLabel() {
      roomTitle.textContent = state.roomMode === 'firebase' ? 'オンラインで通信' : 'ローカルで通信';
      roomText.textContent = state.roomMode === 'firebase'
        ? '同じ文字を入力した人と同じ部屋になります。マッチング中も普通に遊べます。'
        : '同じ文字を入力した人と同じローカル部屋になります。マッチング中も普通に遊べます。';
      roomJoinButton.textContent = state.showQrAfterJoin ? '表示して参加' : '参加する';
      roomQrToggleButton.textContent = state.showQrAfterJoin ? 'QR表示: ON' : 'QR表示: OFF';
    }

    function clearRoomUi() {
      roomCodeInput.value = '';
      closeRoomOverlay();
      closeQrOverlay();
      closePeerMenu();
      updatePeerMenuUi();
    }

    function handleRoomJoin() {
      const code = normalizeRoomCode(roomCodeInput.value) || generateRoomCode();
      roomCodeInput.value = code;
      if (state.roomMode === 'firebase') {
        openFirebaseRoom(code);
        closeRoomOverlay();
      } else {
        openLocalRoom(code);
        closeRoomOverlay();
      }
    }

    function handlePeerDisconnect() {
      disconnectRoom(true);
      showToast('切断した');
    }

    function handlePeerSend() {
      sendCurrentSettings();
    }

    function handlePeerReceive() {
      state.receiveWindowUntil = nowEpoch() + 10000;
      showToast('10秒以内の設定を待ってる');
    }

    function handleRoomResetOnLeave() {
      state.showQrAfterJoin = false;
      updateRoomOverlayLabel();
    }

    function setInitialUiState() {
      syncSettingsUi();
      updateTheme();
      resize();
      updatePeerButtonUi();
      updatePeerMenuUi();
      document.body.style.background = getBgColor();
    }

    openSettings.addEventListener('click', openOverlay);
    closeSettings.addEventListener('click', closeOverlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeOverlay();
    });

    peerButton.addEventListener('click', () => {
      if (state.peerState === 'searching') {
        disconnectRoom(true);
        showToast('キャンセルした');
        return;
      }
      if (state.peerState === 'connected') {
        openPeerMenu('connected');
        return;
      }
      openPeerMenu('off');
    });

    peerMenuOverlay.addEventListener('click', (e) => {
      if (e.target === peerMenuOverlay) closePeerMenu();
    });

    qrOverlay.addEventListener('click', (e) => {
      if (e.target === qrOverlay) closeQrOverlay();
    });

    roomOverlay.addEventListener('click', (e) => {
      if (e.target === roomOverlay) closeRoomOverlay();
    });

    qrCloseButton.addEventListener('click', closeQrOverlay);

    roomJoinButton.addEventListener('click', handleRoomJoin);
    roomCancelButton.addEventListener('click', () => {
      closeRoomOverlay();
    });
    roomQrToggleButton.addEventListener('click', () => {
      state.showQrAfterJoin = !state.showQrAfterJoin;
      updateRoomOverlayLabel();
    });

    bgMode.addEventListener('change', () => {
      settings.bgMode = bgMode.value;
      bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');
      applySettingsSnapshotToUi();
    });

    bgCustomInput.addEventListener('input', () => {
      settings.bgCustom = bgCustomInput.value.trim();
      applySettingsSnapshotToUi();
    });

    tapColorInput.addEventListener('input', () => {
      settings.tapColor = tapColorInput.value.trim();
      saveSettings();
    });

    swipeColorInput.addEventListener('input', () => {
      settings.swipeColor = swipeColorInput.value.trim();
      saveSettings();
    });

    loopColorInput.addEventListener('input', () => {
      settings.loopColor = loopColorInput.value.trim();
      saveSettings();
    });

    gridToggle.addEventListener('change', () => {
      settings.gridEnabled = gridToggle.checked;
      gridDetails.classList.toggle('disabled', !settings.gridEnabled);
      saveSettings();
    });

    gridMode.addEventListener('change', () => {
      settings.gridMode = gridMode.value;
      gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');
      saveSettings();
    });

    gridCustomInput.addEventListener('input', () => {
      settings.gridCustom = gridCustomInput.value.trim();
      saveSettings();
    });

    spacingRange.addEventListener('input', () => {
      settings.gridSpacing = clamp(Number(spacingRange.value) || 36, 18, 100);
      spacingValue.textContent = String(settings.gridSpacing);
      saveSettings();
    });

    peerButtonToggle.addEventListener('change', () => {
      settings.peerButtonVisible = peerButtonToggle.checked;
      if (!settings.peerButtonVisible) {
        disconnectRoom(false);
      }
      updatePeerButtonHidden();
      saveSettings();
    });

    displayNameInput.addEventListener('input', () => {
      settings.displayName = displayNameInput.value.trim().slice(0, 20) || '自分';
      saveSettings();
      if (state.transport !== 'none') {
        sendCurrentPresenceToRoom();
        updatePeerMenuUi();
      }
    });

    resetSettings.addEventListener('click', resetAllSettings);

    roomCodeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleRoomJoin();
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (overlay.classList.contains('open')) return;
      if (peerMenuOverlay.classList.contains('open')) return;
      if (qrOverlay.classList.contains('open')) return;
      if (roomOverlay.classList.contains('open')) return;
      if (activePointerId !== null) return;

      activePointerId = e.pointerId;
      canvas.setPointerCapture(activePointerId);

      const p = getPoint(e);
      pointerDownTime = nowMs();
      pointerDownPos = { x: p.x, y: p.y };
      lastPos = { x: p.x, y: p.y };
      strokePoints = [p];
      pointerHadLoop = false;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
      if (activePointerId !== e.pointerId) return;
      const p = getPoint(e);
      const t = nowMs();

      if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
        strokePoints.push(p);
        lastPos = p;
      }

      if (t - lastLoopAt >= LASSO_COOLDOWN) {
        if (detectLoop(strokePoints, p.x, p.y)) {
          createLoopEffect(strokePoints);
          lastLoopAt = t;
          pointerHadLoop = true;
          strokePoints = [p];
        }
      }

      e.preventDefault();
    }, { passive: false });

    function finishPointer(e) {
      if (activePointerId !== e.pointerId) return;

      const p = getPoint(e);
      const elapsed = nowMs() - pointerDownTime;
      const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

      if (!pointerHadLoop) {
        if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
          addTapEffect(p.x, p.y);
        } else if (totalMove >= SWIPE_MIN_DISTANCE) {
          const dx = p.x - pointerDownPos.x;
          const dy = p.y - pointerDownPos.y;
          createSwipeEffect(p.x, p.y, dx, dy);
        }
      }

      activePointerId = null;
      strokePoints = [];
      pointerHadLoop = false;
      e.preventDefault();
    }

    canvas.addEventListener('pointerup', finishPointer, { passive: false });
    canvas.addEventListener('pointercancel', finishPointer, { passive: false });
    canvas.addEventListener('lostpointercapture', () => {
      activePointerId = null;
      strokePoints = [];
      pointerHadLoop = false;
    });

    function handleWindowResize() {
      resize();
    }

    window.addEventListener('resize', handleWindowResize);

    function openOverlayFromSettings() {
      openOverlay();
    }

    function connectRenderLoop() {
      loadSettings();
      setInitialUiState();
      updatePeerButtonHidden();
      handleRoomResetOnLeave();
      updateRoomOverlayLabel();
      updatePeerMenuUi();
      requestAnimationFrame(render);
    }

    function refreshConnectedUI() {
      setPeerStateBasedOnParticipants();
      updatePeerMenuUi();
      maybeShowConnectedToast();
    }

    function safeDisconnectOnUnload() {
      try {
        disconnectRoom(false);
      } catch (_) {}
    }

    window.addEventListener('beforeunload', safeDisconnectOnUnload);

    const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    if (darkMql) {
      if (typeof darkMql.addEventListener === 'function') {
        darkMql.addEventListener('change', updateTheme);
      } else if (typeof darkMql.addListener === 'function') {
        darkMql.addListener(updateTheme);
      }
    }

    setInterval(() => {
      if (state.transport === 'none') return;
      cleanupParticipants();
      if (state.sendLock && isLockActive(state.sendLock) && state.sendLock.until < nowEpoch()) {
        state.sendLock = { byId: '', byName: '', until: 0, token: '' };
        updatePeerMenuUi();
      }
      refreshConnectedUI();
    }, 1000);

    connectRenderLoop();
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <button class="gear-btn" id="openSettings" aria-label="設定を開く">
    <span>⛭</span>
  </button>

  <button class="peer-btn hidden" id="peerButton" aria-label="ローカル通信">
    <span class="peer-icon">☋</span>
    <span class="peer-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </span>
  </button>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="設定">
      <div class="panel-header">
        <div class="panel-title">設定</div>
        <button class="close-btn" id="closeSettings">戻る</button>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">背景色</div>
            <div class="sub">システム / 白 / 黒 / カスタム</div>
          </div>
          <select class="mode-select" id="bgMode">
            <option value="system">システム</option>
            <option value="white">白</option>
            <option value="black">黒</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
        <div class="sub-input-wrap hidden" id="bgCustomWrap">
          <input class="hex-input" id="bgCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ffffff" />
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-label">
          <div class="main">色</div>
          <div class="sub">タップ / スワイプ / 囲い の色をカラーコードで指定</div>
        </div>

        <div class="effect-grid">
          <div class="effect-item">
            <div class="effect-name">タップの色</div>
            <input class="hex-input" id="tapColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#46ff78" />
          </div>
          <div class="effect-item">
            <div class="effect-name">スワイプの色</div>
            <input class="hex-input" id="swipeColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#6ea5ff" />
          </div>
          <div class="effect-item">
            <div class="effect-name">囲いの色</div>
            <input class="hex-input" id="loopColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ff4e4e" />
          </div>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">グリッドを表示</div>
            <div class="sub">ONで背景に格子を出します</div>
          </div>
          <label class="switch" aria-label="グリッドを表示">
            <input type="checkbox" id="gridToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div id="gridDetails">
          <div class="range-wrap">
            <div class="range-head">
              <div class="range-title">間隔</div>
              <div class="range-value"><span id="spacingValue">36</span>px</div>
            </div>
            <input type="range" id="spacingRange" min="18" max="100" step="1" value="36" />
          </div>

          <div class="control-row">
            <div class="setting-label">
              <div class="main" style="font-size: 13px;">グリッド色</div>
              <div class="sub">システム / 白 / 黒 / カスタム</div>
            </div>
            <select class="mode-select" id="gridMode">
              <option value="system">システム</option>
              <option value="white">白</option>
              <option value="black">黒</option>
              <option value="custom">カスタム</option>
            </select>
          </div>

          <div class="sub-input-wrap hidden" id="gridCustomWrap">
            <input class="hex-input" id="gridCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#e8e8e8" />
          </div>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">ローカル通信ボタンを表示</div>
            <div class="sub">左上に通信ボタンを出します</div>
          </div>
          <label class="switch" aria-label="ローカル通信ボタンを表示">
            <input type="checkbox" id="peerButtonToggle" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="name-input-wrap" id="displayNameWrap">
          <input class="hex-input" id="displayNameInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="表示名" />
        </div>
      </div>

      <div class="setting-block">
        <div class="footer-actions">
          <button class="danger-btn" id="resetSettings">設定をリセット</button>
        </div>
      </div>
    </div>
  </div>

  <div class="peer-menu-overlay" id="peerMenuOverlay" aria-hidden="true">
    <div class="peer-menu-stage" id="peerMenuStage">
      <div class="peer-burst-ring"></div>
      <div class="peer-names-bar" id="peerNamesBar"></div>
      <button class="peer-choice" id="peerChoice1"><span class="peer-choice-label" id="peerChoiceLabel1"></span></button>
      <button class="peer-choice" id="peerChoice2"><span class="peer-choice-label" id="peerChoiceLabel2"></span></button>
      <button class="peer-choice" id="peerChoice3"><span class="peer-choice-label" id="peerChoiceLabel3"></span></button>
    </div>
  </div>

  <div class="qr-overlay" id="qrOverlay" aria-hidden="true">
    <div class="dialog">
      <div class="dialog-title" id="qrTitle">QRコード</div>
      <div class="dialog-text" id="qrText">読み込み中…</div>
      <div class="qr-box"><img id="qrImage" alt="QRコード" /></div>
      <div class="qr-actions">
        <button class="ghost-btn" id="qrCloseButton">閉じる</button>
      </div>
    </div>
  </div>

  <div class="room-overlay" id="roomOverlay" aria-hidden="true">
    <div class="dialog">
      <div class="dialog-title" id="roomTitle">通信</div>
      <div class="dialog-text" id="roomText">同じ文字を入力した人と同じ部屋になります。</div>
      <input class="hex-input" id="roomCodeInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="参加コード" />
      <div class="room-actions" style="margin-top: 12px;">
        <button class="ghost-btn" id="roomJoinButton">参加する</button>
        <button class="ghost-btn" id="roomQrToggleButton">QR表示: OFF</button>
        <button class="ghost-btn" id="roomCancelButton">閉じる</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</body>
</html>
