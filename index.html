<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      --bg: #fff;
      --edge: #111;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: rgba(0, 0, 0, 0.14);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.45);
      --track: rgba(0, 0, 0, 0.12);
      --track-disabled: rgba(0, 0, 0, 0.06);
      --thumb: rgba(0, 0, 0, 0.72);
      --peer-blue: #2f78ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --edge: #fafafa;
        --panel-bg: rgba(0, 0, 0, 0.82);
        --panel-border: rgba(255, 255, 255, 0.16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, 0.45);
        --track: rgba(255, 255, 255, 0.14);
        --track-disabled: rgba(255, 255, 255, 0.07);
        --thumb: rgba(255, 255, 255, 0.78);
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color-scheme: light dark;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
      background: var(--bg);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .gear-btn,
    .peer-btn {
      position: fixed;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.7px solid var(--edge);
      background: transparent;
      color: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      text-shadow: none;
    }

    .gear-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
    }

    .peer-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 10px);
    }

    .gear-btn span,
    .peer-btn .peer-icon {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      transform: translateY(-0.5px);
      color: var(--edge);
      -webkit-text-stroke: 0;
      text-shadow: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
    }

    .gear-btn:active,
    .peer-btn:active {
      transform: scale(0.97);
    }

    .peer-btn.hidden {
      display: none;
    }

    .peer-btn.searching {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
    }

    .peer-btn.connected {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
    }

    .peer-btn.connected .peer-icon {
      color: var(--peer-blue);
    }

    .peer-icon {
      display: block;
      width: 20px;
      text-align: center;
    }

    .peer-spinner {
      display: none;
      position: relative;
      width: 20px;
      height: 20px;
      color: var(--peer-blue);
    }

    .peer-btn.searching .peer-icon {
      display: none;
    }

    .peer-btn.searching .peer-spinner {
      display: block;
      animation: peer-spin 0.9s linear infinite;
    }

    .peer-spinner span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: currentColor;
      transform-origin: 0 0;
    }

    .peer-spinner span:nth-child(1) { transform: translate(0, -8px); opacity: 1; }
    .peer-spinner span:nth-child(2) { transform: translate(5.5px, -5.5px); opacity: 0.82; }
    .peer-spinner span:nth-child(3) { transform: translate(8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(4) { transform: translate(5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(5) { transform: translate(0, 8px); opacity: 0.34; }
    .peer-spinner span:nth-child(6) { transform: translate(-5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(7) { transform: translate(-8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(8) { transform: translate(-5.5px, -5.5px); opacity: 0.82; }

    @keyframes peer-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .overlay,
    .peer-menu-overlay,
    .qr-overlay,
    .room-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
      box-sizing: border-box;
    }

    .overlay.open,
    .peer-menu-overlay.open,
    .qr-overlay.open,
    .room-overlay.open {
      display: flex;
    }

    .panel {
      width: min(92vw, 460px);
      max-height: min(84vh, 680px);
      overflow: auto;
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 18px 18px 16px;
      box-sizing: border-box;
      scrollbar-width: thin;
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -18px -18px 18px;
      padding: 18px 18px 14px;
      background: linear-gradient(to bottom, var(--panel-bg) 80%, rgba(0,0,0,0));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(127, 127, 127, 0.12);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .close-btn,
    .ghost-btn,
    .danger-btn {
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      border-radius: 14px;
      font-weight: 650;
    }

    .close-btn {
      border: 1.5px solid var(--edge);
      background: transparent;
      color: var(--text);
      min-width: 42px;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
    }

    .close-btn:active,
    .ghost-btn:active,
    .danger-btn:active {
      transform: scale(0.98);
    }

    .setting-block {
      padding: 14px 0 4px;
      border-top: 1px solid rgba(127, 127, 127, 0.16);
    }

    .setting-block:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .setting-label .main {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }

    .setting-label .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }

    .switch {
      position: relative;
      width: 56px;
      height: 34px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(127, 127, 127, 0.18);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--thumb);
      transition: 0.2s ease;
    }

    .switch input:checked + .slider {
      background: rgba(55, 180, 90, 0.22);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .mode-select {
      width: 128px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .hex-input {
      width: 100%;
      box-sizing: border-box;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    .hex-input::placeholder {
      color: var(--muted);
    }

    .sub-input-wrap {
      margin-top: 10px;
    }

    .disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .range-wrap {
      margin-top: 12px;
      padding-left: 2px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .range-title {
      font-size: 13px;
      font-weight: 650;
    }

    .range-value {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      height: 28px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-webkit-slider-runnable-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-top: -7.5px;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-moz-range-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    .effect-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .effect-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 0 0;
    }

    .effect-item + .effect-item {
      border-top: 1px solid rgba(127, 127, 127, 0.12);
      padding-top: 12px;
    }

    .effect-name {
      font-size: 13px;
      font-weight: 650;
    }

    .effect-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .danger-btn {
      border: 1.5px solid rgba(220, 40, 40, 0.55);
      background: transparent;
      color: #d23636;
      min-width: 0;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      flex: 1 1 auto;
    }

    .ghost-btn {
      border: 1.5px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
    }

    .ghost-btn.small {
      height: 36px;
      padding: 0 12px;
      font-size: 13px;
      border-radius: 12px;
    }

    .dialog {
      width: min(92vw, 520px);
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 18px;
      box-sizing: border-box;
      max-height: min(86vh, 720px);
      overflow: auto;
    }

    .dialog-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .dialog-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .qr-box {
      width: min(72vw, 320px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 12px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0,0,0,0.08);
      display: grid;
      place-items: center;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .qr-actions,
    .room-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .room-code-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 12px;
      margin-bottom: 8px;
    }

    .room-code-pill {
      border: 1px solid rgba(47, 120, 255, 0.36);
      color: var(--peer-blue);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      line-height: 1;
      background: rgba(47, 120, 255, 0.06);
      white-space: nowrap;
    }

    .scan-input {
      width: 100%;
      box-sizing: border-box;
      min-height: 92px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
      resize: vertical;
      margin-bottom: 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      transform: translateX(-50%) translateY(12px);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: min(90vw, 420px);
      text-align: center;
      box-sizing: border-box;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden {
      display: none !important;
    }

    .peer-menu-stage {
      position: relative;
      width: min(92vw, 460px);
      height: min(84vh, 460px);
      pointer-events: none;
    }

    .peer-burst-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1.8px solid rgba(47, 120, 255, 0.35);
      transform: translate(-50%, -50%) scale(0.25);
      opacity: 0;
      transition: transform 1s ease, opacity 0.5s ease;
      pointer-events: none;
    }

    .peer-menu-overlay.open .peer-burst-ring {
      transform: translate(-50%, -50%) scale(2.45);
      opacity: 1;
    }

    .peer-names-bar {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      width: min(88vw, 420px);
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }

    .peer-menu-overlay.connected .peer-names-bar {
      display: flex;
    }

    .peer-name-chip {
      border: 1px solid rgba(47, 120, 255, 0.32);
      background: rgba(47, 120, 255, 0.08);
      color: var(--peer-blue);
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 999px;
      line-height: 1;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .peer-choice {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 122px;
      height: 122px;
      border: 1.7px solid rgba(47, 120, 255, 0.82);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      transform:
        translate(-50%, -50%)
        translate(var(--from-x), var(--from-y))
        scale(0.12);
      opacity: 0;
      transition:
        transform 1s cubic-bezier(.2,.8,.2,1),
        opacity 0.5s ease;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      color: #2f78ff;
    }

    .peer-menu-overlay.open .peer-choice {
      transform:
        translate(-50%, -50%)
        translate(var(--to-x), var(--to-y))
        scale(1);
      opacity: 1;
    }

    .peer-choice:active {
      transform:
        translate(-50%, -50%)
        translate(var(--to-x), var(--to-y))
        scale(0.97);
    }

    .peer-choice:disabled {
      opacity: 0.42;
      cursor: default;
      filter: grayscale(0.15);
    }

    .peer-choice .peer-choice-label {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      padding: 0 12px;
      color: #2f78ff;
      opacity: 0;
      transition: opacity 0.5s ease;
      transition-delay: 1.0s;
      word-break: keep-all;
      white-space: pre-line;
    }

    .peer-menu-overlay.open .peer-choice .peer-choice-label {
      opacity: 1;
    }

    .peer-choice::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 1px solid rgba(47, 120, 255, 0.2);
      background: rgba(47, 120, 255, 0.03);
      pointer-events: none;
    }

    .peer-choice.wifi { --to-x: 0px; --to-y: -118px; }
    .peer-choice.qr-show { --to-x: -118px; --to-y: 108px; }
    .peer-choice.online { --to-x: 118px; --to-y: 108px; }
    .peer-choice.disconnect { --to-x: 0px; --to-y: -118px; }
    .peer-choice.send { --to-x: -118px; --to-y: 108px; }
    .peer-choice.receive { --to-x: 118px; --to-y: 108px; }

    .name-input-wrap.disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .name-input-wrap {
      margin-top: 10px;
    }

    .room-overlay .dialog {
      max-width: 520px;
    }

    .room-overlay .dialog .ghost-btn {
      flex: 1 1 140px;
    }
  </style>

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function nowMs() {
      return performance.now();
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(ax - bx, ay - by);
    }

    function pointToSegmentDistance(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const abLen2 = abx * abx + aby * aby;
      if (abLen2 === 0) return Math.hypot(px - ax, py - ay);
      let t = (apx * abx + apy * aby) / abLen2;
      t = clamp(t, 0, 1);
      const cx = ax + abx * t;
      const cy = ay + aby * t;
      return Math.hypot(px - cx, py - cy);
    }

    function isValidMode(value) {
      return value === 'system' || value === 'white' || value === 'black' || value === 'custom';
    }

    function normalizeHexColor(raw) {
      if (typeof raw !== 'string') return null;
      let s = raw.trim();
      if (!s) return null;
      if (s[0] === '#') s = s.slice(1);
      if (!/^[0-9a-fA-F]+$/.test(s)) return null;
      if (s.length === 3 || s.length === 4) {
        s = s.split('').map(ch => ch + ch).join('');
      }
      if (s.length !== 6 && s.length !== 8) return null;
      return '#' + s.toLowerCase();
    }

    function hexToRgba(rawHex, alphaOverride = 1) {
      const hex = normalizeHexColor(rawHex);
      if (!hex) return null;
      const s = hex.slice(1);
      const r = parseInt(s.slice(0, 2), 16);
      const g = parseInt(s.slice(2, 4), 16);
      const b = parseInt(s.slice(4, 6), 16);
      const a = s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1;
      return `rgba(${r}, ${g}, ${b}, ${clamp(a * alphaOverride, 0, 1)})`;
    }

    function resolveModeColor(mode, customRaw, lightHex, darkHex) {
      const fallback = darkMode ? darkHex : lightHex;
      if (mode === 'system') return fallback;
      if (mode === 'white') return '#ffffff';
      if (mode === 'black') return '#000000';
      if (mode === 'custom') return normalizeHexColor(customRaw) || fallback;
      return fallback;
    }

        const data = JSON.parse(raw);

        if (typeof data.bgCustom === 'string') settings.bgCustom = data.bgCustom;
        if (typeof data.tapColor === 'string') settings.tapColor = data.tapColor;
        if (typeof data.swipeColor === 'string') settings.swipeColor = data.swipeColor;
        if (typeof data.loopColor === 'string') settings.loopColor = data.loopColor;
        if (typeof data.gridEnabled === 'boolean') settings.gridEnabled = data.gridEnabled;
        if (isValidMode(data.gridMode)) settings.gridMode = data.gridMode;
        if (typeof data.gridCustom === 'string') settings.gridCustom = data.gridCustom;
        if (typeof data.gridSpacing === 'number' && isFinite(data.gridSpacing)) {
          settings.gridSpacing = clamp(Math.round(data.gridSpacing), 18, 100);

        if (typeof data.peerButtonVisible === 'boolean') settings.peerButtonVisible = data.peerButtonVisible;
        if (typeof data.displayName === 'string' && data.displayName.trim()) settings.displayName = data.displayName.trim();

    function generateRoomCode(len = 6) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = '';
      for (let i = 0; i < len; i++) {
        s += chars[Math.floor(Math.random() * chars.length)];

    function pushSeenPacket(id) {
      if (!id || state.seenPackets.has(id)) return false;
      state.seenPackets.add(id);
      state.seenQueue.push(id);
      if (state.seenQueue.length > 500) {
        const old = state.seenQueue.shift();
        if (old) state.seenPackets.delete(old);
      }
      return true;
    }

      const now = nowEpoch();
      return Array.from(state.participants.values())
        .filter(p => p && typeof p.lastSeen === 'number' && now - p.lastSeen <= 7000)
        .sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0));
    }

      state.peerState = count >= 2 ? 'connected' : 'searching';

      state.participants.clear();
      for (const item of list) {

        if (typeof item.lastSeen === 'number' && now - item.lastSeen <= 7000) {
          state.participants.set(item.id, item);

      state.participants.set(selfId, {

        name: currentDisplayName(),

    function localPostMessage(packet) {
      if (!state.localChannel) return;
      try {
        state.localChannel.postMessage(packet);
      } catch (_) {}
      try {
        localStorage.setItem(state.localBusKey, JSON.stringify(packet));
      } catch (_) {}
    }

    function broadcastRoomMessage(packet) {
      if (!state.roomCode) return;
      const payload = {
        ...packet,
        id: packet.id || crypto.randomUUID?.() || Math.random().toString(36).slice(2),
        sender: selfId,
        senderName: currentDisplayName(),
        ts: nowEpoch()
      };
      if (state.transport === 'local') {
        localPostMessage(payload);
      } else if (state.transport === 'firebase') {
        if (payload.type === 'effect') {
          try {
            addDoc(state.firebase.eventsCol, {
              ...payload,
              createdAt: nowEpoch()
            });
          } catch (_) {}
        } else if (payload.type === 'settings') {
          try {
            setDoc(state.firebase.settingsRef, {
              ...payload,
              updatedAt: nowEpoch()
            }, { merge: false });
          } catch (_) {}
        } else if (payload.type === 'lock') {
          try {
            setDoc(state.firebase.roomRef, {
              sendLock: {
                byId: payload.byId,
                byName: payload.byName,
                until: payload.until,
                token: payload.token
              },
              updatedAt: nowEpoch()
            }, { merge: true });
          } catch (_) {}
        } else if (payload.type === 'presence') {
          try {
            setDoc(state.firebase.selfPresenceRef, {
              id: selfId,
              name: currentDisplayName(),
              lastSeen: nowEpoch(),
              mode: state.roomMode,
              sending: isLockActive(state.sendLock) && state.sendLock.byId === selfId
            }, { merge: true });
          } catch (_) {}
        } else if (payload.type === 'leave') {
          try {
            deleteDoc(state.firebase.selfPresenceRef);
          } catch (_) {}
        }
      }
      return payload;
    }

    function addTapEffect(x, y, broadcast = true) {
      effects.push({
        type: 'tap',
        x,
        y,
        start: nowMs(),
        duration: 650
      });
      if (broadcast) {
        sendEffectToRoom('tap', { x, y });
      }
    }

    function createSwipeEffect(startX, startY, dirX, dirY, broadcast = true, forced = null) {
      const len = Math.hypot(dirX, dirY) || 1;
      dirX /= len;
      dirY /= len;

      const pad = 90;
      const minX = -pad;
      const minY = -pad;
      const maxX = w + pad;
      const maxY = h + pad;
      const hits = [];

      function pushCandidate(t, x, y) {
        if (x >= minX - 0.5 && x <= maxX + 0.5 && y >= minY - 0.5 && y <= maxY + 0.5) {
          hits.push({ t, x, y });
        }
      }

      if (forced && forced.forceFrom && forced.forceTo) {
        hits.push(
          { t: 0, x: forced.forceFrom.x, y: forced.forceFrom.y },
          { t: 1, x: forced.forceTo.x, y: forced.forceTo.y }
        );
      } else {
        if (Math.abs(dirX) > 1e-6) {
          let t = (minX - startX) / dirX;
          pushCandidate(t, minX, startY + dirY * t);
          t = (maxX - startX) / dirX;
          pushCandidate(t, maxX, startY + dirY * t);
        }
        if (Math.abs(dirY) > 1e-6) {
          let t = (minY - startY) / dirY;
          pushCandidate(t, startX + dirX * t, minY);
          t = (maxY - startY) / dirY;
          pushCandidate(t, startX + dirX * t, maxY);
        }
        if (hits.length < 2) {
          hits.push(
            { t: -400, x: startX - dirX * 400, y: startY - dirY * 400 },
            { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 }
          );
        } else {
          hits.sort((a, b) => a.t - b.t);
        }
      }

      const first = forced && forced.forceFrom ? forced.forceFrom : hits[0];
      const last = forced && forced.forceTo ? forced.forceTo : hits[hits.length - 1];
      const travel = distance(first.x, first.y, last.x, last.y);
      const duration = clamp(460 + travel * 0.12, 520, 900);

      const radius = typeof (forced && forced.forceRadius) === 'number'
        ? forced.forceRadius
        : clamp(Math.min(w, h) * 0.045, 18, 38);

      effects.push({
        type: 'swipe',
        start: nowMs(),
        duration,
        from: { x: first.x, y: first.y },
        to: { x: last.x, y: last.y },
        dir: { x: dirX, y: dirY },
        radius
      });

      if (broadcast) {
        sendEffectToRoom('swipe', {
          from: { x: first.x, y: first.y },
          to: { x: last.x, y: last.y },
          dir: { x: dirX, y: dirY },
          radius
        });
      }
    }

    function createLoopEffect(points, broadcast = true) {
      if (points.length < 3) return;
      const copy = points.map(p => ({ x: p.x, y: p.y }));
      effects.push({
        type: 'loop',
        start: nowMs(),
        duration: 420,
        points: copy
      });
      if (broadcast) {
        sendEffectToRoom('loop', { points: copy });
      }
    }

    function detectLoop(points, currentX, currentY) {
      if (points.length < LASSO_MIN_POINTS) return false;
      const n = points.length;
      const safeEnd = Math.max(0, n - 1 - LASSO_IGNORE_RECENT_SEGMENTS);
      for (let i = 0; i < safeEnd - 1; i++) {
        const a = points[i];
        const b = points[i + 1];
        const d = pointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
        if (d <= LASSO_HIT_RADIUS) {
          let traveled = 0;
          for (let k = i; k < n - 1; k++) {
            traveled += distance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
            if (traveled > 40) break;
          }
          if (traveled > 40) return true;
        }
      }
      return false;
    }

    function drawGrid() {
      if (!settings.gridEnabled) return;
      const baseColor = getGridBaseColor();
      const lineLow = hexToRgba(baseColor, 0.40) || (darkMode ? 'rgba(34,34,34,0.40)' : 'rgba(232,232,232,0.40)');
      const lineHigh = hexToRgba(baseColor, 0.56) || (darkMode ? 'rgba(58,58,58,0.56)' : 'rgba(210,210,210,0.56)');

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = 1;

      for (let x = 0; x <= w + settings.gridSpacing; x += settings.gridSpacing) {
        const isAccent = Math.round(x / settings.gridSpacing) % 4 === 0;
        ctx.strokeStyle = isAccent ? lineHigh : lineLow;
        ctx.beginPath();
        ctx.moveTo(Math.floor(x) + 0.5, 0);
        ctx.lineTo(Math.floor(x) + 0.5, h);
        ctx.stroke();
      }

      for (let y = 0; y <= h + settings.gridSpacing; y += settings.gridSpacing) {
        const isAccent = Math.round(y / settings.gridSpacing) % 4 === 0;
        ctx.strokeStyle = isAccent ? lineHigh : lineLow;
        ctx.beginPath();
        ctx.moveTo(0, Math.floor(y) + 0.5);
        ctx.lineTo(w, Math.floor(y) + 0.5);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawTap(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;
      const e = easeOutCubic(p);
      const radius = Math.max(10, lerp(10, Math.max(w, h) * 0.22, e));
      const alpha = 0.34 * Math.pow(1 - p, 1.7);
      const baseColor = getTapBaseColor();

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = radius * 0.22;
      ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(70, 255, 120, 0.55)';

      const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
      g.addColorStop(0.00, hexToRgba(baseColor, 0.92) || 'rgba(70, 255, 120, 0.92)');
      g.addColorStop(0.28, hexToRgba(baseColor, 0.60) || 'rgba(60, 235, 110, 0.60)');
      g.addColorStop(0.68, hexToRgba(baseColor, 0.25) || 'rgba(50, 220, 100, 0.25)');
      g.addColorStop(1.00, hexToRgba(baseColor, 0.00) || 'rgba(50, 220, 100, 0)');

      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawSwipe(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;

      const e = easeOutCubic(p);
      const x = lerp(effect.from.x, effect.to.x, e);
      const y = lerp(effect.from.y, effect.to.y, e);
      const trailSteps = 16;
      const trailSpacing = effect.radius * 0.82;
      const baseColor = getSwipeBaseColor();

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';

      for (let i = trailSteps; i >= 0; i--) {
        const back = i * trailSpacing;
        const px = x - effect.dir.x * back;
        const py = y - effect.dir.y * back;
        const a = 0.24 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, 0.35);
        if (a <= 0.001) continue;

        const r = effect.radius * (1 + (trailSteps - i) * 0.02);

        ctx.globalAlpha = a;
        ctx.shadowBlur = r * 0.35;
        ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(90, 150, 255, 0.55)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 0.45 * Math.pow(1 - p, 0.7);
      ctx.shadowBlur = effect.radius * 0.6;
      ctx.shadowColor = hexToRgba(baseColor, 0.45) || 'rgba(110, 165, 255, 0.45)';
      ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
      ctx.beginPath();
      ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawLoop(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;
      if (effect.points.length < 3) return;

      const alpha = 0.36 * Math.pow(1 - p, 2.0);
      const blur = 8 * Math.pow(1 - p, 0.55);
      const baseColor = getLoopBaseColor();

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = blur;
      ctx.shadowColor = hexToRgba(baseColor, 0.40) || 'rgba(255, 60, 60, 0.40)';
      ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(255, 78, 78, 1)';

      ctx.beginPath();
      ctx.moveTo(effect.points[0].x, effect.points[0].y);
      for (let i = 1; i < effect.points.length; i++) {
        ctx.lineTo(effect.points[i].x, effect.points[i].y);
      }
      ctx.closePath();
      ctx.fill('evenodd');

      ctx.restore();
    }

    function render() {
      const t = nowMs();

      ctx.fillStyle = getBgColor();
      ctx.fillRect(0, 0, w, h);
      drawGrid();

      for (let i = 0; i < effects.length; i++) {
        const effect = effects[i];
        if (effect.type === 'tap') drawTap(effect, t);
        else if (effect.type === 'swipe') drawSwipe(effect, t);
        else if (effect.type === 'loop') drawLoop(effect, t);
      }

      for (let i = effects.length - 1; i >= 0; i--) {
        if (t - effects[i].start >= effects[i].duration) effects.splice(i, 1);
      }

      requestAnimationFrame(render);
    }

    function getPoint(e) {
      return { x: e.clientX, y: e.clientY };
    }

    function handleSelfPresenceHeartbeat() {
      if (state.transport === 'local') {
        localPostMessage({
          type: 'presence',
          id: selfId,
          name: currentDisplayName(),
          lastSeen: nowEpoch(),
          self: true
        });
      } else if (state.transport === 'firebase') {
        if (state.firebase.selfPresenceRef) {
          setDoc(state.firebase.selfPresenceRef, {
            id: selfId,
            name: currentDisplayName(),
            lastSeen: nowEpoch(),
            mode: state.roomMode,
            self: true
          }, { merge: true }).catch(() => {});
        }
      }
    }

    function applyIncomingPresence(packet) {
      if (!packet || typeof packet !== 'object' || !packet.id) return;
      if (packet.id === selfId) return;
      if (typeof packet.name !== 'string') return;
      setRoomParticipant(packet.id, {
        id: packet.id,
        name: packet.name.trim() || '名無し',
        lastSeen: typeof packet.lastSeen === 'number' ? packet.lastSeen : nowEpoch(),
        self: false
      });
      updateConnectionStateFromParticipants();
    }

    function applyIncomingLock(lockPacket) {
      if (!lockPacket || typeof lockPacket !== 'object') return;
      if (typeof lockPacket.byId !== 'string' || typeof lockPacket.byName !== 'string') return;
      state.sendLock = {
        byId: lockPacket.byId,
        byName: lockPacket.byName,
        until: typeof lockPacket.until === 'number' ? lockPacket.until : 0,
        token: lockPacket.token || ''
      };
      updatePeerMenuUi();
    }

    function applySettingsSnapshot(snapshot) {
      if (!snapshot || typeof snapshot !== 'object') return;
      if (typeof snapshot.token === 'string' && snapshot.token === state.currentSettingsToken) return;
      if (snapshot.senderId && snapshot.senderId === selfId) return;
      if (Date.now() > state.receiveWindowUntil) return;
      state.currentSettingsToken = typeof snapshot.token === 'string' ? snapshot.token : state.currentSettingsToken;
      state.receiveWindowUntil = 0;
      if (snapshot.payload && typeof snapshot.payload === 'object') {
        const p = snapshot.payload;
        if (isValidMode(p.bgMode)) settings.bgMode = p.bgMode;
        if (typeof p.bgCustom === 'string') settings.bgCustom = p.bgCustom;
        if (typeof p.tapColor === 'string') settings.tapColor = p.tapColor;
        if (typeof p.swipeColor === 'string') settings.swipeColor = p.swipeColor;
        if (typeof p.loopColor === 'string') settings.loopColor = p.loopColor;
        if (typeof p.gridEnabled === 'boolean') settings.gridEnabled = p.gridEnabled;
        if (isValidMode(p.gridMode)) settings.gridMode = p.gridMode;
        if (typeof p.gridCustom === 'string') settings.gridCustom = p.gridCustom;
        if (typeof p.gridSpacing === 'number' && isFinite(p.gridSpacing)) settings.gridSpacing = clamp(Math.round(p.gridSpacing), 18, 100);
        if (typeof p.displayName === 'string') settings.displayName = p.displayName.slice(0, 20) || settings.displayName;
      }
      syncSettingsUi();
      document.body.style.background = getBgColor();
      saveSettings();
      showToast('設定を受信した');
    }

    function applyEffectPacket(packet) {
      if (!packet || typeof packet !== 'object') return;
      if (packet.sender === selfId) return;
      if (!pushSeenPacket(packet.id)) return;
      const kind = packet.kind;
      const payload = packet.payload || {};
      if (kind === 'tap' && typeof payload.x === 'number' && typeof payload.y === 'number') {
        addTapEffect(payload.x, payload.y, false);
      } else if (kind === 'swipe' && payload.from && payload.to && payload.dir) {
        createSwipeEffect(payload.from.x, payload.from.y, payload.dir.x * 100, payload.dir.y * 100, false, {
          forceFrom: payload.from,
          forceTo: payload.to,
          forceRadius: payload.radius
        });
      } else if (kind === 'loop' && Array.isArray(payload.points)) {
        const pts = payload.points.filter(p => p && typeof p.x === 'number' && typeof p.y === 'number');
        if (pts.length >= 3) createLoopEffect(pts, false);
      }
    }

    function updateFromRoomSnapshot() {
      const count = activeParticipants().length;
      state.peerState = count >= 2 ? 'connected' : (state.roomCode ? 'searching' : 'off');
      updatePeerButtonUi();
      updatePeerMenuUi();
    }

    function disconnectLocalRoom(sendLeave = true) {
      if (sendLeave && state.roomCode && state.transport === 'local') {
        localPostMessage({
          type: 'leave',
          id: selfId
        });
      }
      if (state.localHeartbeat) {
        clearInterval(state.localHeartbeat);
        state.localHeartbeat = null;
      }
      if (state.localChannel) {
        try { state.localChannel.close(); } catch (_) {}
        state.localChannel = null;
      }
      window.removeEventListener('storage', onLocalStorage);
      state.localBusKey = '';
      state.transport = 'none';
      state.roomCode = '';
      state.participants.clear();
      state.sendLock = { byId: '', byName: '', until: 0, token: '' };
      state.receiveWindowUntil = 0;
      state.lastSeenByPeer = 0;
      updateFromRoomSnapshot();
    }

    function onLocalStorage(ev) {
      if (ev.key !== state.localBusKey || !ev.newValue) return;
      try {
        handleIncomingMessage(JSON.parse(ev.newValue), 'local');
      } catch (_) {}
    }

    function openLocalRoom(roomCode) {
      disconnectRoom(false);

      state.roomCode = roomCode;
      state.transport = 'local';
      state.localBusKey = getLocalBusKey();
      state.participants.clear();
      state.participants.set(selfId, {
        id: selfId,
        name: currentDisplayName(),
        lastSeen: nowEpoch(),
        self: true
      });
      state.peerState = 'searching';
      updatePeerButtonUi();
      updatePeerMenuUi();

      try {
        state.localChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('touch_effect_local_' + roomCode) : null;
        if (state.localChannel) {
          state.localChannel.onmessage = (ev) => handleIncomingMessage(ev.data, 'local');
        }
      } catch (_) {
        state.localChannel = null;
      }

      window.addEventListener('storage', onLocalStorage);

      state.localHeartbeat = setInterval(() => {
        handleSelfPresenceHeartbeat();
        cleanupParticipants();
        if (state.transport === 'local') {
          localPostMessage({
            type: 'presence',
            id: selfId,
            name: currentDisplayName(),
            lastSeen: nowEpoch(),
            self: true
          });
        }
      }, 2000);

      handleSelfPresenceHeartbeat();
      if (state.roomMode === 'local' && state.showQrAfterJoin) {
        openQrOverlay('QRコードを表示', 'このコードを相手に見せるか、同じ文字を入力してください。', `local:${roomCode}`);
      }
      showToast('ローカル部屋を開いた');
      startRoomSyncTimer();
    }

    function openFirebaseRoom(roomCode) {
      disconnectRoom(false);

      state.roomCode = roomCode;
      state.transport = 'firebase';
      state.participants.clear();
      state.participants.set(selfId, {
        id: selfId,
        name: currentDisplayName(),
        lastSeen: nowEpoch(),
        self: true
      });
      state.peerState = 'searching';
      updatePeerButtonUi();
      updatePeerMenuUi();

      const roomRef = doc(db, firebaseRoomBase, roomCode);
      const settingsRef = doc(db, firebaseRoomBase, roomCode, 'meta', 'settings');
      const participantsCol = collection(db, firebaseRoomBase, roomCode, 'participants');
      const eventsCol = collection(db, firebaseRoomBase, roomCode, 'events');
      const selfPresenceRef = doc(db, firebaseRoomBase, roomCode, 'participants', selfId);

      state.firebase.roomRef = roomRef;
      state.firebase.settingsRef = settingsRef;
      state.firebase.participantsCol = participantsCol;
      state.firebase.eventsCol = eventsCol;
      state.firebase.selfPresenceRef = selfPresenceRef;

      state.firebase.unsubRoom = onSnapshot(roomRef, (snap) => {
        const data = snap.data() || {};
        if (data.sendLock && typeof data.sendLock === 'object') {
          state.sendLock = {
            byId: data.sendLock.byId || '',
            byName: data.sendLock.byName || '',
            until: typeof data.sendLock.until === 'number' ? data.sendLock.until : 0,
            token: data.sendLock.token || ''
          };
        } else {
          state.sendLock = { byId: '', byName: '', until: 0, token: '' };
        }
        updatePeerMenuUi();
        updateFromRoomSnapshot();
      });

      state.firebase.unsubSettings = onSnapshot(settingsRef, (snap) => {
        if (!snap.exists()) return;
        const data = snap.data() || {};
        if (data && typeof data === 'object' && data.token) {
          if (data.senderId === selfId) return;
          if (Date.now() <= state.receiveWindowUntil) {
            applySettingsSnapshot(data);
          }
        }
      });

      state.firebase.unsubParticipants = onSnapshot(participantsCol, (snap) => {
        const list = [];
        snap.forEach((d) => {
          const data = d.data() || {};
          list.push({
            id: d.id,
            name: (data.name || '名無し').toString().slice(0, 20),
            lastSeen: typeof data.lastSeen === 'number' ? data.lastSeen : 0,
            self: d.id === selfId
          });
        });
        updateRoomParticipantsFromSnapshot(list);
      });

      state.firebase.unsubEvents = onSnapshot(query(eventsCol, orderBy('createdAt', 'asc'), limit(200)), (snap) => {
        snap.docChanges().forEach((ch) => {
          if (ch.type !== 'added') return;
          const data = ch.doc.data() || {};
          if (data.sender === selfId) return;
          if (!pushSeenPacket(ch.doc.id)) return;
          applyEffectPacket({
            id: ch.doc.id,
            sender: data.sender,
            kind: data.kind,
            payload: data.payload
          });
        });
      });

      state.firebase.heartbeat = setInterval(() => {
        handleSelfPresenceHeartbeat();
        cleanupParticipants();
      }, 2000);

      handleSelfPresenceHeartbeat();
      showToast('オンライン部屋を開いた');
      startRoomSyncTimer();
    }

    function disconnectFirebaseRoom(sendLeave = true) {
      if (sendLeave && state.firebase.selfPresenceRef) {
        deleteDoc(state.firebase.selfPresenceRef).catch(() => {});
      }
      if (state.firebase.unsubRoom) state.firebase.unsubRoom();
      if (state.firebase.unsubSettings) state.firebase.unsubSettings();
      if (state.firebase.unsubParticipants) state.firebase.unsubParticipants();
      if (state.firebase.unsubEvents) state.firebase.unsubEvents();
      if (state.firebase.heartbeat) {
        clearInterval(state.firebase.heartbeat);
        state.firebase.heartbeat = null;
      }
      state.firebase.roomRef = null;
      state.firebase.settingsRef = null;
      state.firebase.participantsCol = null;
      state.firebase.eventsCol = null;
      state.firebase.selfPresenceRef = null;
      state.firebase.unsubRoom = null;
      state.firebase.unsubSettings = null;
      state.firebase.unsubParticipants = null;
      state.firebase.unsubEvents = null;
      state.transport = 'none';
      state.roomCode = '';
      state.participants.clear();
      state.sendLock = { byId: '', byName: '', until: 0, token: '' };
      state.receiveWindowUntil = 0;
      state.lastSeenByPeer = 0;
      updateFromRoomSnapshot();
    }

    function disconnectRoom(sendLeave = true) {
      stopRoomSyncTimer();
      if (state.transport === 'local') {
        disconnectLocalRoom(sendLeave);
      } else if (state.transport === 'firebase') {
        disconnectFirebaseRoom(sendLeave);
      } else {
        state.roomCode = '';
        state.participants.clear();
        state.sendLock = { byId: '', byName: '', until: 0, token: '' };
        state.receiveWindowUntil = 0;
        updateFromRoomSnapshot();
      }
      closePeerMenu();
      closeRoomOverlay();
      closeQrOverlay();
    }

    function cleanupParticipants() {
      const now = nowEpoch();
      for (const [id, item] of state.participants.entries()) {
        if (id === selfId) continue;
        if (!item || typeof item.lastSeen !== 'number' || now - item.lastSeen > 7000) {
          state.participants.delete(id);
        }
      }
      state.participants.set(selfId, {
        id: selfId,
        name: currentDisplayName(),
        lastSeen: now,
        self: true
      });
      updateFromRoomSnapshot();
      updatePeerMenuUi();
    }

    function startRoomSyncTimer() {
      stopRoomSyncTimer();
      roomSyncTimer = setInterval(() => {
        if (!state.roomCode || state.transport === 'none') return;
        cleanupParticipants();
        if (state.sendLock && isLockActive(state.sendLock) && state.sendLock.byId !== selfId) {
          updatePeerMenuUi();
        }
        if (state.sendLock && state.sendLock.until && nowEpoch() > state.sendLock.until) {
          state.sendLock = { byId: '', byName: '', until: 0, token: '' };
          updatePeerMenuUi();
        }
      }, 1000);
    }

    function stopRoomSyncTimer() {
      if (roomSyncTimer) {
        clearInterval(roomSyncTimer);
        roomSyncTimer = null;
      }
    }

    function handleIncomingMessage(packet, via) {
      if (!packet || typeof packet !== 'object') return;
      if (!packet.id) packet.id = crypto.randomUUID?.() || Math.random().toString(36).slice(2);
      if (packet.sender === selfId) return;
      if (!pushSeenPacket(packet.id)) return;

      if (packet.type === 'presence') {
        applyIncomingPresence(packet);
        updateConnectionStateFromParticipants();
        return;
      }

      if (packet.type === 'leave') {
        removeRoomParticipant(packet.id || packet.sender);
        if (state.transport === via && state.roomCode) {
          updateConnectionStateFromParticipants();
        }
        return;
      }

      if (packet.type === 'lock') {
        applyIncomingLock(packet);
        if (packet.byId && packet.byId !== selfId) {
          updatePeerMenuUi();
        }
        return;
      }

      if (packet.type === 'settings') {
        if (Date.now() <= state.receiveWindowUntil) {
          state.currentSettingsToken = packet.token || '';
          applySettingsSnapshot({
            token: packet.token,
            senderId: packet.sender,
            senderName: packet.senderName,
            payload: packet.payload
          });
        }
        return;
      }

      if (packet.type === 'effect') {
        applyEffectPacket(packet);
        return;
      }
    }

    function sendEffectToRoom(kind, payload) {
      if (!state.roomCode || state.transport === 'none') return;
      const packet = broadcastRoomMessage({
        type: 'effect',
        kind,
        payload
      });
      if (state.transport === 'local') {
        // local echo ignored by self id check, but the view should update immediately from local effect above
      }
      return packet;
    }

    function currentLockIsMine() {
      return isLockActive(state.sendLock) && state.sendLock.byId === selfId;
    }

    function tryAcquireSendLock() {
      const now = nowEpoch();
      if (isLockActive(state.sendLock) && state.sendLock.byId !== selfId) {
        return false;
      }
      state.sendLock = {
        byId: selfId,
        byName: currentDisplayName(),
        until: now + 10000,
        token: crypto.randomUUID?.() || Math.random().toString(36).slice(2)
      };
      updatePeerMenuUi();
      broadcastRoomMessage({
        type: 'lock',
        byId: selfId,
        byName: currentDisplayName(),
        until: state.sendLock.until,
        token: state.sendLock.token
      });
      return true;
    }

    function sendCurrentSettings() {
      if (state.peerState !== 'connected') {
        showToast('まだ接続されてない');
        return;
      }
      if (!tryAcquireSendLock() && !currentLockIsMine()) {
        showToast(`${state.sendLock.byName || '誰か'}が送信中…`);
        return;
      }

      const payload = {
        bgMode: settings.bgMode,
        bgCustom: settings.bgCustom,
        tapColor: settings.tapColor,
        swipeColor: settings.swipeColor,
        loopColor: settings.loopColor,
        gridEnabled: settings.gridEnabled,
        gridMode: settings.gridMode,
        gridCustom: settings.gridCustom,
        gridSpacing: settings.gridSpacing,
        displayName: settings.displayName
      };

      const token = crypto.randomUUID?.() || Math.random().toString(36).slice(2);
      state.currentSettingsToken = token;
      broadcastRoomMessage({
        type: 'settings',
        token,
        payload
      });
      if (state.transport === 'firebase') {
        setDoc(state.firebase.settingsRef, {
          type: 'settings',
          token,
          senderId: selfId,
          senderName: currentDisplayName(),
          payload,
          updatedAt: nowEpoch()
        }, { merge: false }).catch(() => {});
      }
      showToast('設定を送った');
    }

    function joinRoomFromOverlay() {
      const code = normalizeRoomCode(roomCodeInput.value) || generateRoomCode();
      roomCodeInput.value = code;

      if (state.roomMode === 'local') {
        openLocalRoom(code);
      } else {
        openFirebaseRoom(code);
      }

      closeRoomOverlay();
      if (state.showQrAfterJoin) {
        openQrOverlay(
          'QRコードを表示',
          'このコードを相手に見せるか、同じ文字を入力してください。',
          `${state.roomMode}:${code}`
        );
      }
    }

    function openPeerMenuFromButton() {
      if (state.peerState === 'searching') {
        disconnectRoom(true);
        showToast('キャンセルした');
        return;
      }
      if (state.peerState === 'connected') {
        openPeerMenu('connected');
        return;
      }

    canvas.addEventListener('pointerdown', (e) => {
      if (overlay.classList.contains('open')) return;
      if (peerMenuOverlay.classList.contains('open')) return;
      if (qrOverlay.classList.contains('open')) return;
      if (roomOverlay.classList.contains('open')) return;
      if (activePointerId !== null) return;

      activePointerId = e.pointerId;
      canvas.setPointerCapture(activePointerId);

      const p = getPoint(e);
      pointerDownTime = nowMs();
      pointerDownPos = { x: p.x, y: p.y };
      lastPos = { x: p.x, y: p.y };
      strokePoints = [p];
      pointerHadLoop = false;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
      if (activePointerId !== e.pointerId) return;
      const p = getPoint(e);
      const t = nowMs();

      if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
        strokePoints.push(p);
        lastPos = p;
      }

      if (t - lastLoopAt >= LASSO_COOLDOWN) {
        if (detectLoop(strokePoints, p.x, p.y)) {
          createLoopEffect(strokePoints);
          lastLoopAt = t;
          pointerHadLoop = true;
          strokePoints = [p];
        }
      }

      e.preventDefault();
    }, { passive: false });

    function finishPointer(e) {
      if (activePointerId !== e.pointerId) return;

      const p = getPoint(e);
      const elapsed = nowMs() - pointerDownTime;
      const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

      if (!pointerHadLoop) {
        if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
          addTapEffect(p.x, p.y);
        } else if (totalMove >= SWIPE_MIN_DISTANCE) {
          const dx = p.x - pointerDownPos.x;
          const dy = p.y - pointerDownPos.y;
          createSwipeEffect(p.x, p.y, dx, dy);
        }
      }

      activePointerId = null;
      strokePoints = [];
      pointerHadLoop = false;
      e.preventDefault();
    }

    canvas.addEventListener('pointerup', finishPointer, { passive: false });
    canvas.addEventListener('pointercancel', finishPointer, { passive: false });
    canvas.addEventListener('lostpointercapture', () => {
      activePointerId = null;
      strokePoints = [];
      pointerHadLoop = false;
    });

    function handleSelfEffectBroadcast() {

    function sendCurrentPresenceToRoom() {
      if (state.transport === 'none' || !state.roomCode) return;
      if (state.transport === 'local') {
        localPostMessage({
          type: 'presence',
          id: selfId,
          name: currentDisplayName(),
          lastSeen: nowEpoch(),
          self: true
        });
      } else if (state.transport === 'firebase') {
        setDoc(state.firebase.selfPresenceRef, {
          id: selfId,
          name: currentDisplayName(),
          lastSeen: nowEpoch(),
          mode: state.roomMode,
          self: true
        }, { merge: true }).catch(() => {});

      updatePeerMenuUi();
    }

    function joinLocalRoom(roomCode) {
      disconnectRoom(false);
      state.roomCode = roomCode;
      state.transport = 'local';
      state.localBusKey = getLocalBusKey();
      state.participants.clear();
      state.participants.set(selfId, { id: selfId, name: currentDisplayName(), lastSeen: nowEpoch(), self: true });
      state.peerState = 'searching';
      updatePeerButtonUi();
      updatePeerMenuUi();

      try {
        state.localChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('touch_effect_local_' + roomCode) : null;
        if (state.localChannel) {
          state.localChannel.onmessage = (ev) => handleIncomingMessage(ev.data, 'local');
        }
      } catch (_) {
        state.localChannel = null;
      }

      window.addEventListener('storage', onLocalStorage);
      state.localHeartbeat = setInterval(() => {
        sendCurrentPresenceToRoom();
        cleanupParticipants();
      }, 2000);

      sendCurrentPresenceToRoom();
      updateConnectionStateFromParticipants();
      showToast('ローカルで待機中');
      startRoomSyncTimer();
    }

    function joinFirebaseRoom(roomCode) {
      disconnectRoom(false);
      state.roomCode = roomCode;
      state.transport = 'firebase';
      state.participants.clear();
      state.participants.set(selfId, { id: selfId, name: currentDisplayName(), lastSeen: nowEpoch(), self: true });
      state.peerState = 'searching';
      updatePeerButtonUi();
      updatePeerMenuUi();

      const roomRef = doc(db, firebaseRoomBase, roomCode);
      const settingsRef = doc(db, firebaseRoomBase, roomCode, 'meta', 'settings');
      const participantsCol = collection(db, firebaseRoomBase, roomCode, 'participants');
      const eventsCol = collection(db, firebaseRoomBase, roomCode, 'events');
      const selfPresenceRef = doc(db, firebaseRoomBase, roomCode, 'participants', selfId);

      state.firebase.roomRef = roomRef;
      state.firebase.settingsRef = settingsRef;
      state.firebase.participantsCol = participantsCol;
      state.firebase.eventsCol = eventsCol;
      state.firebase.selfPresenceRef = selfPresenceRef;

      state.firebase.unsubRoom = onSnapshot(roomRef, (snap) => {
        const data = snap.data() || {};
        if (data.sendLock && typeof data.sendLock === 'object') {
          state.sendLock = {
            byId: data.sendLock.byId || '',
            byName: data.sendLock.byName || '',
            until: typeof data.sendLock.until === 'number' ? data.sendLock.until : 0,
            token: data.sendLock.token || ''
          };
        } else {
          state.sendLock = { byId: '', byName: '', until: 0, token: '' };
        }
        updatePeerMenuUi();
        updateConnectionStateFromParticipants();
      });

      state.firebase.unsubSettings = onSnapshot(settingsRef, (snap) => {
        if (!snap.exists()) return;
        const data = snap.data() || {};
        if (data.senderId === selfId) return;
        if (Date.now() <= state.receiveWindowUntil) {
          applySettingsSnapshot({
            token: data.token,
            senderId: data.senderId,
            senderName: data.senderName,
            payload: data.payload
          });
        }
      });

      state.firebase.unsubParticipants = onSnapshot(participantsCol, (snap) => {
        const list = [];
        snap.forEach((d) => {
          const data = d.data() || {};
          list.push({
            id: d.id,
            name: (data.name || '名無し').toString().slice(0, 20),
            lastSeen: typeof data.lastSeen === 'number' ? data.lastSeen : 0,
            self: d.id === selfId
          });
        });
        updateRoomParticipantsFromSnapshot(list);
      });

      state.firebase.unsubEvents = onSnapshot(query(eventsCol, orderBy('createdAt', 'asc'), limit(200)), (snap) => {
        snap.docChanges().forEach((ch) => {
          if (ch.type !== 'added') return;
          const data = ch.doc.data() || {};
          if (data.sender === selfId) return;
          if (!pushSeenPacket(ch.doc.id)) return;
          applyEffectPacket({
            id: ch.doc.id,
            sender: data.sender,
            kind: data.kind,
            payload: data.payload
          });
        });
      });

      state.firebase.heartbeat = setInterval(() => {
        sendCurrentPresenceToRoom();
        cleanupParticipants();
      }, 2000);

      sendCurrentPresenceToRoom();
      updateConnectionStateFromParticipants();
      showToast('オンラインで待機中');
      startRoomSyncTimer();
    }

    function disconnectFirebaseRoom(sendLeave = true) {
      if (sendLeave && state.firebase.selfPresenceRef) {
        deleteDoc(state.firebase.selfPresenceRef).catch(() => {});
      }
      if (state.firebase.unsubRoom) state.firebase.unsubRoom();
      if (state.firebase.unsubSettings) state.firebase.unsubSettings();
      if (state.firebase.unsubParticipants) state.firebase.unsubParticipants();
      if (state.firebase.unsubEvents) state.firebase.unsubEvents();
      if (state.firebase.heartbeat) {
        clearInterval(state.firebase.heartbeat);
        state.firebase.heartbeat = null;
      }
      state.firebase.roomRef = null;
      state.firebase.settingsRef = null;
      state.firebase.participantsCol = null;
      state.firebase.eventsCol = null;
      state.firebase.selfPresenceRef = null;
      state.firebase.unsubRoom = null;
      state.firebase.unsubSettings = null;
      state.firebase.unsubParticipants = null;
      state.firebase.unsubEvents = null;
      state.transport = 'none';
      state.roomCode = '';
      state.participants.clear();
      state.sendLock = { byId: '', byName: '', until: 0, token: '' };
      state.receiveWindowUntil = 0;

    }

    function disconnectRoom(sendLeave = true) {
      stopRoomSyncTimer();
      if (state.transport === 'local') {
        if (sendLeave) {
          localPostMessage({ type: 'leave', id: selfId });
        }
        if (state.localHeartbeat) {
          clearInterval(state.localHeartbeat);
          state.localHeartbeat = null;
        }
        if (state.localChannel) {
          try { state.localChannel.close(); } catch (_) {}
          state.localChannel = null;
        }
        window.removeEventListener('storage', onLocalStorage);
        state.localBusKey = '';
        state.transport = 'none';
        state.roomCode = '';
        state.participants.clear();
        state.sendLock = { byId: '', byName: '', until: 0, token: '' };
        state.receiveWindowUntil = 0;
        updateFromRoomSnapshot();
      } else if (state.transport === 'firebase') {
        disconnectFirebaseRoom(sendLeave);
      } else {
        state.roomCode = '';
        state.participants.clear();
        state.sendLock = { byId: '', byName: '', until: 0, token: '' };
        state.receiveWindowUntil = 0;
        updateFromRoomSnapshot();
      }
      closePeerMenu();
      closeRoomOverlay();
      closeQrOverlay();
    }

    function stopRoomSyncTimer() {

        roomSyncTimer = null;
      }
    }

    function startRoomSyncTimer() {
      stopRoomSyncTimer();
      roomSyncTimer = setInterval(() => {
        if (!state.roomCode || state.transport === 'none') return;
        cleanupParticipants();
        if (state.sendLock && isLockActive(state.sendLock) && state.sendLock.until < nowEpoch()) {
          state.sendLock = { byId: '', byName: '', until: 0, token: '' };
          updatePeerMenuUi();
        }
      }, 1000);
    }

    function handleIncomingMessage(packet, via) {
      if (!packet || typeof packet !== 'object') return;
      if (packet.sender === selfId) return;
      if (!pushSeenPacket(packet.id)) return;

      if (packet.type === 'presence') {
        applyIncomingPresence(packet);
        updateConnectionStateFromParticipants();
        return;
      }

      if (packet.type === 'leave') {
        removeRoomParticipant(packet.id || packet.sender);
        updateConnectionStateFromParticipants();
        return;
      }

      if (packet.type === 'lock') {
        applyIncomingLock(packet);
        updatePeerMenuUi();
        return;
      }

      if (packet.type === 'settings') {
        if (Date.now() <= state.receiveWindowUntil) {
          applySettingsSnapshot(packet);
        }
        return;
      }

      if (packet.type === 'effect') {
        applyEffectPacket(packet);
        return;
      }
    }

    function cleanupParticipants() {
      const now = nowEpoch();
      for (const [id, item] of state.participants.entries()) {
        if (id === selfId) continue;
        if (!item || typeof item.lastSeen !== 'number' || now - item.lastSeen > 7000) {
          state.participants.delete(id);
        }
      }
      state.participants.set(selfId, {
        id: selfId,
        name: currentDisplayName(),
        lastSeen: now,
        self: true

      updateConnectionStateFromParticipants();

    async function sendCurrentSettings() {
      if (state.peerState !== 'connected') {
        showToast('まだ接続されてない');
        return;
      }

      const lockOk = tryAcquireSendLock();
      if (!lockOk && !currentLockIsMine()) {
        showToast(`${state.sendLock.byName || '誰か'}が送信中…`);
        return;
      }

      const payload = {
        bgMode: settings.bgMode,
        bgCustom: settings.bgCustom,
        tapColor: settings.tapColor,
        swipeColor: settings.swipeColor,
        loopColor: settings.loopColor,
        gridEnabled: settings.gridEnabled,
        gridMode: settings.gridMode,
        gridCustom: settings.gridCustom,
        gridSpacing: settings.gridSpacing,
        displayName: settings.displayName
      };

      const token = crypto.randomUUID?.() || Math.random().toString(36).slice(2);
      state.currentSettingsToken = token;

      const message = {
        type: 'settings',
        token,
        payload,
        senderId: selfId,
        senderName: currentDisplayName()
      };

      if (state.transport === 'local') {
        localPostMessage({
          ...message,
          id: crypto.randomUUID?.() || Math.random().toString(36).slice(2),
          sender: selfId,
          ts: nowEpoch()
        });
      } else if (state.transport === 'firebase') {
        try {
          await setDoc(state.firebase.settingsRef, {
            ...message,
            updatedAt: nowEpoch()
          });
        } catch (_) {
          showToast('Firebaseに送れなかった');
        }
      }

      showToast('設定を送った');
    }

    function tryAcquireSendLock() {
      const now = nowEpoch();
      if (isLockActive(state.sendLock) && state.sendLock.byId !== selfId) return false;
      state.sendLock = {
        byId: selfId,
        byName: currentDisplayName(),
        until: now + 10000,
        token: crypto.randomUUID?.() || Math.random().toString(36).slice(2)
      };
      updatePeerMenuUi();
      const packet = {
        type: 'lock',
        byId: selfId,
        byName: currentDisplayName(),
        until: state.sendLock.until,
        token: state.sendLock.token
      };
      if (state.transport === 'local') {
        localPostMessage({
          ...packet,
          id: crypto.randomUUID?.() || Math.random().toString(36).slice(2),
          sender: selfId,
          ts: nowEpoch()
        });
      } else if (state.transport === 'firebase') {
        setDoc(state.firebase.roomRef, {
          sendLock: {
            byId: packet.byId,
            byName: packet.byName,
            until: packet.until,
            token: packet.token
          },
          updatedAt: nowEpoch()
        }, { merge: true }).catch(() => {});
      }
      return true;
    }

    function currentLockIsMine() {
      return isLockActive(state.sendLock) && state.sendLock.byId === selfId;
    }

    function disconnectSelfFromRoom(sendLeave = true) {
      if (state.transport === 'none') return;
      if (state.transport === 'local') {
        if (sendLeave) {
          localPostMessage({
            type: 'leave',
            id: selfId,
            sender: selfId,
            ts: nowEpoch()
          });
        }
        disconnectLocalRoom(false);
      } else if (state.transport === 'firebase') {
        disconnectFirebaseRoom(sendLeave);
      }
      state.peerState = 'off';
      updatePeerButtonUi();
      updatePeerMenuUi();
      stopRoomSyncTimer();
    }

    function cleanupAfterDisconnect() {
