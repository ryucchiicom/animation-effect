<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      --bg: #fff;
      --edge: #111;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: rgba(0, 0, 0, 0.14);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.45);
      --track: rgba(0, 0, 0, 0.12);
      --track-disabled: rgba(0, 0, 0, 0.06);
      --thumb: rgba(0, 0, 0, 0.72);
      --peer-blue: #2f78ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --edge: #fafafa;
        --panel-bg: rgba(0, 0, 0, 0.82);
        --panel-border: rgba(255, 255, 255, 0.16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, 0.45);
        --track: rgba(255, 255, 255, 0.14);
        --track-disabled: rgba(255, 255, 255, 0.07);
        --thumb: rgba(255, 255, 255, 0.78);
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color-scheme: light dark;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
      background: var(--bg);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .gear-btn,
    .peer-btn {
      position: fixed;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.7px solid var(--edge);
      background: transparent;
      color: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      text-shadow: none;
      outline: none;
    }

    .gear-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
    }

    .peer-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 10px);
    }

    .gear-btn span,
    .peer-btn .peer-icon {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      transform: translateY(-0.5px);
      color: var(--edge);
      -webkit-text-stroke: 0;
      text-shadow: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
    }

    .gear-btn:active,
    .peer-btn:active {
      transform: scale(0.97);
    }

    .peer-btn.hidden {
      display: none;
    }

    .peer-btn.searching {
      border-color: var(--peer-blue);
    }

    .peer-btn.searching .peer-icon {
      display: none;
    }

    .peer-btn.searching .peer-spinner {
      display: block;
    }

    .peer-btn.connected {
      border-color: var(--peer-blue);
    }

    .peer-btn.connected .peer-icon {
      color: var(--peer-blue);
    }

    .peer-btn.connected .peer-spinner {
      display: none;
    }

    .peer-icon {
      display: block;
      width: 20px;
      text-align: center;
    }

    .peer-spinner {
      display: none;
      position: relative;
      width: 20px;
      height: 20px;
      color: var(--peer-blue);
    }

    .peer-spinner span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: currentColor;
      transform-origin: 0 0;
    }

    .peer-spinner span:nth-child(1) { transform: translate(0, -8px); opacity: 1; }
    .peer-spinner span:nth-child(2) { transform: translate(5.5px, -5.5px); opacity: 0.82; }
    .peer-spinner span:nth-child(3) { transform: translate(8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(4) { transform: translate(5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(5) { transform: translate(0, 8px); opacity: 0.34; }
    .peer-spinner span:nth-child(6) { transform: translate(-5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(7) { transform: translate(-8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(8) { transform: translate(-5.5px, -5.5px); opacity: 0.82; }

    @keyframes peer-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 18px;
      box-sizing: border-box;
    }

    .overlay.open {
      display: flex;
    }

    .panel {
      width: min(92vw, 460px);
      max-height: min(84vh, 680px);
      overflow: auto;
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      box-sizing: border-box;
    }

    .panel-inner {
      padding: 18px 18px 16px;
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 14px;
      margin: 0 -18px 0;
      background: var(--panel-bg);
      border-bottom: 1px solid rgba(127, 127, 127, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .close-btn,
    .small-btn,
    .peer-action-btn,
    .choice-btn {
      appearance: none;
      border: 1.5px solid var(--edge);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      min-width: 42px;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    .close-btn:active,
    .small-btn:active,
    .peer-action-btn:active,
    .choice-btn:active {
      transform: scale(0.98);
    }

    .setting-block {
      padding: 14px 18px 4px;
      border-top: 1px solid rgba(127, 127, 127, 0.16);
    }

    .setting-block:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .setting-label .main {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }

    .setting-label .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }

    .switch {
      position: relative;
      width: 56px;
      height: 34px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(127, 127, 127, 0.18);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--thumb);
      transition: 0.2s ease;
    }

    .switch input:checked + .slider {
      background: rgba(55, 180, 90, 0.22);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .mode-select {
      width: 128px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .hex-input {
      width: 100%;
      box-sizing: border-box;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    .hex-input::placeholder {
      color: var(--muted);
    }

    .sub-input-wrap {
      margin-top: 10px;
    }

    .disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .range-wrap {
      margin-top: 12px;
      padding-left: 2px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .range-title {
      font-size: 13px;
      font-weight: 650;
    }

    .range-value {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      height: 28px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-webkit-slider-runnable-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-top: -7.5px;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-moz-range-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    .effect-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .effect-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 0 0;
    }

    .effect-item + .effect-item {
      border-top: 1px solid rgba(127, 127, 127, 0.12);
      padding-top: 12px;
    }

    .effect-name {
      font-size: 13px;
      font-weight: 650;
    }

    .effect-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .danger-btn {
      appearance: none;
      border: 1.5px solid rgba(220, 40, 40, 0.55);
      background: transparent;
      color: #d23636;
      border-radius: 14px;
      min-width: 0;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex: 1 1 auto;
    }

    .danger-btn:active {
      transform: scale(0.98);
    }

    .hidden {
      display: none !important;
    }

    .peer-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-sizing: border-box;
      padding: 18px;
    }

    .peer-overlay.open {
      display: flex;
    }

    .peer-card {
      width: min(92vw, 460px);
      max-height: min(86vh, 680px);
      overflow: auto;
      border-radius: 28px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      color: var(--text);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      box-sizing: border-box;
    }

    .peer-card-top {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 14px;
      margin: 0;
      background: var(--panel-bg);
      border-bottom: 1px solid rgba(127, 127, 127, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .peer-card-body {
      padding: 18px;
    }

    .peer-stage {
      display: none;
      min-height: 280px;
    }

    .peer-stage.active {
      display: block;
    }

    .peer-chooser {
      position: relative;
      min-height: 360px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .peer-launch {
      position: absolute;
      left: var(--launch-x, 50%);
      top: var(--launch-y, 50%);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.7px solid var(--peer-blue);
      color: var(--peer-blue);
      background: transparent;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      font-size: 20px;
      pointer-events: none;
      opacity: 0;
    }

    .peer-overlay.open .peer-launch {
      animation: launchMove 1.0s ease forwards;
    }

    .peer-launch span {
      display: block;
      transform: translateY(-0.5px);
    }

    .peer-launch-dots {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0;
    }

    .peer-overlay.open .peer-launch-dots {
      animation: dotsFade 1.0s ease forwards;
    }

    .peer-dot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--peer-blue);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.7);
    }

    .peer-overlay.open .peer-dot.one { animation: dot1 1.0s ease forwards; }
    .peer-overlay.open .peer-dot.two { animation: dot2 1.0s ease forwards; }
    .peer-overlay.open .peer-dot.three { animation: dot3 1.0s ease forwards; }

    .peer-choice-list {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }

    .peer-choice-btn {
      position: absolute;
      min-width: 136px;
      height: 44px;
      border-radius: 999px;
      border: 1.5px solid var(--edge);
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
      pointer-events: auto;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.86);
      transition:
        transform 0.55s ease 1.0s,
        opacity 0.55s ease 1.0s;
    }

    .peer-overlay.open .peer-choice-btn {
      opacity: 1;
    }

    .peer-choice-btn.top {
      left: 50%;
      top: 24%;
    }

    .peer-choice-btn.left {
      left: 22%;
      top: 63%;
    }

    .peer-choice-btn.right {
      left: 78%;
      top: 63%;
    }

    .peer-choice-btn::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 999px;
      background: transparent;
    }

    .peer-choice-btn:active {
      transform: translate(-50%, -50%) scale(0.98);
    }

    .peer-choice-caption {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.45s ease 0.5s;
      color: var(--text);
      pointer-events: none;
    }

    .peer-overlay.open .peer-choice-caption {
      opacity: 0;
    }

    .peer-stage.qr,
    .peer-stage.scan,
    .peer-stage.connected-menu {
      padding: 18px;
    }

    .peer-status {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.4;
      margin: 0 0 14px;
    }

    .qr-box {
      width: min(72vw, 280px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(127, 127, 127, 0.06);
      border: 1px solid rgba(127, 127, 127, 0.15);
      overflow: hidden;
    }

    .qr-box canvas,
    .qr-box img {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .scan-video-wrap {
      position: relative;
      width: min(72vw, 280px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(127, 127, 127, 0.15);
      background: #000;
    }

    .scan-video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scan-frame {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      pointer-events: none;
      box-shadow: inset 0 0 0 2px rgba(47, 120, 255, 0.28);
    }

    .peer-action-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .peer-action-btn {
      flex: 1 1 0;
      height: 42px;
      border-radius: 16px;
    }

    .peer-action-btn.primary {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
    }

    .peer-action-btn.danger {
      border-color: rgba(220, 40, 40, 0.55);
      color: #d23636;
    }

    .peer-action-btn:disabled {
      opacity: 0.38;
      pointer-events: none;
    }

    .peer-mini-note {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      text-align: center;
    }

    @keyframes launchMove {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) translate(0, 0);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    @keyframes dotsFade {
      0% { opacity: 0; }
      45% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes dot1 {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      45% { opacity: 1; transform: translate(-50%, -50%) translate(0, 0); }
      100% { opacity: 1; transform: translate(-50%, -50%) translate(-92px, -86px); }
    }

    @keyframes dot2 {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      45% { opacity: 1; transform: translate(-50%, -50%) translate(0, 0); }
      100% { opacity: 1; transform: translate(-50%, -50%) translate(-112px, 72px); }
    }

    @keyframes dot3 {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      45% { opacity: 1; transform: translate(-50%, -50%) translate(0, 0); }
      100% { opacity: 1; transform: translate(-50%, -50%) translate(102px, 72px); }
    }

    .peer-option-fade {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.55s ease 1.45s, transform 0.55s ease 1.45s;
    }

    .peer-overlay.open .peer-option-fade {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
  <canvas id="c"></canvas>

  <button class="gear-btn" id="openSettings" aria-label="設定を開く">
    <span>⛭</span>
  </button>

  <button class="peer-btn hidden" id="peerButton" aria-label="ローカル通信">
    <span class="peer-icon">☋</span>
    <span class="peer-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </span>
  </button>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="設定">
      <div class="panel-header">
        <div class="panel-title">設定</div>
        <button class="close-btn" id="closeSettings">戻る</button>
      </div>

      <div class="panel-inner">
        <div class="setting-block">
          <div class="setting-row">
            <div class="setting-label">
              <div class="main">背景色</div>
              <div class="sub">システム / 白 / 黒 / カスタム</div>
            </div>
            <select class="mode-select" id="bgMode">
              <option value="system">システム</option>
              <option value="white">白</option>
              <option value="black">黒</option>
              <option value="custom">カスタム</option>
            </select>
          </div>
          <div class="sub-input-wrap hidden" id="bgCustomWrap">
            <input class="hex-input" id="bgCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ffffff" />
          </div>
        </div>

        <div class="setting-block">
          <div class="setting-label">
            <div class="main">色</div>
            <div class="sub">タップ / スワイプ / 囲い の色をカラーコードで指定</div>
          </div>

          <div class="effect-grid">
            <div class="effect-item">
              <div class="effect-name">タップの色</div>
              <input class="hex-input" id="tapColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#46ff78" />

  <script>
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: true });

      const overlay = document.getElementById('overlay');
      const openSettings = document.getElementById('openSettings');
      const closeSettings = document.getElementById('closeSettings');

      const peerButton = document.getElementById('peerButton');
      const peerOverlay = document.getElementById('peerOverlay');
      const peerClose = document.getElementById('peerClose');
      const peerLaunch = document.getElementById('peerLaunch');
      const peerTitle = document.getElementById('peerTitle');
      const peerStageMenu = document.getElementById('peerStageMenu');
      const peerStageQr = document.getElementById('peerStageQr');
      const peerStageScan = document.getElementById('peerStageScan');
      const peerStageConnected = document.getElementById('peerStageConnected');
      const peerOptionTop = document.getElementById('peerOptionTop');
      const peerOptionLeft = document.getElementById('peerOptionLeft');
      const peerOptionRight = document.getElementById('peerOptionRight');
      const peerQrCanvas = document.getElementById('peerQrCanvas');
      const peerQrStatus = document.getElementById('peerQrStatus');
      const peerQrNote = document.getElementById('peerQrNote');
      const peerScanVideo = document.getElementById('peerScanVideo');
      const peerScanStatus = document.getElementById('peerScanStatus');
      const peerScanNote = document.getElementById('peerScanNote');
      const peerScanFromQr = document.getElementById('peerScanFromQr');
      const peerCancelFromQr = document.getElementById('peerCancelFromQr');
      const peerBackToQr = document.getElementById('peerBackToQr');
      const peerCancelScan = document.getElementById('peerCancelScan');
      const peerDisconnect = document.getElementById('peerDisconnect');
      const peerSendSettings = document.getElementById('peerSendSettings');
      const peerReceiveSettings = document.getElementById('peerReceiveSettings');
      const peerCloseConnected = document.getElementById('peerCloseConnected');
      const peerConnectedNote = document.getElementById('peerConnectedNote');

      const bgMode = document.getElementById('bgMode');
      const bgCustomWrap = document.getElementById('bgCustomWrap');
      const bgCustomInput = document.getElementById('bgCustomInput');

      const tapColorInput = document.getElementById('tapColorInput');
      const swipeColorInput = document.getElementById('swipeColorInput');
      const loopColorInput = document.getElementById('loopColorInput');

      const gridToggle = document.getElementById('gridToggle');
      const gridDetails = document.getElementById('gridDetails');
      const gridMode = document.getElementById('gridMode');
      const gridCustomWrap = document.getElementById('gridCustomWrap');
      const gridCustomInput = document.getElementById('gridCustomInput');
      const spacingRange = document.getElementById('spacingRange');
      const spacingValue = document.getElementById('spacingValue');

      const peerButtonToggle = document.getElementById('peerButtonToggle');
      const resetSettings = document.getElementById('resetSettings');

      const STORAGE_KEY = 'touch_effect_settings_v5';
      const COMM_CHANNEL_NAME = 'touch_effect_peer_v1';
      const COMM_STORAGE_KEY = 'touch_effect_peer_v1_msg';

      const defaults = {
        bgMode: 'system',
        bgCustom: '#ffffff',
        tapColor: '#46ff78',
        swipeColor: '#6ea5ff',
        loopColor: '#ff4e4e',
        gridEnabled: false,
        gridMode: 'system',
        gridCustom: '#e8e8e8',
        gridSpacing: 36,
        peerButtonVisible: false
      };

      const settings = { ...defaults };

      let w = 0;
      let h = 0;
      let dpr = 1;
      let darkMode = false;
      let activeUi = 'main';

      const effects = [];

      let activePointerId = null;
      let pointerDownTime = 0;
      let pointerDownPos = { x: 0, y: 0 };
      let lastPos = { x: 0, y: 0 };
      let strokePoints = [];
      let pointerHadLoop = false;
      let lastLoopAt = 0;

      const SWIPE_MIN_DISTANCE = 42;
      const TAP_MAX_DISTANCE = 12;
      const TAP_MAX_TIME = 320;
      const LASSO_MIN_POINTS = 20;
      const LASSO_HIT_RADIUS = 18;
      const LASSO_IGNORE_RECENT_SEGMENTS = 10;
      const LASSO_COOLDOWN = 140;

      let selfPeerId = makeId();
      let peerState = 'off';
      let remotePeerId = null;
      let peerChannel = null;
      let peerPulseTimer = null;
      let peerWatchTimer = null;
      let peerLastSeenAt = 0;
      let localIntent = null;
      let localIntentAt = 0;
      let remoteIntent = null;
      let remoteIntentAt = 0;
      let pendingOffer = null;
      let pendingAnswer = null;
      let pendingRole = null;
      let rtcPc = null;
      let rtcDc = null;
      let rtcDataReady = false;
      let pairingStage = 'none';
      let scannerStream = null;
      let scannerBusy = false;
      let scannerTimer = null;
      let scanCanvas = document.createElement('canvas');
      let scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
      let scannerDetector = null;
      let peerMenuMode = 'disconnected';
      let openMenuAnchor = null;
      const seenPackets = new Set();
      const seenPacketQueue = [];

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        const bytes = new Uint8Array(16);
        (window.crypto || window.msCrypto).getRandomValues(bytes);
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      }

      function clamp(v, min, max) {
        return Math.min(max, Math.max(min, v));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function nowMs() {
        return performance.now();
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function distance(ax, ay, bx, by) {
        return Math.hypot(ax - bx, ay - by);
      }

      function pointToSegmentDistance(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const apx = px - ax;
        const apy = py - ay;
        const abLen2 = abx * abx + aby * aby;

        if (abLen2 === 0) return Math.hypot(px - ax, py - ay);

        let t = (apx * abx + apy * aby) / abLen2;
        t = clamp(t, 0, 1);

        const cx = ax + abx * t;
        const cy = ay + aby * t;
        return Math.hypot(px - cx, py - cy);
      }

      function isValidMode(value) {
        return value === 'system' || value === 'white' || value === 'black' || value === 'custom';
      }

      function normalizeHexColor(raw) {
        if (typeof raw !== 'string') return null;
        let s = raw.trim();
        if (!s) return null;
        if (s[0] === '#') s = s.slice(1);
        if (!/^[0-9a-fA-F]+$/.test(s)) return null;
        if (s.length === 3 || s.length === 4) {
          s = s.split('').map(ch => ch + ch).join('');
        }
        if (s.length !== 6 && s.length !== 8) return null;
        return '#' + s.toLowerCase();
      }

      function hexToRgba(rawHex, alphaOverride = 1) {
        const hex = normalizeHexColor(rawHex);
        if (!hex) return null;
        const s = hex.slice(1);
        const r = parseInt(s.slice(0, 2), 16);
        const g = parseInt(s.slice(2, 4), 16);
        const b = parseInt(s.slice(4, 6), 16);
        const a = s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1;
        return `rgba(${r}, ${g}, ${b}, ${clamp(a * alphaOverride, 0, 1)})`;
      }

      function resolveModeColor(mode, customRaw, lightHex, darkHex) {
        const fallback = darkMode ? darkHex : lightHex;
        if (mode === 'system') return fallback;
        if (mode === 'white') return '#ffffff';
        if (mode === 'black') return '#000000';
        if (mode === 'custom') return normalizeHexColor(customRaw) || fallback;
        return fallback;
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (_) {}
      }

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);

          if (isValidMode(data.bgMode)) settings.bgMode = data.bgMode;
          if (typeof data.bgCustom === 'string') settings.bgCustom = data.bgCustom;
          if (typeof data.tapColor === 'string') settings.tapColor = data.tapColor;
          if (typeof data.swipeColor === 'string') settings.swipeColor = data.swipeColor;
          if (typeof data.loopColor === 'string') settings.loopColor = data.loopColor;
          if (typeof data.gridEnabled === 'boolean') settings.gridEnabled = data.gridEnabled;
          if (isValidMode(data.gridMode)) settings.gridMode = data.gridMode;
          if (typeof data.gridCustom === 'string') settings.gridCustom = data.gridCustom;
          if (typeof data.gridSpacing === 'number' && isFinite(data.gridSpacing)) {
            settings.gridSpacing = clamp(Math.round(data.gridSpacing), 18, 100);
          }
          if (typeof data.peerButtonVisible === 'boolean') settings.peerButtonVisible = data.peerButtonVisible;
        } catch (_) {}
      }

      function updateTheme() {
        darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        document.documentElement.style.setProperty('--bg', darkMode ? '#000' : '#fff');
        document.documentElement.style.setProperty('--edge', darkMode ? '#fafafa' : '#111');
        document.documentElement.style.setProperty('--panel-bg', darkMode ? 'rgba(0, 0, 0, 0.82)' : 'rgba(255, 255, 255, 0.84)');
        document.documentElement.style.setProperty('--panel-border', darkMode ? 'rgba(255, 255, 255, 0.16)' : 'rgba(0, 0, 0, 0.14)');
        document.documentElement.style.setProperty('--text', darkMode ? '#f5f5f5' : '#101010');
        document.documentElement.style.setProperty('--muted', darkMode ? 'rgba(245, 245, 245, 0.45)' : 'rgba(16, 16, 16, 0.45)');
        document.documentElement.style.setProperty('--track', darkMode ? 'rgba(255, 255, 255, 0.14)' : 'rgba(0, 0, 0, 0.12)');
        document.documentElement.style.setProperty('--track-disabled', darkMode ? 'rgba(255, 255, 255, 0.07)' : 'rgba(0, 0, 0, 0.06)');
        document.documentElement.style.setProperty('--thumb', darkMode ? 'rgba(255, 255, 255, 0.78)' : 'rgba(0, 0, 0, 0.72)');
        document.body.style.background = getBgColor();
      }

      function resize() {
        dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function syncSettingsUi() {
        bgMode.value = settings.bgMode;
        bgCustomInput.value = settings.bgCustom;
        bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');

        tapColorInput.value = settings.tapColor;
        swipeColorInput.value = settings.swipeColor;
        loopColorInput.value = settings.loopColor;

        gridToggle.checked = settings.gridEnabled;
        gridDetails.classList.toggle('disabled', !settings.gridEnabled);

        gridMode.value = settings.gridMode;
        gridCustomInput.value = settings.gridCustom;
        gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');

        spacingRange.value = String(settings.gridSpacing);
        spacingValue.textContent = String(settings.gridSpacing);

        peerButtonToggle.checked = settings.peerButtonVisible;
        peerButton.classList.toggle('hidden', !settings.peerButtonVisible);
        updatePeerButtonUi();
      }

      function openOverlay() {
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
      }

      function closeOverlay() {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
      }

      function getBgColor() {
        return resolveModeColor(settings.bgMode, settings.bgCustom, '#ffffff', '#000000');
      }

      function getGridBaseColor() {
        return resolveModeColor(settings.gridMode, settings.gridCustom, darkMode ? '#262626' : '#e8e8e8', darkMode ? '#262626' : '#e8e8e8');
      }

      function getTapBaseColor() {
        return normalizeHexColor(settings.tapColor) || defaults.tapColor;
      }

      function getSwipeBaseColor() {
        return normalizeHexColor(settings.swipeColor) || defaults.swipeColor;
      }

      function getLoopBaseColor() {
        return normalizeHexColor(settings.loopColor) || defaults.loopColor;
      }

      function updatePeerButtonUi() {
        peerButton.classList.toggle('hidden', !settings.peerButtonVisible);
        peerButton.classList.toggle('searching', peerState === 'searching');
        peerButton.classList.toggle('connected', peerState === 'connected');
        if (peerState === 'searching') {
          peerButton.setAttribute('aria-label', 'ローカル通信を停止');
        } else if (peerState === 'connected') {
          peerButton.setAttribute('aria-label', '接続メニュー');
        } else {
          peerButton.setAttribute('aria-label', 'ローカル通信');
        }
      }

      function showPeerStage(stage) {
        peerStageMenu.classList.toggle('active', stage === 'menu');
        peerStageQr.classList.toggle('active', stage === 'qr');
        peerStageScan.classList.toggle('active', stage === 'scan');
        peerStageConnected.classList.toggle('active', stage === 'connected');
        activeUi = stage === 'menu' ? 'peer-menu' : stage === 'qr' ? 'peer-qr' : stage === 'scan' ? 'peer-scan' : stage === 'connected' ? 'peer-connected' : 'main';
      }

      function openPeerOverlay(mode) {
        peerMenuMode = mode;
        peerOverlay.classList.add('open');
        peerOverlay.setAttribute('aria-hidden', 'false');
        openMenuAnchor = peerButton.getBoundingClientRect();
        if (openMenuAnchor) {
          const cx = openMenuAnchor.left + openMenuAnchor.width / 2;
          const cy = openMenuAnchor.top + openMenuAnchor.height / 2;
          peerLaunch.style.setProperty('--launch-x', `${cx}px`);
          peerLaunch.style.setProperty('--launch-y', `${cy}px`);
        }
        peerOverlay.classList.remove('peer-opened');
        void peerOverlay.offsetWidth;
        peerOverlay.classList.add('peer-opened');
        if (mode === 'connected') {
          peerTitle.textContent = '接続済み';
          showPeerStage('connected');
          peerConnectedNote.textContent = remotePeerId ? '相手とつながっています' : '接続中です';
        } else {
          peerTitle.textContent = 'ローカル通信';
          showPeerStage('menu');
        }
      }

      function closePeerOverlay() {
        peerOverlay.classList.remove('open');
        peerOverlay.classList.remove('peer-opened');
        peerOverlay.setAttribute('aria-hidden', 'true');
        showPeerStage('menu');
      }

      function resetPeerUiNote() {
        peerQrNote.textContent = '';
        peerScanNote.textContent = '';
        peerConnectedNote.textContent = '';
      }

      function setPeerState(nextState, nextRemoteId = remotePeerId) {
        peerState = nextState;
        remotePeerId = nextRemoteId || null;
        peerLastSeenAt = Date.now();
        updatePeerButtonUi();
      }

      function startPeerTimers() {
        stopPeerTimers();
        peerPulseTimer = window.setInterval(() => {
          if (peerState === 'searching') {
            sendPacket({ type: 'search' });
          } else if (peerState === 'connected') {
            sendPacket({ type: 'keepalive', target: remotePeerId });
          }
        }, 1000);

        peerWatchTimer = window.setInterval(() => {
          if (peerState !== 'connected') return;
          if (!peerLastSeenAt) return;
          if (Date.now() - peerLastSeenAt > 6500) {
            remotePeerId = null;
            setPeerState('searching', null);
            sendPacket({ type: 'search' });
          }
        }, 1000);
      }

      function stopPeerTimers() {
        if (peerPulseTimer) {
          clearInterval(peerPulseTimer);
          peerPulseTimer = null;
        }
        if (peerWatchTimer) {
          clearInterval(peerWatchTimer);
          peerWatchTimer = null;
        }
      }

      function broadcastStoragePacket(packet) {
        try {
          localStorage.setItem(COMM_STORAGE_KEY, JSON.stringify(packet));
        } catch (_) {}
      }

      function sendPacket(packet) {
        const data = {
          ...packet,
          id: makeId(),
          sender: selfPeerId,
          ts: Date.now()
        };

        try {
          if (peerChannel) peerChannel.postMessage(data);
        } catch (_) {}

        broadcastStoragePacket(data);
        return data;
      }

      function rememberPacket(id) {
        if (!id || seenPackets.has(id)) return false;
        seenPackets.add(id);
        seenPacketQueue.push(id);
        if (seenPacketQueue.length > 300) {
          const old = seenPacketQueue.shift();
          if (old) seenPackets.delete(old);
        }
        return true;
      }

      function disconnectPeer(sendGoodbye = true) {
        const oldRemote = remotePeerId;
        if (sendGoodbye && oldRemote) {
          sendPacket({ type: 'goodbye', target: oldRemote });
        }
        remotePeerId = null;
        peerLastSeenAt = 0;
        stopPeerTimers();
        localIntent = null;
        remoteIntent = null;
        localIntentAt = 0;
        remoteIntentAt = 0;
        pendingOffer = null;
        pendingAnswer = null;
        pendingRole = null;
        rtcDataReady = false;
        pairingStage = 'none';
        closeRtc();
        stopScanner();
        peerState = 'off';
        updatePeerButtonUi();
      }

      function connectPeer(remoteId) {
        remotePeerId = remoteId;
        peerLastSeenAt = Date.now();
        peerState = 'connected';
        startPeerTimers();
        updatePeerButtonUi();
      }

      function openSearchState() {
        setPeerState('searching', null);
        startPeerTimers();
        updatePeerButtonUi();
      }

      function applyRemoteSettings(data) {
        if (!data || typeof data !== 'object') return;
        if (data.bgMode && isValidMode(data.bgMode)) settings.bgMode = data.bgMode;
        if (typeof data.bgCustom === 'string') settings.bgCustom = data.bgCustom;
        if (typeof data.tapColor === 'string') settings.tapColor = data.tapColor;
        if (typeof data.swipeColor === 'string') settings.swipeColor = data.swipeColor;
        if (typeof data.loopColor === 'string') settings.loopColor = data.loopColor;
        if (typeof data.gridEnabled === 'boolean') settings.gridEnabled = data.gridEnabled;
        if (data.gridMode && isValidMode(data.gridMode)) settings.gridMode = data.gridMode;
        if (typeof data.gridCustom === 'string') settings.gridCustom = data.gridCustom;
        if (typeof data.gridSpacing === 'number' && isFinite(data.gridSpacing)) {
          settings.gridSpacing = clamp(Math.round(data.gridSpacing), 18, 100);
        }
        if (typeof data.peerButtonVisible === 'boolean') settings.peerButtonVisible = data.peerButtonVisible;
        document.body.style.background = getBgColor();
        syncSettingsUi();
        saveSettings();
      }

      function isSettingsIntentMatch() {
        if (!localIntent || !remoteIntent) return false;
        if (Math.abs(localIntentAt - remoteIntentAt) > 10000) return false;
        if (localIntent === 'send' && remoteIntent === 'receive') return true;
        if (localIntent === 'receive' && remoteIntent === 'send') return true;
        return false;
      }

      function maybeFulfillSettingsIntent() {
        if (!rtcDc || rtcDc.readyState !== 'open') return;
        if (!isSettingsIntentMatch()) return;
        if (localIntent === 'send' && remoteIntent === 'receive') {
          sendDataChannel({ type: 'settings-data', payload: settings });
          peerConnectedNote.textContent = '設定を送信しました';
        }
      }

      function startSettingsIntent(kind) {
        if (peerState !== 'connected') return;
        localIntent = kind;
        localIntentAt = Date.now();
        peerConnectedNote.textContent = kind === 'send' ? '送信待ちです' : '受信待ちです';
        sendDataChannel({ type: 'intent', intent: kind, at: localIntentAt });
        maybeFulfillSettingsIntent();
      }

      function onRemoteIntent(intent, at) {
        remoteIntent = intent;
        remoteIntentAt = at || Date.now();
        maybeFulfillSettingsIntent();
        if (peerState === 'connected') {
          if (localIntent === 'receive' && remoteIntent === 'send' && Math.abs(localIntentAt - remoteIntentAt) <= 10000) {
            peerConnectedNote.textContent = '相手から設定を待っています';
          } else if (localIntent === 'send' && remoteIntent === 'receive' && Math.abs(localIntentAt - remoteIntentAt) <= 10000) {
            peerConnectedNote.textContent = '設定を送信します';
          }
        }
      }

      function sendDataChannel(message) {
        if (!rtcDc || rtcDc.readyState !== 'open') return false;
        try {
          rtcDc.send(JSON.stringify(message));
          return true;
        } catch (_) {
          return false;
        }
      }

      function closeRtc() {
        try {
          if (rtcDc) {
            rtcDc.onopen = null;
            rtcDc.onclose = null;
            rtcDc.onmessage = null;
            rtcDc.close();
          }
        } catch (_) {}
        try {
          if (rtcPc) {
            rtcPc.onicecandidate = null;
            rtcPc.onconnectionstatechange = null;
            rtcPc.ondatachannel = null;
            rtcPc.close();
          }
        } catch (_) {}
        rtcDc = null;
        rtcPc = null;
        rtcDataReady = false;
      }

      function waitIceComplete(pc) {
        if (pc.iceGatheringState === 'complete') return Promise.resolve();
        return new Promise((resolve) => {
          const onState = () => {
            if (pc.iceGatheringState === 'complete') {
              pc.removeEventListener('icegatheringstatechange', onState);
              resolve();
            }
          };
          pc.addEventListener('icegatheringstatechange', onState);
        });
      }

      function createRtcPeer() {
        closeRtc();
        rtcPc = new RTCPeerConnection({ iceServers: [] });
        rtcPc.onicecandidate = () => {};
        rtcPc.onconnectionstatechange = () => {
          if (!rtcPc) return;
          const state = rtcPc.connectionState;
          if (state === 'connected') {
            rtcDataReady = true;
            peerConnectedNote.textContent = '接続しました';
            peerState = 'connected';
            updatePeerButtonUi();
            showPeerStage('connected');
          } else if (state === 'failed' || state === 'disconnected' || state === 'closed') {
            if (peerState !== 'off') {
              peerConnectedNote.textContent = '接続が切れました';
            }
          }
        };
        rtcPc.ondatachannel = (ev) => {
          attachDataChannel(ev.channel);
        };
      }

      function attachDataChannel(dc) {
        rtcDc = dc;
        rtcDc.onopen = () => {
          rtcDataReady = true;
          if (peerState !== 'connected') {
            peerState = 'connected';
            updatePeerButtonUi();
          }
          peerConnectedNote.textContent = '接続しました';
          showPeerStage('connected');
          startPeerTimers();
        };
        rtcDc.onclose = () => {
          rtcDataReady = false;
        };
        rtcDc.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            handleDataChannelMessage(msg);
          } catch (_) {}
        };
      }

      function handleDataChannelMessage(msg) {
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'intent') {
          onRemoteIntent(msg.intent, msg.at);
          return;
        }
        if (msg.type === 'settings-data') {
          applyRemoteSettings(msg.payload);
          peerConnectedNote.textContent = '設定を受信しました';
          return;
        }
        if (msg.type === 'hello') {
          if (msg.sender) connectPeer(msg.sender);
          return;
        }
        if (msg.type === 'keepalive') {
          peerLastSeenAt = Date.now();
          return;
        }
      }

      async function makeOfferPayload() {
        createRtcPeer();
        rtcDc = rtcPc.createDataChannel('touch');
        attachDataChannel(rtcDc);

        const offer = await rtcPc.createOffer();
        await rtcPc.setLocalDescription(offer);
        await waitIceComplete(rtcPc);

        pendingRole = 'offer';
        pendingOffer = rtcPc.localDescription ? rtcPc.localDescription.sdp : offer.sdp;
        pairingStage = 'offer-ready';

        return {
          v: 1,
          type: 'offer',
          sdp: pendingOffer
        };
      }

      async function makeAnswerPayload(offerSdp) {
        createRtcPeer();
        pendingRole = 'answer';
        await rtcPc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
        const answer = await rtcPc.createAnswer();
        await rtcPc.setLocalDescription(answer);
        await waitIceComplete(rtcPc);
        pendingAnswer = rtcPc.localDescription ? rtcPc.localDescription.sdp : answer.sdp;
        pairingStage = 'answer-ready';
        return {
          v: 1,
          type: 'answer',
          sdp: pendingAnswer
        };
      }

      async function completeWithAnswer(answerSdp) {
        if (!rtcPc) return;
        await rtcPc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
        peerState = 'connected';
        updatePeerButtonUi();
        startPeerTimers();
        showPeerStage('connected');
        peerConnectedNote.textContent = '接続しました';
      }

      async function generatePeerQr(payload) {
        if (!window.QRCode || !QRCode.toCanvas) {
          peerQrStatus.textContent = 'QRライブラリを読み込めませんでした';
          return;
        }
        peerQrCanvas.width = 256;
        peerQrCanvas.height = 256;
        try {
          await QRCode.toCanvas(peerQrCanvas, JSON.stringify(payload), {
            errorCorrectionLevel: 'M',
            margin: 1,
            width: 256,
            color: {
              dark: '#000000',
              light: '#ffffff'
            }
          });
        } catch (err) {
          peerQrStatus.textContent = 'QRコードの生成に失敗しました';
        }
      }

      function stopScanner() {
        scannerBusy = false;
        if (scannerTimer) {
          clearInterval(scannerTimer);
          scannerTimer = null;
        }
        try {
          if (peerScanVideo.srcObject) {
            const tracks = peerScanVideo.srcObject.getTracks();
            tracks.forEach(track => track.stop());
          }
        } catch (_) {}
        peerScanVideo.srcObject = null;
        scannerStream = null;
      }

      async function startScanner() {
        stopScanner();
        try {
          scannerStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' }
            },
            audio: false
          });
          peerScanVideo.srcObject = scannerStream;
          await peerScanVideo.play();
          scannerBusy = true;
          startScanLoop();
        } catch (err) {
          peerScanNote.textContent = 'カメラを使えませんでした';
        }
      }

      async function scanFrame() {
        if (!scannerBusy || !peerScanVideo.videoWidth || !peerScanVideo.videoHeight) return null;
        const vw = peerScanVideo.videoWidth;
        const vh = peerScanVideo.videoHeight;
        scanCanvas.width = vw;
        scanCanvas.height = vh;
        scanCtx.drawImage(peerScanVideo, 0, 0, vw, vh);
        const imageData = scanCtx.getImageData(0, 0, vw, vh);

        if (window.BarcodeDetector) {
          if (!scannerDetector) {
            try {
              scannerDetector = new BarcodeDetector({ formats: ['qr_code'] });
            } catch (_) {
              scannerDetector = null;
            }
          }
          if (scannerDetector) {
            try {
              const barcodes = await scannerDetector.detect(peerScanVideo);
              if (barcodes && barcodes.length) {
                return barcodes[0].rawValue || null;
              }
            } catch (_) {}
          }
        }

        if (window.jsQR) {
          try {
            const result = jsQR(imageData.data, vw, vh, { inversionAttempts: 'dontInvert' });
            if (result && result.data) return result.data;
          } catch (_) {}
        }

        return null;
      }

      function startScanLoop() {
        if (scannerTimer) clearInterval(scannerTimer);
        scannerTimer = setInterval(async () => {
          if (!scannerBusy) return;
          const raw = await scanFrame();
          if (!raw) return;
          try {
            const payload = JSON.parse(raw);
            await handleScannedPayload(payload);
          } catch (_) {}
        }, 180);
      }

      async function handleScannedPayload(payload) {
        if (!payload || typeof payload !== 'object') return;
        if (payload.type === 'offer' && typeof payload.sdp === 'string') {
          peerScanNote.textContent = '受信しました。応答を作成中';
          stopScanner();
          await makeAnswerPayload(payload.sdp);
          await generatePeerQr({ v: 1, type: 'answer', sdp: pendingAnswer });
          peerQrStatus.textContent = '応答QRコード';
          peerQrNote.textContent = '今度は相手にこのQRを読み取ってもらってください';
          showPeerStage('qr');
          peerState = 'searching';
          updatePeerButtonUi();
          openSearchState();
          return;
        }
        if (payload.type === 'answer' && typeof payload.sdp === 'string') {
          peerScanNote.textContent = '接続を確定中';
          stopScanner();
          await completeWithAnswer(payload.sdp);
          return;
        }
      }

      function cancelPeerFlow() {
        stopScanner();
        closeRtc();
        peerState = 'off';
        pairingStage = 'none';
        pendingOffer = null;
        pendingAnswer = null;
        pendingRole = null;
        localIntent = null;
        remoteIntent = null;
        localIntentAt = 0;
        remoteIntentAt = 0;
        stopPeerTimers();
        updatePeerButtonUi();
        closePeerOverlay();
      }

      async function startOfferFlow(label) {
        resetPeerUiNote();
        peerTitle.textContent = label === 'wifi' ? 'Wi-Fiで通信' : 'QRコードを表示';
        openPeerOverlay('host');
        showPeerStage('qr');
        peerQrStatus.textContent = '接続用QRコードを作成中';
        peerQrNote.textContent = '相手に読み取ってもらってください';
        setPeerState('searching', null);
        updatePeerButtonUi();
        openSearchState();

        const payload = await makeOfferPayload();
        await generatePeerQr(payload);
        peerQrStatus.textContent = '接続用QRコード';
      }

      async function startScanFlow() {
        resetPeerUiNote();
        peerTitle.textContent = 'QRコードを読み取り';
        openPeerOverlay('scan');
        showPeerStage('scan');
        peerScanStatus.textContent = 'QRコードを読み取り中';
        peerScanNote.textContent = 'カメラを起動します';
        setPeerState('searching', null);
        updatePeerButtonUi();
        openSearchState();
        await startScanner();
      }

      function openConnectedMenu() {
        resetPeerUiNote();
        peerTitle.textContent = '接続済み';
        openPeerOverlay('connected');
        showPeerStage('connected');
        peerConnectedNote.textContent = remotePeerId ? '相手とつながっています' : '接続中です';
      }

      function maybeOpenPeerMenu() {
        if (peerState === 'searching') {
          cancelPeerFlow();
          return;
        }
        if (peerState === 'connected') {
          openConnectedMenu();
          return;
        }
        if (peerOverlay.classList.contains('open')) {
          cancelPeerFlow();
          return;
        }
        openPeerOverlay('menu');
        showPeerStage('menu');
      }

      function getSettingsSnapshot() {
        return JSON.parse(JSON.stringify(settings));
      }

      function handlePeerUiButton() {
        if (peerState === 'searching' && peerOverlay.classList.contains('open')) {
          cancelPeerFlow();
          return;
        }
        if (peerState === 'connected' && peerOverlay.classList.contains('open')) {
          cancelPeerFlow();
          return;
        }
        maybeOpenPeerMenu();
      }

      function drawGrid() {
        if (!settings.gridEnabled) return;
        const baseColor = getGridBaseColor();
        const lineLow = hexToRgba(baseColor, 0.40) || (darkMode ? 'rgba(34,34,34,0.40)' : 'rgba(232,232,232,0.40)');
        const lineHigh = hexToRgba(baseColor, 0.56) || (darkMode ? 'rgba(58,58,58,0.56)' : 'rgba(210,210,210,0.56)');

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 1;

        for (let x = 0; x <= w + settings.gridSpacing; x += settings.gridSpacing) {
          const isAccent = Math.round(x / settings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(Math.floor(x) + 0.5, 0);
          ctx.lineTo(Math.floor(x) + 0.5, h);
          ctx.stroke();
        }

        for (let y = 0; y <= h + settings.gridSpacing; y += settings.gridSpacing) {
          const isAccent = Math.round(y / settings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(0, Math.floor(y) + 0.5);
          ctx.lineTo(w, Math.floor(y) + 0.5);
          ctx.stroke();
        }

        ctx.restore();
      }

      function addTapEffect(x, y, broadcast = true) {
        effects.push({
          type: 'tap',
          x,
          y,
          start: nowMs(),
          duration: 650
        });

        if (broadcast && peerState === 'connected' && remotePeerId && rtcDc && rtcDc.readyState === 'open') {
          sendDataChannel({ type: 'effect', kind: 'tap', target: remotePeerId, payload: { x, y } });
        }
      }

      function createSwipeEffect(startX, startY, dirX, dirY, broadcast = true, forced = null) {
        const len = Math.hypot(dirX, dirY) || 1;
        dirX /= len;
        dirY /= len;

        const pad = 90;
        const minX = -pad;
        const minY = -pad;
        const maxX = w + pad;
        const maxY = h + pad;

        const hits = [];

        function pushCandidate(t, x, y) {
          if (x >= minX - 0.5 && x <= maxX + 0.5 && y >= minY - 0.5 && y <= maxY + 0.5) {
            hits.push({ t, x, y });
          }
        }

        if (forced && forced.forceFrom && forced.forceTo) {
          hits.push(
            { t: 0, x: forced.forceFrom.x, y: forced.forceFrom.y },
            { t: 1, x: forced.forceTo.x, y: forced.forceTo.y }
          );
        } else {
          if (Math.abs(dirX) > 1e-6) {
            let t = (minX - startX) / dirX;
            pushCandidate(t, minX, startY + dirY * t);
            t = (maxX - startX) / dirX;
            pushCandidate(t, maxX, startY + dirY * t);
          }
          if (Math.abs(dirY) > 1e-6) {
            let t = (minY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, minY);
            t = (maxY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, maxY);
          }

          if (hits.length < 2) {
            hits.push(
              { t: -400, x: startX - dirX * 400, y: startY - dirY * 400 },
              { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 }
            );
          } else {
            hits.sort((a, b) => a.t - b.t);
          }
        }

        const first = forced && forced.forceFrom ? forced.forceFrom : hits[0];
        const last = forced && forced.forceTo ? forced.forceTo : hits[hits.length - 1];
        const travel = distance(first.x, first.y, last.x, last.y);
        const duration = clamp(460 + travel * 0.12, 520, 900);

        const radius = typeof (forced && forced.forceRadius) === 'number'
          ? forced.forceRadius
          : clamp(Math.min(w, h) * 0.045, 18, 38);

        effects.push({
          type: 'swipe',
          start: nowMs(),
          duration,
          from: { x: first.x, y: first.y },
          to: { x: last.x, y: last.y },
          dir: { x: dirX, y: dirY },
          radius
        });

        if (broadcast && peerState === 'connected' && remotePeerId && rtcDc && rtcDc.readyState === 'open') {
          sendDataChannel({
            type: 'effect',
            kind: 'swipe',
            target: remotePeerId,
            payload: {
              from: { x: first.x, y: first.y },
              to: { x: last.x, y: last.y },
              dir: { x: dirX, y: dirY },
              radius
            }
          });
        }
      }

      function createLoopEffect(points, broadcast = true) {
        if (points.length < 3) return;
        const copy = points.map(p => ({ x: p.x, y: p.y }));
        effects.push({
          type: 'loop',
          start: nowMs(),
          duration: 420,
          points: copy
        });

        if (broadcast && peerState === 'connected' && remotePeerId && rtcDc && rtcDc.readyState === 'open') {
          sendDataChannel({
            type: 'effect',
            kind: 'loop',
            target: remotePeerId,
            payload: { points: copy }
          });
        }
      }

      function detectLoop(points, currentX, currentY) {
        if (points.length < LASSO_MIN_POINTS) return false;

        const n = points.length;
        const safeEnd = Math.max(0, n - 1 - LASSO_IGNORE_RECENT_SEGMENTS);

        for (let i = 0; i < safeEnd - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const d = pointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
          if (d <= LASSO_HIT_RADIUS) {
            let traveled = 0;
            for (let k = i; k < n - 1; k++) {
              traveled += distance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
              if (traveled > 40) break;
            }
            if (traveled > 40) return true;
          }
        }

        return false;
      }

      function drawTap(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;
        const e = easeOutCubic(p);
        const radius = lerp(10, Math.max(w, h) * 0.22, e);
        const alpha = 0.34 * Math.pow(1 - p, 1.7);
        const baseColor = getTapBaseColor();

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = radius * 0.22;
        ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(70, 255, 120, 0.55)';

        const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
        g.addColorStop(0.00, hexToRgba(baseColor, 0.92) || 'rgba(70, 255, 120, 0.92)');
        g.addColorStop(0.28, hexToRgba(baseColor, 0.60) || 'rgba(60, 235, 110, 0.60)');
        g.addColorStop(0.68, hexToRgba(baseColor, 0.25) || 'rgba(50, 220, 100, 0.25)');
        g.addColorStop(1.00, hexToRgba(baseColor, 0.00) || 'rgba(50, 220, 100, 0)');

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawSwipe(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;
        const e = easeOutCubic(p);
        const x = lerp(effect.from.x, effect.to.x, e);
        const y = lerp(effect.from.y, effect.to.y, e);
        const trailSteps = 16;
        const trailSpacing = effect.radius * 0.82;
        const baseColor = getSwipeBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';

        for (let i = trailSteps; i >= 0; i--) {
          const back = i * trailSpacing;
          const px = x - effect.dir.x * back;
          const py = y - effect.dir.y * back;
          const a = 0.24 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, 0.35);
          if (a <= 0.001) continue;

          const r = effect.radius * (1 + (trailSteps - i) * 0.02);
          ctx.globalAlpha = a;
          ctx.shadowBlur = r * 0.35;
          ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(90, 150, 255, 0.55)';
          ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 0.45 * Math.pow(1 - p, 0.7);
        ctx.shadowBlur = effect.radius * 0.6;
        ctx.shadowColor = hexToRgba(baseColor, 0.45) || 'rgba(110, 165, 255, 0.45)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
        ctx.beginPath();
        ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawLoop(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;
        if (effect.points.length < 3) return;
        const alpha = 0.36 * Math.pow(1 - p, 2.0);
        const blur = 8 * Math.pow(1 - p, 0.55);
        const baseColor = getLoopBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = blur;
        ctx.shadowColor = hexToRgba(baseColor, 0.40) || 'rgba(255, 60, 60, 0.40)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(255, 78, 78, 1)';

        ctx.beginPath();
        ctx.moveTo(effect.points[0].x, effect.points[0].y);
        for (let i = 1; i < effect.points.length; i++) {
          ctx.lineTo(effect.points[i].x, effect.points[i].y);
        }
        ctx.closePath();
        ctx.fill('evenodd');
        ctx.restore();
      }

      function render() {
        const t = nowMs();
        ctx.fillStyle = getBgColor();
        ctx.fillRect(0, 0, w, h);
        drawGrid();

        for (let i = 0; i < effects.length; i++) {
          const effect = effects[i];
          if (effect.type === 'tap') drawTap(effect, t);
          else if (effect.type === 'swipe') drawSwipe(effect, t);
          else if (effect.type === 'loop') drawLoop(effect, t);
        }

        for (let i = effects.length - 1; i >= 0; i--) {
          if (t - effects[i].start >= effects[i].duration) effects.splice(i, 1);
        }

        requestAnimationFrame(render);
      }

      function getPoint(e) {
        return { x: e.clientX, y: e.clientY };
      }

      function applyAndSave() {
        document.body.style.background = getBgColor();
        syncSettingsUi();
        updatePeerButtonUi();
        saveSettings();
      }

      function resetAllSettings() {
        const ok = window.confirm('設定を初期状態に戻します。よろしいですか？');
        if (!ok) return;
        Object.assign(settings, defaults);
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (_) {}
        disconnectPeer(false);
        applyAndSave();
      }

      bgMode.addEventListener('change', () => {
        settings.bgMode = bgMode.value;
        bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');
        applyAndSave();
      });

      bgCustomInput.addEventListener('input', () => {
        settings.bgCustom = bgCustomInput.value.trim();
        applyAndSave();
      });

      tapColorInput.addEventListener('input', () => {
        settings.tapColor = tapColorInput.value.trim();
        saveSettings();
      });

      swipeColorInput.addEventListener('input', () => {
        settings.swipeColor = swipeColorInput.value.trim();
        saveSettings();
      });

      loopColorInput.addEventListener('input', () => {
        settings.loopColor = loopColorInput.value.trim();
        saveSettings();
      });

      gridToggle.addEventListener('change', () => {
        settings.gridEnabled = gridToggle.checked;
        gridDetails.classList.toggle('disabled', !settings.gridEnabled);
        saveSettings();

      gridMode.addEventListener('change', () => {

      function applyRemoteEffect(kind, payload) {
        if (!payload || typeof payload !== 'object') return;
        if (kind === 'tap') {
          if (typeof payload.x === 'number' && typeof payload.y === 'number') addTapEffect(payload.x, payload.y, false);
          return;
        }
        if (kind === 'swipe') {
          const from = payload.from;
          const to = payload.to;
          const dir = payload.dir;
          if (from && to && dir && typeof from.x === 'number' && typeof from.y === 'number' && typeof to.x === 'number' && typeof to.y === 'number' && typeof dir.x === 'number' && typeof dir.y === 'number') {
            createSwipeEffect(from.x, from.y, dir.x * 100, dir.y * 100, false, {
              forceFrom: from,
              forceTo: to,
              forceRadius: typeof payload.radius === 'number' ? payload.radius : undefined
            });
          }
          return;
        }
        if (kind === 'loop') {
          if (Array.isArray(payload.points)) {
            const points = payload.points
              .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number')
              .map(p => ({ x: p.x, y: p.y }));
            if (points.length >= 3) createLoopEffect(points, false);
          }
        }
      }

      function handleDataChannelMessage(msg) {
        if (!msg || typeof msg !== 'object') return;
        if (msg.type === 'intent') {
          remoteIntent = msg.intent;
          remoteIntentAt = msg.at || Date.now();
          maybeFulfillSettingsIntent();
          return;
        }
        if (msg.type === 'settings-data') {
          applyRemoteSettings(msg.payload);
          peerConnectedNote.textContent = '設定を受信しました';
          return;
        }
        if (msg.type === 'effect') {
          if (peerState === 'off') return;
          if (msg.target && msg.target !== selfPeerId) return;
          if (remotePeerId && msg.sender !== remotePeerId) return;
          if (!remotePeerId) remotePeerId = msg.sender;
          peerLastSeenAt = Date.now();
          applyRemoteEffect(msg.kind, msg.payload);
          return;
        }
        if (msg.type === 'hello') {
          if (msg.sender) connectPeer(msg.sender);
          return;
        }
        if (msg.type === 'keepalive') {
          if (msg.target && msg.target !== selfPeerId) return;
          peerLastSeenAt = Date.now();
          return;
        }
        if (msg.type === 'search') {
          if (!settings.peerButtonVisible || peerState === 'off') return;
          peerLastSeenAt = Date.now();
          if (peerState === 'searching' && !remotePeerId) {
            connectPeer(msg.sender);
            sendPacket({ type: 'found', target: msg.sender });
          }
          return;
        }
        if (msg.type === 'found') {
          if (peerState === 'searching' && msg.target === selfPeerId) {
            connectPeer(msg.sender);
          }
          return;
        }
        if (msg.type === 'goodbye') {
          if (remotePeerId && msg.sender === remotePeerId) {
            disconnectPeer(false);
          }
        }
      }

      function maybeFulfillSettingsIntent() {
        if (!rtcDc || rtcDc.readyState !== 'open') return;
        if (!localIntent || !remoteIntent) return;
        if (Math.abs(localIntentAt - remoteIntentAt) > 10000) return;
        if (localIntent === 'send' && remoteIntent === 'receive') {
          sendDataChannel({ type: 'settings-data', payload: getSettingsSnapshot() });
          peerConnectedNote.textContent = '設定を送信しました';
        }
      }

      function startSettingsIntent(kind) {
        if (peerState !== 'connected') return;
        localIntent = kind;
        localIntentAt = Date.now();
        peerConnectedNote.textContent = kind === 'send' ? '送信待ちです' : '受信待ちです';
        sendDataChannel({ type: 'intent', intent: kind, at: localIntentAt });
        maybeFulfillSettingsIntent();
      }

      function sendDataChannel(message) {
        if (!rtcDc || rtcDc.readyState !== 'open') return false;
        try {
          rtcDc.send(JSON.stringify(message));
          return true;
        } catch (_) {
          return false;
        }
      }

      function createRtcPeer() {
        closeRtc();
        rtcPc = new RTCPeerConnection({ iceServers: [] });
        rtcPc.ondatachannel = (ev) => attachDataChannel(ev.channel);
        rtcPc.onconnectionstatechange = () => {
          if (!rtcPc) return;
          const state = rtcPc.connectionState;
          if (state === 'connected') {
            rtcDataReady = true;
            peerState = 'connected';
            updatePeerButtonUi();
            showPeerStage('connected');
            peerConnectedNote.textContent = '接続しました';
            startPeerTimers();
          } else if (state === 'failed' || state === 'disconnected' || state === 'closed') {
            if (peerState !== 'off') peerConnectedNote.textContent = '接続が切れました';
          }
        };
      }

      function attachDataChannel(dc) {
        rtcDc = dc;
        rtcDc.onopen = () => {
          rtcDataReady = true;
          if (peerState !== 'connected') {
            peerState = 'connected';
            updatePeerButtonUi();
          }
          peerConnectedNote.textContent = '接続しました';
          showPeerStage('connected');
          startPeerTimers();
        };
        rtcDc.onclose = () => {
          rtcDataReady = false;
        };
        rtcDc.onmessage = (ev) => {
          try {
            const msg = JSON.parse(ev.data);
            handleDataChannelMessage(msg);
          } catch (_) {}
        };
      }

      function closeRtc() {
        try {
          if (rtcDc) {
            rtcDc.onopen = null;
            rtcDc.onclose = null;
            rtcDc.onmessage = null;
            rtcDc.close();
          }
        } catch (_) {}
        try {
          if (rtcPc) {
            rtcPc.onicecandidate = null;
            rtcPc.onconnectionstatechange = null;
            rtcPc.ondatachannel = null;
            rtcPc.close();
          }
        } catch (_) {}
        rtcDc = null;
        rtcPc = null;
        rtcDataReady = false;
      }

      function waitIceComplete(pc) {
        if (pc.iceGatheringState === 'complete') return Promise.resolve();
        return new Promise((resolve) => {
          const onState = () => {
            if (pc.iceGatheringState === 'complete') {
              pc.removeEventListener('icegatheringstatechange', onState);
              resolve();
            }
          };
          pc.addEventListener('icegatheringstatechange', onState);
        });
      }

      async function makeOfferPayload() {
        createRtcPeer();
        rtcDc = rtcPc.createDataChannel('touch');
        attachDataChannel(rtcDc);

        const offer = await rtcPc.createOffer();
        await rtcPc.setLocalDescription(offer);
        await waitIceComplete(rtcPc);

        pendingRole = 'offer';
        pendingOffer = rtcPc.localDescription ? rtcPc.localDescription.sdp : offer.sdp;
        pairingStage = 'offer-ready';

        return {
          v: 1,
          type: 'offer',
          sdp: pendingOffer
        };
      }

      async function makeAnswerPayload(offerSdp) {
        createRtcPeer();
        pendingRole = 'answer';
        await rtcPc.setRemoteDescription({ type: 'offer', sdp: offerSdp });
        const answer = await rtcPc.createAnswer();
        await rtcPc.setLocalDescription(answer);
        await waitIceComplete(rtcPc);
        pendingAnswer = rtcPc.localDescription ? rtcPc.localDescription.sdp : answer.sdp;
        pairingStage = 'answer-ready';
        return {
          v: 1,
          type: 'answer',
          sdp: pendingAnswer
        };
      }

      async function completeWithAnswer(answerSdp) {
        if (!rtcPc) return;
        await rtcPc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

      async function generatePeerQr(payload) {
        if (!window.QRCode || !QRCode.toCanvas) {

            width: 256,
            color: {
              dark: '#000000',

            }
          });
        } catch (_) {

        }
      }

      function stopScanner() {
        scannerBusy = false;
        if (scannerTimer) {
          clearInterval(scannerTimer);
          scannerTimer = null;
        }
        try {
          if (peerScanVideo.srcObject) {
            const tracks = peerScanVideo.srcObject.getTracks();
            tracks.forEach(track => track.stop());
          }
        } catch (_) {}
        peerScanVideo.srcObject = null;
        scannerStream = null;
      }

      async function startScanner() {
        stopScanner();
        try {
          scannerStream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' }
            },
            audio: false
          });
          peerScanVideo.srcObject = scannerStream;
          await peerScanVideo.play();
          scannerBusy = true;
          startScanLoop();
          peerScanNote.textContent = 'QRコードをカメラに向けてください';
        } catch (_) {
          peerScanNote.textContent = 'カメラを使えませんでした';
        }
      }

      async function scanFrame() {
        if (!scannerBusy || !peerScanVideo.videoWidth || !peerScanVideo.videoHeight) return null;
        const vw = peerScanVideo.videoWidth;
        const vh = peerScanVideo.videoHeight;
        scanCanvas.width = vw;
        scanCanvas.height = vh;
        scanCtx.drawImage(peerScanVideo, 0, 0, vw, vh);
        const imageData = scanCtx.getImageData(0, 0, vw, vh);

        if (window.BarcodeDetector) {
          if (!scannerDetector) {
            try {
              scannerDetector = new BarcodeDetector({ formats: ['qr_code'] });
            } catch (_) {
              scannerDetector = null;
            }
          }
          if (scannerDetector) {
            try {
              const barcodes = await scannerDetector.detect(peerScanVideo);
              if (barcodes && barcodes.length) return barcodes[0].rawValue || null;
            } catch (_) {}
          }
        }

        if (window.jsQR) {
          try {
            const result = jsQR(imageData.data, vw, vh, { inversionAttempts: 'dontInvert' });
            if (result && result.data) return result.data;
          } catch (_) {}
        }

        return null;
      }

      function startScanLoop() {
        if (scannerTimer) clearInterval(scannerTimer);
        scannerTimer = setInterval(async () => {
          if (!scannerBusy) return;
          const raw = await scanFrame();
          if (!raw) return;
          try {
            const payload = JSON.parse(raw);
            await handleScannedPayload(payload);
          } catch (_) {}
        }, 180);
      }

      async function handleScannedPayload(payload) {
        if (!payload || typeof payload !== 'object') return;
        if (payload.type === 'offer' && typeof payload.sdp === 'string') {
          peerScanNote.textContent = '受信しました。応答を作成中';

            });

        if (kind === 'loop') {

              .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number')
              .map(p => ({ x: p.x, y: p.y }));

      canvas.addEventListener('pointerdown', (e) => {
        if (overlay.classList.contains('open') || peerOverlay.classList.contains('open')) return;
        if (activePointerId !== null) return;
        activePointerId = e.pointerId;
        canvas.setPointerCapture(activePointerId);
        const p = getPoint(e);
        pointerDownTime = nowMs();
        pointerDownPos = { x: p.x, y: p.y };
        lastPos = { x: p.x, y: p.y };
        strokePoints = [p];
        pointerHadLoop = false;
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId) return;
        const p = getPoint(e);
        const t = nowMs();

        if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
          strokePoints.push(p);
          lastPos = p;
        }

        if (t - lastLoopAt >= LASSO_COOLDOWN) {
          if (detectLoop(strokePoints, p.x, p.y)) {
            createLoopEffect(strokePoints);
            lastLoopAt = t;
            pointerHadLoop = true;
            strokePoints = [p];
          }
        }

        e.preventDefault();
      }, { passive: false });

      function finishPointer(e) {
        if (activePointerId !== e.pointerId) return;
        const p = getPoint(e);
        const elapsed = nowMs() - pointerDownTime;
        const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

        if (!pointerHadLoop) {
          if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
            addTapEffect(p.x, p.y);
          } else if (totalMove >= SWIPE_MIN_DISTANCE) {
            const dx = p.x - pointerDownPos.x;
            const dy = p.y - pointerDownPos.y;
            createSwipeEffect(p.x, p.y, dx, dy);
          }
        }

        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;
        e.preventDefault();
      }

      canvas.addEventListener('pointerup', finishPointer, { passive: false });
      canvas.addEventListener('pointercancel', finishPointer, { passive: false });
      canvas.addEventListener('lostpointercapture', () => {
        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;
      });

      const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      function initPeerChannel() {
        try {
          if ('BroadcastChannel' in window) {
            peerChannel = new BroadcastChannel(COMM_CHANNEL_NAME);
            peerChannel.onmessage = (ev) => {
              const msg = ev.data;
              if (!msg || typeof msg !== 'object') return;
              if (msg.sender === selfPeerId) return;
              if (!rememberPacket(msg.id)) return;
              handleDataChannelMessage(msg);
            };
          }
        } catch (_) {
          peerChannel = null;
        }

        window.addEventListener('storage', (ev) => {
          if (ev.key !== COMM_STORAGE_KEY || !ev.newValue) return;
          try {
            const msg = JSON.parse(ev.newValue);
            if (!msg || typeof msg !== 'object') return;
            if (msg.sender === selfPeerId) return;
            if (!rememberPacket(msg.id)) return;
            handleDataChannelMessage(msg);
          } catch (_) {}
        });
      }

      loadSettings();
      updateTheme();
      resize();
      syncSettingsUi();
      document.body.style.background = getBgColor();
      updatePeerButtonUi();
      initPeerChannel();

      if (darkMql) {
        if (typeof darkMql.addEventListener === 'function') {
          darkMql.addEventListener('change', updateTheme);
        } else if (typeof darkMql.addListener === 'function') {
          darkMql.addListener(updateTheme);
        }
      }

      window.addEventListener('resize', resize);

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
