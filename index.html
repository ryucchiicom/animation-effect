<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: rgba(17, 17, 17, 0.56);
      --panel: rgba(255, 255, 255, 0.78);
      --panel-border: rgba(17, 17, 17, 0.12);
      --panel-shadow: rgba(0, 0, 0, 0.10);
      --control-bg: rgba(255, 255, 255, 0.18);
      --control-border: rgba(17, 17, 17, 0.18);
      --control-disabled: rgba(17, 17, 17, 0.24);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --fg: #f4f4f4;
        --muted: rgba(244, 244, 244, 0.58);
        --panel: rgba(0, 0, 0, 0.72);
        --panel-border: rgba(244, 244, 244, 0.10);
        --panel-shadow: rgba(0, 0, 0, 0.48);
        --control-bg: rgba(255, 255, 255, 0.08);
        --control-border: rgba(244, 244, 244, 0.18);
        --control-disabled: rgba(244, 244, 244, 0.22);
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--fg);
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #mainView,
    #settingsView {
      position: fixed;
      inset: 0;
    }

    #mainView {
      display: block;
    }

    #settingsView {
      display: none;
      box-sizing: border-box;
      padding:
        max(18px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      background: linear-gradient(180deg, rgba(255,255,255,0.00), rgba(255,255,255,0.00));
    }

    body.route-settings #settingsView {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body.route-settings #mainView {
      display: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .gearButton {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1.5px solid var(--fg);
      background: transparent;
      color: transparent;
      display: grid;
      place-items: center;
      padding: 0;
      margin: 0;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      cursor: pointer;
    }

    .gearButton span {
      display: block;
      font-size: 24px;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.25px var(--fg);
      text-shadow: 0 0 0 var(--fg);
      transform: translateY(-0.5px);
    }

    .settingsPanel {
      width: min(440px, calc(100vw - 32px));
      border-radius: 26px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      box-shadow: 0 18px 50px var(--panel-shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 18px;
      box-sizing: border-box;
    }

    .settingsTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .backButton {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1.5px solid var(--fg);
      background: transparent;
      color: transparent;
      display: grid;
      place-items: center;
      padding: 0;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .backButton span {
      display: block;
      font-size: 22px;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.2px var(--fg);
      text-shadow: 0 0 0 var(--fg);
      transform: translateY(-0.5px);
    }

    .settingsTitle {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--fg);
      flex: 1 1 auto;
      text-align: right;
    }

    .settingRow {
      border-radius: 18px;
      border: 1px solid var(--panel-border);
      background: rgba(255,255,255,0.06);
      padding: 14px;
      box-sizing: border-box;
      margin-top: 12px;
    }

    .settingHead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .settingLabel {
      font-size: 16px;
      font-weight: 650;
      color: var(--fg);
    }

    .settingNote {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .toggle {
      position: relative;
      width: 56px;
      height: 32px;
      flex: 0 0 auto;
    }

    .toggle input {
      position: absolute;
      inset: 0;
      opacity: 0;
      margin: 0;
      cursor: pointer;
    }

    .toggleTrack {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(127,127,127,0.22);
      border: 1px solid var(--control-border);
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .toggleThumb {
      position: absolute;
      top: 50%;
      left: 3px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--fg);
      transform: translateY(-50%);
      transition: left 0.18s ease, background 0.18s ease;
    }

    .toggle input:checked + .toggleTrack {
      background: rgba(76, 200, 120, 0.32);
    }

    .toggle input:checked + .toggleTrack .toggleThumb {
      left: 27px;
    }

    .rangeWrap {
      display: grid;
      gap: 8px;
      transition: opacity 0.18s ease;
    }

    .rangeWrap.disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .rangeTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--fg);
      font-size: 14px;
      font-weight: 600;
    }

    .rangeValue {
      color: var(--muted);
      font-weight: 650;
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      accent-color: var(--fg);
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: var(--control-bg);
      border: 1px solid var(--control-border);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--fg);
      border: none;
      margin-top: -6px;
    }

    input[type="range"]::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: var(--control-bg);
      border: 1px solid var(--control-border);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--fg);
      border: none;
    }

    .settingsFooter {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="mainView">
    <canvas id="c"></canvas>
    <button id="gearButton" class="gearButton" type="button" aria-label="設定">
      <span>⛭</span>
    </button>
  </div>

  <div id="settingsView" aria-hidden="true">
    <div class="settingsPanel">
      <div class="settingsTop">
        <button id="backButton" class="backButton" type="button" aria-label="戻る">
          <span>←</span>
        </button>
        <h1 class="settingsTitle">設定</h1>
      </div>

      <div class="settingRow">
        <div class="settingHead">
          <div class="settingLabel">格子状の線</div>
          <label class="toggle" aria-label="格子状の線を表示する">
            <input id="gridEnabled" type="checkbox" />
            <div class="toggleTrack">
              <div class="toggleThumb"></div>
            </div>
          </label>
        </div>

        <div id="gridRangeWrap" class="rangeWrap">
          <div class="rangeTop">
            <div>間隔</div>
            <div class="rangeValue"><span id="gridSpacingValue">34</span> px</div>
          </div>
          <input id="gridSpacing" type="range" min="18" max="120" step="1" value="34" />
          <div class="settingNote">ONのときだけ調整できます。</div>
        </div>

        <div id="gridOffNote" class="settingNote" style="display:none;">
          OFFのときは薄い表示になって、間隔の調整はできません。
        </div>
      </div>

      <div class="settingsFooter">
        URLは <code>/s</code>、無理なら <code>/#/s</code> で開けます。
      </div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: true });

      const gearButton = document.getElementById('gearButton');
      const settingsView = document.getElementById('settingsView');
      const backButton = document.getElementById('backButton');
      const gridEnabledEl = document.getElementById('gridEnabled');
      const gridSpacingEl = document.getElementById('gridSpacing');
      const gridSpacingValueEl = document.getElementById('gridSpacingValue');
      const gridRangeWrap = document.getElementById('gridRangeWrap');
      const gridOffNote = document.getElementById('gridOffNote');

      const STORAGE_KEY = 'touch_effects_settings_v2';

      const defaultSettings = {
        gridEnabled: true,
        gridSpacing: 34
      };

      let settings = loadSettings();

      let w = 0;
      let h = 0;
      let dpr = 1;

      const effects = [];
      let activePointerId = null;

      let strokePoints = [];
      let pointerDownTime = 0;
      let pointerDownPos = { x: 0, y: 0 };
      let lastMovePos = { x: 0, y: 0 };
      let lastLoopAt = 0;

      const SWIPE_MIN_DISTANCE = 42;
      const TAP_MAX_DISTANCE = 12;
      const TAP_MAX_TIME = 320;
      const LASSO_MIN_POINTS = 20;
      const LASSO_HIT_RADIUS = 18;
      const LASSO_IGNORE_RECENT_SEGMENTS = 10;
      const LASSO_COOLDOWN = 140;

      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const nowMs = () => performance.now();

      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { ...defaultSettings };
          const parsed = JSON.parse(raw);
          return {
            gridEnabled: typeof parsed.gridEnabled === 'boolean' ? parsed.gridEnabled : defaultSettings.gridEnabled,
            gridSpacing: clamp(Number(parsed.gridSpacing ?? defaultSettings.gridSpacing), 18, 120)
          };
        } catch {
          return { ...defaultSettings };
        }
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch {}
      }

      function syncSettingsUI() {
        gridEnabledEl.checked = !!settings.gridEnabled;
        gridSpacingEl.value = String(settings.gridSpacing);
        gridSpacingValueEl.textContent = String(settings.gridSpacing);

        const enabled = !!settings.gridEnabled;
        gridRangeWrap.classList.toggle('disabled', !enabled);
        gridOffNote.style.display = enabled ? 'none' : 'block';
      }

      function updateRouteView() {
        const settingsRoute = isSettingsRoute();
        document.body.classList.toggle('route-settings', settingsRoute);
        settingsView.setAttribute('aria-hidden', settingsRoute ? 'false' : 'true');
        document.title = settingsRoute ? '設定' : 'Touch Effects';
      }

      function isSettingsRoute() {
        const segs = location.pathname.split('/').filter(Boolean);
        return segs[segs.length - 1] === 's' || location.hash === '#/s';
      }

      function goSettings() {
        try {
          history.pushState({ view: 'settings' }, '', '/s');
        } catch {
          location.hash = '#/s';
          return;
        }
        updateRouteView();
      }

      function goMain() {
        try {
          history.pushState({ view: 'main' }, '', '/');
        } catch {
          if (location.hash === '#/s') location.hash = '';
          else location.hash = '';
          return;
        }
        updateRouteView();
      }

      function resize() {
        dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function distance(ax, ay, bx, by) {
        return Math.hypot(ax - bx, ay - by);
      }

      function pointToSegmentDistance(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const apx = px - ax;
        const apy = py - ay;
        const abLen2 = abx * abx + aby * aby;

        if (abLen2 === 0) return Math.hypot(px - ax, py - ay);

        let t = (apx * abx + apy * aby) / abLen2;
        t = clamp(t, 0, 1);

        const cx = ax + abx * t;
        const cy = ay + aby * t;
        return Math.hypot(px - cx, py - cy);
      }

      function addTapEffect(x, y) {
        effects.push({
          type: 'tap',
          x,
          y,
          start: nowMs(),
          duration: 650
        });
      }

      function createSwipeEffect(startX, startY, dirX, dirY) {
        const len = Math.hypot(dirX, dirY) || 1;
        dirX /= len;
        dirY /= len;

        const pad = 90;
        const minX = -pad;
        const minY = -pad;
        const maxX = w + pad;
        const maxY = h + pad;

        const candidates = [];

        function pushIfValid(t, x, y) {
          if (x >= minX - 0.5 && x <= maxX + 0.5 && y >= minY - 0.5 && y <= maxY + 0.5) {
            candidates.push({ t, x, y });
          }
        }

        if (Math.abs(dirX) > 1e-6) {
          let t = (minX - startX) / dirX;
          pushIfValid(t, minX, startY + dirY * t);
          t = (maxX - startX) / dirX;
          pushIfValid(t, maxX, startY + dirY * t);
        }

        if (Math.abs(dirY) > 1e-6) {
          let t = (minY - startY) / dirY;
          pushIfValid(t, startX + dirX * t, minY);
          t = (maxY - startY) / dirY;
          pushIfValid(t, startX + dirX * t, maxY);
        }

        if (candidates.length < 2) {
          candidates.push(
            { t: -400, x: startX - dirX * 400, y: startY - dirY * 400 },
            { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 }
          );
        } else {
          candidates.sort((a, b) => a.t - b.t);
        }

        const first = candidates[0];
        const last = candidates[candidates.length - 1];

        const travel = distance(first.x, first.y, last.x, last.y);
        const duration = clamp(460 + travel * 0.12, 520, 900);

        effects.push({
          type: 'swipe',
          start: nowMs(),
          duration,
          from: { x: first.x, y: first.y },
          to: { x: last.x, y: last.y },
          dir: { x: dirX, y: dirY },
          radius: clamp(Math.min(w, h) * 0.045, 18, 38)
        });
      }

      function createLoopEffect(points) {
        if (points.length < 3) return;
        const copy = points.map(p => ({ x: p.x, y: p.y }));
        effects.push({
          type: 'loop',
          start: nowMs(),
          duration: 420,
          points: copy
        });
      }

      function detectLoop(points, currentX, currentY) {
        if (points.length < LASSO_MIN_POINTS) return false;
        const n = points.length;
        const startIndex = Math.max(0, n - 1 - LASSO_IGNORE_RECENT_SEGMENTS);

        for (let i = 0; i < startIndex - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const d = pointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
          if (d <= LASSO_HIT_RADIUS) {
            let traveled = 0;
            for (let k = i; k < n - 1; k++) {
              traveled += distance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
              if (traveled > 40) break;
            }
            if (traveled > 40) return true;
          }
        }

        return false;
      }

      function currentGridStrokeStyle() {
        const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        return dark ? 'rgba(32, 32, 32, 0.82)' : 'rgba(235, 235, 235, 0.92)';
      }

      function drawGrid() {
        if (!settings.gridEnabled) return;

        const spacing = clamp(Number(settings.gridSpacing) || 34, 18, 120);
        const style = currentGridStrokeStyle();
        const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 1;

        // 全体の格子
        ctx.strokeStyle = style;
        ctx.globalAlpha = dark ? 0.48 : 0.42;

        for (let x = 0; x <= w; x += spacing) {
          ctx.beginPath();
          ctx.moveTo(x + 0.5, 0);
          ctx.lineTo(x + 0.5, h);
          ctx.stroke();
        }

        for (let y = 0; y <= h; y += spacing) {
          ctx.beginPath();
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(w, y + 0.5);
          ctx.stroke();
        }

        // ちょっとだけ濃い線を重ねて、色が出たときに他より薄くならないようにする
        const major = spacing * 4;
        if (major >= 64) {
          ctx.globalAlpha = dark ? 0.20 : 0.18;
          ctx.strokeStyle = style;

          for (let x = 0; x <= w; x += major) {
            ctx.beginPath();
            ctx.moveTo(x + 0.5, 0);
            ctx.lineTo(x + 0.5, h);
            ctx.stroke();
          }

          for (let y = 0; y <= h; y += major) {
            ctx.beginPath();
            ctx.moveTo(0, y + 0.5);
            ctx.lineTo(w, y + 0.5);
            ctx.stroke();
          }
        }

        ctx.restore();
      }

      function drawTap(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = easeOutCubic(p);
        const alpha = 0.36 * Math.pow(1 - p, 1.6);
        const radius = lerp(10, Math.max(w, h) * 0.22, e);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = radius * 0.22;
        ctx.shadowColor = 'rgba(70, 255, 120, 0.55)';

        const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
        g.addColorStop(0.00, 'rgba(70, 255, 120, 0.96)');
        g.addColorStop(0.28, 'rgba(60, 235, 110, 0.62)');
        g.addColorStop(0.68, 'rgba(50, 220, 100, 0.28)');
        g.addColorStop(1.00, 'rgba(50, 220, 100, 0)');

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawSwipe(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = easeOutCubic(p);
        const x = lerp(effect.from.x, effect.to.x, e);
        const y = lerp(effect.from.y, effect.to.y, e);

        const trailSteps = 16;
        const trailSpacing = effect.radius * 0.82;

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';

        for (let i = trailSteps; i >= 0; i--) {
          const back = i * trailSpacing;
          const px = x - effect.dir.x * back;
          const py = y - effect.dir.y * back;
          const a = 0.26 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, 0.30);
          if (a <= 0.001) continue;

          const r = effect.radius * (1 + (trailSteps - i) * 0.02);

          ctx.globalAlpha = a;
          ctx.shadowBlur = r * 0.35;
          ctx.shadowColor = 'rgba(90, 150, 255, 0.55)';
          ctx.fillStyle = 'rgba(110, 165, 255, 1)';
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 0.48 * Math.pow(1 - p, 0.72);
        ctx.shadowBlur = effect.radius * 0.6;
        ctx.shadowColor = 'rgba(110, 165, 255, 0.45)';
        ctx.fillStyle = 'rgba(110, 165, 255, 1)';
        ctx.beginPath();
        ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawLoop(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;
        if (effect.points.length < 3) return;

        const alpha = 0.40 * Math.pow(1 - p, 1.95);
        const blur = 8 * Math.pow(1 - p, 0.55);

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = blur;
        ctx.shadowColor = 'rgba(255, 60, 60, 0.40)';
        ctx.fillStyle = 'rgba(255, 78, 78, 1)';

        ctx.beginPath();
        ctx.moveTo(effect.points[0].x, effect.points[0].y);
        for (let i = 1; i < effect.points.length; i++) {
          ctx.lineTo(effect.points[i].x, effect.points[i].y);
        }
        ctx.closePath();
        ctx.fill();

        ctx.restore();
      }

      function render() {
        const t = nowMs();

        ctx.clearRect(0, 0, w, h);

        drawGrid();

        for (let i = 0; i < effects.length; i++) {
          const e = effects[i];
          if (e.type === 'tap') drawTap(e, t);
          else if (e.type === 'swipe') drawSwipe(e, t);
          else if (e.type === 'loop') drawLoop(e, t);
        }

        for (let i = effects.length - 1; i >= 0; i--) {
          if (t - effects[i].start >= effects[i].duration) effects.splice(i, 1);
        }

        requestAnimationFrame(render);
      }

      function setPointFromEvent(e) {
        return { x: e.clientX, y: e.clientY };
      }

      canvas.addEventListener('pointerdown', (e) => {
        if (activePointerId !== null || isSettingsRoute()) return;

        activePointerId = e.pointerId;
        canvas.setPointerCapture(activePointerId);

        const p = setPointFromEvent(e);
        pointerDownTime = nowMs();
        pointerDownPos = { x: p.x, y: p.y };
        lastMovePos = { x: p.x, y: p.y };
        strokePoints = [p];

        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId || isSettingsRoute()) return;

        const p = setPointFromEvent(e);
        const t = nowMs();

        if (distance(p.x, p.y, lastMovePos.x, lastMovePos.y) >= 2.2) {
          strokePoints.push(p);
          lastMovePos = p;
        }

        if (t - lastLoopAt >= LASSO_COOLDOWN) {
          if (detectLoop(strokePoints, p.x, p.y)) {
            createLoopEffect(strokePoints);
            lastLoopAt = t;

            // 指を離さずに、もう一回そのまま囲えるようにする
            strokePoints = [ { x: p.x, y: p.y } ];
          }
        }

        e.preventDefault();
      }, { passive: false });

      function finishPointer(e) {
        if (activePointerId !== e.pointerId) return;

        const t = nowMs();
        const totalMove = distance(pointerDownPos.x, pointerDownPos.y, lastMovePos.x, lastMovePos.y);
        const elapsed = t - pointerDownTime;

        if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME && !isSettingsRoute()) {
          addTapEffect(lastMovePos.x, lastMovePos.y);
        } else if (totalMove >= SWIPE_MIN_DISTANCE && !isSettingsRoute()) {
          const dx = lastMovePos.x - pointerDownPos.x;
          const dy = lastMovePos.y - pointerDownPos.y;
          createSwipeEffect(lastMovePos.x, lastMovePos.y, dx, dy);
        }

        activePointerId = null;
        strokePoints = [];
        e.preventDefault();
      }

      canvas.addEventListener('pointerup', finishPointer, { passive: false });
      canvas.addEventListener('pointercancel', finishPointer, { passive: false });
      canvas.addEventListener('lostpointercapture', () => {
        activePointerId = null;
        strokePoints = [];
      });

      gridEnabledEl.addEventListener('change', () => {
        settings.gridEnabled = gridEnabledEl.checked;
        saveSettings();
        syncSettingsUI();
      });

      gridSpacingEl.addEventListener('input', () => {
        settings.gridSpacing = clamp(Number(gridSpacingEl.value) || 34, 18, 120);
        gridSpacingValueEl.textContent = String(settings.gridSpacing);
        saveSettings();
      });

      gearButton.addEventListener('click', goSettings);
      backButton.addEventListener('click', goMain);

      window.addEventListener('resize', resize);
      window.addEventListener('popstate', updateRouteView);
      window.addEventListener('hashchange', updateRouteView);

      const mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
      if (mql) {
        const refreshTheme = () => {
          updateRouteView();
        };

        if (typeof mql.addEventListener === 'function') {
          mql.addEventListener('change', refreshTheme);
        } else if (typeof mql.addListener === 'function') {
          mql.addListener(refreshTheme);
        }
      }

      syncSettingsUI();
      resize();
      updateRouteView();
      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
