<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      --bg: #fff;
      --edge: #111;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: rgba(0, 0, 0, 0.14);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.45);
      --track: rgba(0, 0, 0, 0.12);
      --track-disabled: rgba(0, 0, 0, 0.06);
      --thumb: rgba(0, 0, 0, 0.72);
      --peer-blue: #2f78ff;
    }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000;
    --edge: #fafafa;
    --panel-bg: rgba(0, 0, 0, 0.82);
    --panel-border: rgba(255, 255, 255, 0.16);
    --text: #f5f5f5;
    --muted: rgba(245, 245, 245, 0.45);
    --track: rgba(255, 255, 255, 0.14);
    --track-disabled: rgba(255, 255, 255, 0.07);
    --thumb: rgba(255, 255, 255, 0.78);
  }
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color-scheme: light dark;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  overscroll-behavior: none;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body {
  position: relative;
  background: var(--bg);
}
canvas {
  display: block;
  width: 100vw;
  height: 100vh;
  touch-action: none;
}
.gear-btn,
.peer-btn {
  position: fixed;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1.7px solid var(--edge);
  background: transparent;
  color: transparent;
  padding: 0;
  display: grid;
  place-items: center;
  cursor: pointer;
  z-index: 20;
  -webkit-tap-highlight-color: transparent;
  -webkit-appearance: none;
  appearance: none;
  box-sizing: border-box;
  text-shadow: none;
}
.gear-btn {
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  right: calc(env(safe-area-inset-right, 0px) + 10px);
}
.peer-btn {
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: calc(env(safe-area-inset-left, 0px) + 10px);
}
.gear-btn span,
.peer-btn .peer-icon {
  font-size: 20px;
  font-weight: 400;
  line-height: 1;
  transform: translateY(-0.5px);
  color: var(--edge);
  -webkit-text-stroke: 0;
  text-shadow: none;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
}
.gear-btn:active,
.peer-btn:active {
  transform: scale(0.97);
}
.peer-btn.hidden {
  display: none;
}
.peer-btn.searching,
.peer-btn.connected {
  border-color: var(--peer-blue);
  color: var(--peer-blue);
}
.peer-btn.connected .peer-icon {
  color: var(--peer-blue);
}
.peer-icon {
  display: block;
  width: 20px;
  text-align: center;
}
.peer-spinner {
  display: none;
  position: relative;
  width: 20px;
  height: 20px;
  color: var(--peer-blue);
}
.peer-btn.searching .peer-icon {
  display: none;
}
.peer-btn.searching .peer-spinner {
  display: block;
  animation: peer-spin 0.9s linear infinite;
}
.peer-spinner span {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4px;
  height: 4px;
  margin: -2px 0 0 -2px;
  border-radius: 50%;
  background: currentColor;
  transform-origin: 0 0;
}
.peer-spinner span:nth-child(1) { transform: translate(0, -8px); opacity: 1; }
.peer-spinner span:nth-child(2) { transform: translate(5.5px, -5.5px); opacity: 0.82; }
.peer-spinner span:nth-child(3) { transform: translate(8px, 0); opacity: 0.64; }
.peer-spinner span:nth-child(4) { transform: translate(5.5px, 5.5px); opacity: 0.46; }
.peer-spinner span:nth-child(5) { transform: translate(0, 8px); opacity: 0.34; }
.peer-spinner span:nth-child(6) { transform: translate(-5.5px, 5.5px); opacity: 0.46; }
.peer-spinner span:nth-child(7) { transform: translate(-8px, 0); opacity: 0.64; }
.peer-spinner span:nth-child(8) { transform: translate(-5.5px, -5.5px); opacity: 0.82; }
@keyframes peer-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.overlay {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.26);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 18px;
  box-sizing: border-box;
}
.overlay.open {
  display: flex;
}
.panel {
  width: min(92vw, 460px);
  max-height: min(84vh, 680px);
  overflow: auto;
  border-radius: 26px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
  color: var(--text);
  padding: 18px 18px 16px;
  box-sizing: border-box;
  scrollbar-width: thin;
}
.panel-header {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: -18px -18px 18px;
  padding: 18px 18px 14px;
  background: linear-gradient(to bottom, var(--panel-bg) 80%, rgba(0,0,0,0));
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(127, 127, 127, 0.12);
}
.panel-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.close-btn {
  appearance: none;
  border: 1.5px solid var(--edge);
  background: transparent;
  color: var(--text);
  border-radius: 999px;
  min-width: 42px;
  height: 36px;
  padding: 0 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.close-btn:active {
  transform: scale(0.98);
}
.setting-block {
  padding: 14px 0 4px;
  border-top: 1px solid rgba(127, 127, 127, 0.16);
}
.setting-block:first-of-type {
  border-top: 0;
  padding-top: 0;
}
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.setting-label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.setting-label .main {
  font-size: 15px;
  font-weight: 650;
  line-height: 1.2;
}
.setting-label .sub {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.3;
}
.switch {
  position: relative;
  width: 56px;
  height: 34px;
  flex: 0 0 auto;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
  position: absolute;
}
.slider {
  position: absolute;
  inset: 0;
  background: rgba(127, 127, 127, 0.18);
  border: 1px solid var(--panel-border);
  border-radius: 999px;
  transition: 0.2s ease;
  cursor: pointer;
}
.slider::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 4px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--thumb);
  transition: 0.2s ease;
}
.switch input:checked + .slider {
  background: rgba(55, 180, 90, 0.22);
}
.switch input:checked + .slider::before {
  transform: translateX(22px);
}
.control-row {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: space-between;
  margin-top: 10px;
}
.mode-select {
  width: 128px;
  height: 36px;
  border-radius: 12px;
  border: 1px solid var(--panel-border);
  background: transparent;
  color: var(--text);
  padding: 0 10px;
  font-size: 14px;
  outline: none;
  appearance: none;
  -webkit-appearance: none;
}
.hex-input,
.text-input {
  width: 100%;
  box-sizing: border-box;
  height: 38px;
  border-radius: 12px;
  border: 1px solid var(--panel-border);
  background: transparent;
  color: var(--text);
  padding: 0 12px;
  font-size: 14px;
  outline: none;
}
.text-input {
  text-transform: none;
  letter-spacing: 0.01em;
}
.hex-input::placeholder,
.text-input::placeholder {
  color: var(--muted);
}
.sub-input-wrap {
  margin-top: 10px;
}
.disabled {
  opacity: 0.34;
  pointer-events: none;
}
.range-wrap {
  margin-top: 12px;
  padding-left: 2px;
}
.range-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.range-title {
  font-size: 13px;
  font-weight: 650;
}
.range-value {
  font-size: 12px;
  color: var(--muted);
}
input[type="range"] {
  width: 100%;
  margin: 0;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  height: 28px;
  outline: none;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 7px;
  border-radius: 999px;
  background: var(--track);
}
.disabled input[type="range"]::-webkit-slider-runnable-track {
  background: var(--track-disabled);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  margin-top: -7.5px;
  background: var(--thumb);
  border: 0;
  box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
}
input[type="range"]::-moz-range-track {
  height: 7px;
  border-radius: 999px;
  background: var(--track);
}
.disabled input[type="range"]::-moz-range-track {
  background: var(--track-disabled);
}
input[type="range"]::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--thumb);
  border: 0;
  box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
}
.effect-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 12px;
}
.effect-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 10px 0 0;
}
.effect-item + .effect-item {
  border-top: 1px solid rgba(127, 127, 127, 0.12);
  padding-top: 12px;
}
.effect-name {
  font-size: 13px;
  font-weight: 650;
}
.effect-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.35;
}
.footer-actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}
.danger-btn {
  appearance: none;
  border: 1.5px solid rgba(220, 40, 40, 0.55);
  background: transparent;
  color: #d23636;
  border-radius: 14px;
  min-width: 0;
  height: 40px;
  padding: 0 14px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  flex: 1 1 auto;
}
.danger-btn:active {
  transform: scale(0.98);
}
.peer-menu-overlay,
.connect-overlay {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.34);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 18px;
  box-sizing: border-box;
}
.peer-menu-overlay.open,
.connect-overlay.open {
  display: flex;
}
.peer-menu-shell {
  position: relative;
  width: min(92vw, 420px);
  height: min(84vh, 420px);
  pointer-events: none;
}
.peer-menu-top {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  padding: 10px 12px 0;
  box-sizing: border-box;
  pointer-events: none;
}
.peer-menu-top-card {
  pointer-events: auto;
  border: 1px solid rgba(47, 120, 255, 0.28);
  background: rgba(255, 255, 255, 0.10);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-radius: 20px;
  padding: 12px 12px 10px;
  color: #fff;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
}
.peer-room-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.peer-room-code {
  font-size: 12px;
  color: rgba(255,255,255,0.92);
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.peer-status {
  font-size: 12px;
  color: rgba(255,255,255,0.78);
  white-space: nowrap;
}
.peer-name-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
  min-height: 28px;
}
.peer-name-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 28px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid rgba(47, 120, 255, 0.52);
  background: rgba(47, 120, 255, 0.08);
  color: #fff;
  font-size: 12px;
  line-height: 1;
  white-space: nowrap;
}
.peer-name-chip.active {
  background: rgba(47, 120, 255, 0.22);
  border-color: rgba(47, 120, 255, 0.88);
}
.peer-burst-ring {
  position: absolute;
  left: 50%;
  top: 54%;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  border: 1.8px solid rgba(47, 120, 255, 0.35);
  transform: translate(-50%, -50%) scale(0.25);
  opacity: 0;
  transition: transform 1s ease, opacity 0.5s ease;
  pointer-events: none;
}
.peer-menu-overlay.open .peer-burst-ring {
  transform: translate(-50%, -50%) scale(2.45);
  opacity: 1;
}
.peer-choice {
  position: absolute;
  left: 50%;
  top: 54%;
  width: 122px;
  height: 122px;
  border: 1.7px solid rgba(47, 120, 255, 0.82);
  background: rgba(255, 255, 255, 0.08);
  border-radius: 50%;
  padding: 0;
  cursor: pointer;
  pointer-events: auto;
  -webkit-tap-highlight-color: transparent;
  transform:
    translate(-50%, -50%)
    translate(var(--from-x), var(--from-y))
    scale(0.12);
  opacity: 0;
  transition:
    transform 1s cubic-bezier(.2,.8,.2,1),
    opacity 0.5s ease;
  display: grid;
  place-items: center;
  box-sizing: border-box;
  color: #2f78ff;
}
.peer-menu-overlay.open .peer-choice {
  transform:
    translate(-50%, -50%)
    translate(var(--to-x), var(--to-y))
    scale(1);
  opacity: 1;
}
.peer-choice:active {
  transform:
    translate(-50%, -50%)
    translate(var(--to-x), var(--to-y))
    scale(0.97);
}
.peer-choice .peer-choice-label {
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  line-height: 1.35;
  padding: 0 12px;
  color: #2f78ff;
  opacity: 0;
  transition: opacity 0.5s ease;
  transition-delay: 1.0s;
  word-break: keep-all;
  white-space: pre-line;
}
.peer-menu-overlay.open .peer-choice .peer-choice-label {
  opacity: 1;
}
.peer-choice::before {
  content: "";
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  border: 1px solid rgba(47, 255, 255, 0.0);
  background: rgba(47, 120, 255, 0.03);
  pointer-events: none;
}
.peer-choice.wifi { --to-x: 0px; --to-y: -118px; }
.peer-choice.online { --to-x: -118px; --to-y: 108px; }
.peer-choice.cancel { --to-x: 118px; --to-y: 108px; }
.peer-choice.disconnect { --to-x: 0px; --to-y: -118px; }
.peer-choice.send { --to-x: -118px; --to-y: 108px; }
.peer-choice.receive { --to-x: 118px; --to-y: 108px; }
.dialog {
  width: min(92vw, 520px);
  border-radius: 26px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
  color: var(--text);
  padding: 18px;
  box-sizing: border-box;
  max-height: min(86vh, 720px);
  overflow: auto;
}
.dialog-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
}
.dialog-text {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.45;
  margin-bottom: 12px;
  white-space: pre-line;
}
.dialog-section {
  display: grid;
  gap: 10px;
  margin-bottom: 12px;
}
.dialog-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.ghost-btn {
  appearance: none;
  border: 1.5px solid var(--panel-border);
  background: transparent;
  color: var(--text);
  border-radius: 14px;
  height: 40px;
  padding: 0 14px;
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.ghost-btn:active {
  transform: scale(0.98);
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%) translateY(12px);
  background: rgba(0, 0, 0, 0.72);
  color: #fff;
  border-radius: 999px;
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1;
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  max-width: min(90vw, 420px);
  text-align: center;
  box-sizing: border-box;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.hidden {
  display: none !important;
}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <button class="gear-btn" id="openSettings" aria-label="設定を開く">
    <span>⛭</span>
  </button>
  <button class="peer-btn hidden" id="peerButton" aria-label="通信">
    <span class="peer-icon">☋</span>
    <span class="peer-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </span>
  </button>
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="設定">
      <div class="panel-header">
        <div class="panel-title">設定</div>
        <button class="close-btn" id="closeSettings">戻る</button>
      </div>
  <div class="setting-block">
    <div class="setting-label">
      <div class="main">自分の名前</div>
      <div class="sub">通信先の一覧に出ます</div>
    </div>
    <div class="sub-input-wrap">
      <input class="text-input" id="nameInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" maxlength="20" placeholder="名前" />
    </div>
  </div>
  <div class="setting-block">
    <div class="setting-row">
      <div class="setting-label">
        <div class="main">背景色</div>
        <div class="sub">システム / 白 / 黒 / カスタム</div>
      </div>
      <select class="mode-select" id="bgMode">
        <option value="system">システム</option>
        <option value="white">白</option>
        <option value="black">黒</option>
        <option value="custom">カスタム</option>
      </select>
    </div>
    <div class="sub-input-wrap hidden" id="bgCustomWrap">
      <input class="hex-input" id="bgCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ffffff" />
    </div>
  </div>
  <div class="setting-block">
    <div class="setting-label">
      <div class="main">色</div>
      <div class="sub">タップ / スワイプ / 囲い の色をカラーコードで指定</div>
    </div>
    <div class="effect-grid">
      <div class="effect-item">
        <div class="effect-name">タップの色</div>
        <input class="hex-input" id="tapColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#46ff78" />
      </div>
      <div class="effect-item">
        <div class="effect-name">スワイプの色</div>
        <input class="hex-input" id="swipeColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#6ea5ff" />
      </div>
      <div class="effect-item">
        <div class="effect-name">囲いの色</div>
        <input class="hex-input" id="loopColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ff4e4e" />
      </div>
    </div>
  </div>
  <div class="setting-block">
    <div class="setting-row">
      <div class="setting-label">
        <div class="main">グリッドを表示</div>
        <div class="sub">ONで背景に格子を出します</div>
      </div>
      <label class="switch" aria-label="グリッドを表示">
        <input type="checkbox" id="gridToggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div id="gridDetails">
      <div class="range-wrap">
        <div class="range-head">
          <div class="range-title">間隔</div>
          <div class="range-value"><span id="spacingValue">36</span>px</div>
        </div>
        <input type="range" id="spacingRange" min="18" max="100" step="1" value="36" />
      </div>
      <div class="control-row">

          await runTransaction(db, async (tx) => {
            const snap = await tx.get(firebaseRoomRef);
            const data = snap.exists() ? snap.data() : {};
            const activeId = data?.activeSenderId || null;
            const activeUpdated = data?.activeSenderUpdatedAtMs || 0;
            const busy = activeId && activeId !== selfPeerId && (now - activeUpdated <= LOCK_STALE_MS);
            if (busy) throw new Error(`${data?.activeSenderName || '誰か'}が送信中…`);
            tx.set(firebaseRoomRef, {
              roomCode,
              activeSenderId: selfPeerId,
              activeSenderName: settings.playerName,
              activeSenderUpdatedAtMs: now,
              updatedAtMs: now
            }, { merge: true });
          });
          return true;
        } catch (err) {
          showToast((err && err.message) ? err.message : '送信できない');
          return false;
        }
      }
      async function firebaseSendSettings() {
        if (!firebaseRoomRef) return;
        if (!canSelfSend()) {
          showToast(roomLockMessage());
          return;
        }
        const payload = captureSettingsSnapshot();
        const now = nowStamp();
        const nonce = makeId();
        const locked = await firebaseClaimLock();
        if (!locked) return;
        try {
          await setDoc(firebaseRoomRef, {
            roomCode,
            activeSenderId: selfPeerId,
            activeSenderName: settings.playerName,
            activeSenderUpdatedAtMs: now,
            lastSendAtMs: now,
            lastSentBy: selfPeerId,
            lastSentName: settings.playerName,
            lastSendNonce: nonce,
            lastSettings: payload,
            updatedAtMs: now
          }, { merge: true });
          roomLastSettings = payload;
          roomLastSendAtMs = now;
          roomLastSentBy = selfPeerId;
          roomLastSentName = settings.playerName;
          roomLastSendNonce = nonce;
          roomActiveSenderId = selfPeerId;
          roomActiveSenderName = settings.playerName;
          roomActiveSenderUpdatedAtMs = now;
          updateRoomStatusTexts();
          showToast('設定を送った');
        } catch (_) {
          showToast('送信に失敗');
        }
      }
      function handleFirebaseMemberSnapshot(snapshot) {
        const map = new Map();
        snapshot.forEach((docSnap) => {
          const d = docSnap.data() || {};
          map.set(docSnap.id, {
            id: docSnap.id,
            name: normalizeName(d.name),
            joinedAtMs: d.joinedAtMs || 0,
            activeSender: !!d.activeSender
          });
        });
        if (!map.has(selfPeerId)) {
          map.set(selfPeerId, { id: selfPeerId, name: settings.playerName, joinedAtMs: nowStamp(), activeSender: roomActiveSenderId === selfPeerId });
        }
        setMembersFromMap(map);
      }
      async function connectFirebaseRoom(code) {
        const normalized = normalizeRoomCode(code);
        if (!normalized) {
          showToast('部屋コードを入れて');
          return;
        }
        await stopAllTransport(false);
        transportKind = 'firebase';
        roomCode = normalized;
        settings.lastRoomCode = normalized;
        saveSettings();
        firebaseRoomRef = doc(db, 'rooms', roomCode);
        firebaseMemberRef = doc(db, 'rooms', roomCode, 'members', selfPeerId);
        roomMembers = new Map();
        setRoomMember(selfPeerId, settings.playerName, nowStamp(), false);
        setPeerState('searching');
        updateButtonsState();
        const now = nowStamp();
        await setDoc(firebaseRoomRef, { roomCode, updatedAtMs: now }, { merge: true });
        await setDoc(firebaseMemberRef, {
          name: settings.playerName,
          joinedAtMs: now,
          lastSeenAtMs: now,
          activeSender: false
        }, { merge: true });
        firebaseRoomUnsub = onSnapshot(firebaseRoomRef, (snap) => {
          const data = snap.exists() ? snap.data() : {};
          setRoomPayloadFromDoc(data || {});
          setPeerState('connected');
          updateButtonsState();
        }, () => {});
        const membersQ = query(collection(db, 'rooms', roomCode, 'members'), orderBy('joinedAtMs'), limit(50));
        firebaseMembersQueryUnsub = onSnapshot(membersQ, (snap) => {
          handleFirebaseMemberSnapshot(snap);
        }, () => {});
        startLocalHeartbeat();
        setPeerState('connected');
        updateRoomStatusTexts();
        showToast('接続した');
        closeConnectOverlay();
      }
      function sendSettingsViaLocalOrFirebase() {
        if (transportKind === 'local') {
          sendLocalSettings();
          return;
        }
        if (transportKind === 'firebase') {
          firebaseSendSettings();
          return;
        }
        showToast('まだ接続してない');
      }
      function sendLocalSettings() {
        if (transportKind !== 'local') return;
        if (!canSelfSend()) {
          showToast(roomLockMessage());
          return;
        }
        if (!claimLocalLock()) return;
        const payload = captureSettingsSnapshot();
        const now = nowStamp();
        const nonce = makeId();
        roomLastSettings = payload;
        roomLastSendAtMs = now;
        roomLastSentBy = selfPeerId;
        roomLastSentName = settings.playerName;
        roomLastSendNonce = nonce;
        localBroadcast({
          type: 'settings',
          payload,
          sentAtMs: now,
          sendNonce: nonce
        });
        updateRoomStatusTexts();
        showToast('設定を送った');
      }
      function sendEffect(kind, payload) {
        if (transportKind === 'local') {
          localBroadcast({ type: 'effect', kind, payload });
          return;
        }
        if (transportKind === 'firebase' && firebaseRoomRef) {
          setDoc(firebaseRoomRef, {
            updatedAtMs: nowStamp(),
            lastEffect: {
              kind,
              payload,
              senderId: selfPeerId,
              senderName: settings.playerName,
              ts: nowStamp()
            }
          }, { merge: true }).catch(() => {});
        }
      }
      function roomLockMessage() {
        if (roomActiveSenderId && roomActiveSenderName && nowStamp() - roomActiveSenderUpdatedAtMs <= LOCK_STALE_MS) {
          if (roomActiveSenderId === selfPeerId) return '送信中';
          return `${roomActiveSenderName}が送信中…`;
        }
        return peerState === 'connected' ? '接続中' : '-';
      }
      function maybeReleaseStaleLocalLock() {
        if (transportKind !== 'local') return;
        if (roomActiveSenderId && roomActiveSenderId !== selfPeerId && nowStamp() - roomActiveSenderUpdatedAtMs > LOCK_STALE_MS) {
          roomActiveSenderId = null;
          roomActiveSenderName = '';
          roomActiveSenderUpdatedAtMs = 0;
          updateRoomStatusTexts();
        }
      }
      function updateRoomStatusTexts() {
        peerRoomCodeText.textContent = `部屋: ${getRoomLabel()}`;
        peerStatusText.textContent = roomLockMessage();
        peerNameList.innerHTML = '';
        const members = [...roomMembers.values()]
          .sort((a, b) => (a.joinedAtMs || 0) - (b.joinedAtMs || 0))
          .slice(0, 20);
        if (members.length === 0) {
          const chip = document.createElement('span');
          chip.className = 'peer-name-chip';
          chip.textContent = normalizeName(settings.playerName);
          peerNameList.appendChild(chip);
          return;
        }
        for (const member of members) {
          const chip = document.createElement('span');
          chip.className = 'peer-name-chip' + (member.id === roomActiveSenderId ? ' active' : '');
          chip.textContent = member.name || '名無し';
          peerNameList.appendChild(chip);
        }
      }
      function getRoomLabel() {
        return roomCode || '-';
      }
      function setRoomPayloadFromDoc(data) {
        roomActiveSenderId = data?.activeSenderId || null;
        roomActiveSenderName = data?.activeSenderName || '';
        roomActiveSenderUpdatedAtMs = data?.activeSenderUpdatedAtMs || 0;
        roomLastSettings = data?.lastSettings || null;
        roomLastSendAtMs = data?.lastSendAtMs || 0;
        roomLastSentBy = data?.lastSentBy || '';
        roomLastSentName = data?.lastSentName || '';
        roomLastSendNonce = data?.lastSendNonce || '';
        if (data?.roomCode) roomCode = data.roomCode;
        updateRoomStatusTexts();
        maybeApplyIncomingSettings();
      }
      function maybeOpenMenuFromButton() {
        if (peerState === 'searching') {
          stopAllTransport(false);
          showToast('キャンセルした');
          return;
        }
        if (peerState === 'connected') {
          openPeerMenu('connected');
          return;
        }
        openPeerMenu('off');
      }
      function cleanupAndRefreshUiAfterSettingsChange() {
        applyChangeAndPersist();
        updateButtonsState();
        updateRoomStatusTexts();
      }
      // Connection overlay buttons
      connectGoButton.addEventListener('click', connectHandler);
      connectCancelButton.addEventListener('click', cancelAnyConnection);
      // Settings / UI events
      openSettings.addEventListener('click', openOverlay);
      closeSettings.addEventListener('click', closeOverlay);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeOverlay();
      });
      peerButton.addEventListener('click', maybeOpenMenuFromButton);
      peerMenuOverlay.addEventListener('click', (e) => {
        if (e.target === peerMenuOverlay) closePeerMenu();
      });
      connectOverlay.addEventListener('click', (e) => {
        if (e.target === connectOverlay) closeConnectOverlay();
      });
      peerChoice1.addEventListener('click', () => {});
      peerChoice2.addEventListener('click', () => {});
      peerChoice3.addEventListener('click', () => {});
      nameInput.addEventListener('input', () => {
        settings.playerName = normalizeName(nameInput.value);
        saveSettings();
        syncUiToSettings();
        pushMyNameUpdate();
        updateRoomStatusTexts();
      });
      bgMode.addEventListener('change', () => {
        settings.bgMode = bgMode.value;
        bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');
        cleanupAndRefreshUiAfterSettingsChange();
      });
      bgCustomInput.addEventListener('input', () => {
        settings.bgCustom = bgCustomInput.value.trim();
        cleanupAndRefreshUiAfterSettingsChange();
      });
      tapColorInput.addEventListener('input', () => {
        settings.tapColor = tapColorInput.value.trim();
        saveSettings();
      });
      swipeColorInput.addEventListener('input', () => {
        settings.swipeColor = swipeColorInput.value.trim();
        saveSettings();
      });
      loopColorInput.addEventListener('input', () => {
        settings.loopColor = loopColorInput.value.trim();
        saveSettings();
      });
      gridToggle.addEventListener('change', () => {
        settings.gridEnabled = gridToggle.checked;
        gridDetails.classList.toggle('disabled', !settings.gridEnabled);
        saveSettings();
      });
      gridMode.addEventListener('change', () => {
        settings.gridMode = gridMode.value;
        gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');
        saveSettings();
      });
      gridCustomInput.addEventListener('input', () => {
        settings.gridCustom = gridCustomInput.value.trim();
        saveSettings();
      });
      spacingRange.addEventListener('input', () => {
        settings.gridSpacing = clamp(Number(spacingRange.value) || 36, 18, 100);
        spacingValue.textContent = String(settings.gridSpacing);
        saveSettings();
      });
      peerButtonToggle.addEventListener('change', () => {
        settings.peerButtonVisible = peerButtonToggle.checked;
        if (!settings.peerButtonVisible) {
          stopAllTransport(false);
        }
        updateButtonsState();
        saveSettings();
      });
      resetSettings.addEventListener('click', resetAllSettings);
      connectCodeInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          connectHandler();
        }
      });
      function connectHandler() {
        if (connectBusy) return;
        connectBusy = true;
        const code = normalizeRoomCode(connectCodeInput.value);
        if (!code) {
          connectBusy = false;
          showToast('部屋コードを入れて');
          return;
        }
        if (connectMode === 'local') {
          connectLocalRoom(code).finally(() => { connectBusy = false; });
          return;
        }
        if (connectMode === 'firebase') {
          connectFirebaseRoom(code).finally(() => { connectBusy = false; });
          return;
        }
        connectBusy = false;
      }
      function cancelAnyConnection() {
        closeConnectOverlay();
      }
      function openConnectOverlay(mode) {
        connectMode = mode;
        connectOverlay.classList.add('open');
        connectOverlay.setAttribute('aria-hidden', 'false');
        connectTitle.textContent = mode === 'firebase' ? 'オンラインで通信' : 'Wi-Fiで通信';
        connectDesc.textContent = mode === 'firebase'
          ? '同じ部屋コードを入れるとマッチします。\n1人でも接続できるので、そのまま遊べます。'
          : '同じ部屋コードを入れるとマッチします。\n同じブラウザ環境の端末やタブで使えます。';
        connectCodeInput.value = settings.lastRoomCode || '';
        setTimeout(() => connectCodeInput.focus(), 0);
      }
      function closeConnectOverlay() {
        connectOverlay.classList.remove('open');
        connectOverlay.setAttribute('aria-hidden', 'true');
        connectMode = null;
        connectBusy = false;
      }
      function render() {
        const t = nowMs();
        ctx.fillStyle = getBgColor();
        ctx.fillRect(0, 0, w, h);
        drawGrid();
        for (let i = 0; i < effects.length; i++) {
          const effect = effects[i];
          if (effect.type === 'tap') drawTap(effect, t);
          else if (effect.type === 'swipe') drawSwipe(effect, t);
          else if (effect.type === 'loop') drawLoop(effect, t);
        }
        for (let i = effects.length - 1; i >= 0; i--) {
          if (t - effects[i].start >= effects[i].duration) effects.splice(i, 1);
        }
        requestAnimationFrame(render);
      }
      function handlePeerMenuSelectionAfterClick() {
        renderMenuOptions();
      }
      function openPeerButtonMenuForConnectedState() {
        openPeerMenu('connected');
      }
      function openPeerButtonMenuForOffState() {
        openPeerMenu('off');
      }
      function claimAndSendIfPossible() {
        sendCurrentSettings();
      }
      // Peer menu choice click wiring
      peerChoice1.addEventListener('click', () => {
        if (peerMenuMode === 'off') {
          closePeerMenu();
          openConnectOverlay('local');
          return;
        }
        closePeerMenu();
        stopAllTransport(false);
        showToast('切断した');
      });
      peerChoice2.addEventListener('click', () => {
        if (peerMenuMode === 'off') {
          closePeerMenu();
          openConnectOverlay('firebase');
          return;
        }
        closePeerMenu();
        claimAndSendIfPossible();
      });
      peerChoice3.addEventListener('click', () => {
        if (peerMenuMode === 'off') {
          closePeerMenu();
          return;
        }
        closePeerMenu();
        setReceiveWindow();
      });
      // Connect overlay click wiring
      connectGoButton.onclick = connectHandler;
      connectCancelButton.onclick = cancelAnyConnection;
      // Keep overlay header fixed and names live
      const transportMenuRefresh = () => {
        if (peerMenuOpen) updateRoomStatusTexts();
      };
      setInterval(() => {
        transportMenuRefresh();
        if (transportKind === 'local') maybeReleaseStaleLocalLock();
      }, 1000);
      // Final initial state
      syncUiToSettings();
      renderMenuOptions();
      updateButtonsState();
      updateRoomStatusTexts();
      document.body.style.background = getBgColor();
      requestAnimationFrame(render);
      // Expose minimal helpers in case debugging is needed
      window.__touchEffectState = {
        get settings() { return { ...settings }; },
        get roomCode() { return roomCode; },
        get transportKind() { return transportKind; }
      };
    })();
  </script>
</body>
</html>
