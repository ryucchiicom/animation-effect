    });

    canvas.addEventListener('pointerdown', (e) => {
      if (overlay.classList.contains('open')) return;
      if (peerMenuOverlay.classList.contains('open')) return;
      if (joinOverlay.classList.contains('open')) return;
      if (activePointerId !== null) return;

      activePointerId = e.pointerId;
      canvas.setPointerCapture(activePointerId);

      const p = getPoint(e);
      pointerDownTime = nowMs();
      pointerDownPos = { x: p.x, y: p.y };
      lastPos = { x: p.x, y: p.y };
      strokePoints = [p];
      pointerHadLoop = false;

      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
      if (activePointerId !== e.pointerId) return;

      const p = getPoint(e);
      const t = nowMs();

      if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
        strokePoints.push(p);
        lastPos = p;
      }

      if (t - lastLoopAt >= LASSO_COOLDOWN) {
        if (detectLoop(strokePoints, p.x, p.y)) {
          createLoopEffect(strokePoints);
          lastLoopAt = t;
          pointerHadLoop = true;
          strokePoints = [p];
        }
      }

      e.preventDefault();
    }, { passive: false });

    function finishPointer(e) {
      if (activePointerId !== e.pointerId) return;

      const p = getPoint(e);
      const elapsed = nowMs() - pointerDownTime;
      const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

      if (!pointerHadLoop) {
        if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
          addTapEffect(p.x, p.y);
        } else if (totalMove >= SWIPE_MIN_DISTANCE) {
          const dx = p.x - pointerDownPos.x;
          const dy = p.y - pointerDownPos.y;
          createSwipeEffect(p.x, p.y, dx, dy);
        }
      }

      activePointerId = null;
      strokePoints = [];
      pointerHadLoop = false;

      e.preventDefault();
    }

    canvas.addEventListener('pointerup', finishPointer, { passive: false });
    canvas.addEventListener('pointercancel', finishPointer, { passive: false });
    canvas.addEventListener('lostpointercapture', () => {
      activePointerId = null;
      strokePoints = [];
      pointerHadLoop = false;
    });

    const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function init() {
      loadSettings();

      if (!settings.userName || settings.userName === 'ユーザー') {
        settings.userName = defaultName();
      }

      membersMap.clear();
      membersMap.set(selfPeerId, {
        id: selfPeerId,
        name: settings.userName,
        updatedAtMs: Date.now(),
        transport: 'local'
      });

      updateTheme();
      resize();
      syncSettingsUi();
      document.body.style.background = getBgColor();
      updateTransportButtons();
      refreshPeerMenuUi();

      if (darkMql) {
        if (typeof darkMql.addEventListener === 'function') {
          darkMql.addEventListener('change', updateTheme);
        } else if (typeof darkMql.addListener === 'function') {
          darkMql.addListener(updateTheme);
        }
      }

      window.addEventListener('resize', resize);
      requestAnimationFrame(render);
    }

    init();

    function refreshPeerMenuUi() {
      if (!settings.peerButtonVisible) {
        peerButton.classList.add('hidden');
      } else {
        peerButton.classList.remove('hidden');
      }

      const list = getMemberListArray();
      peerMembers.innerHTML = '';

      for (const item of list) {
        const chip = document.createElement('div');
        chip.className = 'peer-member';
        chip.textContent = item.id === selfPeerId ? `${item.name}（自分）` : item.name;
        peerMembers.appendChild(chip);
      }

      peerRoomLabel.textContent = roomDisplayName
        ? `${roomDisplayName} / ${transportMode === 'firebase' ? 'Firebase' : 'ローカル'}`
        : '未接続';

      const lock = activeLock();
      if (peerState === 'connected') {
        peerRoomStatus.textContent = lock && lock.senderId !== selfPeerId
          ? `${lock.senderName}が送信中…`
          : `${list.length}人接続中`;
      } else if (peerState === 'searching') {
        peerRoomStatus.textContent = '接続中…';
      } else {
        peerRoomStatus.textContent = `${list.length}人`;
      }

      if (peerState === 'connected') {
        peerChoiceLabel1.textContent = '接続を\n切断';
        peerChoiceLabel2.textContent = lock && lock.senderId !== selfPeerId ? `${lock.senderName}が\n送信中…` : '設定を\n送信';
        peerChoiceLabel3.textContent = '設定を\n受信';
        peerChoice1.className = 'peer-choice disconnect';
        peerChoice2.className = 'peer-choice send';
        peerChoice3.className = 'peer-choice receive';
        peerChoice2.disabled = !!(lock && lock.senderId !== selfPeerId);
      } else {
        peerChoiceLabel1.textContent = 'ローカルで\n通信';
        peerChoiceLabel2.textContent = 'Firebaseで\n通信';
        peerChoiceLabel3.textContent = 'やめる';
        peerChoice1.className = 'peer-choice wifi';
        peerChoice2.className = 'peer-choice online';
        peerChoice3.className = 'peer-choice cancel';
        peerChoice2.disabled = false;
      }

      updateTransportButtons();
    }
  </script>
</body>
</html>
