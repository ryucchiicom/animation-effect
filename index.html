    function showToast(message, duration = 1700) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, duration);
    }

    function makeId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      const bytes = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(bytes);
      return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function nowMs() {
      return performance.now();
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(ax - bx, ay - by);
    }

    function pointToSegmentDistance(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const abLen2 = abx * abx + aby * aby;

      if (abLen2 === 0) return Math.hypot(px - ax, py - ay);

      let t = (apx * abx + apy * aby) / abLen2;
      t = clamp(t, 0, 1);

      const cx = ax + abx * t;
      const cy = ay + aby * t;
      return Math.hypot(px - cx, py - cy);
    }

    function isValidMode(value) {
      return value === 'system' || value === 'white' || value === 'black' || value === 'custom';
    }

    function normalizeHexColor(raw) {
      if (typeof raw !== 'string') return null;
      let s = raw.trim();
      if (!s) return null;
      if (s[0] === '#') s = s.slice(1);
      if (!/^[0-9a-fA-F]+$/.test(s)) return null;

      if (s.length === 3 || s.length === 4) {
        s = s.split('').map(ch => ch + ch).join('');
      }

      if (s.length !== 6 && s.length !== 8) return null;
      return '#' + s.toLowerCase();
    }

    function hexToRgba(rawHex, alphaOverride = 1) {
      const hex = normalizeHexColor(rawHex);
      if (!hex) return null;

      const s = hex.slice(1);
      const r = parseInt(s.slice(0, 2), 16);
      const g = parseInt(s.slice(2, 4), 16);
      const b = parseInt(s.slice(4, 6), 16);
      const a = s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1;
      return `rgba(${r}, ${g}, ${b}, ${clamp(a * alphaOverride, 0, 1)})`;
    }

    function resolveModeColor(mode, customRaw, lightHex, darkHex) {
      const fallback = darkMode ? darkHex : lightHex;
      if (mode === 'system') return fallback;
      if (mode === 'white') return '#ffffff';
      if (mode === 'black') return '#000000';
      if (mode === 'custom') return normalizeHexColor(customRaw) || fallback;
      return fallback;
    }

    function sanitizeDisplayName(value) {
      const text = String(value ?? '').trim().replace(/\s+/g, ' ');
      return text.slice(0, 20) || defaults.displayName;
    }

    function saveSettings() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      } catch (_) {}
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);

        if (isValidMode(data.bgMode)) settings.bgMode = data.bgMode;
        if (typeof data.bgCustom === 'string') settings.bgCustom = data.bgCustom;

        if (typeof data.tapColor === 'string') settings.tapColor = data.tapColor;
        if (typeof data.swipeColor === 'string') settings.swipeColor = data.swipeColor;
        if (typeof data.loopColor === 'string') settings.loopColor = data.loopColor;

        if (typeof data.gridEnabled === 'boolean') settings.gridEnabled = data.gridEnabled;
        if (isValidMode(data.gridMode)) settings.gridMode = data.gridMode;
        if (typeof data.gridCustom === 'string') settings.gridCustom = data.gridCustom;
        if (typeof data.gridSpacing === 'number' && isFinite(data.gridSpacing)) {
          settings.gridSpacing = clamp(Math.round(data.gridSpacing), 18, 100);
        }

        if (typeof data.peerButtonVisible === 'boolean') settings.peerButtonVisible = data.peerButtonVisible;
        if (typeof data.displayName === 'string') settings.displayName = sanitizeDisplayName(data.displayName);
      } catch (_) {}
    }

    function updateTheme() {
      darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

      document.documentElement.style.setProperty('--bg', darkMode ? '#000' : '#fff');
      document.documentElement.style.setProperty('--edge', darkMode ? '#fafafa' : '#111');
      document.documentElement.style.setProperty('--panel-bg', darkMode ? 'rgba(0, 0, 0, 0.82)' : 'rgba(255, 255, 255, 0.84)');
      document.documentElement.style.setProperty('--panel-border', darkMode ? 'rgba(255, 255, 255, 0.16)' : 'rgba(0, 0, 0, 0.14)');
      document.documentElement.style.setProperty('--text', darkMode ? '#f5f5f5' : '#101010');
      document.documentElement.style.setProperty('--muted', darkMode ? 'rgba(245, 245, 245, 0.45)' : 'rgba(16, 16, 16, 0.45)');
      document.documentElement.style.setProperty('--track', darkMode ? 'rgba(255, 255, 255, 0.14)' : 'rgba(0, 0, 0, 0.12)');
      document.documentElement.style.setProperty('--track-disabled', darkMode ? 'rgba(255, 255, 255, 0.07)' : 'rgba(0, 0, 0, 0.06)');
      document.documentElement.style.setProperty('--thumb', darkMode ? 'rgba(255, 255, 255, 0.78)' : 'rgba(0, 0, 0, 0.72)');

      document.body.style.background = getBgColor();
    }

    function resize() {
      dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function openOverlay(el) {
      el.classList.add('open');
      el.setAttribute('aria-hidden', 'false');
    }

    function closeOverlay(el) {
      el.classList.remove('open');
      el.setAttribute('aria-hidden', 'true');
    }

    function getShareableSettingsSnapshot() {
      const snapshot = {};
      for (const key of SHAREABLE_KEYS) snapshot[key] = settings[key];
      return snapshot;
    }

    function applyShareableSettingsSnapshot(snapshot) {
      if (!snapshot || typeof snapshot !== 'object') return;

      if (isValidMode(snapshot.bgMode)) settings.bgMode = snapshot.bgMode;
      if (typeof snapshot.bgCustom === 'string') settings.bgCustom = snapshot.bgCustom;

      if (typeof snapshot.tapColor === 'string') settings.tapColor = snapshot.tapColor;
      if (typeof snapshot.swipeColor === 'string') settings.swipeColor = snapshot.swipeColor;
      if (typeof snapshot.loopColor === 'string') settings.loopColor = snapshot.loopColor;

      if (typeof snapshot.gridEnabled === 'boolean') settings.gridEnabled = snapshot.gridEnabled;
      if (isValidMode(snapshot.gridMode)) settings.gridMode = snapshot.gridMode;
      if (typeof snapshot.gridCustom === 'string') settings.gridCustom = snapshot.gridCustom;
      if (typeof snapshot.gridSpacing === 'number' && isFinite(snapshot.gridSpacing)) {
        settings.gridSpacing = clamp(Math.round(snapshot.gridSpacing), 18, 100);
      }

      syncSettingsUi();
      document.body.style.background = getBgColor();
      saveSettings();
    }

    function getBgColor() {
      return resolveModeColor(settings.bgMode, settings.bgCustom, '#ffffff', '#000000');
    }

    function getGridBaseColor() {
      return resolveModeColor(
        settings.gridMode,
        settings.gridCustom,
        darkMode ? '#262626' : '#e8e8e8',
        darkMode ? '#262626' : '#e8e8e8'
      );
    }

    function getTapBaseColor() {
      return normalizeHexColor(settings.tapColor) || defaults.tapColor;
    }

    function getSwipeBaseColor() {
      return normalizeHexColor(settings.swipeColor) || defaults.swipeColor;
    }

    function getLoopBaseColor() {
      return normalizeHexColor(settings.loopColor) || defaults.loopColor;
    }

    function getDisplayName() {
      return sanitizeDisplayName(settings.displayName);
    }

    function refreshOwnPresence() {
      if (comm.transport === 'none') return;
      const entry = {
        id: comm.clientId,
        name: getDisplayName(),
        lastSeenMs: Date.now()
      };
      comm.members.set(comm.clientId, entry);
      if (comm.transport === 'local') {
        postLocalPacket({ type: 'presence', id: comm.clientId, name: entry.name, lastSeenMs: entry.lastSeenMs });
      } else if (comm.transport === 'firebase' && comm.memberRef) {
        setDoc(comm.memberRef, {
          name: entry.name,
          lastSeenMs: entry.lastSeenMs,
          clientId: comm.clientId,
          roomCode: comm.roomCode
        }, { merge: true }).catch(() => {});
      }
      updatePeerMenuUi();
    }

    function purgeStaleMembers() {
      const now = Date.now();
      for (const [id, info] of [...comm.members.entries()]) {
        if (id === comm.clientId) continue;
        if (!info || now - (info.lastSeenMs || 0) > 12000) {
          comm.members.delete(id);
        }
      }
      updatePeerMenuUi();
    }

    function rememberPacket(id) {
      if (!id) return false;
      if (!comm._seenPackets) comm._seenPackets = new Set();
      if (comm._seenPackets.has(id)) return false;
      comm._seenPackets.add(id);
      if (!comm._seenPacketQueue) comm._seenPacketQueue = [];
      comm._seenPacketQueue.push(id);
      if (comm._seenPacketQueue.length > 400) {
        const old = comm._seenPacketQueue.shift();
        if (old) comm._seenPackets.delete(old);
      }
      return true;
    }

    function updatePeerButtonUi() {
      peerButton.classList.toggle('hidden', !settings.peerButtonVisible);
      peerButton.classList.toggle('searching', comm.transport !== 'none' && comm.transportState === 'searching');
      peerButton.classList.toggle('connected', comm.transport !== 'none' && comm.transportState === 'connected');

      if (comm.transportState === 'searching') {
        peerButton.setAttribute('aria-label', '通信をキャンセル');
      } else if (comm.transport !== 'none') {
        peerButton.setAttribute('aria-label', '接続メニューを開く');
      } else {
        peerButton.setAttribute('aria-label', 'ローカル通信');
      }
    }

    function updateSettingsUiAvailability() {
      nameBlock.classList.toggle('disabled', !settings.peerButtonVisible);
      displayNameInput.disabled = !settings.peerButtonVisible;
      peerButtonToggle.checked = settings.peerButtonVisible;
      nameBlock.classList.toggle('disabled', !settings.peerButtonVisible);
    }

    function syncSettingsUi() {
      bgMode.value = settings.bgMode;
      bgCustomInput.value = settings.bgCustom;
      bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');

      tapColorInput.value = settings.tapColor;
      swipeColorInput.value = settings.swipeColor;
      loopColorInput.value = settings.loopColor;

      gridToggle.checked = settings.gridEnabled;
      gridDetails.classList.toggle('disabled', !settings.gridEnabled);

      gridMode.value = settings.gridMode;
      gridCustomInput.value = settings.gridCustom;
      gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');

      spacingRange.value = String(settings.gridSpacing);
      spacingValue.textContent = String(settings.gridSpacing);

      displayNameInput.value = settings.displayName;
      updateSettingsUiAvailability();
      updatePeerButtonUi();
    }

    function currentVisibleMembers() {
      const now = Date.now();
      const list = [];
      for (const [id, info] of comm.members.entries()) {
        if (!info) continue;
        if (id === comm.clientId || now - (info.lastSeenMs || 0) <= 12000) {
          list.push({ id, name: info.name || '名無し', lastSeenMs: info.lastSeenMs || 0 });
        }
      }
      list.sort((a, b) => {
        if (a.id === comm.clientId) return -1;
        if (b.id === comm.clientId) return 1;
        return (b.lastSeenMs || 0) - (a.lastSeenMs || 0);
      });
      return list;
    }

    function updatePeerMenuUi() {
      const members = currentVisibleMembers();
      peerTopbar.classList.toggle('open', comm.transport !== 'none' && peerMenuOverlay.classList.contains('open'));

      peerNamesList.innerHTML = '';
      for (const member of members) {
        const chip = document.createElement('span');
        chip.className = 'peer-chip' + (member.id === comm.clientId ? ' self' : '');
        chip.textContent = member.name;
        peerNamesList.appendChild(chip);
      }

      if (comm.transport === 'none') {
        peerChoiceLabel1.textContent = 'ローカルで\n通信';
        peerChoiceLabel2.textContent = 'Firebaseで\n通信';
        peerChoiceLabel3.textContent = '閉じる';
        peerChoice1.className = 'peer-choice wifi';
        peerChoice2.className = 'peer-choice firebase';
        peerChoice3.className = 'peer-choice close';
        peerChoice1.classList.remove('disabledChoice');
        peerChoice2.classList.remove('disabledChoice');
      } else {
        const lock = getActiveSendLock();
        peerChoiceLabel1.textContent = '接続を\n切断';

        if (lock && lock.ownerId && lock.ownerId !== comm.clientId) {
          peerChoiceLabel2.textContent = `${truncateName(lock.ownerName)}が\n送信中…`;
          peerChoice2.classList.add('disabledChoice');
        } else if (lock && lock.ownerId === comm.clientId) {
          peerChoiceLabel2.textContent = '送信中…';
          peerChoice2.classList.add('disabledChoice');
        } else {
          peerChoiceLabel2.textContent = '設定を\n送信';
          peerChoice2.classList.remove('disabledChoice');
        }

        peerChoiceLabel3.textContent = '設定を\n受信';
        peerChoice1.className = 'peer-choice disconnect';
        peerChoice2.className = 'peer-choice send' + (peerChoice2.classList.contains('disabledChoice') ? ' disabledChoice' : '');
        peerChoice3.className = 'peer-choice receive';
      }
    }

    function truncateName(name) {
      const s = String(name || '').trim();
      return s.length > 8 ? s.slice(0, 8) + '…' : s;
    }

    function openPeerMenu() {
      if (!settings.peerButtonVisible) return;
      updatePeerMenuUi();
      openOverlay(peerMenuOverlay);
      requestAnimationFrame(() => {
        peerTopbar.classList.toggle('open', comm.transport !== 'none');
      });
      const rect = peerButton.getBoundingClientRect();
      const stageRect = document.getElementById('peerMenuStage').getBoundingClientRect();
      const stageW = stageRect.width || window.innerWidth;
      const stageH = stageRect.height || window.innerHeight;
      const anchorX = rect.left + rect.width / 2 - stageW / 2;
      const anchorY = rect.top + rect.height / 2 - stageH / 2;

      const setFrom = (el, tx, ty) => {
        el.style.setProperty('--from-x', `${anchorX}px`);
        el.style.setProperty('--from-y', `${anchorY}px`);
        el.style.setProperty('--to-x', `${tx}px`);
        el.style.setProperty('--to-y', `${ty}px`);
      };

      setFrom(peerChoice1, 0, -118);
      setFrom(peerChoice2, -118, 108);
      setFrom(peerChoice3, 118, 108);
    }

    function closePeerMenu() {
      closeOverlay(peerMenuOverlay);
      peerTopbar.classList.remove('open');
    }

    function openConnectDialog(mode) {
      connectMode = mode;
      roomCodeInput.value = '';
      if (mode === 'local') {
        connectTitle.textContent = 'ローカル通信';
        connectText.textContent = '同じ文字を入れた人とつながる';
        connectJoinButton.textContent = '参加';
      } else {
        connectTitle.textContent = 'Firebase通信';
        connectText.textContent = '同じ文字を入れた人とつながる';
        connectJoinButton.textContent = '参加';
      }
      openOverlay(connectOverlay);
      setTimeout(() => roomCodeInput.focus(), 50);
    }

    function closeConnectDialog() {
      closeOverlay(connectOverlay);
    }

    function buildRoomCode(name, code) {
      const c = String(code || '').trim();
      if (!c) return '';
      return `${name}${c}`;
    }

    function openLocalTransport(roomCode) {
      stopAllComm(false);
      comm.transport = 'local';
      comm.transportState = 'searching';
      comm.roomCode = roomCode;
      comm.localBusKey = LOCAL_BUS_PREFIX + roomCode;
      comm.members = new Map();
      comm.currentSendLock = null;
      comm.lastAppliedLockId = '';
      comm.receiveWindowUntil = 0;

      const channelName = LOCAL_ROOM_PREFIX + roomCode;
      if ('BroadcastChannel' in window) {
        try {
          comm.channel = new BroadcastChannel(channelName);
          comm.channel.onmessage = (ev) => handleIncomingPacket(ev.data, 'local');
        } catch (_) {
          comm.channel = null;
        }
      }

      window.addEventListener('storage', onLocalStorage);
      window.addEventListener('beforeunload', onBeforeUnload, { once: true });

      comm.members.set(comm.clientId, { id: comm.clientId, name: getDisplayName(), lastSeenMs: Date.now() });
      refreshOwnPresence();
      startLocalPresenceTimer();
      startCleanupTimer();
      comm.transportState = 'connected';
      updatePeerButtonUi();
      updatePeerMenuUi();
    }

    function postLocalPacket(packet) {
      if (packet.room !== comm.roomCode) packet.room = comm.roomCode;
      packet.id = packet.id || makeId();
      packet.senderId = packet.senderId || comm.clientId;
      packet.senderName = packet.senderName || getDisplayName();
      packet.createdAtMs = packet.createdAtMs || Date.now();

      if (comm.channel) {
        try {
          comm.channel.postMessage(packet);
        } catch (_) {}
      }

      try {
        localStorage.setItem(comm.localBusKey, JSON.stringify(packet));
      } catch (_) {}
    }

    function onLocalStorage(ev) {
      if (ev.key !== comm.localBusKey || !ev.newValue) return;
      try {
        handleIncomingPacket(JSON.parse(ev.newValue), 'local');
      } catch (_) {}
    }

    function startLocalPresenceTimer() {
      clearInterval(localPresenceTimer);
      localPresenceTimer = setInterval(() => {
        if (comm.transport !== 'local') return;
        postLocalPacket({ type: 'presence', room: comm.roomCode, id: comm.clientId, name: getDisplayName(), lastSeenMs: Date.now() });
      }, 2500);
    }

    function stopLocalPresenceTimer() {
      clearInterval(localPresenceTimer);
      localPresenceTimer = null;
    }

    async function openFirebaseTransport(roomCode) {
      stopAllComm(false);
      comm.transport = 'firebase';
      comm.transportState = 'searching';
      comm.roomCode = roomCode;
      comm.members = new Map();
      comm.currentSendLock = null;
      comm.lastAppliedLockId = '';
      comm.receiveWindowUntil = 0;

      comm.roomRef = doc(db, 'rooms', roomCode);
      comm.membersCol = collection(comm.roomRef, 'members');
      comm.eventsCol = collection(comm.roomRef, 'events');
      comm.memberRef = doc(comm.membersCol, comm.clientId);

      await setDoc(comm.roomRef, {
        roomCode,
        createdAtMs: Date.now(),
        updatedAtMs: Date.now()
      }, { merge: true });

      await setDoc(comm.memberRef, {
        clientId: comm.clientId,
        name: getDisplayName(),
        roomCode,
        lastSeenMs: Date.now(),
        joinedAtMs: Date.now()
      }, { merge: true });

      comm.unsubMembers = onSnapshot(query(comm.membersCol, orderBy('joinedAtMs', 'asc')), (snap) => {
        const next = new Map();
        next.set(comm.clientId, { id: comm.clientId, name: getDisplayName(), lastSeenMs: Date.now() });

        snap.forEach((docSnap) => {
          const data = docSnap.data() || {};
          const id = docSnap.id;
          const name = sanitizeDisplayName(data.name);
          const lastSeenMs = typeof data.lastSeenMs === 'number' ? data.lastSeenMs : 0;
          if (Date.now() - lastSeenMs <= 12000 || id === comm.clientId) {
            next.set(id, { id, name, lastSeenMs });
          }
        });

        comm.members = next;
        updatePeerMenuUi();
      });

      comm.unsubRoom = onSnapshot(comm.roomRef, (snap) => {
        const data = snap.data() || {};
        const lock = data.sendLock || null;
        comm.currentSendLock = lock && typeof lock === 'object' ? lock : null;
        if (comm.currentSendLock && typeof comm.currentSendLock.expiresAtMs === 'number' && Date.now() > comm.currentSendLock.expiresAtMs) {
          comm.currentSendLock = null;
        }
        updatePeerMenuUi();
        maybeApplyReceiveFromCurrentLock();
      });

      comm.unsubEvents = onSnapshot(query(comm.eventsCol, orderBy('createdAtMs', 'asc')), (snap) => {
        snap.docChanges().forEach((change) => {
          if (change.type !== 'added') return;
          const data = change.doc.data() || {};
          handleIncomingPacket({ ...data, id: change.doc.id }, 'firebase');
        });
      });

      comm.heartbeatTimer = setInterval(() => {
        if (comm.transport !== 'firebase' || !comm.memberRef) return;
        setDoc(comm.memberRef, {
          name: getDisplayName(),
          roomCode: comm.roomCode,
          lastSeenMs: Date.now()
        }, { merge: true }).catch(() => {});
      }, 2500);

      startCleanupTimer();
      comm.transportState = 'connected';
      updatePeerButtonUi();
      updatePeerMenuUi();
      refreshOwnPresence();
      window.addEventListener('beforeunload', onBeforeUnload, { once: true });
    }

    function startCleanupTimer() {
      clearInterval(comm.roomCleanupTimer);
      clearInterval(comm.localCleanupTimer);

      comm.roomCleanupTimer = setInterval(() => {
        if (comm.transport === 'none') return;
        purgeStaleMembers();
        purgeExpiredSendLock();
      }, 1000);

      comm.localCleanupTimer = comm.roomCleanupTimer;
    }

    function purgeExpiredSendLock() {
      if (!comm.currentSendLock) return;
      const exp = typeof comm.currentSendLock.expiresAtMs === 'number' ? comm.currentSendLock.expiresAtMs : 0;
      if (exp && Date.now() > exp) {
        comm.currentSendLock = null;
        updatePeerMenuUi();
      }
    }

    function stopFirebaseTransport(sendLeave = false) {
      clearInterval(comm.heartbeatTimer);
      comm.heartbeatTimer = null;

      if (sendLeave && comm.memberRef) {
        deleteDoc(comm.memberRef).catch(() => {});
      }

      if (comm.unsubMembers) comm.unsubMembers();
      if (comm.unsubRoom) comm.unsubRoom();
      if (comm.unsubEvents) comm.unsubEvents();
      comm.unsubMembers = null;
      comm.unsubRoom = null;
      comm.unsubEvents = null;

      comm.roomRef = null;
      comm.membersCol = null;
      comm.eventsCol = null;
      comm.memberRef = null;
    }

    function stopLocalTransport(sendLeave = false) {
      stopLocalPresenceTimer();

      if (sendLeave) {
        postLocalPacket({ type: 'leave', room: comm.roomCode, id: comm.clientId });
      }

      if (comm.channel) {
        try { comm.channel.close(); } catch (_) {}
        comm.channel = null;
      }

      window.removeEventListener('storage', onLocalStorage);
    }

    function stopAllComm(sendLeave = true) {
      if (comm.transport === 'local') {
        stopLocalTransport(sendLeave);
      } else if (comm.transport === 'firebase') {
        stopFirebaseTransport(sendLeave);
      }

      comm.transport = 'none';
      comm.transportState = 'off';
      comm.roomCode = '';
      comm.currentSendLock = null;
      comm.receiveWindowUntil = 0;
      comm.lastAppliedLockId = '';
      comm.members = new Map();
      stopLocalPresenceTimer();
      clearInterval(comm.heartbeatTimer);
      clearInterval(comm.roomCleanupTimer);
      clearInterval(comm.localCleanupTimer);
      comm.heartbeatTimer = null;
      comm.roomCleanupTimer = null;
      comm.localCleanupTimer = null;

      updatePeerButtonUi();
      updatePeerMenuUi();
    }

    function onBeforeUnload() {
      if (comm.transport === 'local') {
        stopLocalTransport(true);
      } else if (comm.transport === 'firebase') {
        stopFirebaseTransport(true);
      }
    }

    function getActiveSendLock() {
      const lock = comm.currentSendLock;
      if (!lock) return null;
      const exp = typeof lock.expiresAtMs === 'number' ? lock.expiresAtMs : 0;
      if (exp && Date.now() > exp) return null;
      return lock;
    }

    function maybeApplyReceiveFromCurrentLock() {
      const lock = getActiveSendLock();
      if (!lock) return;
      if (lock.ownerId === comm.clientId) return;
      if (Date.now() > comm.receiveWindowUntil) return;
      if (comm.lastAppliedLockId === lock.id) return;
      comm.lastAppliedLockId = lock.id;
      applyShareableSettingsSnapshot(lock.payload);
      showToast('設定を受信した');
    }

    function claimLocalSendLock(snapshot) {
      const now = Date.now();
      const lock = getActiveSendLock();
      if (lock && lock.ownerId !== comm.clientId) return null;

      const newLock = {
        id: makeId(),
        ownerId: comm.clientId,
        ownerName: getDisplayName(),
        payload: snapshot,
        expiresAtMs: now + 10000,
        createdAtMs: now
      };

      comm.currentSendLock = newLock;
      postLocalPacket({ type: 'send-lock', room: comm.roomCode, lock: newLock });
      maybeApplyReceiveFromCurrentLock();
      updatePeerMenuUi();
      return newLock;
    }

    async function claimFirebaseSendLock(snapshot) {
      const now = Date.now();
      const roomRef = comm.roomRef;
      if (!roomRef) return null;

      let claimed = null;

      await runTransaction(db, async (tx) => {
        const snap = await tx.get(roomRef);
        const data = snap.data() || {};
        const lock = data.sendLock || null;
        const exp = lock && typeof lock.expiresAtMs === 'number' ? lock.expiresAtMs : 0;
        if (lock && exp > now && lock.ownerId !== comm.clientId) {
          throw new Error(lock.ownerName || '他の人');
        }

        claimed = {
          id: makeId(),
          ownerId: comm.clientId,
          ownerName: getDisplayName(),
          payload: snapshot,
          expiresAtMs: now + 10000,
          createdAtMs: now
        };

        tx.set(roomRef, {
          sendLock: claimed,
          updatedAtMs: now
        }, { merge: true });
      });

      comm.currentSendLock = claimed;
      maybeApplyReceiveFromCurrentLock();
      updatePeerMenuUi();
      return claimed;
    }

    function claimSendLock(snapshot) {
      if (comm.transport === 'local') return claimLocalSendLock(snapshot);
      if (comm.transport === 'firebase') return claimFirebaseSendLock(snapshot);
      return null;
    }

    function sendCurrentSettings() {
      const snapshot = getShareableSettingsSnapshot();
      const lock = getActiveSendLock();
      if (lock && lock.ownerId !== comm.clientId) {
        showToast(`${truncateName(lock.ownerName)}が送信中…`);
        return;
      }

      const result = claimSendLock(snapshot);
      if (result && typeof result.then === 'function') {
        result.then(() => {
          showToast('設定を送った');
        }).catch((err) => {
          showToast('送れなかった');
        });
      } else if (result) {
        showToast('設定を送った');
      } else {
        showToast('通信先を選んで');
      }
    }

    function handleIncomingPacket(packet, transport) {
      if (!packet || typeof packet !== 'object') return;
      if (!rememberPacket(packet.id || packet.messageId || packet.eventId || makeId())) return;

      if (packet.room && packet.room !== comm.roomCode) return;
      if (packet.senderId === comm.clientId) return;

      if (packet.type === 'presence') {
        const id = packet.id || packet.senderId;
        if (!id) return;
        comm.members.set(id, {
          id,
          name: sanitizeDisplayName(packet.name),
          lastSeenMs: typeof packet.lastSeenMs === 'number' ? packet.lastSeenMs : Date.now()
        });
        updatePeerMenuUi();
        return;
      }

      if (packet.type === 'leave') {
        const id = packet.id || packet.senderId;
        if (id) comm.members.delete(id);
        updatePeerMenuUi();
        return;
      }

      if (packet.type === 'send-lock') {
        const lock = packet.lock || null;
        if (!lock) return;
        comm.currentSendLock = lock;
        updatePeerMenuUi();
        maybeApplyReceiveFromCurrentLock();
        return;
      }

      if (packet.type === 'effect') {
        handleRemoteEffect(packet);
        return;
      }
    }

    function handleRemoteEffect(packet) {
      const kind = packet.kind;
      const payload = packet.payload || {};
      if (kind === 'tap') {
        if (typeof payload.x === 'number' && typeof payload.y === 'number') {
          addTapEffect(payload.x, payload.y, false);
        }
      } else if (kind === 'swipe') {
        const from = payload.from || null;
        const to = payload.to || null;
        const dir = payload.dir || null;
        if (from && to && dir &&
            typeof from.x === 'number' && typeof from.y === 'number' &&
            typeof to.x === 'number' && typeof to.y === 'number' &&
            typeof dir.x === 'number' && typeof dir.y === 'number') {
          createSwipeEffect(from.x, from.y, dir.x * 100, dir.y * 100, false, {
            forceFrom: from,
            forceTo: to,
            forceRadius: typeof payload.radius === 'number' ? payload.radius : undefined
          });
        }
      } else if (kind === 'loop') {
        if (Array.isArray(payload.points)) {
          const points = payload.points
            .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number')
            .map(p => ({ x: p.x, y: p.y }));
          if (points.length >= 3) createLoopEffect(points, false);
        }
      }
    }

    function publishEffect(kind, payload) {
      const packet = {
        type: 'effect',
        kind,
        payload,
        senderId: comm.clientId,
        senderName: getDisplayName(),
        room: comm.roomCode,
        id: makeId(),
        createdAtMs: Date.now()
      };

      if (comm.transport === 'local') {
        postLocalPacket(packet);
      } else if (comm.transport === 'firebase' && comm.eventsCol) {
        addDoc(comm.eventsCol, packet).catch(() => {});
      }
    }

    function addTapEffect(x, y, broadcast = true) {
      effects.push({
        type: 'tap',
        x,
        y,
        start: nowMs(),
        duration: 650
      });

      if (broadcast && comm.transport !== 'none') {
        publishEffect('tap', { x, y });
      }
    }

    function createSwipeEffect(startX, startY, dirX, dirY, broadcast = true, forced = null) {
      const len = Math.hypot(dirX, dirY) || 1;
      dirX /= len;
      dirY /= len;

      const pad = 90;
      const minX = -pad;
      const minY = -pad;
      const maxX = w + pad;
      const maxY = h + pad;

      const hits = [];

      function pushCandidate(t, x, y) {
        if (x >= minX - 0.5 && x <= maxX + 0.5 && y >= minY - 0.5 && y <= maxY + 0.5) {
          hits.push({ t, x, y });
        }
      }

      if (forced && forced.forceFrom && forced.forceTo) {
        hits.push(
          { t: 0, x: forced.forceFrom.x, y: forced.forceFrom.y },
          { t: 1, x: forced.forceTo.x, y: forced.forceTo.y }
        );
      } else {
        if (Math.abs(dirX) > 1e-6) {
          let t = (minX - startX) / dirX;
          pushCandidate(t, minX, startY + dirY * t);
          t = (maxX - startX) / dirX;
          pushCandidate(t, maxX, startY + dirY * t);
        }

        if (Math.abs(dirY) > 1e-6) {
          let t = (minY - startY) / dirY;
          pushCandidate(t, startX + dirX * t, minY);
          t = (maxY - startY) / dirY;
          pushCandidate(t, startX + dirX * t, maxY);
        }

        if (hits.length < 2) {
          hits.push(
            { t: -400, x: startX - dirX * 400, y: startY - dirY * 400 },
            { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 }
          );
        } else {
          hits.sort((a, b) => a.t - b.t);
        }
      }

      const first = forced && forced.forceFrom ? forced.forceFrom : hits[0];
      const last = forced && forced.forceTo ? forced.forceTo : hits[hits.length - 1];
      const travel = distance(first.x, first.y, last.x, last.y);
      const duration = clamp(460 + travel * 0.12, 520, 900);

      const radius = typeof (forced && forced.forceRadius) === 'number'
        ? forced.forceRadius
        : clamp(Math.min(w, h) * 0.045, 18, 38);

      effects.push({
        type: 'swipe',
        start: nowMs(),
        duration,
        from: { x: first.x, y: first.y },
        to: { x: last.x, y: last.y },
        dir: { x: dirX, y: dirY },
        radius
      });

      if (broadcast && comm.transport !== 'none') {
        publishEffect('swipe', {
          from: { x: first.x, y: first.y },
          to: { x: last.x, y: last.y },
          dir: { x: dirX, y: dirY },
          radius
        });
      }
    }

    function createLoopEffect(points, broadcast = true) {
      if (points.length < 3) return;

      const copy = points.map(p => ({ x: p.x, y: p.y }));
      effects.push({
        type: 'loop',
        start: nowMs(),
        duration: 420,
        points: copy
      });

      if (broadcast && comm.transport !== 'none') {
        publishEffect('loop', { points: copy });
      }
    }

    function detectLoop(points, currentX, currentY) {
      if (points.length < LASSO_MIN_POINTS) return false;

      const n = points.length;
      const safeEnd = Math.max(0, n - 1 - LASSO_IGNORE_RECENT_SEGMENTS);

      for (let i = 0; i < safeEnd - 1; i++) {
        const a = points[i];
        const b = points[i + 1];
        const d = pointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
        if (d <= LASSO_HIT_RADIUS) {
          let traveled = 0;
          for (let k = i; k < n - 1; k++) {
            traveled += distance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
            if (traveled > 40) break;
          }
          if (traveled > 40) return true;
        }
      }

      return false;
    }

    function drawGrid() {
      if (!settings.gridEnabled) return;

      const baseColor = getGridBaseColor();
      const lineLow = hexToRgba(baseColor, 0.40) || (darkMode ? 'rgba(34,34,34,0.40)' : 'rgba(232,232,232,0.40)');
      const lineHigh = hexToRgba(baseColor, 0.56) || (darkMode ? 'rgba(58,58,58,0.56)' : 'rgba(210,210,210,0.56)');

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = 1;

      for (let x = 0; x <= w + settings.gridSpacing; x += settings.gridSpacing) {
        const isAccent = Math.round(x / settings.gridSpacing) % 4 === 0;
        ctx.strokeStyle = isAccent ? lineHigh : lineLow;
        ctx.beginPath();
        ctx.moveTo(Math.floor(x) + 0.5, 0);
        ctx.lineTo(Math.floor(x) + 0.5, h);
        ctx.stroke();
      }

      for (let y = 0; y <= h + settings.gridSpacing; y += settings.gridSpacing) {
        const isAccent = Math.round(y / settings.gridSpacing) % 4 === 0;
        ctx.strokeStyle = isAccent ? lineHigh : lineLow;
        ctx.beginPath();
        ctx.moveTo(0, Math.floor(y) + 0.5);
        ctx.lineTo(w, Math.floor(y) + 0.5);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawTap(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;

      const e = easeOutCubic(p);
      const radius = lerp(10, Math.max(w, h) * 0.22, e);
      const alpha = 0.34 * Math.pow(1 - p, 1.7);
      const baseColor = getTapBaseColor();

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = radius * 0.22;
      ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(70, 255, 120, 0.55)';

      const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
      g.addColorStop(0.00, hexToRgba(baseColor, 0.92) || 'rgba(70, 255, 120, 0.92)');
      g.addColorStop(0.28, hexToRgba(baseColor, 0.60) || 'rgba(60, 235, 110, 0.60)');
      g.addColorStop(0.68, hexToRgba(baseColor, 0.25) || 'rgba(50, 220, 100, 0.25)');
      g.addColorStop(1.00, hexToRgba(baseColor, 0.00) || 'rgba(50, 220, 100, 0)');

      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawSwipe(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;

      const e = easeOutCubic(p);
      const x = lerp(effect.from.x, effect.to.x, e);
      const y = lerp(effect.from.y, effect.to.y, e);

      const trailSteps = 16;
      const trailSpacing = effect.radius * 0.82;
      const baseColor = getSwipeBaseColor();

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';

      for (let i = trailSteps; i >= 0; i--) {
        const back = i * trailSpacing;
        const px = x - effect.dir.x * back;
        const py = y - effect.dir.y * back;
        const a = 0.24 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, 0.35);
        if (a <= 0.001) continue;

        const r = effect.radius * (1 + (trailSteps - i) * 0.02);

        ctx.globalAlpha = a;
        ctx.shadowBlur = r * 0.35;
        ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(90, 150, 255, 0.55)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 0.45 * Math.pow(1 - p, 0.7);
      ctx.shadowBlur = effect.radius * 0.6;
      ctx.shadowColor = hexToRgba(baseColor, 0.45) || 'rgba(110, 165, 255, 0.45)';
      ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
      ctx.beginPath();
      ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawLoop(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;
      if (effect.points.length < 3) return;

      const alpha = 0.36 * Math.pow(1 - p, 2.0);
      const blur = 8 * Math.pow(1 - p, 0.55);
      const baseColor = getLoopBaseColor();

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = blur;
      ctx.shadowColor = hexToRgba(baseColor, 0.40) || 'rgba(255, 60, 60, 0.40)';
      ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(255, 78, 78, 1)';

      ctx.beginPath();
      ctx.moveTo(effect.points[0].x, effect.points[0].y);
      for (let i = 1; i < effect.points.length; i++) {
        ctx.lineTo(effect.points[i].x, effect.points[i].y);
      }
      ctx.closePath();
      ctx.fill('evenodd');

      ctx.restore();
    }

    function render() {
      const t = nowMs();

      ctx.fillStyle = getBgColor();
      ctx.fillRect(0, 0, w, h);

      drawGrid();

      for (let i = 0; i < effects.length; i++) {
        const effect = effects[i];
        if (effect.type === 'tap') drawTap(effect, t);
        else if (effect.type === 'swipe') drawSwipe(effect, t);
        else if (effect.type === 'loop') drawLoop(effect, t);
      }

      for (let i = effects.length - 1; i >= 0; i--) {
        if (t - effects[i].start >= effects[i].duration) effects.splice(i, 1);
      }

      requestAnimationFrame(render);
    }

    function setShareableInputsFromSettings() {
      bgMode.value = settings.bgMode;
      bgCustomInput.value = settings.bgCustom;
      bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');

      tapColorInput.value = settings.tapColor;
      swipeColorInput.value = settings.swipeColor;
      loopColorInput.value = settings.loopColor;

      gridToggle.checked = settings.gridEnabled;
      gridDetails.classList.toggle('disabled', !settings.gridEnabled);

      gridMode.value = settings.gridMode;
      gridCustomInput.value = settings.gridCustom;
      gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');

      spacingRange.value = String(settings.gridSpacing);
      spacingValue.textContent = String(settings.gridSpacing);

      displayNameInput.value = settings.displayName;
    }

    function syncSettingsUi() {
      setShareableInputsFromSettings();
      updateSettingsUiAvailability();
      updatePeerButtonUi();
      updatePeerMenuUi();
    }

    function updateSettingsUiAvailability() {
      const enabled = !!settings.peerButtonVisible;
      nameBlock.classList.toggle('disabled', !enabled);
      displayNameInput.disabled = !enabled;
      peerButtonToggle.checked = enabled;
    }

    function getVisibleMemberChips() {
      const list = currentVisibleMembers();
      const chipNodes = [];
      for (const member of list) {
        const chip = document.createElement('span');
        chip.className = 'peer-chip' + (member.id === comm.clientId ? ' self' : '');
        chip.textContent = member.name;
        chipNodes.push(chip);
      }
      return chipNodes;
    }

    function updatePeerMenuUi() {
      const connected = comm.transport !== 'none';
      peerTopbar.classList.toggle('open', connected && peerMenuOverlay.classList.contains('open'));
      peerNamesList.innerHTML = '';
      for (const chip of getVisibleMemberChips()) peerNamesList.appendChild(chip);

      if (!connected) {
        peerChoiceLabel1.textContent = 'ローカルで\n通信';
        peerChoiceLabel2.textContent = 'Firebaseで\n通信';
        peerChoiceLabel3.textContent = '閉じる';
        peerChoice1.className = 'peer-choice wifi';
        peerChoice2.className = 'peer-choice firebase';
        peerChoice3.className = 'peer-choice close';
        return;
      }

      const lock = getActiveSendLock();
      peerChoiceLabel1.textContent = '接続を\n切断';

      if (lock && lock.ownerId !== comm.clientId) {
        peerChoiceLabel2.textContent = `${truncateName(lock.ownerName)}が\n送信中…`;
        peerChoice2.className = 'peer-choice send disabledChoice';
      } else if (lock && lock.ownerId === comm.clientId) {
        peerChoiceLabel2.textContent = '送信中…';
        peerChoice2.className = 'peer-choice send disabledChoice';
      } else {
        peerChoiceLabel2.textContent = '設定を\n送信';
        peerChoice2.className = 'peer-choice send';
      }

      peerChoiceLabel3.textContent = '設定を\n受信';
      peerChoice1.className = 'peer-choice disconnect';
      peerChoice3.className = 'peer-choice receive';
    }

    function truncateName(name) {
      const s = String(name || '').trim();
      return s.length > 8 ? s.slice(0, 8) + '…' : s;
    }

    function currentVisibleMembers() {
      const now = Date.now();
      const list = [];
      for (const [id, info] of comm.members.entries()) {
        if (!info) continue;
        const seen = typeof info.lastSeenMs === 'number' ? info.lastSeenMs : 0;
        if (id === comm.clientId || now - seen <= 12000) {
          list.push({ id, name: sanitizeDisplayName(info.name), lastSeenMs: seen });
        }
      }
      list.sort((a, b) => {
        if (a.id === comm.clientId) return -1;
        if (b.id === comm.clientId) return 1;
        return (b.lastSeenMs || 0) - (a.lastSeenMs || 0);
      });
      return list;
    }

    function getActiveSendLock() {
      const lock = comm.currentSendLock;
      if (!lock) return null;
      const exp = typeof lock.expiresAtMs === 'number' ? lock.expiresAtMs : 0;
      if (exp && Date.now() > exp) return null;
      return lock;
    }

    function maybeApplyReceiveFromCurrentLock() {
      const lock = getActiveSendLock();
      if (!lock) return;
      if (lock.ownerId === comm.clientId) return;
      if (Date.now() > comm.receiveWindowUntil) return;
      if (comm.lastAppliedLockId === lock.id) return;
      comm.lastAppliedLockId = lock.id;
      applyShareableSettingsSnapshot(lock.payload);
      showToast('設定を受信した');
    }

    function purgeExpiredSendLock() {
      const lock = comm.currentSendLock;
      if (!lock) return;
      const exp = typeof lock.expiresAtMs === 'number' ? lock.expiresAtMs : 0;
      if (exp && Date.now() > exp) {
        comm.currentSendLock = null;
        updatePeerMenuUi();
      }
    }

    function refreshOwnMemberEntry() {
      comm.members.set(comm.clientId, {
        id: comm.clientId,
        name: getDisplayName(),
        lastSeenMs: Date.now()
      });
    }

    function claimLocalSendLock(snapshot) {
      const now = Date.now();
      const lock = getActiveSendLock();
      if (lock && lock.ownerId !== comm.clientId) return null;

      const newLock = {
        id: makeId(),
        ownerId: comm.clientId,
        ownerName: getDisplayName(),
        payload: snapshot,
        expiresAtMs: now + 10000,
        createdAtMs: now
      };

      comm.currentSendLock = newLock;
      postLocalPacket({ type: 'send-lock', room: comm.roomCode, lock: newLock });
      updatePeerMenuUi();
      maybeApplyReceiveFromCurrentLock();
      return newLock;
    }

    async function claimFirebaseSendLock(snapshot) {
      const now = Date.now();
      const roomRef = comm.roomRef;
      if (!roomRef) return null;

      let claimed = null;

      await runTransaction(db, async (tx) => {
        const snap = await tx.get(roomRef);
        const data = snap.data() || {};
        const lock = data.sendLock || null;
        const exp = lock && typeof lock.expiresAtMs === 'number' ? lock.expiresAtMs : 0;
        if (lock && exp > now && lock.ownerId !== comm.clientId) {
          throw new Error(lock.ownerName || '他の人');
        }

        claimed = {
          id: makeId(),
          ownerId: comm.clientId,
          ownerName: getDisplayName(),
          payload: snapshot,
          expiresAtMs: now + 10000,
          createdAtMs: now
        };

        tx.set(roomRef, {
          sendLock: claimed,
          updatedAtMs: now
        }, { merge: true });
      });

      comm.currentSendLock = claimed;
      updatePeerMenuUi();
      maybeApplyReceiveFromCurrentLock();
      return claimed;
    }

    function claimSendLock(snapshot) {
      if (comm.transport === 'local') return claimLocalSendLock(snapshot);
      if (comm.transport === 'firebase') return claimFirebaseSendLock(snapshot);
      return null;
    }

    function sendCurrentSettings() {
      const snapshot = getShareableSettingsSnapshot();
      const lock = getActiveSendLock();

      if (lock && lock.ownerId !== comm.clientId) {
        showToast(`${truncateName(lock.ownerName)}が送信中…`);
        return;
      }

      const result = claimSendLock(snapshot);
      if (result && typeof result.then === 'function') {
        result.then(() => {
          showToast('設定を送った');
        }).catch(() => {
          showToast('送れなかった');
        });
      } else if (result) {
        showToast('設定を送った');
      } else {
        showToast('通信先を選んで');
      }
    }

    function handleIncomingPacket(packet, transport) {
      if (!packet || typeof packet !== 'object') return;
      const id = packet.id || packet.messageId || packet.eventId;
      if (!rememberPacket(id || makeId())) return;

      if (packet.room && packet.room !== comm.roomCode) return;
      if (packet.senderId === comm.clientId) return;

      if (packet.type === 'presence') {
        const memberId = packet.id || packet.senderId;
        if (!memberId) return;
        comm.members.set(memberId, {
          id: memberId,
          name: sanitizeDisplayName(packet.name),
          lastSeenMs: typeof packet.lastSeenMs === 'number' ? packet.lastSeenMs : Date.now()
        });
        updatePeerMenuUi();
        return;
      }

      if (packet.type === 'leave') {
        const memberId = packet.id || packet.senderId;
        if (memberId) comm.members.delete(memberId);
        updatePeerMenuUi();
        return;
      }

      if (packet.type === 'send-lock') {
        const lock = packet.lock || null;
        if (!lock) return;
        comm.currentSendLock = lock;
        updatePeerMenuUi();
        maybeApplyReceiveFromCurrentLock();
        return;
      }

      if (packet.type === 'effect') {
        handleRemoteEffect(packet);
        return;
      }
    }

    function publishEffect(kind, payload) {
      const packet = {
        type: 'effect',
        kind,
        payload,
        senderId: comm.clientId,
        senderName: getDisplayName(),
        room: comm.roomCode,
        id: makeId(),
        createdAtMs: Date.now()
      };

      if (comm.transport === 'local') {
        postLocalPacket(packet);
      } else if (comm.transport === 'firebase' && comm.eventsCol) {
        addDoc(comm.eventsCol, packet).catch(() => {});
      }
    }

    function handleRemoteEffect(packet) {
      const kind = packet.kind;
      const payload = packet.payload || {};
      if (kind === 'tap') {
        if (typeof payload.x === 'number' && typeof payload.y === 'number') {
          addTapEffect(payload.x, payload.y, false);
        }
      } else if (kind === 'swipe') {
        const from = payload.from || null;
        const to = payload.to || null;
        const dir = payload.dir || null;
        if (from && to && dir &&
            typeof from.x === 'number' && typeof from.y === 'number' &&
            typeof to.x === 'number' && typeof to.y === 'number' &&
            typeof dir.x === 'number' && typeof dir.y === 'number') {
          createSwipeEffect(from.x, from.y, dir.x * 100, dir.y * 100, false, {
            forceFrom: from,
            forceTo: to,
            forceRadius: typeof payload.radius === 'number' ? payload.radius : undefined
          });
        }
      } else if (kind === 'loop') {
        if (Array.isArray(payload.points)) {
          const points = payload.points
            .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number')
            .map(p => ({ x: p.x, y: p.y }));
          if (points.length >= 3) createLoopEffect(points, false);
        }
      }
    }

    function postLocalPacket(packet) {
      packet.room = comm.roomCode;
      packet.id = packet.id || makeId();
      packet.senderId = packet.senderId || comm.clientId;
      packet.senderName = packet.senderName || getDisplayName();
      packet.createdAtMs = packet.createdAtMs || Date.now();

      if (comm.channel) {
        try { comm.channel.postMessage(packet); } catch (_) {}
      }

      try {
        localStorage.setItem(comm.localBusKey, JSON.stringify(packet));
      } catch (_) {}
    }

    function onLocalStorage(ev) {
      if (ev.key !== comm.localBusKey || !ev.newValue) return;
      try {
        handleIncomingPacket(JSON.parse(ev.newValue), 'local');
      } catch (_) {}
    }

    function startLocalPresenceTimer() {
      stopLocalPresenceTimer();
      localPresenceTimer = setInterval(() => {
        if (comm.transport !== 'local') return;
        refreshOwnMemberEntry();
        postLocalPacket({
          type: 'presence',
          room: comm.roomCode,
          id: comm.clientId,
          name: getDisplayName(),
          lastSeenMs: Date.now()
        });
      }, 2500);
    }

    function stopLocalPresenceTimer() {
      clearInterval(localPresenceTimer);
      localPresenceTimer = null;
    }

    async function openLocalConnection(code) {
      stopAllComm(false);
      comm.transport = 'local';
      comm.transportState = 'searching';
      comm.roomCode = code;
      comm.localBusKey = LOCAL_BUS_PREFIX + code;
      comm.members = new Map();
      comm.currentSendLock = null;
      comm.receiveWindowUntil = 0;
      comm.lastAppliedLockId = '';
      comm.members.set(comm.clientId, { id: comm.clientId, name: getDisplayName(), lastSeenMs: Date.now() });

      const channelName = LOCAL_ROOM_PREFIX + code;
      if ('BroadcastChannel' in window) {
        try {
          comm.channel = new BroadcastChannel(channelName);
          comm.channel.onmessage = (ev) => handleIncomingPacket(ev.data, 'local');
        } catch (_) {
          comm.channel = null;
        }
      }

      window.addEventListener('storage', onLocalStorage);
      window.addEventListener('beforeunload', onBeforeUnload, { once: true });

      refreshOwnMemberEntry();
      postLocalPacket({ type: 'presence', room: comm.roomCode, id: comm.clientId, name: getDisplayName(), lastSeenMs: Date.now() });
      startLocalPresenceTimer();
      startCleanupTimer();

      comm.transportState = 'connected';
      updatePeerButtonUi();
      updatePeerMenuUi();
    }

    async function openFirebaseConnection(code) {
      stopAllComm(false);
      comm.transport = 'firebase';
      comm.transportState = 'searching';
      comm.roomCode = code;
      comm.members = new Map();
      comm.currentSendLock = null;
      comm.receiveWindowUntil = 0;
      comm.lastAppliedLockId = '';
      comm.roomRef = doc(db, 'rooms', code);
      comm.membersCol = collection(comm.roomRef, 'members');
      comm.eventsCol = collection(comm.roomRef, 'events');
      comm.memberRef = doc(comm.membersCol, comm.clientId);

      await setDoc(comm.roomRef, {
        roomCode: code,
        createdAtMs: Date.now(),
        updatedAtMs: Date.now()
      }, { merge: true });

      await setDoc(comm.memberRef, {
        clientId: comm.clientId,
        name: getDisplayName(),
        roomCode: code,
        lastSeenMs: Date.now(),
        joinedAtMs: Date.now()
      }, { merge: true });

      comm.unsubMembers = onSnapshot(query(comm.membersCol, orderBy('joinedAtMs', 'asc')), (snap) => {
        const next = new Map();
        next.set(comm.clientId, { id: comm.clientId, name: getDisplayName(), lastSeenMs: Date.now() });

        snap.forEach((docSnap) => {
          const data = docSnap.data() || {};
          const id = docSnap.id;
          const name = sanitizeDisplayName(data.name);
          const lastSeenMs = typeof data.lastSeenMs === 'number' ? data.lastSeenMs : 0;
          if (id === comm.clientId || Date.now() - lastSeenMs <= 12000) {
            next.set(id, { id, name, lastSeenMs });
          }
        });

        comm.members = next;
        updatePeerMenuUi();
      });

      comm.unsubRoom = onSnapshot(comm.roomRef, (snap) => {
        const data = snap.data() || {};
        const lock = data.sendLock || null;
        comm.currentSendLock = lock && typeof lock === 'object' ? lock : null;
        purgeExpiredSendLock();
        updatePeerMenuUi();
        maybeApplyReceiveFromCurrentLock();
      });

      comm.unsubEvents = onSnapshot(query(comm.eventsCol, orderBy('createdAtMs', 'asc')), (snap) => {
        snap.docChanges().forEach((change) => {
          if (change.type !== 'added') return;
          const data = change.doc.data() || {};
          handleIncomingPacket({ ...data, id: change.doc.id }, 'firebase');
        });
      });

      comm.heartbeatTimer = setInterval(() => {
        if (comm.transport !== 'firebase' || !comm.memberRef) return;
        setDoc(comm.memberRef, {
          name: getDisplayName(),
          roomCode: comm.roomCode,
          lastSeenMs: Date.now()
        }, { merge: true }).catch(() => {});
      }, 2500);

      startCleanupTimer();
      window.addEventListener('beforeunload', onBeforeUnload, { once: true });

      comm.transportState = 'connected';
      updatePeerButtonUi();
      updatePeerMenuUi();
      refreshOwnMemberEntry();
    }

    function startCleanupTimer() {
      clearInterval(comm.roomCleanupTimer);
      comm.roomCleanupTimer = setInterval(() => {
        if (comm.transport === 'none') return;
        purgeStaleMembers();
        purgeExpiredSendLock();
      }, 1000);
      comm.localCleanupTimer = comm.roomCleanupTimer;
    }

    function stopFirebaseTransport(sendLeave = false) {
      clearInterval(comm.heartbeatTimer);
      comm.heartbeatTimer = null;

      if (sendLeave && comm.memberRef) {
        deleteDoc(comm.memberRef).catch(() => {});
      }

      if (comm.unsubMembers) comm.unsubMembers();
      if (comm.unsubRoom) comm.unsubRoom();
      if (comm.unsubEvents) comm.unsubEvents();
      comm.unsubMembers = null;
      comm.unsubRoom = null;
      comm.unsubEvents = null;

      comm.roomRef = null;
      comm.membersCol = null;
      comm.eventsCol = null;
      comm.memberRef = null;
    }

    function stopLocalTransport(sendLeave = false) {
      stopLocalPresenceTimer();

      if (sendLeave) {
        postLocalPacket({ type: 'leave', room: comm.roomCode, id: comm.clientId });
      }

      if (comm.channel) {
        try { comm.channel.close(); } catch (_) {}
        comm.channel = null;
      }

      window.removeEventListener('storage', onLocalStorage);
    }

    function stopAllComm(sendLeave = true) {
      if (comm.transport === 'local') {
        stopLocalTransport(sendLeave);
      } else if (comm.transport === 'firebase') {
        stopFirebaseTransport(sendLeave);
      }

      comm.transport = 'none';
      comm.transportState = 'off';
      comm.roomCode = '';
      comm.currentSendLock = null;
      comm.receiveWindowUntil = 0;
      comm.lastAppliedLockId = '';
      comm.members = new Map();
      clearInterval(comm.heartbeatTimer);
      clearInterval(comm.roomCleanupTimer);
      clearInterval(comm.localCleanupTimer);
      comm.heartbeatTimer = null;
      comm.roomCleanupTimer = null;
      comm.localCleanupTimer = null;

      updatePeerButtonUi();
      updatePeerMenuUi();
    }

    function onBeforeUnload() {
      if (comm.transport === 'local') {
        stopLocalTransport(true);
      } else if (comm.transport === 'firebase') {
        stopFirebaseTransport(true);
      }
    }

    function openPeerConnectionFlow(mode) {
      connectMode = mode;
      closePeerMenu();
      openConnectDialog(mode);
    }

    function startTransportFromDialog() {
      const raw = roomCodeInput.value.trim();
      if (!raw) {
        showToast('文字を入れて');
        return;
      }

      const code = raw.replace(/\s+/g, '').slice(0, 32);
      if (!code) {
        showToast('文字を入れて');
        return;
      }

      closeConnectDialog();

      if (connectMode === 'local') {
        openLocalConnection(code).then(() => {
          showToast('ローカル通信に参加した');
        }).catch(() => {
          showToast('参加できなかった');
        });
      } else {
        openFirebaseConnection(code).then(() => {
          showToast('Firebase通信に参加した');
        }).catch(() => {
          showToast('参加できなかった');
          stopAllComm(false);
        });
      }
    }

    function handlePeerButtonClick() {
      if (!settings.peerButtonVisible) return;

      if (comm.transportState === 'searching') {
        stopAllComm(true);
        showToast('キャンセルした');
        return;
      }

      if (comm.transport === 'none') {
        openPeerMenu();
        return;
      }

      openPeerMenu();
    }

    function resetAllSettings() {
      const ok = window.confirm('設定を初期状態に戻します。よろしいですか？');
      if (!ok) return;

      Object.assign(settings, defaults);
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (_) {}
      if (comm.transport !== 'none') stopAllComm(true);
      syncSettingsUi();
      document.body.style.background = getBgColor();
    }

    bgMode.addEventListener('change', () => {
      settings.bgMode = bgMode.value;
      bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');
      document.body.style.background = getBgColor();
      saveSettings();
    });

    bgCustomInput.addEventListener('input', () => {
      settings.bgCustom = bgCustomInput.value.trim();
      document.body.style.background = getBgColor();
      saveSettings();
    });

    tapColorInput.addEventListener('input', () => {
      settings.tapColor = tapColorInput.value.trim();
      saveSettings();
    });

    swipeColorInput.addEventListener('input', () => {
      settings.swipeColor = swipeColorInput.value.trim();
      saveSettings();
    });

    loopColorInput.addEventListener('input', () => {
      settings.loopColor = loopColorInput.value.trim();
      saveSettings();
    });

    gridToggle.addEventListener('change', () => {
      settings.gridEnabled = gridToggle.checked;
      gridDetails.classList.toggle('disabled', !settings.gridEnabled);
      saveSettings();
    });

    gridMode.addEventListener('change', () => {
      settings.gridMode = gridMode.value;
      gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');
      saveSettings();
    });

    gridCustomInput.addEventListener('input', () => {
      settings.gridCustom = gridCustomInput.value.trim();
      saveSettings();
    });

    spacingRange.addEventListener('input', () => {
      settings.gridSpacing = clamp(Number(spacingRange.value) || 36, 18, 100);
      spacingValue.textContent = String(settings.gridSpacing);
      saveSettings();
    });

    peerButtonToggle.addEventListener('change', () => {
      settings.peerButtonVisible = peerButtonToggle.checked;
      if (!settings.peerButtonVisible) {
        stopAllComm(true);
      }
      updateSettingsUiAvailability();
      updatePeerButtonUi();
      updatePeerMenuUi();
      saveSettings();
    });

    displayNameInput.addEventListener('input', () => {
      settings.displayName = sanitizeDisplayName(displayNameInput.value);
      displayNameInput.value = settings.displayName;
      saveSettings();
      refreshOwnPresence();
      updatePeerMenuUi();
    });

    resetSettings.addEventListener('click', resetAllSettings);

    openSettings.addEventListener('click', () => openOverlay(overlay));
    closeSettings.addEventListener('click', () => closeOverlay(overlay));
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeOverlay(overlay);
    });

    peerButton.addEventListener('click', handlePeerButtonClick);

    peerMenuOverlay.addEventListener('click', (e) => {
      if (e.target === peerMenuOverlay) closePeerMenu();
    });

    peerChoice1.addEventListener('click', () => {
      if (comm.transport === 'none') {
        openPeerConnectionFlow('local');
      } else {
        stopAllComm(true);
        closePeerMenu();
        showToast('切断した');
      }
    });

    peerChoice2.addEventListener('click', () => {
      if (comm.transport === 'none') {
        openPeerConnectionFlow('firebase');
      } else {
        const lock = getActiveSendLock();
        if (lock && lock.ownerId !== comm.clientId) return;
        sendCurrentSettings();
      }
    });

    peerChoice3.addEventListener('click', () => {
      if (comm.transport === 'none') {
        closePeerMenu();
      } else {
        comm.receiveWindowUntil = Date.now() + 10000;
        maybeApplyReceiveFromCurrentLock();
        showToast('10秒以内の設定を待ってる');
      }
    });

    connectOverlay.addEventListener('click', (e) => {
      if (e.target === connectOverlay) closeConnectDialog();
    });

    connectJoinButton.addEventListener('click', startTransportFromDialog);
    connectCancelButton.addEventListener('click', closeConnectDialog);

    roomCodeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') startTransportFromDialog();
    });

    function openPeerMenuIfConnected() {
      openPeerMenu();
      updatePeerMenuUi();
    }

    function closePeerMenu() {
      closeOverlay(peerMenuOverlay);
      peerTopbar.classList.remove('open');
    }

    function openConnectDialog(mode) {
      connectMode = mode;
      roomCodeInput.value = '';
      if (mode === 'local') {
        connectTitle.textContent = 'ローカル通信';
        connectText.textContent = '同じ文字を入れた人とつながる';
      } else {
        connectTitle.textContent = 'Firebase通信';
        connectText.textContent = '同じ文字を入れた人とつながる';
      }
      openOverlay(connectOverlay);
      setTimeout(() => roomCodeInput.focus(), 50);
    }

    function closeConnectDialog() {
      closeOverlay(connectOverlay);
    }

    function openPeerMenu() {
      if (!settings.peerButtonVisible) return;
      updatePeerMenuUi();
      openOverlay(peerMenuOverlay);

      const rect = peerButton.getBoundingClientRect();
      const stageRect = document.getElementById('peerMenuStage').getBoundingClientRect();
      const stageW = stageRect.width || window.innerWidth;
      const stageH = stageRect.height || window.innerHeight;

      const anchorX = rect.left + rect.width / 2 - stageW / 2;
      const anchorY = rect.top + rect.height / 2 - stageH / 2;

      const setFrom = (el, tx, ty) => {
        el.style.setProperty('--from-x', `${anchorX}px`);
        el.style.setProperty('--from-y', `${anchorY}px`);
        el.style.setProperty('--to-x', `${tx}px`);
        el.style.setProperty('--to-y', `${ty}px`);
      };

      if (comm.transport === 'none') {
        peerChoice1.className = 'peer-choice wifi';
        peerChoice2.className = 'peer-choice firebase';
        peerChoice3.className = 'peer-choice close';
        peerChoiceLabel1.textContent = 'ローカルで\n通信';
        peerChoiceLabel2.textContent = 'Firebaseで\n通信';
        peerChoiceLabel3.textContent = '閉じる';
      } else {
        const lock = getActiveSendLock();
        peerChoice1.className = 'peer-choice disconnect';
        peerChoice3.className = 'peer-choice receive';

        if (lock && lock.ownerId !== comm.clientId) {
          peerChoice2.className = 'peer-choice send disabledChoice';
          peerChoiceLabel2.textContent = `${truncateName(lock.ownerName)}が\n送信中…`;
        } else if (lock && lock.ownerId === comm.clientId) {
          peerChoice2.className = 'peer-choice send disabledChoice';
          peerChoiceLabel2.textContent = '送信中…';
        } else {
          peerChoice2.className = 'peer-choice send';
          peerChoiceLabel2.textContent = '設定を\n送信';
        }

        peerChoiceLabel1.textContent = '接続を\n切断';
        peerChoiceLabel3.textContent = '設定を\n受信';
      }

      setFrom(peerChoice1, 0, -118);
      setFrom(peerChoice2, -118, 108);
      setFrom(peerChoice3, 118, 108);

      peerTopbar.classList.toggle('open', comm.transport !== 'none');
      updatePeerMenuUi();
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (overlay.classList.contains('open')) return;
      if (peerMenuOverlay.classList.contains('open')) return;
      if (connectOverlay.classList.contains('open')) return;
      if (activePointerId !== null) return;

      activePointerId = e.pointerId;
      canvas.setPointerCapture(activePointerId);

      const p = { x: e.clientX, y: e.clientY };
      pointerDownTime = nowMs();
      pointerDownPos = { x: p.x, y: p.y };
      lastPos = { x: p.x, y: p.y };
      strokePoints = [p];
      pointerHadLoop = false;

      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('pointermove', (e) => {
      if (activePointerId !== e.pointerId) return;

      const p = { x: e.clientX, y: e.clientY };
      const t = nowMs();

      if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
        strokePoints.push(p);
        lastPos = p;
      }

      if (t - lastLoopAt >= LASSO_COOLDOWN) {
        if (detectLoop(strokePoints, p.x, p.y)) {
          createLoopEffect(strokePoints);
          lastLoopAt = t;
          pointerHadLoop = true;
          strokePoints = [p];
        }
      }

      e.preventDefault();
    }, { passive: false });

    function finishPointer(e) {
      if (activePointerId !== e.pointerId) return;

      const p = { x: e.clientX, y: e.clientY };
      const elapsed = nowMs() - pointerDownTime;
      const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

      if (!pointerHadLoop) {
        if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
          addTapEffect(p.x, p.y);
        } else if (totalMove >= SWIPE_MIN_DISTANCE) {
          const dx = p.x - pointerDownPos.x;
          const dy = p.y - pointerDownPos.y;
          createSwipeEffect(p.x, p.y, dx, dy);
        }
      }

      activePointerId = null;
      strokePoints = [];
      pointerHadLoop = false;
      e.preventDefault();
    }

    canvas.addEventListener('pointerup', finishPointer, { passive: false });
    canvas.addEventListener('pointercancel', finishPointer, { passive: false });
    canvas.addEventListener('lostpointercapture', () => {
      activePointerId = null;
      strokePoints = [];
      pointerHadLoop = false;
    });

    const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    loadSettings();
    updateTheme();
    resize();
    syncSettingsUi();
    document.body.style.background = getBgColor();
    updatePeerButtonUi();
    updatePeerMenuUi();

    if (darkMql) {
      if (typeof darkMql.addEventListener === 'function') {
        darkMql.addEventListener('change', updateTheme);
      } else if (typeof darkMql.addListener === 'function') {
        darkMql.addListener(updateTheme);
      }
    }

    window.addEventListener('resize', resize);

    requestAnimationFrame(render);
  </script>
</body>
</html>
