      function setupRtcCommonHandlers() {
        if (!rtcPc) return;

        rtcPc.onicecandidate = () => {};

        rtcPc.onconnectionstatechange = () => {
          if (!rtcPc) return;
          if (rtcPc.connectionState === 'connected') {
            setPeerConnected('rtc');
            showToast('接続した');
          } else if (rtcPc.connectionState === 'failed' || rtcPc.connectionState === 'disconnected' || rtcPc.connectionState === 'closed') {
            if (peerState !== 'off') {
              showToast('接続が切れた');
              stopAllPeerFlows();
            }
          }
        };

        rtcPc.ondatachannel = (ev) => {
          rtcDc = ev.channel;
          rtcDc.onopen = () => {
            setPeerConnected('rtc');
            showToast('接続した');
          };
          rtcDc.onmessage = (msg) => handleRtcPacket(msg.data);
          rtcDc.onclose = () => {
            if (peerState !== 'off') {
              showToast('切断した');
              stopAllPeerFlows();
            }
          };
        };
      }

      async function createRtcHostOffer() {
        stopRtcTransport();

        rtcPc = new RTCPeerConnection({ iceServers: [] });
        rtcDc = rtcPc.createDataChannel('touch');

        setupRtcCommonHandlers();

        rtcDc.onopen = () => {
          setPeerConnected('rtc');
          showToast('接続した');
        };

        rtcDc.onmessage = (ev) => handleRtcPacket(ev.data);

        const offer = await rtcPc.createOffer();
        await rtcPc.setLocalDescription(offer);
        await waitForIceComplete(rtcPc);

        const payload = JSON.stringify({
          kind: 'offer',
          sdp: rtcPc.localDescription ? rtcPc.localDescription.sdp : ''
        });

        openQrOverlay(
          'QRコードを表示',
          '相手にこのQRを見せて、相手側で読み取ってもらってください。',
          payload,
          'QRを読み取る',
          () => {
            qrModeAfterScan = 'hostAnswer';
            openScanOverlay();
            startScanLoop();
          }
        );
      }

      async function createRtcAnswerFromOffer(offerText) {
        let offerData;
        try {
          offerData = JSON.parse(offerText);
        } catch (_) {
          throw new Error('QRが読めない');
        }

        if (!offerData || offerData.kind !== 'offer' || typeof offerData.sdp !== 'string') {
          throw new Error('offerではない');
        }

        stopRtcTransport();

        rtcPc = new RTCPeerConnection({ iceServers: [] });
        setupRtcCommonHandlers();

        rtcPc.ondatachannel = (ev) => {
          rtcDc = ev.channel;
          rtcDc.onopen = () => {
            setPeerConnected('rtc');
            showToast('接続した');
          };
          rtcDc.onmessage = (msg) => handleRtcPacket(msg.data);
          rtcDc.onclose = () => {
            if (peerState !== 'off') {
              showToast('切断した');
              stopAllPeerFlows();
            }
          };
        };

        const offerDesc = new RTCSessionDescription({ type: 'offer', sdp: offerData.sdp });
        await rtcPc.setRemoteDescription(offerDesc);

        const answer = await rtcPc.createAnswer();
        await rtcPc.setLocalDescription(answer);
        await waitForIceComplete(rtcPc);

        const answerPayload = JSON.stringify({
          kind: 'answer',
          sdp: rtcPc.localDescription ? rtcPc.localDescription.sdp : ''
        });

        openQrOverlay(
          '返答用QRを表示',
          '今度はこのQRを相手に見せて、相手側で読み取ってもらってください。',
          answerPayload,
          '閉じる',
          () => {
            qrModeAfterScan = null;
            closeQrOverlay();
          }
        );
      }

      async function finishRtcHostWithAnswer(answerText) {
        if (!rtcPc) throw new Error('未接続');

        let answerData;
        try {
          answerData = JSON.parse(answerText);
        } catch (_) {
          throw new Error('QRが読めない');
        }

        if (!answerData || answerData.kind !== 'answer' || typeof answerData.sdp !== 'string') {
          throw new Error('answerではない');
        }

        await rtcPc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerData.sdp }));
        if (rtcDc && rtcDc.readyState === 'open') {
          setPeerConnected('rtc');
        } else {
          setPeerSearching();
        }
        showToast('接続した');
        closeQrOverlay();
        closeScanOverlay();
      }

      function waitForIceComplete(pc) {
        return new Promise((resolve) => {
          if (!pc) {
            resolve();
            return;
          }
          if (pc.iceGatheringState === 'complete') {
            resolve();
            return;
          }
          const timer = setTimeout(() => {
            cleanup();
            resolve();
          }, 1800);

          const onState = () => {
            if (!pc) return;
            if (pc.iceGatheringState === 'complete') {
              cleanup();
              resolve();
            }
          };

          function cleanup() {
            clearTimeout(timer);
            pc.removeEventListener('icegatheringstatechange', onState);
          }

          pc.addEventListener('icegatheringstatechange', onState);
        });
      }

      async function handleScannedText(text) {
        scanInput.value = text;
        if (qrModeAfterScan === 'hostAnswer') {
          try {
            await finishRtcHostWithAnswer(text);
            qrModeAfterScan = null;
          } catch (_) {
            showToast('読み取りに失敗');
          }
          return;
        }

        try {
          const data = JSON.parse(text);
          if (data && data.kind === 'offer') {
            await createRtcAnswerFromOffer(text);
            qrModeAfterScan = null;
            closeScanOverlay();
            return;
          }
          if (data && data.kind === 'answer') {
            await finishRtcHostWithAnswer(text);
            qrModeAfterScan = null;
            return;
          }
        } catch (_) {}

        showToast('QRを読み込んだ');
      }

      function startScanLoop() {
        if (scanLoopRunning) return;
        scanLoopRunning = true;
        scanAcceptButton.textContent = '読み込む';

        if ('BarcodeDetector' in window) {
          try {
            scanDetector = new BarcodeDetector({ formats: ['qr_code'] });
          } catch (_) {
            scanDetector = null;
          }
        } else {
          scanDetector = null;
        }

        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && scanDetector) {
          scanFallback.textContent = 'カメラで読み取り中。うまくいかないときは文字列を貼り付けてください。';
          navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: 'environment',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          }).then((stream) => {
            scanStream = stream;
            scanVideo.srcObject = stream;
            scanVideo.play().catch(() => {});
            requestAnimationFrame(scanFrame);
          }).catch(() => {
            scanFallback.textContent = 'カメラが使えないので、文字列貼り付けで進めてください。';
            scanStream = null;
          });
        } else {
          scanFallback.textContent = 'この環境ではカメラ読み取りが使えないので、文字列貼り付けで進めてください。';
        }
      }

      function stopScanLoop() {
        scanLoopRunning = false;
        qrModeAfterScan = null;
        scanInput.value = '';
        if (scanStream) {
          for (const track of scanStream.getTracks()) track.stop();
          scanStream = null;
        }
        scanVideo.srcObject = null;
      }

      async function scanFrame() {
        if (!scanLoopRunning) return;
        if (!scanDetector || !scanVideo.videoWidth) {
          requestAnimationFrame(scanFrame);
          return;
        }

        try {
          const results = await scanDetector.detect(scanVideo);
          if (results && results.length > 0) {
            const raw = results[0].rawValue || '';
            if (raw.trim()) {
              await handleScannedText(raw.trim());
              return;
            }
          }
        } catch (_) {}

        requestAnimationFrame(scanFrame);
      }

      bgMode.addEventListener('change', () => {
        settings.bgMode = bgMode.value;
        bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');
        applyAndSave();
      });

      bgCustomInput.addEventListener('input', () => {
        settings.bgCustom = bgCustomInput.value.trim();
        applyAndSave();
      });

      tapColorInput.addEventListener('input', () => {
        settings.tapColor = tapColorInput.value.trim();
        saveSettings();
      });

      swipeColorInput.addEventListener('input', () => {
        settings.swipeColor = swipeColorInput.value.trim();
        saveSettings();
      });

      loopColorInput.addEventListener('input', () => {
        settings.loopColor = loopColorInput.value.trim();
        saveSettings();
      });

      gridToggle.addEventListener('change', () => {
        settings.gridEnabled = gridToggle.checked;
        gridDetails.classList.toggle('disabled', !settings.gridEnabled);
        saveSettings();
      });

      gridMode.addEventListener('change', () => {
        settings.gridMode = gridMode.value;
        gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');
        saveSettings();
      });

      gridCustomInput.addEventListener('input', () => {
        settings.gridCustom = gridCustomInput.value.trim();
        saveSettings();
      });

      spacingRange.addEventListener('input', () => {
        settings.gridSpacing = clamp(Number(spacingRange.value) || 36, 18, 100);
        spacingValue.textContent = String(settings.gridSpacing);
        saveSettings();
      });

      peerButtonToggle.addEventListener('change', () => {
        settings.peerButtonVisible = peerButtonToggle.checked;
        if (!settings.peerButtonVisible) {
          stopAllPeerFlows();
        }
        updatePeerButtonUi();
        saveSettings();
      });

      resetSettings.addEventListener('click', resetAllSettings);

      scanAcceptButton.addEventListener('click', async () => {
        const text = scanInput.value.trim();
        if (!text) {
          showToast('文字列がない');
          return;
        }
        try {
          await handleScannedText(text);
        } catch (_) {
          showToast('読み取りに失敗');
        }
      });

      qrModeButton.onclick = null;

      canvas.addEventListener('pointerdown', (e) => {
        if (overlay.classList.contains('open')) return;
        if (peerMenuOverlay.classList.contains('open')) return;
        if (qrOverlay.classList.contains('open')) return;
        if (scanOverlay.classList.contains('open')) return;
        if (activePointerId !== null) return;

        activePointerId = e.pointerId;
        canvas.setPointerCapture(activePointerId);

        const p = getPoint(e);
        pointerDownTime = nowMs();
        pointerDownPos = { x: p.x, y: p.y };
        lastPos = { x: p.x, y: p.y };
        strokePoints = [p];
        pointerHadLoop = false;

        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const t = nowMs();

        if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
          strokePoints.push(p);
          lastPos = p;
        }

        if (t - lastLoopAt >= LASSO_COOLDOWN) {
          if (detectLoop(strokePoints, p.x, p.y)) {
            createLoopEffect(strokePoints);
            lastLoopAt = t;
            pointerHadLoop = true;
            strokePoints = [p];
          }
        }

        e.preventDefault();
      }, { passive: false });

      function finishPointer(e) {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const elapsed = nowMs() - pointerDownTime;
        const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

        if (!pointerHadLoop) {
          if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
            addTapEffect(p.x, p.y);
          } else if (totalMove >= SWIPE_MIN_DISTANCE) {
            const dx = p.x - pointerDownPos.x;
            const dy = p.y - pointerDownPos.y;
            createSwipeEffect(p.x, p.y, dx, dy);
          }
        }

        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;

        e.preventDefault();
      }

      canvas.addEventListener('pointerup', finishPointer, { passive: false });
      canvas.addEventListener('pointercancel', finishPointer, { passive: false });
      canvas.addEventListener('lostpointercapture', () => {
        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;
      });

      const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      function connectRendersAndState() {
        loadSettings();
        updateTheme();
        resize();
        syncSettingsUi();
        document.body.style.background = getBgColor();
        updatePeerButtonUi();
        startPeerButtonsState();
      }

      connectRendersAndState();

      if (darkMql) {
        if (typeof darkMql.addEventListener === 'function') {
          darkMql.addEventListener('change', updateTheme);
        } else if (typeof darkMql.addListener === 'function') {
          darkMql.addListener(updateTheme);
        }
      }

      window.addEventListener('resize', resize);

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
