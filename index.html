<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      --bg: #fff;
      --edge: #111;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: rgba(0, 0, 0, 0.14);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.45);
      --track: rgba(0, 0, 0, 0.12);
      --track-disabled: rgba(0, 0, 0, 0.06);
      --thumb: rgba(0, 0, 0, 0.72);
      --peer-blue: #2f78ff;
      --danger: #d23636;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --edge: #fafafa;
        --panel-bg: rgba(0, 0, 0, 0.82);
        --panel-border: rgba(255, 255, 255, 0.16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, 0.45);
        --track: rgba(255, 255, 255, 0.14);
        --track-disabled: rgba(255, 255, 255, 0.07);
        --thumb: rgba(255, 255, 255, 0.78);
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color-scheme: light dark;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
      background: var(--bg);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .gear-btn,
    .peer-btn {
      position: fixed;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.7px solid var(--edge);
      background: transparent;
      color: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      text-shadow: none;
    }

    .gear-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
    }

    .peer-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 10px);
    }

    .gear-btn span,
    .peer-btn .peer-icon {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      transform: translateY(-0.5px);
      color: var(--edge);
      -webkit-text-stroke: 0;
      text-shadow: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
    }

    .gear-btn:active,
    .peer-btn:active {
      transform: scale(0.97);
    }

    .peer-btn.hidden {
      display: none;
    }

    .peer-btn.searching {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
    }

    .peer-btn.connected {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
    }

    .peer-btn.connected .peer-icon {
      color: var(--peer-blue);
    }

    .peer-icon {
      display: block;
      width: 20px;
      text-align: center;
    }

    .peer-spinner {
      display: none;
      position: relative;
      width: 20px;
      height: 20px;
      color: var(--peer-blue);
    }

    .peer-btn.searching .peer-icon {
      display: none;
    }

    .peer-btn.searching .peer-spinner {
      display: block;
      animation: peer-spin 0.9s linear infinite;
    }

    .peer-spinner span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: currentColor;
      transform-origin: 0 0;
    }

    .peer-spinner span:nth-child(1) { transform: translate(0, -8px); opacity: 1; }
    .peer-spinner span:nth-child(2) { transform: translate(5.5px, -5.5px); opacity: 0.82; }
    .peer-spinner span:nth-child(3) { transform: translate(8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(4) { transform: translate(5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(5) { transform: translate(0, 8px); opacity: 0.34; }
    .peer-spinner span:nth-child(6) { transform: translate(-5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(7) { transform: translate(-8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(8) { transform: translate(-5.5px, -5.5px); opacity: 0.82; }

    @keyframes peer-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 18px;
      box-sizing: border-box;
    }

    .overlay.open {
      display: flex;
    }

    .panel {
      width: min(92vw, 460px);
      max-height: min(84vh, 680px);
      overflow: auto;
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 18px 18px 16px;
      box-sizing: border-box;
      scrollbar-width: thin;
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: -18px -18px 18px;
      padding: 18px 18px 14px;
      background: linear-gradient(to bottom, var(--panel-bg) 78%, rgba(0, 0, 0, 0));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(127, 127, 127, 0.12);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .close-btn {
      appearance: none;
      border: 1.5px solid var(--edge);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      min-width: 42px;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .close-btn:active {
      transform: scale(0.98);
    }

    .setting-block {
      padding: 14px 0 4px;
      border-top: 1px solid rgba(127, 127, 127, 0.16);
    }

    .setting-block:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .setting-label .main {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }

    .setting-label .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }

    .switch {
      position: relative;
      width: 56px;
      height: 34px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(127, 127, 127, 0.18);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--thumb);
      transition: 0.2s ease;
    }

    .switch input:checked + .slider {
      background: rgba(55, 180, 90, 0.22);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .mode-select {
      width: 128px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .hex-input {
      width: 100%;
      box-sizing: border-box;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    .hex-input::placeholder {
      color: var(--muted);
    }

    .sub-input-wrap {
      margin-top: 10px;
    }

    .disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .range-wrap {
      margin-top: 12px;
      padding-left: 2px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .range-title {
      font-size: 13px;
      font-weight: 650;
    }

    .range-value {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      height: 28px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-webkit-slider-runnable-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-top: -7.5px;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-moz-range-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    .effect-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .effect-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 0 0;
    }

    .effect-item + .effect-item {
      border-top: 1px solid rgba(127, 127, 127, 0.12);
      padding-top: 12px;
    }

    .effect-name {
      font-size: 13px;
      font-weight: 650;
    }

    .effect-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .danger-btn {
      appearance: none;
      border: 1.5px solid rgba(220, 40, 40, 0.55);
      background: transparent;
      color: var(--danger);
      border-radius: 14px;
      min-width: 0;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex: 1 1 auto;
    }

    .danger-btn:active {
      transform: scale(0.98);
    }

    .peer-menu-overlay,
    .join-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px;
      box-sizing: border-box;
    }

    .peer-menu-overlay.open,
    .join-overlay.open {
      display: flex;
    }

    .peer-menu-stage {
      position: relative;
      width: min(92vw, 420px);
      height: min(84vh, 420px);
      pointer-events: none;
    }

    .peer-menu-head {
      position: absolute;
      left: 50%;
      top: calc(50% - 146px);
      transform: translateX(-50%);
      width: min(88vw, 380px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s ease 0.95s;
      z-index: 2;
      align-items: center;
    }

    .peer-menu-overlay.open .peer-menu-head {
      opacity: 1;
    }

    .peer-room-label {
      color: #2f78ff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-align: center;
      word-break: break-all;
    }

    .peer-room-status {
      color: rgba(47, 120, 255, 0.85);
      font-size: 12px;
      text-align: center;
      line-height: 1.35;
    }

    .peer-members {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      max-width: 100%;
      max-height: 92px;
      overflow: auto;
      padding: 0 8px;
      box-sizing: border-box;
      scrollbar-width: thin;
    }

    .peer-member {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(47, 120, 255, 0.42);
      color: #2f78ff;
      background: rgba(47, 120, 255, 0.06);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .peer-burst-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 1.8px solid rgba(47, 120, 255, 0.35);
      transform: translate(-50%, -50%) scale(0.25);
      opacity: 0;
      transition: transform 1s ease, opacity 0.5s ease;
      pointer-events: none;
    }

    .peer-menu-overlay.open .peer-burst-ring {
      transform: translate(-50%, -50%) scale(2.45);
      opacity: 1;
    }

    .peer-choice {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 122px;
      height: 122px;
      border: 1.7px solid rgba(47, 120, 255, 0.82);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
      transform:
        translate(-50%, -50%)
        translate(var(--from-x), var(--from-y))
        scale(0.12);
      opacity: 0;
      transition:
        transform 1s cubic-bezier(.2,.8,.2,1),
        opacity 0.5s ease;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      color: #2f78ff;
    }

    .peer-menu-overlay.open .peer-choice {
      transform:
        translate(-50%, -50%)
        translate(var(--to-x), var(--to-y))
        scale(1);
      opacity: 1;
    }

    .peer-choice:active {
      transform:
        translate(-50%, -50%)
        translate(var(--to-x), var(--to-y))
        scale(0.97);
    }

    .peer-choice .peer-choice-label {
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      line-height: 1.35;
      padding: 0 12px;
      color: #2f78ff;
      opacity: 0;
      transition: opacity 0.5s ease;
      transition-delay: 1s;
      word-break: keep-all;
      white-space: pre-line;
    }

    .peer-menu-overlay.open .peer-choice .peer-choice-label {
      opacity: 1;
    }

    .peer-choice::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      border: 1px solid rgba(47, 120, 255, 0.2);
      background: rgba(47, 120, 255, 0.03);
      pointer-events: none;
    }

    .peer-choice.wifi {
      --to-x: 0px;
      --to-y: -118px;
    }

    .peer-choice.online {
      --to-x: -118px;
      --to-y: 108px;
    }

    .peer-choice.cancel {
      --to-x: 118px;
      --to-y: 108px;
    }

    .peer-choice.disconnect {
      --to-x: 0px;
      --to-y: -118px;
    }

    .peer-choice.send {
      --to-x: -118px;
      --to-y: 108px;
    }

    .peer-choice.receive {
      --to-x: 118px;
      --to-y: 108px;
    }

    .peer-choice:disabled {
      opacity: 0.46;
      pointer-events: none;
      filter: grayscale(0.2);
    }

    .dialog {
      width: min(92vw, 520px);
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 18px;
      box-sizing: border-box;
      max-height: min(86vh, 720px);
      overflow: auto;
    }

    .dialog-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .dialog-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .room-input {
      width: 100%;
      box-sizing: border-box;
      height: 40px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }

    .room-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ghost-btn {
      appearance: none;
      border: 1.5px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      border-radius: 14px;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .ghost-btn:active {
      transform: scale(0.98);
    }

    .join-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      transform: translateX(-50%) translateY(12px);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: min(90vw, 420px);
      text-align: center;
      box-sizing: border-box;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .peer-settings-name {
      width: 100%;
      box-sizing: border-box;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
      margin-top: 10px;
    }

    .peer-settings-name::placeholder {
      color: var(--muted);
    }

    .peer-name-disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <button class="gear-btn" id="openSettings" aria-label="設定を開く">
    <span>⛭</span>
  </button>

  <button class="peer-btn hidden" id="peerButton" aria-label="接続">
    <span class="peer-icon">☋</span>
    <span class="peer-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </span>
  </button>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="設定">
      <div class="panel-header">
        <div class="panel-title">設定</div>
        <button class="close-btn" id="closeSettings">戻る</button>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">背景色</div>
            <div class="sub">システム / 白 / 黒 / カスタム</div>
          </div>
          <select class="mode-select" id="bgMode">
            <option value="system">システム</option>
            <option value="white">白</option>
            <option value="black">黒</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
        <div class="sub-input-wrap hidden" id="bgCustomWrap">
          <input class="hex-input" id="bgCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ffffff" />
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-label">
          <div class="main">色</div>
          <div class="sub">タップ / スワイプ / 囲い の色をカラーコードで指定</div>
        </div>

        <div class="effect-grid">
          <div class="effect-item">
            <div class="effect-name">タップの色</div>
            <input class="hex-input" id="tapColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#46ff78" />
          </div>
          <div class="effect-item">
            <div class="effect-name">スワイプの色</div>
            <input class="hex-input" id="swipeColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#6ea5ff" />
          </div>
          <div class="effect-item">
            <div class="effect-name">囲いの色</div>

    function makeId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      const bytes = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(bytes);
      return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
    }

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function nowMs() {
      return performance.now();
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function distance(ax, ay, bx, by) {
      return Math.hypot(ax - bx, ay - by);
    }

    function pointToSegmentDistance(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const abLen2 = abx * abx + aby * aby;

      if (abLen2 === 0) return Math.hypot(px - ax, py - ay);

      let t = (apx * abx + apy * aby) / abLen2;
      t = clamp(t, 0, 1);

      const cx = ax + abx * t;
      const cy = ay + aby * t;
      return Math.hypot(px - cx, py - cy);
    }

    function showToast(message, duration = 1800) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {

      }, duration);
    }

    function isValidMode(value) {
      return value === 'system' || value === 'white' || value === 'black' || value === 'custom';
    }

    function normalizeHexColor(raw) {
      if (typeof raw !== 'string') return null;
      let s = raw.trim();
      if (!s) return null;
      if (s[0] === '#') s = s.slice(1);
      if (!/^[0-9a-fA-F]+$/.test(s)) return null;

      if (s.length === 3 || s.length === 4) {
        s = s.split('').map(ch => ch + ch).join('');
      }

      if (s.length !== 6 && s.length !== 8) return null;
      return '#' + s.toLowerCase();
    }

    function hexToRgba(rawHex, alphaOverride = 1) {
      const hex = normalizeHexColor(rawHex);
      if (!hex) return null;

      const s = hex.slice(1);
      const r = parseInt(s.slice(0, 2), 16);
      const g = parseInt(s.slice(2, 4), 16);
      const b = parseInt(s.slice(4, 6), 16);
      const a = s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1;
      return `rgba(${r}, ${g}, ${b}, ${clamp(a * alphaOverride, 0, 1)})`;
    }

    function safeRoomId(input) {
      const s = String(input || '').trim();
      if (!s) return '';
      return s.replaceAll('/', '_').slice(0, 48);
    }

    function safeName(input) {
      const s = String(input || '').trim();
      if (!s) return defaultName();
      return s.slice(0, 24);
    }

    function defaultName() {
      return `ユーザー${selfPeerId.slice(0, 4).toUpperCase()}`;
    }

    function getBgColor() {
      return resolveModeColor(settings.bgMode, settings.bgCustom, '#ffffff', '#000000');
    }

    function getGridBaseColor() {
      return resolveModeColor(
        settings.gridMode,
        settings.gridCustom,
        darkMode ? '#262626' : '#e8e8e8',
        darkMode ? '#262626' : '#e8e8e8'
      );
    }

    function getTapBaseColor() {
      return normalizeHexColor(settings.tapColor) || defaults.tapColor;
    }

    function getSwipeBaseColor() {
      return normalizeHexColor(settings.swipeColor) || defaults.swipeColor;
    }

    function getLoopBaseColor() {
      return normalizeHexColor(settings.loopColor) || defaults.loopColor;
    }

    function resolveModeColor(mode, customRaw, lightHex, darkHex) {
      const fallback = darkMode ? darkHex : lightHex;
      if (mode === 'system') return fallback;
      if (mode === 'white') return '#ffffff';
      if (mode === 'black') return '#000000';
      if (mode === 'custom') return normalizeHexColor(customRaw) || fallback;
      return fallback;
    }

    function saveSettings() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      } catch (_) {}
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);

        if (isValidMode(data.bgMode)) settings.bgMode = data.bgMode;
        if (typeof data.bgCustom === 'string') settings.bgCustom = data.bgCustom;

        if (typeof data.tapColor === 'string') settings.tapColor = data.tapColor;
        if (typeof data.swipeColor === 'string') settings.swipeColor = data.swipeColor;
        if (typeof data.loopColor === 'string') settings.loopColor = data.loopColor;

        if (typeof data.gridEnabled === 'boolean') settings.gridEnabled = data.gridEnabled;
        if (isValidMode(data.gridMode)) settings.gridMode = data.gridMode;
        if (typeof data.gridCustom === 'string') settings.gridCustom = data.gridCustom;
        if (typeof data.gridSpacing === 'number' && isFinite(data.gridSpacing)) {
          settings.gridSpacing = clamp(Math.round(data.gridSpacing), 18, 100);
        }

        if (typeof data.peerButtonVisible === 'boolean') settings.peerButtonVisible = data.peerButtonVisible;
        if (typeof data.userName === 'string') settings.userName = data.userName;
      } catch (_) {}
    }

    function resize() {
      dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function updateTheme() {
      darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.style.setProperty('--bg', darkMode ? '#000' : '#fff');
      document.documentElement.style.setProperty('--edge', darkMode ? '#fafafa' : '#111');
      document.documentElement.style.setProperty('--panel-bg', darkMode ? 'rgba(0, 0, 0, 0.82)' : 'rgba(255, 255, 255, 0.84)');
      document.documentElement.style.setProperty('--panel-border', darkMode ? 'rgba(255, 255, 255, 0.16)' : 'rgba(0, 0, 0, 0.14)');
      document.documentElement.style.setProperty('--text', darkMode ? '#f5f5f5' : '#101010');
      document.documentElement.style.setProperty('--muted', darkMode ? 'rgba(245, 245, 245, 0.45)' : 'rgba(16, 16, 16, 0.45)');
      document.documentElement.style.setProperty('--track', darkMode ? 'rgba(255, 255, 255, 0.14)' : 'rgba(0, 0, 0, 0.12)');
      document.documentElement.style.setProperty('--track-disabled', darkMode ? 'rgba(255, 255, 255, 0.07)' : 'rgba(0, 0, 0, 0.06)');
      document.documentElement.style.setProperty('--thumb', darkMode ? 'rgba(255, 255, 255, 0.78)' : 'rgba(0, 0, 0, 0.72)');
      document.body.style.background = getBgColor();
    }

    function syncSettingsUi() {
      bgMode.value = settings.bgMode;
      bgCustomInput.value = settings.bgCustom;
      bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');

      tapColorInput.value = settings.tapColor;
      swipeColorInput.value = settings.swipeColor;
      loopColorInput.value = settings.loopColor;

      gridToggle.checked = settings.gridEnabled;
      gridDetails.classList.toggle('disabled', !settings.gridEnabled);

      gridMode.value = settings.gridMode;
      gridCustomInput.value = settings.gridCustom;
      gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');

    function activeLock() {
      const until = Number(roomState.activeSenderUntil) || 0;
      if (!roomState.activeSenderId || until <= Date.now()) return null;
      return {
        senderId: roomState.activeSenderId,
        senderName: roomState.activeSenderName || '誰か',
        until
      };
    }

    function normalizeRoomState() {
      const until = Number(roomState.activeSenderUntil) || 0;
      if (roomState.activeSenderId && until <= Date.now()) {
        roomState.activeSenderId = null;
        roomState.activeSenderName = '';
        roomState.activeSenderUntil = 0;
      }

      if (roomState.lastSettingsVersion < appliedSettingsVersion) {
        roomState.lastSettingsVersion = appliedSettingsVersion;
      }

      pruneMembers();
      refreshPeerMenuUi();
    }

    function applySettingsSnapshot(snapshot) {
      if (!snapshot || typeof snapshot !== 'object') return;

      if (isValidMode(snapshot.bgMode)) settings.bgMode = snapshot.bgMode;
      if (typeof snapshot.bgCustom === 'string') settings.bgCustom = snapshot.bgCustom;

      if (typeof snapshot.tapColor === 'string') settings.tapColor = snapshot.tapColor;
      if (typeof snapshot.swipeColor === 'string') settings.swipeColor = snapshot.swipeColor;
      if (typeof snapshot.loopColor === 'string') settings.loopColor = snapshot.loopColor;

      if (typeof snapshot.gridEnabled === 'boolean') settings.gridEnabled = snapshot.gridEnabled;
      if (isValidMode(snapshot.gridMode)) settings.gridMode = snapshot.gridMode;
      if (typeof snapshot.gridCustom === 'string') settings.gridCustom = snapshot.gridCustom;
      if (typeof snapshot.gridSpacing === 'number' && isFinite(snapshot.gridSpacing)) {
        settings.gridSpacing = clamp(Math.round(snapshot.gridSpacing), 18, 100);
      }

      if (typeof snapshot.peerButtonVisible === 'boolean') settings.peerButtonVisible = snapshot.peerButtonVisible;
      if (typeof snapshot.userName === 'string') settings.userName = snapshot.userName;

      bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');
      gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');
      gridDetails.classList.toggle('disabled', !settings.gridEnabled);
      document.body.style.background = getBgColor();

      saveSettings();
      syncSettingsUi();
      refreshPeerMenuUi();

      return {
        bgMode: settings.bgMode,
        bgCustom: settings.bgCustom,
        tapColor: settings.tapColor,
        swipeColor: settings.swipeColor,
        loopColor: settings.loopColor,

        gridCustom: settings.gridCustom,
        gridSpacing: settings.gridSpacing,

        userName: settings.userName

    function updateMembersFromMap() {
      pruneMembers();
      renderMembers();
      refreshPeerMenuUi();
    }

    function pruneMembers() {
      const now = Date.now();
      for (const [id, item] of membersMap.entries()) {
        if (id === selfPeerId) continue;
        const seen = Number(item.updatedAtMs) || 0;
        if (now - seen > staleMemberMs) {
          membersMap.delete(id);
        }
      }
      if (!membersMap.has(selfPeerId)) {
        membersMap.set(selfPeerId, {
          id: selfPeerId,
          name: settings.userName || defaultName(),
          updatedAtMs: Date.now(),
          transport: transportMode || 'local'
        });
      } else {
        const mine = membersMap.get(selfPeerId);
        mine.name = settings.userName || defaultName();
        mine.updatedAtMs = Date.now();
        mine.transport = transportMode || 'local';
        membersMap.set(selfPeerId, mine);
      }
    }

    function renderMembers() {
      const arr = Array.from(membersMap.values())
        .filter(m => m && typeof m.name === 'string')
        .sort((a, b) => {
          if (a.id === selfPeerId) return -1;
          if (b.id === selfPeerId) return 1;
          return a.name.localeCompare(b.name, 'ja');
        });

      peerMembers.innerHTML = '';
      for (const item of arr) {
        const chip = document.createElement('div');
        chip.className = 'peer-member';
        chip.textContent = item.id === selfPeerId ? `${item.name}（自分）` : item.name;
        peerMembers.appendChild(chip);
      }

      const connectedCount = arr.length;
      peerRoomStatus.textContent = `${connectedCount}人接続中`;
    }

    function refreshPeerMenuUi() {
      const lock = activeLock();
      const count = Array.from(membersMap.values()).filter(Boolean).length;

      peerRoomLabel.textContent = roomDisplayName
        ? `${roomDisplayName} / ${transportMode === 'firebase' ? 'Firebase' : 'ローカル'}`
        : '未接続';

      if (peerState === 'connected') {
        peerRoomStatus.textContent = lock && lock.senderId !== selfPeerId
          ? `${lock.senderName}が送信中…`
          : `${count}人接続中`;
      } else if (peerState === 'searching') {
        peerRoomStatus.textContent = '接続中…';
      } else {
        peerRoomStatus.textContent = `${count}人`;
      }

      if (peerState === 'connected') {
        peerChoiceLabel1.textContent = '接続を\n切断';
        peerChoiceLabel2.textContent = lock && lock.senderId !== selfPeerId ? `${lock.senderName}が\n送信中…` : '設定を\n送信';
        peerChoiceLabel3.textContent = '設定を\n受信';
        peerChoice1.className = 'peer-choice disconnect';
        peerChoice2.className = 'peer-choice send';
        peerChoice3.className = 'peer-choice receive';
        peerChoice2.disabled = !!(lock && lock.senderId !== selfPeerId);
      } else {
        peerChoiceLabel1.textContent = 'ローカルで\n通信';
        peerChoiceLabel2.textContent = 'Firebaseで\n通信';
        peerChoiceLabel3.textContent = 'やめる';
        peerChoice1.className = 'peer-choice wifi';
        peerChoice2.className = 'peer-choice online';
        peerChoice3.className = 'peer-choice cancel';
        peerChoice2.disabled = false;
      }

      renderMembers();
    }

    function openPeerMenu() {
      if (!settings.peerButtonVisible) return;
      peerMenuOpen = true;
      refreshPeerMenuUi();
      peerMenuOverlay.classList.add('open');
      peerMenuOverlay.setAttribute('aria-hidden', 'false');

      const rect = peerButton.getBoundingClientRect();
      const stageRect = peerMenuOverlay.getBoundingClientRect();
      const stageW = stageRect.width || window.innerWidth;
      const stageH = stageRect.height || window.innerHeight;
      const anchorX = rect.left + rect.width / 2 - stageW / 2;
      const anchorY = rect.top + rect.height / 2 - stageH / 2;

      const setFrom = (el, tx, ty) => {
        el.style.setProperty('--from-x', `${anchorX}px`);
        el.style.setProperty('--from-y', `${anchorY}px`);
        el.style.setProperty('--to-x', `${tx}px`);
        el.style.setProperty('--to-y', `${ty}px`);
      };

      setFrom(peerChoice1, 0, -118);
      setFrom(peerChoice2, -118, 108);
      setFrom(peerChoice3, 118, 108);
    }

    function closePeerMenu() {
      peerMenuOpen = false;
      peerMenuOverlay.classList.remove('open');
      peerMenuOverlay.setAttribute('aria-hidden', 'true');
    }

    function openJoinOverlay(mode) {
      joinMode = mode;
      const isFirebase = mode === 'firebase';
      joinTitle.textContent = isFirebase ? 'Firebaseで通信' : 'ローカルで通信';
      joinText.textContent = isFirebase
        ? '同じ文字を入れると同じ部屋に入ります。1人でもそのまま遊べます。'
        : '同じ文字を入れた端末どうしでつながります。';
      joinLabel.textContent = 'ルーム名';
      joinInput.value = joinDrafts[mode] || '';
      joinConfirm.textContent = '入る';
      joinOverlay.classList.add('open');
      joinOverlay.setAttribute('aria-hidden', 'false');
      setTimeout(() => joinInput.focus(), 0);
    }

    function closeJoinOverlay() {
      joinOverlay.classList.remove('open');
      joinOverlay.setAttribute('aria-hidden', 'true');
      joinMode = null;
    }

    function setPeerState(nextState) {
      peerState = nextState;
      peerButton.classList.toggle('searching', peerState === 'searching');
      peerButton.classList.toggle('connected', peerState === 'connected');
      peerButton.setAttribute('aria-label', peerState === 'connected' ? '接続メニューを開く' : '接続');
      refreshPeerMenuUi();
    }

    function setPeerOff() {
      setPeerState('off');
      transportMode = null;
      roomId = '';
      roomDisplayName = '';
      roomState.activeSenderId = null;
      roomState.activeSenderName = '';
      roomState.activeSenderUntil = 0;
      roomState.lastSettingsVersion = 0;
      roomState.lastSettingsPayload = null;
      roomState.lastSettingsSenderId = null;
      roomState.lastSettingsSenderName = '';
      roomState.lastSettingsAtMs = 0;
      receiveWindowUntil = 0;
      appliedSettingsVersion = 0;
      membersMap.clear();
      membersMap.set(selfPeerId, {
        id: selfPeerId,
        name: settings.userName || defaultName(),
        updatedAtMs: Date.now(),
        transport: 'local'
      });
      refreshPeerMenuUi();
    }

    function stopLocalTransport(sendBye = false) {
      if (sendBye) {
        sendLocalPacket({
          type: 'bye',
          senderId: selfPeerId,
          senderName: settings.userName,
          roomId
        }, false);
      }

      if (localHeartbeatTimer) {
        clearInterval(localHeartbeatTimer);
        localHeartbeatTimer = null;
      }

      if (localCleanupTimer) {
        clearInterval(localCleanupTimer);
        localCleanupTimer = null;
      }

      if (localChannel) {
        try {
          localChannel.close();
        } catch (_) {}
        localChannel = null;
      }

      window.removeEventListener('storage', onLocalStorage);
    }

    function stopFirebaseTransport(sendLeave = false) {
      if (sendLeave && firebaseMemberRef) {
        deleteDoc(firebaseMemberRef).catch(() => {});
      }

      if (firebaseHeartbeatTimer) {
        clearInterval(firebaseHeartbeatTimer);
        firebaseHeartbeatTimer = null;
      }

      if (firebaseRoomUnsub) {
        firebaseRoomUnsub();
        firebaseRoomUnsub = null;
      }

      if (firebaseMembersUnsub) {
        firebaseMembersUnsub();
        firebaseMembersUnsub = null;
      }

      firebaseRoomRef = null;
      firebaseMemberRef = null;
    }

    function stopAllTransports(sendBye = false) {
      stopLocalTransport(sendBye);
      stopFirebaseTransport(sendBye);
      setPeerOff();
      closePeerMenu();
      closeJoinOverlay();
    }

    function sendLocalPacket(packet, includeSelf = false) {
      if (transportMode !== 'local' || !localChannel) return;
      const data = {
        ...packet,
        id: makeId(),
        ts: Date.now()
      };

      try {
        localChannel.postMessage(data);
      } catch (_) {}

      try {
        localStorage.setItem(BUS_KEY, JSON.stringify(data));
      } catch (_) {}

      if (includeSelf) handleIncomingPacket(data, 'local');
    }

    function onLocalStorage(ev) {
      if (ev.key !== BUS_KEY || !ev.newValue) return;
      try {
        handleIncomingPacket(JSON.parse(ev.newValue), 'local');
      } catch (_) {}
    }

    function announcePresence() {
      const now = Date.now();
      const packet = {
        type: 'presence',
        senderId: selfPeerId,
        name: settings.userName || defaultName(),
        updatedAtMs: now,
        transport: transportMode || 'local',
        roomId
      };

      if (transportMode === 'local') {
        sendLocalPacket(packet);
      } else if (transportMode === 'firebase' && firebaseMemberRef) {
        setDoc(firebaseMemberRef, packet, { merge: true }).catch(() => {});
      }

      membersMap.set(selfPeerId, {
        id: selfPeerId,
        name: packet.name,
        updatedAtMs: now,
        transport: transportMode || 'local'
      });
      refreshPeerMenuUi();
    }

    function startLocalHeartbeat() {
      stopLocalTransport(false);
      const channelName = `touch_effect_local_${encodeURIComponent(roomId)}`;
      if ('BroadcastChannel' in window) {
        try {
          localChannel = new BroadcastChannel(channelName);
          localChannel.onmessage = (ev) => handleIncomingPacket(ev.data, 'local');
        } catch (_) {
          localChannel = null;
        }
      }

      window.addEventListener('storage', onLocalStorage);

      localHeartbeatTimer = setInterval(() => {
        if (transportMode !== 'local') return;
        announcePresence();
      }, 3500);

      localCleanupTimer = setInterval(() => {
        if (transportMode !== 'local') return;
        pruneMembers();
        refreshPeerMenuUi();
      }, 2500);
    }

    function startFirebaseHeartbeat() {
      stopFirebaseTransport(false);
      if (!firestore) {
        showToast('Firebaseが使えない');
        return false;
      }

      firebaseRoomRef = doc(firestore, 'rooms', roomId);
      firebaseMemberRef = doc(firestore, 'rooms', roomId, 'members', selfPeerId);

      firebaseRoomUnsub = onSnapshot(firebaseRoomRef, (snap) => {
        if (!snap.exists()) return;
        const data = snap.data() || {};
        updateRoomStateFromRemote(data, 'firebase');
      });

      firebaseMembersUnsub = onSnapshot(collection(firestore, 'rooms', roomId, 'members'), (snap) => {
        const now = Date.now();
        membersMap.clear();
        membersMap.set(selfPeerId, {
          id: selfPeerId,
          name: settings.userName || defaultName(),
          updatedAtMs: now,
          transport: 'firebase'
        });

        snap.forEach((docSnap) => {
          const data = docSnap.data() || {};
          const name = String(data.name || '').trim() || '名無し';
          const updatedAtMs = Number(data.updatedAtMs) || 0;
          if (now - updatedAtMs > staleMemberMs) return;
          membersMap.set(docSnap.id, {
            id: docSnap.id,
            name,
            updatedAtMs,
            transport: 'firebase'
          });
        });

        refreshPeerMenuUi();
      });

      firebaseHeartbeatTimer = setInterval(() => {
        if (transportMode !== 'firebase' || !firebaseMemberRef) return;
        announcePresence();
      }, 4000);

      announcePresence();
      return true;
    }

    function updateRoomStateFromRemote(data, via) {
      const now = Date.now();
      const activeUntil = Number(data.activeSenderUntil) || 0;
      roomState.activeSenderId = data.activeSenderId || null;
      roomState.activeSenderName = data.activeSenderName || '';
      roomState.activeSenderUntil = activeUntil;
      roomState.lastSettingsVersion = Number(data.lastSettingsVersion) || 0;
      roomState.lastSettingsPayload = data.lastSettingsPayload || null;
      roomState.lastSettingsSenderId = data.lastSettingsSenderId || null;
      roomState.lastSettingsSenderName = data.lastSettingsSenderName || '';
      roomState.lastSettingsAtMs = Number(data.lastSettingsAtMs) || 0;

      if (roomState.activeSenderId && roomState.activeSenderUntil <= now) {
        roomState.activeSenderId = null;
        roomState.activeSenderName = '';
        roomState.activeSenderUntil = 0;
      }

      if (roomState.lastSettingsPayload && roomState.lastSettingsVersion > appliedSettingsVersion) {
        if (now <= receiveWindowUntil && roomState.lastSettingsSenderId !== selfPeerId) {
          appliedSettingsVersion = roomState.lastSettingsVersion;
          applySettingsSnapshot(roomState.lastSettingsPayload);
          showToast(`${roomState.lastSettingsSenderName || '相手'}から受信した`);
        }
      }

      refreshPeerMenuUi();
    }

    function handleIncomingPacket(packet, via) {
      if (!packet || typeof packet !== 'object') return;
      if (packet.senderId === selfPeerId) return;

      const now = Date.now();

      if (packet.type === 'presence') {
        const name = String(packet.name || '').trim() || '名無し';
        const updatedAtMs = Number(packet.updatedAtMs) || now;
        membersMap.set(packet.senderId, {
          id: packet.senderId,
          name,
          updatedAtMs,
          transport: via
        });
        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'bye') {
        membersMap.delete(packet.senderId);
        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'lock') {
        roomState.activeSenderId = packet.senderId;
        roomState.activeSenderName = String(packet.senderName || '誰か');
        roomState.activeSenderUntil = Number(packet.until) || 0;
        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'unlock') {
        if (roomState.activeSenderId === packet.senderId) {
          roomState.activeSenderId = null;
          roomState.activeSenderName = '';
          roomState.activeSenderUntil = 0;
        }
        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'effect') {
        if (packet.target && packet.target !== selfPeerId) return;
        applyRemoteEffect(packet.kind, packet.payload);
        return;
      }

      if (packet.type === 'settings') {
        roomState.lastSettingsVersion = Number(packet.version) || (roomState.lastSettingsVersion + 1);
        roomState.lastSettingsPayload = packet.payload || null;
        roomState.lastSettingsSenderId = packet.senderId || null;
        roomState.lastSettingsSenderName = packet.senderName || '相手';
        roomState.lastSettingsAtMs = Number(packet.ts) || now;

        if (Date.now() <= receiveWindowUntil && packet.senderId !== selfPeerId) {
          appliedSettingsVersion = roomState.lastSettingsVersion;
          applySettingsSnapshot(packet.payload);
          showToast(`${packet.senderName || '相手'}から受信した`);
        }

        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'settings-state') {
        updateRoomStateFromRemote(packet, via);
      }
    }

    function localRoomBroadcastState() {
      const now = Date.now();
      const packet = {
        type: 'settings-state',
        senderId: selfPeerId,
        activeSenderId: roomState.activeSenderId,
        activeSenderName: roomState.activeSenderName,
        activeSenderUntil: roomState.activeSenderUntil,
        lastSettingsVersion: roomState.lastSettingsVersion,
        lastSettingsPayload: roomState.lastSettingsPayload,
        lastSettingsSenderId: roomState.lastSettingsSenderId,
        lastSettingsSenderName: roomState.lastSettingsSenderName,
        lastSettingsAtMs: roomState.lastSettingsAtMs,
        ts: now
      };
      sendLocalPacket(packet);
    }

    function connectLocalRoom(rawRoom) {
      if (!settings.peerButtonVisible) return;
      const id = safeRoomId(rawRoom);
      if (!id) {
        showToast('ルーム名を入れて');
        return;
      }

      stopAllTransports(false);
      transportMode = 'local';
      roomId = id;
      roomDisplayName = rawRoom.trim();
      peerState = 'connected';
      setPeerState('connected');

      membersMap.clear();
      membersMap.set(selfPeerId, {
        id: selfPeerId,
        name: settings.userName || defaultName(),
        updatedAtMs: Date.now(),
        transport: 'local'
      });

      startLocalHeartbeat();
      announcePresence();
      refreshPeerMenuUi();
      showToast('ローカル通信に入った');
    }

    function connectFirebaseRoom(rawRoom) {
      if (!settings.peerButtonVisible) return;
      if (!firestore) {
        showToast('Firebaseが使えない');
        return;
      }

      const id = safeRoomId(rawRoom);
      if (!id) {
        showToast('ルーム名を入れて');
        return;
      }

      stopAllTransports(false);
      transportMode = 'firebase';
      roomId = id;
      roomDisplayName = rawRoom.trim();
      peerState = 'connected';
      setPeerState('connected');

      membersMap.clear();
      membersMap.set(selfPeerId, {
        id: selfPeerId,
        name: settings.userName || defaultName(),
        updatedAtMs: Date.now(),
        transport: 'firebase'
      });

      if (!startFirebaseHeartbeat()) {
        stopAllTransports(false);
        return;
      }

      refreshPeerMenuUi();
      showToast('Firebaseに入った');
    }

    function disconnectCurrentTransport(sendLeave = true) {
      if (transportMode === 'local') stopLocalTransport(sendLeave);
      if (transportMode === 'firebase') stopFirebaseTransport(sendLeave);
      setPeerOff();
      membersMap.clear();
      membersMap.set(selfPeerId, {
        id: selfPeerId,
        name: settings.userName || defaultName(),
        updatedAtMs: Date.now(),
        transport: transportMode || 'local'
      });
      refreshPeerMenuUi();
    }

    function attemptSendCurrentSettings() {
      const lock = activeLock();
      if (lock && lock.senderId !== selfPeerId) {
        showToast(`${lock.senderName}が送信中…`);
        return;
      }

      if (peerState !== 'connected') return;

      const now = Date.now();
      const version = (roomState.lastSettingsVersion || 0) + 1;
      const snapshot = captureSettingsSnapshot();

      roomState.activeSenderId = selfPeerId;
      roomState.activeSenderName = settings.userName || defaultName();
      roomState.activeSenderUntil = now + 10000;
      roomState.lastSettingsVersion = version;
      roomState.lastSettingsPayload = snapshot;
      roomState.lastSettingsSenderId = selfPeerId;
      roomState.lastSettingsSenderName = settings.userName || defaultName();
      roomState.lastSettingsAtMs = now;

      if (transportMode === 'local') {
        sendLocalPacket({
          type: 'lock',
          senderId: selfPeerId,
          senderName: settings.userName || defaultName(),
          until: roomState.activeSenderUntil
        });

        sendLocalPacket({
          type: 'settings',
          senderId: selfPeerId,
          senderName: settings.userName || defaultName(),
          version,
          payload: snapshot,
          ts: now
        });

        sendLocalPacket({
          type: 'settings-state',
          senderId: selfPeerId,
          activeSenderId: roomState.activeSenderId,
          activeSenderName: roomState.activeSenderName,
          activeSenderUntil: roomState.activeSenderUntil,
          lastSettingsVersion: roomState.lastSettingsVersion,
          lastSettingsPayload: roomState.lastSettingsPayload,
          lastSettingsSenderId: roomState.lastSettingsSenderId,
          lastSettingsSenderName: roomState.lastSettingsSenderName,
          lastSettingsAtMs: roomState.lastSettingsAtMs,
          ts: now
        });

        setTimeout(() => {
          if (transportMode !== 'local') return;
          if (roomState.activeSenderId === selfPeerId && Date.now() >= roomState.activeSenderUntil) {
            roomState.activeSenderId = null;
            roomState.activeSenderName = '';
            roomState.activeSenderUntil = 0;
            sendLocalPacket({
              type: 'unlock',
              senderId: selfPeerId,
              ts: Date.now()
            });
            refreshPeerMenuUi();
          }
        }, 10200);

        refreshPeerMenuUi();
        showToast('設定を送った');
        return;
      }

      if (transportMode === 'firebase' && firestore && firebaseRoomRef) {
        runTransaction(firestore, async (tx) => {
          const snap = await tx.get(firebaseRoomRef);
          const data = snap.exists() ? (snap.data() || {}) : {};
          const activeUntil = Number(data.activeSenderUntil) || 0;
          const activeSenderId = data.activeSenderId || null;

          if (activeSenderId && activeSenderId !== selfPeerId && activeUntil > Date.now()) {
            throw new Error(data.activeSenderName || '誰か');
          }

          tx.set(firebaseRoomRef, {
            roomId,
            roomDisplayName,
            updatedAtMs: Date.now(),
            activeSenderId: selfPeerId,
            activeSenderName: settings.userName || defaultName(),
            activeSenderUntil: Date.now() + 10000,
            lastSettingsVersion: version,
            lastSettingsPayload: snapshot,
            lastSettingsSenderId: selfPeerId,
            lastSettingsSenderName: settings.userName || defaultName(),
            lastSettingsAtMs: Date.now()
          }, { merge: true });
        }).then(() => {
          refreshPeerMenuUi();
          showToast('設定を送った');
        }).catch((err) => {
          const name = (err && err.message) ? err.message : '誰か';
          showToast(`${name}が送信中…`);
          roomState.activeSenderId = null;
          roomState.activeSenderName = '';
          roomState.activeSenderUntil = 0;
          refreshPeerMenuUi();
        });

        return;
      }
    }

    function setReceiveWindow() {
      receiveWindowUntil = Date.now() + 10000;
      showToast('10秒以内の設定を待ってる');
      if (roomState.lastSettingsPayload && roomState.lastSettingsVersion > appliedSettingsVersion) {
        if (roomState.lastSettingsSenderId !== selfPeerId && Date.now() - roomState.lastSettingsAtMs <= 10000) {
          appliedSettingsVersion = roomState.lastSettingsVersion;
          applySettingsSnapshot(roomState.lastSettingsPayload);
          showToast(`${roomState.lastSettingsSenderName || '相手'}から受信した`);
        }
      }
    }

    function sendEffectToRemote(kind, payload) {
      if (peerState !== 'connected') return;

      if (transportMode === 'local') {
        sendLocalPacket({
          type: 'effect',
          senderId: selfPeerId,
          senderName: settings.userName || defaultName(),
          kind,
          payload,
          target: null
        });
      } else if (transportMode === 'firebase' && firebaseRoomRef) {
        setDoc(firebaseRoomRef, {
          updatedAtMs: Date.now(),
          lastEffectKind: kind,
          lastEffectPayload: payload,
          lastEffectSenderId: selfPeerId,
          lastEffectSenderName: settings.userName || defaultName(),
          lastEffectAtMs: Date.now()
        }, { merge: true }).catch(() => {});
      }
    }

    function addTapEffect(x, y, broadcast = true) {
      effects.push({
        type: 'tap',
        x,
        y,
        start: nowMs(),
        duration: 650
      });

      if (broadcast) sendEffectToRemote('tap', { x, y });
    }

    function createSwipeEffect(startX, startY, dirX, dirY, broadcast = true, forced = null) {
      const len = Math.hypot(dirX, dirY) || 1;
      dirX /= len;
      dirY /= len;

      const pad = 90;
      const minX = -pad;
      const minY = -pad;
      const maxX = w + pad;
      const maxY = h + pad;

      const hits = [];

      function pushCandidate(t, x, y) {
        if (x >= minX - 0.5 && x <= maxX + 0.5 && y >= minY - 0.5 && y <= maxY + 0.5) {
          hits.push({ t, x, y });
        }
      }

      if (forced && forced.forceFrom && forced.forceTo) {
        hits.push(
          { t: 0, x: forced.forceFrom.x, y: forced.forceFrom.y },
          { t: 1, x: forced.forceTo.x, y: forced.forceTo.y }
        );
      } else {
        if (Math.abs(dirX) > 1e-6) {
          let t = (minX - startX) / dirX;
          pushCandidate(t, minX, startY + dirY * t);
          t = (maxX - startX) / dirX;
          pushCandidate(t, maxX, startY + dirY * t);
        }

        if (Math.abs(dirY) > 1e-6) {
          let t = (minY - startY) / dirY;
          pushCandidate(t, startX + dirX * t, minY);
          t = (maxY - startY) / dirY;
          pushCandidate(t, startX + dirX * t, maxY);
        }

        if (hits.length < 2) {
          hits.push(
            { t: -400, x: startX - dirX * 400, y: startY - dirY * 400 },
            { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 }
          );
        } else {
          hits.sort((a, b) => a.t - b.t);
        }
      }

      const first = forced && forced.forceFrom ? forced.forceFrom : hits[0];
      const last = forced && forced.forceTo ? forced.forceTo : hits[hits.length - 1];
      const travel = distance(first.x, first.y, last.x, last.y);
      const duration = clamp(460 + travel * 0.12, 520, 900);
      const radius = typeof (forced && forced.forceRadius) === 'number'
        ? forced.forceRadius
        : clamp(Math.min(w, h) * 0.045, 18, 38);

      effects.push({
        type: 'swipe',
        start: nowMs(),
        duration,
        from: { x: first.x, y: first.y },
        to: { x: last.x, y: last.y },
        dir: { x: dirX, y: dirY },
        radius
      });

      if (broadcast) sendEffectToRemote('swipe', {
        from: { x: first.x, y: first.y },
        to: { x: last.x, y: last.y },
        dir: { x: dirX, y: dirY },
        radius
      });
    }

    function createLoopEffect(points, broadcast = true) {
      if (points.length < 3) return;

      const copy = points.map(p => ({ x: p.x, y: p.y }));
      effects.push({
        type: 'loop',
        start: nowMs(),
        duration: 420,
        points: copy
      });

      if (broadcast) sendEffectToRemote('loop', { points: copy });
    }

    function detectLoop(points, currentX, currentY) {
      if (points.length < LASSO_MIN_POINTS) return false;

      const n = points.length;
      const safeEnd = Math.max(0, n - 1 - LASSO_IGNORE_RECENT_SEGMENTS);

      for (let i = 0; i < safeEnd - 1; i++) {
        const a = points[i];
        const b = points[i + 1];
        const d = pointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
        if (d <= LASSO_HIT_RADIUS) {
          let traveled = 0;
          for (let k = i; k < n - 1; k++) {
            traveled += distance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
            if (traveled > 40) break;
          }
          if (traveled > 40) return true;
        }
      }

      return false;
    }

    function drawGrid() {
      if (!settings.gridEnabled) return;

      const baseColor = getGridBaseColor();
      const lineLow = hexToRgba(baseColor, 0.40) || (darkMode ? 'rgba(34,34,34,0.40)' : 'rgba(232,232,232,0.40)');
      const lineHigh = hexToRgba(baseColor, 0.56) || (darkMode ? 'rgba(58,58,58,0.56)' : 'rgba(210,210,210,0.56)');

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.lineWidth = 1;

      for (let x = 0; x <= w + settings.gridSpacing; x += settings.gridSpacing) {
        const isAccent = Math.round(x / settings.gridSpacing) % 4 === 0;
        ctx.strokeStyle = isAccent ? lineHigh : lineLow;
        ctx.beginPath();
        ctx.moveTo(Math.floor(x) + 0.5, 0);
        ctx.lineTo(Math.floor(x) + 0.5, h);
        ctx.stroke();
      }

      for (let y = 0; y <= h + settings.gridSpacing; y += settings.gridSpacing) {
        const isAccent = Math.round(y / settings.gridSpacing) % 4 === 0;
        ctx.strokeStyle = isAccent ? lineHigh : lineLow;
        ctx.beginPath();
        ctx.moveTo(0, Math.floor(y) + 0.5);
        ctx.lineTo(w, Math.floor(y) + 0.5);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawTap(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;

      const e = easeOutCubic(p);
      const radius = lerp(10, Math.max(w, h) * 0.22, e);
      const alpha = 0.34 * Math.pow(1 - p, 1.7);
      const baseColor = getTapBaseColor();

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.globalCompositeOperation = 'source-over';
      ctx.shadowBlur = radius * 0.22;
      ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(70, 255, 120, 0.55)';

      const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
      g.addColorStop(0.00, hexToRgba(baseColor, 0.92) || 'rgba(70, 255, 120, 0.92)');
      g.addColorStop(0.28, hexToRgba(baseColor, 0.60) || 'rgba(60, 235, 110, 0.60)');
      g.addColorStop(0.68, hexToRgba(baseColor, 0.25) || 'rgba(50, 220, 100, 0.25)');
      g.addColorStop(1.00, hexToRgba(baseColor, 0.00) || 'rgba(50, 220, 100, 0)');

      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawSwipe(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;

      const e = easeOutCubic(p);
      const x = lerp(effect.from.x, effect.to.x, e);
      const y = lerp(effect.from.y, effect.to.y, e);

      const trailSteps = 16;
      const trailSpacing = effect.radius * 0.82;
      const baseColor = getSwipeBaseColor();

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';

      for (let i = trailSteps; i >= 0; i--) {
        const back = i * trailSpacing;
        const px = x - effect.dir.x * back;
        const py = y - effect.dir.y * back;
        const a = 0.24 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, 0.35);
        if (a <= 0.001) continue;

        const r = effect.radius * (1 + (trailSteps - i) * 0.02);

        ctx.globalAlpha = a;
        ctx.shadowBlur = r * 0.35;
        ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(90, 150, 255, 0.55)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 0.45 * Math.pow(1 - p, 0.7);
      ctx.shadowBlur = effect.radius * 0.6;
      ctx.shadowColor = hexToRgba(baseColor, 0.45) || 'rgba(110, 165, 255, 0.45)';
      ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
      ctx.beginPath();
      ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawLoop(effect, t) {
      const p = clamp((t - effect.start) / effect.duration, 0, 1);
      if (p >= 1) return;
      if (effect.points.length < 3) return;

      const alpha = 0.36 * Math.pow(1 - p, 2.0);
      const blur = 8 * Math.pow(1 - p, 0.55);
      const baseColor = getLoopBaseColor();

      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = alpha;
      ctx.shadowBlur = blur;
      ctx.shadowColor = hexToRgba(baseColor, 0.40) || 'rgba(255, 60, 60, 0.40)';
      ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(255, 78, 78, 1)';

      ctx.beginPath();
      ctx.moveTo(effect.points[0].x, effect.points[0].y);
      for (let i = 1; i < effect.points.length; i++) {
        ctx.lineTo(effect.points[i].x, effect.points[i].y);
      }
      ctx.closePath();
      ctx.fill('evenodd');

      ctx.restore();
    }

    function render() {
      const t = Date.now();

      normalizeRoomState();

      ctx.fillStyle = getBgColor();
      ctx.fillRect(0, 0, w, h);

      drawGrid();

      for (let i = 0; i < effects.length; i++) {
        const effect = effects[i];
        if (effect.type === 'tap') drawTap(effect, performance.now());
        else if (effect.type === 'swipe') drawSwipe(effect, performance.now());
        else if (effect.type === 'loop') drawLoop(effect, performance.now());
      }

      for (let i = effects.length - 1; i >= 0; i--) {
        if (performance.now() - effects[i].start >= effects[i].duration) effects.splice(i, 1);
      }

      requestAnimationFrame(render);
    }

    function stopAllTransports(sendLeave = true) {

      stopFirebaseTransport(sendLeave);
      transportMode = null;
      roomId = '';
      roomDisplayName = '';
      receiveWindowUntil = 0;

      roomState.activeSenderId = null;
      roomState.activeSenderName = '';
      roomState.activeSenderUntil = 0;
      roomState.lastSettingsVersion = 0;
      roomState.lastSettingsPayload = null;
      roomState.lastSettingsSenderId = null;
      roomState.lastSettingsSenderName = '';
      roomState.lastSettingsAtMs = 0;
      membersMap.clear();
      membersMap.set(selfPeerId, {

    function updateRoomStateFromRemote(data) {
      const now = Date.now();
      roomState.activeSenderId = data.activeSenderId || null;
      roomState.activeSenderName = data.activeSenderName || '';
      roomState.activeSenderUntil = Number(data.activeSenderUntil) || 0;
      roomState.lastSettingsVersion = Number(data.lastSettingsVersion) || 0;
      roomState.lastSettingsPayload = data.lastSettingsPayload || null;
      roomState.lastSettingsSenderId = data.lastSettingsSenderId || null;
      roomState.lastSettingsSenderName = data.lastSettingsSenderName || '';
      roomState.lastSettingsAtMs = Number(data.lastSettingsAtMs) || 0;

      if (roomState.activeSenderId && roomState.activeSenderUntil <= now) {
        roomState.activeSenderId = null;
        roomState.activeSenderName = '';
        roomState.activeSenderUntil = 0;
      }

      if (roomState.lastSettingsPayload && roomState.lastSettingsVersion > appliedSettingsVersion) {
        if (Date.now() <= receiveWindowUntil && roomState.lastSettingsSenderId !== selfPeerId) {
          appliedSettingsVersion = roomState.lastSettingsVersion;
          applySettingsSnapshot(roomState.lastSettingsPayload);
          showToast(`${roomState.lastSettingsSenderName || '相手'}から受信した`);
        }
      }

      refreshPeerMenuUi();
    }

    function ensureFirebaseAvailability() {
      return !!firestore;
    }

    function sendLocalLock(until) {
      if (transportMode !== 'local') return;
      sendLocalPacket({
        type: 'lock',
        senderId: selfPeerId,
        senderName: settings.userName,
        until
      });
    }

    function sendLocalUnlock() {
      if (transportMode !== 'local') return;
      sendLocalPacket({
        type: 'unlock',
        senderId: selfPeerId,
        senderName: settings.userName,
        ts: Date.now()
      });
    }

    function attemptSendCurrentSettings() {
      const lock = activeLock();
      if (lock && lock.senderId !== selfPeerId) {
        showToast(`${lock.senderName}が送信中…`);
        return;
      }

      if (peerState !== 'connected') return;

      const now = Date.now();
      const version = (roomState.lastSettingsVersion || 0) + 1;
      const snapshot = captureSettingsSnapshot();

      roomState.activeSenderId = selfPeerId;
      roomState.activeSenderName = settings.userName;
      roomState.activeSenderUntil = now + 10000;
      roomState.lastSettingsVersion = version;
      roomState.lastSettingsPayload = snapshot;
      roomState.lastSettingsSenderId = selfPeerId;
      roomState.lastSettingsSenderName = settings.userName;
      roomState.lastSettingsAtMs = now;

      if (transportMode === 'local') {
        sendLocalLock(roomState.activeSenderUntil);

        sendLocalPacket({
          type: 'settings',
          senderId: selfPeerId,
          senderName: settings.userName,
          version,
          payload: snapshot,
          ts: now
        });

        sendLocalPacket({
          type: 'settings-state',
          senderId: selfPeerId,
          activeSenderId: roomState.activeSenderId,
          activeSenderName: roomState.activeSenderName,
          activeSenderUntil: roomState.activeSenderUntil,
          lastSettingsVersion: roomState.lastSettingsVersion,
          lastSettingsPayload: roomState.lastSettingsPayload,
          lastSettingsSenderId: roomState.lastSettingsSenderId,
          lastSettingsSenderName: roomState.lastSettingsSenderName,
          lastSettingsAtMs: roomState.lastSettingsAtMs,
          ts: now
        });

        setTimeout(() => {
          if (transportMode !== 'local') return;
          if (roomState.activeSenderId === selfPeerId && Date.now() >= roomState.activeSenderUntil) {
            roomState.activeSenderId = null;
            roomState.activeSenderName = '';
            roomState.activeSenderUntil = 0;
            sendLocalUnlock();
            refreshPeerMenuUi();
          }
        }, 10200);

        refreshPeerMenuUi();
        showToast('設定を送った');
        return;
      }

      if (transportMode === 'firebase' && firestore && firebaseRoomRef) {
        runTransaction(firestore, async (tx) => {
          const snap = await tx.get(firebaseRoomRef);
          const data = snap.exists() ? (snap.data() || {}) : {};
          const activeUntil = Number(data.activeSenderUntil) || 0;
          const activeSenderId = data.activeSenderId || null;

          if (activeSenderId && activeSenderId !== selfPeerId && activeUntil > Date.now()) {
            throw new Error(data.activeSenderName || '誰か');
          }

          tx.set(firebaseRoomRef, {
            roomId,
            roomDisplayName,
            updatedAtMs: Date.now(),
            activeSenderId: selfPeerId,
            activeSenderName: settings.userName,
            activeSenderUntil: Date.now() + 10000,
            lastSettingsVersion: version,
            lastSettingsPayload: snapshot,
            lastSettingsSenderId: selfPeerId,
            lastSettingsSenderName: settings.userName,
            lastSettingsAtMs: Date.now()
          }, { merge: true });
        }).then(() => {
          refreshPeerMenuUi();
          showToast('設定を送った');
        }).catch((err) => {
          const name = (err && err.message) ? err.message : '誰か';
          showToast(`${name}が送信中…`);
          roomState.activeSenderId = null;
          roomState.activeSenderName = '';
          roomState.activeSenderUntil = 0;
          refreshPeerMenuUi();
        });

        return;
      }
    }

    function setReceiveWindow() {
      receiveWindowUntil = Date.now() + 10000;
      showToast('10秒以内の設定を待ってる');

      if (roomState.lastSettingsPayload && roomState.lastSettingsVersion > appliedSettingsVersion) {
        if (roomState.lastSettingsSenderId !== selfPeerId && Date.now() - roomState.lastSettingsAtMs <= 10000) {
          appliedSettingsVersion = roomState.lastSettingsVersion;
          applySettingsSnapshot(roomState.lastSettingsPayload);
          showToast(`${roomState.lastSettingsSenderName || '相手'}から受信した`);
        }
      }
    }

    function applyRemoteEffect(kind, payload) {
      if (!payload || typeof payload !== 'object') return;

      if (kind === 'tap') {
        if (typeof payload.x === 'number' && typeof payload.y === 'number') {
          addTapEffect(payload.x, payload.y, false);
        }
        return;
      }

      if (kind === 'swipe') {
        const from = payload.from;
        const to = payload.to;
        const dir = payload.dir;
        if (
          from && to && dir &&
          typeof from.x === 'number' && typeof from.y === 'number' &&
          typeof to.x === 'number' && typeof to.y === 'number' &&
          typeof dir.x === 'number' && typeof dir.y === 'number'
        ) {
          createSwipeEffect(from.x, from.y, dir.x * 100, dir.y * 100, false, {
            forceFrom: from,
            forceTo: to,
            forceRadius: typeof payload.radius === 'number' ? payload.radius : undefined
          });
        }
        return;
      }

      if (kind === 'loop') {
        if (Array.isArray(payload.points)) {
          const points = payload.points
            .filter(p => p && typeof p.x === 'number' && typeof p.y === 'number')
            .map(p => ({ x: p.x, y: p.y }));
          if (points.length >= 3) createLoopEffect(points, false);
        }
      }
    }

    function sendRoomPresenceImmediately() {
      const now = Date.now();
      membersMap.set(selfPeerId, {
        id: selfPeerId,
        name: settings.userName,
        updatedAtMs: now,
        transport: transportMode || 'local'
      });

      if (transportMode === 'local') {
        sendLocalPacket({
          type: 'presence',
          senderId: selfPeerId,
          name: settings.userName,
          updatedAtMs: now,
          transport: transportMode,
          roomId
        });
      } else if (transportMode === 'firebase' && firebaseMemberRef) {
        setDoc(firebaseMemberRef, {
          name: settings.userName,
          updatedAtMs: now,
          transport: transportMode,
          roomId
        }, { merge: true }).catch(() => {});
      }

      refreshPeerMenuUi();
    }

    function connectLocalRoom(rawRoom) {
      const id = safeRoomId(rawRoom);
      if (!id) {
        showToast('ルーム名を入れて');
        return;
      }

      stopAllTransports(false);
      transportMode = 'local';
      roomId = id;
      roomDisplayName = String(rawRoom || '').trim() || id;
      setPeerState('connected');

      membersMap.clear();
      membersMap.set(selfPeerId, {
        id: selfPeerId,
        name: settings.userName,
        updatedAtMs: Date.now(),
        transport: 'local'
      });

      if ('BroadcastChannel' in window) {
        const channelName = `touch_effect_local_${encodeURIComponent(roomId)}`;
        try {
          localChannel = new BroadcastChannel(channelName);
          localChannel.onmessage = (ev) => handleIncomingPacket(ev.data, 'local');
        } catch (_) {
          localChannel = null;
        }
      }

      window.addEventListener('storage', onLocalStorage);

      localHeartbeatTimer = setInterval(() => {
        if (transportMode !== 'local') return;
        sendRoomPresenceImmediately();
      }, 3500);

      localCleanupTimer = setInterval(() => {
        if (transportMode !== 'local') return;
        pruneMembers();
        refreshPeerMenuUi();
      }, 2500);

      sendRoomPresenceImmediately();
      refreshPeerMenuUi();
      showToast('ローカル通信に入った');
    }

    function connectFirebaseRoom(rawRoom) {
      const id = safeRoomId(rawRoom);
      if (!id) {
        showToast('ルーム名を入れて');
        return;
      }
      if (!ensureFirebaseAvailability()) {
        showToast('Firebaseが使えない');
        return;
      }

      stopAllTransports(false);
      transportMode = 'firebase';
      roomId = id;
      roomDisplayName = String(rawRoom || '').trim() || id;
      setPeerState('connected');

      membersMap.clear();
      membersMap.set(selfPeerId, {
        id: selfPeerId,
        name: settings.userName,
        updatedAtMs: Date.now(),
        transport: 'firebase'
      });

      firebaseRoomRef = doc(firestore, 'rooms', roomId);
      firebaseMemberRef = doc(firestore, 'rooms', roomId, 'members', selfPeerId);

      firebaseRoomUnsub = onSnapshot(firebaseRoomRef, (snap) => {
        if (!snap.exists()) return;
        updateRoomStateFromRemote(snap.data() || {});
      });

      firebaseMembersUnsub = onSnapshot(collection(firestore, 'rooms', roomId, 'members'), (snap) => {
        const now = Date.now();
        membersMap.clear();
        membersMap.set(selfPeerId, {
          id: selfPeerId,
          name: settings.userName,
          updatedAtMs: now,
          transport: 'firebase'
        });

        snap.forEach((docSnap) => {
          const data = docSnap.data() || {};
          const name = String(data.name || '').trim() || '名無し';
          const updatedAtMs = Number(data.updatedAtMs) || 0;
          if (now - updatedAtMs > staleMemberMs) return;
          membersMap.set(docSnap.id, {
            id: docSnap.id,
            name,
            updatedAtMs,
            transport: 'firebase'
          });
        });

        refreshPeerMenuUi();
      });

      firebaseHeartbeatTimer = setInterval(() => {
        if (transportMode !== 'firebase' || !firebaseMemberRef) return;
        sendRoomPresenceImmediately();
      }, 4000);

      sendRoomPresenceImmediately();
      refreshPeerMenuUi();
      showToast('Firebaseに入った');
    }

    function handleIncomingSettingsState(data, via) {
      if (!data || typeof data !== 'object') return;
      updateRoomStateFromRemote(data, via);
    }

    function handleIncomingPacket(packet, via) {
      if (!packet || typeof packet !== 'object') return;
      if (packet.senderId === selfPeerId) return;

      const now = Date.now();

      if (packet.type === 'presence') {
        const name = String(packet.name || '').trim() || '名無し';
        const updatedAtMs = Number(packet.updatedAtMs) || now;
        membersMap.set(packet.senderId, {
          id: packet.senderId,
          name,
          updatedAtMs,
          transport: via
        });
        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'bye') {
        membersMap.delete(packet.senderId);
        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'lock') {
        roomState.activeSenderId = packet.senderId;
        roomState.activeSenderName = String(packet.senderName || '誰か');
        roomState.activeSenderUntil = Number(packet.until) || 0;
        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'unlock') {
        if (roomState.activeSenderId === packet.senderId) {
          roomState.activeSenderId = null;
          roomState.activeSenderName = '';
          roomState.activeSenderUntil = 0;
        }
        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'settings-state') {
        handleIncomingSettingsState(packet, via);
        return;
      }

      if (packet.type === 'settings') {
        roomState.lastSettingsVersion = Number(packet.version) || (roomState.lastSettingsVersion + 1);
        roomState.lastSettingsPayload = packet.payload || null;
        roomState.lastSettingsSenderId = packet.senderId || null;
        roomState.lastSettingsSenderName = packet.senderName || '相手';
        roomState.lastSettingsAtMs = Number(packet.ts) || now;

        if (Date.now() <= receiveWindowUntil && packet.senderId !== selfPeerId) {
          appliedSettingsVersion = roomState.lastSettingsVersion;
          applySettingsSnapshot(packet.payload);
          showToast(`${packet.senderName || '相手'}から受信した`);
        }

        refreshPeerMenuUi();
        return;
      }

      if (packet.type === 'effect') {
        if (packet.target && packet.target !== selfPeerId) return;
        applyRemoteEffect(packet.kind, packet.payload);
        return;
      }
    }

    function onLocalStorage(ev) {
      if (ev.key !== BUS_KEY || !ev.newValue) return;
      try {
        handleIncomingPacket(JSON.parse(ev.newValue), 'local');
      } catch (_) {}
    }
