<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg-light: #ffffff;
      --bg-dark: #000000;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      background: var(--bg-light);
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background: var(--bg-dark);
      }
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: true });

      let dpr = 1;
      let w = 0;
      let h = 0;
      let darkMode = matchMedia('(prefers-color-scheme: dark)').matches;

      const greenBursts = [];
      const blueOrbs = [];
      const redFills = [];
      const pointers = new Map();

      function resize() {
        dpr = Math.max(1, window.devicePixelRatio || 1);
        w = window.innerWidth;
        h = window.innerHeight;

        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }

      function bgColor() {
        return darkMode ? '#000000' : '#ffffff';
      }

      function addGreenBurst(x, y) {
        greenBursts.push({
          x,
          y,
          t: 0,
          dur: 520,
          maxR: Math.max(w, h) * 0.22
        });
      }

      function addRedFill(points) {
        if (!points || points.length < 3) return;
        redFills.push({
          points: points.map(p => ({ x: p.x, y: p.y })),
          t: 0,
          dur: 420
        });
      }

      function intersectionToEdge(x, y, dx, dy) {
        const hits = [];

        if (dx !== 0) {
          const t1 = (0 - x) / dx;
          const t2 = (w - x) / dx;
          if (t1 > 0) hits.push(t1);
          if (t2 > 0) hits.push(t2);
        }

        if (dy !== 0) {
          const t3 = (0 - y) / dy;
          const t4 = (h - y) / dy;
          if (t3 > 0) hits.push(t3);
          if (t4 > 0) hits.push(t4);
        }

        const valid = hits.filter(v => Number.isFinite(v) && v > 0);
        const t = valid.length ? Math.min(...valid) : 1;

        return {
          x: x + dx * t,
          y: y + dy * t
        };
      }

      function addBlueOrbFromSwipe(startX, startY, dx, dy, speedPxPerMs) {
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx / len;
        const uy = dy / len;

        const back = intersectionToEdge(startX, startY, -ux, -uy);
        const forward = intersectionToEdge(startX, startY, ux, uy);

        const sx = back.x;
        const sy = back.y;
        const ex = forward.x;
        const ey = forward.y;

        const totalDx = ex - sx;
        const totalDy = ey - sy;
        const dist = Math.hypot(totalDx, totalDy);

        const dur = Math.max(700, Math.min(1600, (dist / Math.max(0.15, speedPxPerMs)) * 0.75));

        blueOrbs.push({
          sx,
          sy,
          dx: totalDx,
          dy: totalDy,
          t: 0,
          dur,
          r: Math.max(18, Math.min(34, Math.min(w, h) * 0.04)),
          trail: [],
          trailTimer: 0
        });
      }

      function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
        const vx = x2 - x1;
        const vy = y2 - y1;
        const wx = px - x1;
        const wy = py - y1;

        const c1 = vx * wx + vy * wy;
        if (c1 <= 0) return Math.hypot(px - x1, py - y1);

        const c2 = vx * vx + vy * vy;
        if (c2 <= c1) return Math.hypot(px - x2, py - y2);

        const b = c1 / c2;
        const bx = x1 + b * vx;
        const by = y1 + b * vy;
        return Math.hypot(px - bx, py - by);
      }

      function detectLoop(state, x, y) {
        const pts = state.points;
        if (pts.length < 40) return -1;

        const minGap = 18;
        const threshold = 16;

        for (let i = 0; i < pts.length - minGap - 1; i++) {
          const a = pts[i];
          const b = pts[i + 1];
          const d = pointToSegmentDistance(x, y, a.x, a.y, b.x, b.y);
          if (d < threshold) return i;
        }

        return -1;
      }

      function startPointer(id, x, y) {
        pointers.set(id, {
          id,
          startX: x,
          startY: y,
          lastX: x,
          lastY: y,
          downTime: performance.now(),
          moved: false,
          loopTriggered: false,
          points: [{ x, y }],
          lastPointTime: performance.now()
        });

        addGreenBurst(x, y);
      }

      function movePointer(id, x, y) {
        const state = pointers.get(id);
        if (!state) return;

        const dx = x - state.lastX;
        const dy = y - state.lastY;
        const step = Math.hypot(dx, dy);

        if (step > 1.5) {
          state.moved = true;
          state.points.push({ x, y });
          state.lastX = x;
          state.lastY = y;
          state.lastPointTime = performance.now();
        } else {
          state.lastX = x;
          state.lastY = y;
        }

        if (!state.loopTriggered) {
          const loopIndex = detectLoop(state, x, y);
          if (loopIndex >= 0) {
            state.loopTriggered = true;
            const closed = state.points.slice(loopIndex);
            if (closed.length >= 3) {
              addRedFill(closed);
            }
          }
        }
      }

      function endPointer(id, x, y) {
        const state = pointers.get(id);
        if (!state) return;

        const totalDx = x - state.startX;
        const totalDy = y - state.startY;
        const dist = Math.hypot(totalDx, totalDy);
        const dt = Math.max(1, performance.now() - state.downTime);
        const speed = dist / dt;

        if (!state.loopTriggered && dist > 28) {
          addBlueOrbFromSwipe(state.startX, state.startY, totalDx, totalDy, speed);
        }

        pointers.delete(id);
      }

      function cancelPointer(id) {
        pointers.delete(id);
      }

      window.addEventListener('resize', resize, { passive: true });
      matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', (e) => {
        darkMode = e.matches;
      });

      canvas.addEventListener('pointerdown', (e) => {
        canvas.setPointerCapture?.(e.pointerId);
        startPointer(e.pointerId, e.clientX, e.clientY);
      });

      canvas.addEventListener('pointermove', (e) => {
        movePointer(e.pointerId, e.clientX, e.clientY);
      });

      canvas.addEventListener('pointerup', (e) => {
        endPointer(e.pointerId, e.clientX, e.clientY);
      });

      canvas.addEventListener('pointercancel', (e) => {
        cancelPointer(e.pointerId);
      });

      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      function drawGreenBurst(item) {
        const p = item.t / item.dur;
        if (p >= 1) return false;

        const easeOut = 1 - Math.pow(1 - p, 3);
        const radius = item.maxR * easeOut;
        const alpha = Math.max(0, 0.34 * (1 - p));

        const g = ctx.createRadialGradient(item.x, item.y, 0, item.x, item.y, radius);
        g.addColorStop(0, `rgba(0, 255, 0, ${alpha})`);
        g.addColorStop(0.45, `rgba(0, 255, 0, ${alpha * 0.55})`);
        g.addColorStop(1, 'rgba(0, 255, 0, 0)');

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(item.x, item.y, radius, 0, Math.PI * 2);
        ctx.fill();

        return true;
      }

      function drawRedFill(item) {
        const p = item.t / item.dur;
        if (p >= 1) return false;

        const alpha = Math.max(0, 0.28 * (1 - p));
        const scale = 0.98 + p * 0.02;

        ctx.save();
        ctx.translate(0, 0);
        ctx.scale(scale, scale);

        ctx.beginPath();
        const pts = item.points;
        ctx.moveTo(pts[0].x / scale, pts[0].y / scale);
        for (let i = 1; i < pts.length; i++) {
          ctx.lineTo(pts[i].x / scale, pts[i].y / scale);
        }
        ctx.closePath();
        ctx.fillStyle = `rgba(255, 0, 0, ${alpha})`;
        ctx.fill();
        ctx.restore();

        return true;
      }

      function drawBlueOrb(item, now, dt) {
        const p = item.t / item.dur;
        if (p >= 1) return false;

        const ease = p < 0.5
          ? 2 * p * p
          : 1 - Math.pow(-2 * p + 2, 2) / 2;

        const x = item.sx + item.dx * ease;
        const y = item.sy + item.dy * ease;

        item.trailTimer += dt;
        if (item.trailTimer >= 18) {
          item.trailTimer = 0;
          item.trail.push({
            x,
            y,
            life: 0
          });
          if (item.trail.length > 18) item.trail.shift();
        }

        for (let i = 0; i < item.trail.length; i++) {
          const t = item.trail[i];
          t.life += dt;
        }

        for (let i = item.trail.length - 1; i >= 0; i--) {
          const t = item.trail[i];
          const ap = Math.max(0, 1 - t.life / 320);
          if (ap <= 0) {
            item.trail.splice(i, 1);
            continue;
          }

          const rr = item.r * (0.65 + (i / Math.max(1, item.trail.length)) * 0.2);
          ctx.fillStyle = `rgba(0, 120, 255, ${ap * 0.22})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, rr, 0, Math.PI * 2);
          ctx.fill();
        }

        const orbAlpha = Math.max(0, 0.42 * (1 - p));
        const pulse = 1 + Math.sin(p * Math.PI * 3) * 0.05;
        const radius = item.r * pulse;

        const g = ctx.createRadialGradient(x, y, 0, x, y, radius * 1.8);
        g.addColorStop(0, `rgba(0, 150, 255, ${orbAlpha})`);
        g.addColorStop(0.35, `rgba(0, 150, 255, ${orbAlpha * 0.55})`);
        g.addColorStop(1, 'rgba(0, 150, 255, 0)');

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, radius * 1.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(0, 150, 255, ${orbAlpha * 0.5})`;
        ctx.beginPath();
        ctx.arc(x, y, radius * 0.75, 0, Math.PI * 2);
        ctx.fill();

        return true;
      }

      let last = performance.now();

      function frame(now) {
        const dt = Math.min(32, now - last);
        last = now;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = bgColor();
        ctx.fillRect(0, 0, w, h);

        for (let i = greenBursts.length - 1; i >= 0; i--) {
          greenBursts[i].t += dt;
          if (!drawGreenBurst(greenBursts[i])) {
            greenBursts.splice(i, 1);
          }
        }

        for (let i = blueOrbs.length - 1; i >= 0; i--) {
          blueOrbs[i].t += dt;
          if (!drawBlueOrb(blueOrbs[i], now, dt)) {
            blueOrbs.splice(i, 1);
          }
        }

        for (let i = redFills.length - 1; i >= 0; i--) {
          redFills[i].t += dt;
          if (!drawRedFill(redFills[i])) {
            redFills.splice(i, 1);
          }
        }

        requestAnimationFrame(frame);
      }

      resize();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
