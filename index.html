<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Touch Effects</title>
  <style>
    :root {
      --bg: #fff;
      --edge: #111;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: rgba(0, 0, 0, 0.14);
      --text: #101010;
      --muted: rgba(16, 16, 16, 0.45);
      --track: rgba(0, 0, 0, 0.12);
      --track-disabled: rgba(0, 0, 0, 0.06);
      --thumb: rgba(0, 0, 0, 0.72);
      --peer-blue: #2f78ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --edge: #fafafa;
        --panel-bg: rgba(0, 0, 0, 0.82);
        --panel-border: rgba(255, 255, 255, 0.16);
        --text: #f5f5f5;
        --muted: rgba(245, 245, 245, 0.45);
        --track: rgba(255, 255, 255, 0.14);
        --track-disabled: rgba(255, 255, 255, 0.07);
        --thumb: rgba(255, 255, 255, 0.78);
      }
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color-scheme: light dark;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
      background: var(--bg);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .gear-btn,
    .peer-btn {
      position: fixed;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.7px solid var(--edge);
      background: transparent;
      color: transparent;
      padding: 0;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 20;
      -webkit-tap-highlight-color: transparent;
      -webkit-appearance: none;
      appearance: none;
      box-sizing: border-box;
      text-shadow: none;
    }

    .gear-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      right: calc(env(safe-area-inset-right, 0px) + 10px);
    }

    .peer-btn {
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: calc(env(safe-area-inset-left, 0px) + 10px);
    }

    .gear-btn span,
    .peer-btn .peer-icon {
      font-size: 20px;
      font-weight: 400;
      line-height: 1;
      transform: translateY(-0.5px);
      color: var(--edge);
      -webkit-text-stroke: 0;
      text-shadow: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI Symbol", sans-serif;
    }

    .gear-btn:active,
    .peer-btn:active {
      transform: scale(0.97);
    }

    .peer-btn.hidden {
      display: none;
    }

    .peer-btn.searching {
      border-color: var(--peer-blue);
      color: var(--peer-blue);
    }

    .peer-btn.connected {
      background: var(--peer-blue);
      border-color: var(--peer-blue);
      color: #fff;
    }

    .peer-btn.connected .peer-icon {
      color: #fff;
    }

    .peer-icon {
      display: block;
      width: 20px;
      text-align: center;
    }

    .peer-spinner {
      display: none;
      position: relative;
      width: 20px;
      height: 20px;
    }

    .peer-btn.searching .peer-icon {
      display: none;
    }

    .peer-btn.searching .peer-spinner {
      display: block;
      animation: peer-spin 0.9s linear infinite;
    }

    .peer-spinner span {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: currentColor;
      transform-origin: 0 0;
    }

    .peer-spinner span:nth-child(1) { transform: translate(0, -8px); opacity: 1; }
    .peer-spinner span:nth-child(2) { transform: translate(5.5px, -5.5px); opacity: 0.82; }
    .peer-spinner span:nth-child(3) { transform: translate(8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(4) { transform: translate(5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(5) { transform: translate(0, 8px); opacity: 0.34; }
    .peer-spinner span:nth-child(6) { transform: translate(-5.5px, 5.5px); opacity: 0.46; }
    .peer-spinner span:nth-child(7) { transform: translate(-8px, 0); opacity: 0.64; }
    .peer-spinner span:nth-child(8) { transform: translate(-5.5px, -5.5px); opacity: 0.82; }

    @keyframes peer-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 18px;
      box-sizing: border-box;
    }

    .overlay.open {
      display: flex;
    }

    .panel {
      width: min(92vw, 460px);
      max-height: min(84vh, 680px);
      overflow: auto;
      border-radius: 26px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.22);
      color: var(--text);
      padding: 18px 18px 16px;
      box-sizing: border-box;
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 10px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .close-btn {
      appearance: none;
      border: 1.5px solid var(--edge);
      background: transparent;
      color: var(--text);
      border-radius: 999px;
      min-width: 42px;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .close-btn:active {
      transform: scale(0.98);
    }

    .setting-block {
      padding: 14px 0 4px;
      border-top: 1px solid rgba(127, 127, 127, 0.16);
    }

    .setting-block:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .setting-label .main {
      font-size: 15px;
      font-weight: 650;
      line-height: 1.2;
    }

    .setting-label .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
    }

    .switch {
      position: relative;
      width: 56px;
      height: 34px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(127, 127, 127, 0.18);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--thumb);
      transition: 0.2s ease;
    }

    .switch input:checked + .slider {
      background: rgba(55, 180, 90, 0.22);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .mode-select {
      width: 128px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 10px;
      font-size: 14px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .hex-input {
      width: 100%;
      box-sizing: border-box;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      padding: 0 12px;
      font-size: 14px;
      outline: none;
    }

    .hex-input::placeholder {
      color: var(--muted);
    }

    .sub-input-wrap {
      margin-top: 10px;
    }

    .disabled {
      opacity: 0.34;
      pointer-events: none;
    }

    .range-wrap {
      margin-top: 12px;
      padding-left: 2px;
    }

    .range-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .range-title {
      font-size: 13px;
      font-weight: 650;
    }

    .range-value {
      font-size: 12px;
      color: var(--muted);
    }

    input[type="range"] {
      width: 100%;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      height: 28px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-webkit-slider-runnable-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      margin-top: -7.5px;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    input[type="range"]::-moz-range-track {
      height: 7px;
      border-radius: 999px;
      background: var(--track);
    }

    .disabled input[type="range"]::-moz-range-track {
      background: var(--track-disabled);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--thumb);
      border: 0;
      box-shadow: 0 0 0 3px rgba(127, 127, 127, 0.15);
    }

    .effect-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .effect-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 0 0;
    }

    .effect-item + .effect-item {
      border-top: 1px solid rgba(127, 127, 127, 0.12);
      padding-top: 12px;
    }

    .effect-name {
      font-size: 13px;
      font-weight: 650;
    }

    .effect-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }

    .footer-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .danger-btn {
      appearance: none;
      border: 1.5px solid rgba(220, 40, 40, 0.55);
      background: transparent;
      color: #d23636;
      border-radius: 14px;
      min-width: 0;
      height: 40px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex: 1 1 auto;
    }

    .danger-btn:active {
      transform: scale(0.98);
    }

    .peer-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .peer-text {
      font-size: 13px;
      line-height: 1.45;
      color: var(--muted);
    }

    .peer-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .peer-action-btn {
      appearance: none;
      border: 1.5px solid var(--panel-border);
      background: transparent;
      color: var(--text);
      border-radius: 14px;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-align: left;
    }

    .peer-action-btn:active {
      transform: scale(0.98);
    }

    .peer-action-btn.danger {
      color: #d23636;
      border-color: rgba(220, 40, 40, 0.55);
    }

    .peer-box {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: transparent;
      color: var(--text);
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
      outline: none;
      min-height: 88px;
      resize: vertical;
    }

    .peer-note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <button class="gear-btn" id="openSettings" aria-label="設定を開く">
    <span>⛭</span>
  </button>

  <button class="peer-btn hidden" id="peerButton" aria-label="ローカル通信">
    <span class="peer-icon">☋</span>
    <span class="peer-spinner" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </span>
  </button>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="設定">
      <div class="panel-header">
        <div class="panel-title">設定</div>
        <button class="close-btn" id="closeSettings">戻る</button>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">背景色</div>
            <div class="sub">システム / 白 / 黒 / カスタム</div>
          </div>
          <select class="mode-select" id="bgMode">
            <option value="system">システム</option>
            <option value="white">白</option>
            <option value="black">黒</option>
            <option value="custom">カスタム</option>
          </select>
        </div>
        <div class="sub-input-wrap hidden" id="bgCustomWrap">
          <input class="hex-input" id="bgCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ffffff" />
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-label">
          <div class="main">色</div>
          <div class="sub">タップ / スワイプ / 囲い の色をカラーコードで指定</div>
        </div>

        <div class="effect-grid">
          <div class="effect-item">
            <div class="effect-name">タップの色</div>
            <input class="hex-input" id="tapColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#46ff78" />
          </div>
          <div class="effect-item">
            <div class="effect-name">スワイプの色</div>
            <input class="hex-input" id="swipeColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#6ea5ff" />
          </div>
          <div class="effect-item">
            <div class="effect-name">囲いの色</div>
            <input class="hex-input" id="loopColorInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#ff4e4e" />
          </div>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">グリッドを表示</div>
            <div class="sub">ONで背景に格子を出します</div>
          </div>
          <label class="switch" aria-label="グリッドを表示">
            <input type="checkbox" id="gridToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div id="gridDetails">
          <div class="range-wrap">
            <div class="range-head">
              <div class="range-title">間隔</div>
              <div class="range-value"><span id="spacingValue">36</span>px</div>
            </div>
            <input type="range" id="spacingRange" min="18" max="100" step="1" value="36" />
          </div>

          <div class="control-row">
            <div class="setting-label">
              <div class="main" style="font-size: 13px;">グリッド色</div>
              <div class="sub">システム / 白 / 黒 / カスタム</div>
            </div>
            <select class="mode-select" id="gridMode">
              <option value="system">システム</option>
              <option value="white">白</option>
              <option value="black">黒</option>
              <option value="custom">カスタム</option>
            </select>
          </div>

          <div class="sub-input-wrap hidden" id="gridCustomWrap">
            <input class="hex-input" id="gridCustomInput" type="text" inputmode="text" spellcheck="false" autocomplete="off" placeholder="#e8e8e8" />
          </div>
        </div>
      </div>

      <div class="setting-block">
        <div class="setting-row">
          <div class="setting-label">
            <div class="main">ローカル通信ボタンを表示</div>
            <div class="sub">左上に通信ボタンを出します</div>
          </div>
          <label class="switch" aria-label="ローカル通信ボタンを表示">
            <input type="checkbox" id="peerButtonToggle" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="setting-block">
        <div class="footer-actions">
          <button class="danger-btn" id="resetSettings">設定をリセット</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="peerOverlay" aria-hidden="true">
    <div class="panel" role="dialog" aria-modal="true" aria-label="ローカル通信">
      <div class="panel-header">
        <div class="panel-title" id="peerPanelTitle">ローカル通信</div>
        <button class="close-btn" id="closePeerPanel">戻る</button>
      </div>
      <div id="peerPanelBody"></div>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d', { alpha: true });

      const overlay = document.getElementById('overlay');
      const openSettings = document.getElementById('openSettings');
      const closeSettings = document.getElementById('closeSettings');

      const peerButton = document.getElementById('peerButton');
      const peerOverlay = document.getElementById('peerOverlay');
      const peerPanelTitle = document.getElementById('peerPanelTitle');
      const peerPanelBody = document.getElementById('peerPanelBody');
      const closePeerPanel = document.getElementById('closePeerPanel');

      const bgMode = document.getElementById('bgMode');
      const bgCustomWrap = document.getElementById('bgCustomWrap');
      const bgCustomInput = document.getElementById('bgCustomInput');

      const tapColorInput = document.getElementById('tapColorInput');
      const swipeColorInput = document.getElementById('swipeColorInput');
      const loopColorInput = document.getElementById('loopColorInput');

      const gridToggle = document.getElementById('gridToggle');
      const gridDetails = document.getElementById('gridDetails');
      const gridMode = document.getElementById('gridMode');
      const gridCustomWrap = document.getElementById('gridCustomWrap');
      const gridCustomInput = document.getElementById('gridCustomInput');
      const spacingRange = document.getElementById('spacingRange');
      const spacingValue = document.getElementById('spacingValue');

      const peerButtonToggle = document.getElementById('peerButtonToggle');

      const resetSettings = document.getElementById('resetSettings');

      const STORAGE_KEY = 'touch_effect_settings_v5';
      const COMM_CHANNEL_NAME = 'touch_effect_peer_v2';
      const COMM_STORAGE_KEY = 'touch_effect_peer_v2_msg';

      const defaults = {
        bgMode: 'system',
        bgCustom: '#ffffff',

        tapColor: '#46ff78',
        swipeColor: '#6ea5ff',
        loopColor: '#ff4e4e',

        gridEnabled: false,
        gridMode: 'system',
        gridCustom: '#e8e8e8',
        gridSpacing: 36,

        peerButtonVisible: false
      };

      const settings = { ...defaults };

      let w = 0;
      let h = 0;
      let dpr = 1;
      let darkMode = false;

      const effects = [];

      let activePointerId = null;
      let pointerDownTime = 0;
      let pointerDownPos = { x: 0, y: 0 };
      let lastPos = { x: 0, y: 0 };
      let strokePoints = [];
      let pointerHadLoop = false;
      let lastLoopAt = 0;

      const SWIPE_MIN_DISTANCE = 42;
      const TAP_MAX_DISTANCE = 12;
      const TAP_MAX_TIME = 320;
      const LASSO_MIN_POINTS = 20;
      const LASSO_HIT_RADIUS = 18;
      const LASSO_IGNORE_RECENT_SEGMENTS = 10;
      const LASSO_COOLDOWN = 140;

      let selfPeerId = makeId();
      let peerState = 'off'; // off | searching | connected
      let remotePeerId = null;
      let peerMode = 'broadcast'; // broadcast | rtc
      let peerChannel = null;
      let peerPulseTimer = null;
      let peerWatchTimer = null;
      let peerLastSeenAt = 0;
      const seenPackets = new Set();
      const seenPacketQueue = [];

      let peerUiMode = 'menu';
      let peerUiData = {};

      let rtcPc = null;
      let rtcDc = null;
      let rtcKind = null; // host | join
      let rtcOfferCode = '';
      let rtcAnswerCode = '';
      let rtcInputTimer = null;

      let settingsShareTimer = null;
      let settingsShareUntil = 0;
      let receiveArmedUntil = 0;
      let receivedThisWindow = false;

      function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        const bytes = new Uint8Array(16);
        (window.crypto || window.msCrypto).getRandomValues(bytes);
        return Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
      }

      function clamp(v, min, max) {
        return Math.min(max, Math.max(min, v));
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function nowMs() {
        return performance.now();
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function distance(ax, ay, bx, by) {
        return Math.hypot(ax - bx, ay - by);
      }

      function pointToSegmentDistance(px, py, ax, ay, bx, by) {
        const abx = bx - ax;
        const aby = by - ay;
        const apx = px - ax;
        const apy = py - ay;
        const abLen2 = abx * abx + aby * aby;

        if (abLen2 === 0) return Math.hypot(px - ax, py - ay);

        let t = (apx * abx + apy * aby) / abLen2;
        t = clamp(t, 0, 1);

        const cx = ax + abx * t;
        const cy = ay + aby * t;
        return Math.hypot(px - cx, py - cy);
      }

      function isValidMode(value) {
        return value === 'system' || value === 'white' || value === 'black' || value === 'custom';
      }

      function normalizeHexColor(raw) {
        if (typeof raw !== 'string') return null;
        let s = raw.trim();
        if (!s) return null;
        if (s[0] === '#') s = s.slice(1);
        if (!/^[0-9a-fA-F]+$/.test(s)) return null;

        if (s.length === 3 || s.length === 4) {
          s = s.split('').map(ch => ch + ch).join('');
        }

        if (s.length !== 6 && s.length !== 8) return null;
        return '#' + s.toLowerCase();
      }

      function hexToRgba(rawHex, alphaOverride = 1) {
        const hex = normalizeHexColor(rawHex);
        if (!hex) return null;

        const s = hex.slice(1);
        const r = parseInt(s.slice(0, 2), 16);
        const g = parseInt(s.slice(2, 4), 16);
        const b = parseInt(s.slice(4, 6), 16);
        const a = s.length === 8 ? parseInt(s.slice(6, 8), 16) / 255 : 1;
        return `rgba(${r}, ${g}, ${b}, ${clamp(a * alphaOverride, 0, 1)})`;
      }

      function resolveModeColor(mode, customRaw, lightHex, darkHex) {
        const fallback = darkMode ? darkHex : lightHex;
        if (mode === 'system') return fallback;
        if (mode === 'white') return '#ffffff';
        if (mode === 'black') return '#000000';
        if (mode === 'custom') return normalizeHexColor(customRaw) || fallback;
        return fallback;
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (_) {}
      }

      function loadSettings() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);

          if (isValidMode(data.bgMode)) settings.bgMode = data.bgMode;
          if (typeof data.bgCustom === 'string') settings.bgCustom = data.bgCustom;

          if (typeof data.tapColor === 'string') settings.tapColor = data.tapColor;
          if (typeof data.swipeColor === 'string') settings.swipeColor = data.swipeColor;
          if (typeof data.loopColor === 'string') settings.loopColor = data.loopColor;

          if (typeof data.gridEnabled === 'boolean') settings.gridEnabled = data.gridEnabled;
          if (isValidMode(data.gridMode)) settings.gridMode = data.gridMode;
          if (typeof data.gridCustom === 'string') settings.gridCustom = data.gridCustom;
          if (typeof data.gridSpacing === 'number' && isFinite(data.gridSpacing)) {
            settings.gridSpacing = clamp(Math.round(data.gridSpacing), 18, 100);
          }

          if (typeof data.peerButtonVisible === 'boolean') settings.peerButtonVisible = data.peerButtonVisible;
        } catch (_) {}
      }

      function updateTheme() {
        darkMode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

        document.documentElement.style.setProperty('--bg', darkMode ? '#000' : '#fff');
        document.documentElement.style.setProperty('--edge', darkMode ? '#fafafa' : '#111');
        document.documentElement.style.setProperty('--panel-bg', darkMode ? 'rgba(0, 0, 0, 0.82)' : 'rgba(255, 255, 255, 0.84)');
        document.documentElement.style.setProperty('--panel-border', darkMode ? 'rgba(255, 255, 255, 0.16)' : 'rgba(0, 0, 0, 0.14)');
        document.documentElement.style.setProperty('--text', darkMode ? '#f5f5f5' : '#101010');
        document.documentElement.style.setProperty('--muted', darkMode ? 'rgba(245, 245, 245, 0.45)' : 'rgba(16, 16, 16, 0.45)');
        document.documentElement.style.setProperty('--track', darkMode ? 'rgba(255, 255, 255, 0.14)' : 'rgba(0, 0, 0, 0.12)');
        document.documentElement.style.setProperty('--track-disabled', darkMode ? 'rgba(255, 255, 255, 0.07)' : 'rgba(0, 0, 0, 0.06)');
        document.documentElement.style.setProperty('--thumb', darkMode ? 'rgba(255, 255, 255, 0.78)' : 'rgba(0, 0, 0, 0.72)');
        document.body.style.background = getBgColor();
      }

      function resize() {
        dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function syncSettingsUi() {
        bgMode.value = settings.bgMode;
        bgCustomInput.value = settings.bgCustom;
        bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');

        tapColorInput.value = settings.tapColor;
        swipeColorInput.value = settings.swipeColor;
        loopColorInput.value = settings.loopColor;

        gridToggle.checked = settings.gridEnabled;
        gridDetails.classList.toggle('disabled', !settings.gridEnabled);

        gridMode.value = settings.gridMode;
        gridCustomInput.value = settings.gridCustom;
        gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');

        spacingRange.value = String(settings.gridSpacing);
        spacingValue.textContent = String(settings.gridSpacing);

        peerButtonToggle.checked = settings.peerButtonVisible;
      }

      function updatePeerButtonUi() {
        peerButton.classList.toggle('hidden', !settings.peerButtonVisible);
        peerButton.classList.toggle('searching', peerState === 'searching');
        peerButton.classList.toggle('connected', peerState === 'connected');

        if (peerState === 'searching') {
          peerButton.setAttribute('aria-label', 'ローカル通信を停止');
        } else if (peerState === 'connected') {
          peerButton.setAttribute('aria-label', 'ローカル通信を切断');
        } else {
          peerButton.setAttribute('aria-label', 'ローカル通信');
        }
      }

      function openOverlay() {
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
      }

      function closeOverlay() {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
      }

      function openPeerOverlay() {
        peerOverlay.classList.add('open');
        peerOverlay.setAttribute('aria-hidden', 'false');
      }

      function closePeerOverlay() {
        peerOverlay.classList.remove('open');
        peerOverlay.setAttribute('aria-hidden', 'true');
      }

      function getBgColor() {
        return resolveModeColor(settings.bgMode, settings.bgCustom, '#ffffff', '#000000');
      }

      function getGridBaseColor() {
        return resolveModeColor(
          settings.gridMode,
          settings.gridCustom,
          darkMode ? '#262626' : '#e8e8e8',
          darkMode ? '#262626' : '#e8e8e8'
        );
      }

      function getTapBaseColor() {
        return normalizeHexColor(settings.tapColor) || defaults.tapColor;
      }

      function getSwipeBaseColor() {
        return normalizeHexColor(settings.swipeColor) || defaults.swipeColor;
      }

      function getLoopBaseColor() {
        return normalizeHexColor(settings.loopColor) || defaults.loopColor;
      }

      function rememberPacket(id) {
        if (!id || seenPackets.has(id)) return false;
        seenPackets.add(id);
        seenPacketQueue.push(id);
        if (seenPacketQueue.length > 300) {
          const old = seenPacketQueue.shift();
          if (old) seenPackets.delete(old);
        }
        return true;
      }

      function setPeerState(nextState, nextRemoteId = remotePeerId) {
        peerState = nextState;
        remotePeerId = nextRemoteId || null;
        peerLastSeenAt = Date.now();
        updatePeerButtonUi();
      }

      function stopPeerTimers() {
        if (peerPulseTimer) {
          clearInterval(peerPulseTimer);
          peerPulseTimer = null;
        }
        if (peerWatchTimer) {
          clearInterval(peerWatchTimer);
          peerWatchTimer = null;
        }
      }

      function startPeerTimers() {
        stopPeerTimers();

        peerPulseTimer = window.setInterval(() => {
          if (peerState === 'searching') {
            if (peerMode === 'broadcast') {
              transportSend({ type: 'search' });
            } else if (peerMode === 'rtc') {
              transportSend({ type: 'rtc-alive' });
            }
          } else if (peerState === 'connected') {
            transportSend({ type: 'keepalive', target: remotePeerId });
          }
        }, 1000);

        peerWatchTimer = window.setInterval(() => {
          if (peerState !== 'connected') return;
          if (!peerLastSeenAt) return;
          if (Date.now() - peerLastSeenAt > 6500) {
            remotePeerId = null;
            setPeerState('searching');
            if (peerMode === 'broadcast') transportSend({ type: 'search' });
          }
        }, 1000);
      }

      function clearSettingsShare() {
        if (settingsShareTimer) {
          clearInterval(settingsShareTimer);
          settingsShareTimer = null;
        }
        settingsShareUntil = 0;
      }

      function disconnectRtc() {
        if (rtcDc) {
          try { rtcDc.close(); } catch (_) {}
          rtcDc = null;
        }
        if (rtcPc) {
          try { rtcPc.close(); } catch (_) {}
          rtcPc = null;
        }
        rtcKind = null;
        rtcOfferCode = '';
        rtcAnswerCode = '';
      }

      function disconnectPeer(sendGoodbye = true) {
        const oldRemote = remotePeerId;
        clearSettingsShare();
        receiveArmedUntil = 0;
        receivedThisWindow = false;
        stopPeerTimers();

        if (sendGoodbye && oldRemote) {
          transportSend({ type: 'goodbye', target: oldRemote });
        }

        remotePeerId = null;
        peerState = 'off';
        peerMode = 'broadcast';
        updatePeerButtonUi();

        disconnectRtc();
      }

      function encodePacket(obj) {
        const json = JSON.stringify(obj);
        return btoa(unescape(encodeURIComponent(json)));
      }

      function decodePacket(text) {
        const clean = String(text || '').trim();
        if (!clean) throw new Error('empty');
        const json = decodeURIComponent(escape(atob(clean)));
        return JSON.parse(json);
      }

      function transportSend(packet) {
        const data = {
          ...packet,
          id: makeId(),
          sender: selfPeerId,
          ts: Date.now()
        };

        try {
          if (peerMode === 'rtc' && rtcDc && rtcDc.readyState === 'open') {
            rtcDc.send(JSON.stringify(data));
          }
        } catch (_) {}

        try {
          if (peerChannel) peerChannel.postMessage(data);
        } catch (_) {}

        try {
          localStorage.setItem(COMM_STORAGE_KEY, JSON.stringify(data));
        } catch (_) {}

        return data;
      }

      function applySettingsSnapshot(snapshot) {
        if (!snapshot || typeof snapshot !== 'object') return;

        if (isValidMode(snapshot.bgMode)) settings.bgMode = snapshot.bgMode;
        if (typeof snapshot.bgCustom === 'string') settings.bgCustom = snapshot.bgCustom;

        if (typeof snapshot.tapColor === 'string') settings.tapColor = snapshot.tapColor;
        if (typeof snapshot.swipeColor === 'string') settings.swipeColor = snapshot.swipeColor;
        if (typeof snapshot.loopColor === 'string') settings.loopColor = snapshot.loopColor;

        if (typeof snapshot.gridEnabled === 'boolean') settings.gridEnabled = snapshot.gridEnabled;
        if (isValidMode(snapshot.gridMode)) settings.gridMode = snapshot.gridMode;
        if (typeof snapshot.gridCustom === 'string') settings.gridCustom = snapshot.gridCustom;
        if (typeof snapshot.gridSpacing === 'number' && isFinite(snapshot.gridSpacing)) {
          settings.gridSpacing = clamp(Math.round(snapshot.gridSpacing), 18, 100);
        }

        if (typeof snapshot.peerButtonVisible === 'boolean') settings.peerButtonVisible = snapshot.peerButtonVisible;

        updateTheme();
        syncSettingsUi();
        updatePeerButtonUi();
        saveSettings();
      }

      function handlePeerPacket(packet) {
        if (!packet || typeof packet !== 'object') return;
        if (packet.sender === selfPeerId) return;
        if (!rememberPacket(packet.id)) return;

        const now = Date.now();

        if (packet.type === 'search') {
          if (!settings.peerButtonVisible || peerState === 'off') return;
          if (peerMode !== 'broadcast') return;
          peerLastSeenAt = now;

          if (!remotePeerId || remotePeerId === packet.sender) {
            if (peerState === 'searching') {
              connectPeer(packet.sender, 'broadcast');
              transportSend({ type: 'found', target: packet.sender });
            } else if (peerState === 'connected') {
              if (remotePeerId === packet.sender) {
                peerLastSeenAt = now;
              }
            }
          }
          return;
        }

        if (packet.type === 'found') {
          if (peerMode !== 'broadcast') return;
          if (peerState === 'searching' && packet.target === selfPeerId) {
            connectPeer(packet.sender, 'broadcast');
          } else if (peerState === 'connected' && remotePeerId === packet.sender) {
            peerLastSeenAt = now;
          }
          return;
        }

        if (packet.type === 'rtc-alive') {
          if (peerMode !== 'rtc') return;
          if (peerState === 'searching') {
            peerLastSeenAt = now;
          }
          return;
        }

        if (packet.type === 'keepalive') {
          if (peerState === 'off') return;
          if (packet.target && packet.target !== selfPeerId) return;
          if (remotePeerId && packet.sender !== remotePeerId) return;
          if (!remotePeerId) remotePeerId = packet.sender;
          peerLastSeenAt = now;
          return;
        }

        if (packet.type === 'goodbye') {
          if (remotePeerId && packet.sender === remotePeerId) {
            if (settings.peerButtonVisible) {
              remotePeerId = null;
              setPeerState('searching', null);
              if (peerMode === 'broadcast') transportSend({ type: 'search' });
            } else {
              disconnectPeer(false);
            }
          }
          return;
        }

        if (packet.type === 'settings-sync') {
          if (peerState !== 'connected') return;
          if (packet.target && packet.target !== selfPeerId) return;
          if (remotePeerId && packet.sender !== remotePeerId) return;
          if (!remotePeerId) remotePeerId = packet.sender;
          peerLastSeenAt = now;

          if (Date.now() <= receiveArmedUntil && !receivedThisWindow) {
            receivedThisWindow = true;
            applySettingsSnapshot(packet.payload && packet.payload.settings);
            receiveArmedUntil = 0;
            closePeerOverlay();
          }
          return;
        }

        if (packet.type === 'rtc-connect') {
          if (peerMode !== 'rtc') return;
          if (rtcKind === 'host' && packet.target === selfPeerId) {
            if (packet.payload && typeof packet.payload.answer === 'string') {
              rtcSetRemoteAnswer(packet.payload.answer);
            }
          }
          return;
        }
      }

      function setupBroadcastTransport() {
        if ('BroadcastChannel' in window) {
          try {
            peerChannel = new BroadcastChannel(COMM_CHANNEL_NAME);
            peerChannel.onmessage = (ev) => handlePeerPacket(ev.data);
          } catch (_) {
            peerChannel = null;
          }
        }

        window.addEventListener('storage', (ev) => {
          if (ev.key !== COMM_STORAGE_KEY || !ev.newValue) return;
          try {
            handlePeerPacket(JSON.parse(ev.newValue));
          } catch (_) {}
        });
      }

      function connectPeer(remoteId, mode) {
        remotePeerId = remoteId;
        peerLastSeenAt = Date.now();
        peerState = 'connected';
        peerMode = mode || peerMode;
        startPeerTimers();
        updatePeerButtonUi();
      }

      function startWifiSearch() {
        if (!settings.peerButtonVisible) return;
        disconnectRtc();
        peerMode = 'broadcast';
        peerLastSeenAt = Date.now();
        setPeerState('searching', null);
        startPeerTimers();
        transportSend({ type: 'search' });
        updatePeerButtonUi();
      }

      function connectOverRtc() {
        peerMode = 'rtc';
        peerLastSeenAt = Date.now();
        setPeerState('searching', null);
        startPeerTimers();
        updatePeerButtonUi();
      }

      function stopRtcSearch() {
        disconnectPeer(false);
      }

      function waitIceComplete(pc) {
        return new Promise((resolve) => {
          if (pc.iceGatheringState === 'complete') {
            resolve();
            return;
          }
          const onState = () => {
            if (pc.iceGatheringState === 'complete') {
              pc.removeEventListener('icegatheringstatechange', onState);
              resolve();
            }
          };
          pc.addEventListener('icegatheringstatechange', onState);
          setTimeout(() => {
            try { pc.removeEventListener('icegatheringstatechange', onState); } catch (_) {}
            resolve();
          }, 2200);
        });
      }

      async function rtcCreateHost() {
        disconnectRtc();
        connectOverRtc();
        rtcKind = 'host';
        rtcPc = new RTCPeerConnection({ iceServers: [] });
        rtcDc = rtcPc.createDataChannel('touch');

        rtcDc.onopen = () => {
          connectPeer(remotePeerId || 'rtc', 'rtc');
          closePeerOverlay();
        };

        rtcDc.onmessage = (ev) => {
          try {
            handlePeerPacket(JSON.parse(ev.data));
          } catch (_) {}
        };

        rtcDc.onclose = () => {
          if (peerState !== 'off') disconnectPeer(false);
        };

        rtcPc.onconnectionstatechange = () => {
          if (rtcPc && (rtcPc.connectionState === 'disconnected' || rtcPc.connectionState === 'failed' || rtcPc.connectionState === 'closed')) {
            if (peerState !== 'off') disconnectPeer(false);
          }
        };

        const offer = await rtcPc.createOffer();
        await rtcPc.setLocalDescription(offer);
        await waitIceComplete(rtcPc);
        rtcOfferCode = encodePacket(rtcPc.localDescription);
        rtcAnswerCode = '';
        peerUiMode = 'rtc-host';
        renderPeerUi();
        openPeerOverlay();
      }

      async function rtcApplyHostOffer(text) {
        disconnectRtc();
        connectOverRtc();
        rtcKind = 'join';
        rtcPc = new RTCPeerConnection({ iceServers: [] });

        rtcPc.ondatachannel = (ev) => {
          rtcDc = ev.channel;
          rtcDc.onopen = () => {
            connectPeer(remotePeerId || 'rtc', 'rtc');
            closePeerOverlay();
          };
          rtcDc.onmessage = (msg) => {
            try {
              handlePeerPacket(JSON.parse(msg.data));
            } catch (_) {}
          };
          rtcDc.onclose = () => {
            if (peerState !== 'off') disconnectPeer(false);
          };
        };

        rtcPc.onconnectionstatechange = () => {
          if (rtcPc && (rtcPc.connectionState === 'disconnected' || rtcPc.connectionState === 'failed' || rtcPc.connectionState === 'closed')) {
            if (peerState !== 'off') disconnectPeer(false);
          }
        };

        const offerDesc = decodePacket(text);
        await rtcPc.setRemoteDescription(offerDesc);
        const answer = await rtcPc.createAnswer();
        await rtcPc.setLocalDescription(answer);
        await waitIceComplete(rtcPc);
        rtcAnswerCode = encodePacket(rtcPc.localDescription);
        rtcOfferCode = String(text).trim();
        peerUiMode = 'rtc-join';
        renderPeerUi();
        openPeerOverlay();
      }

      async function rtcSetRemoteAnswer(text) {
        if (!rtcPc) return;
        const answerDesc = decodePacket(text);
        await rtcPc.setRemoteDescription(answerDesc);
      }

      function startSettingsShare() {
        if (peerState !== 'connected') return;
        receivedThisWindow = false;
        settingsShareUntil = Date.now() + 10000;

        const sendOnce = () => {
          if (Date.now() > settingsShareUntil) {
            clearSettingsShare();
            return;
          }
          transportSend({
            type: 'settings-sync',
            target: remotePeerId,
            payload: {
              settings: {
                bgMode: settings.bgMode,
                bgCustom: settings.bgCustom,
                tapColor: settings.tapColor,
                swipeColor: settings.swipeColor,
                loopColor: settings.loopColor,
                gridEnabled: settings.gridEnabled,
                gridMode: settings.gridMode,
                gridCustom: settings.gridCustom,
                gridSpacing: settings.gridSpacing,
                peerButtonVisible: settings.peerButtonVisible
              }
            }
          });
        };

        sendOnce();
        clearSettingsShare();
        settingsShareTimer = setInterval(sendOnce, 1000);
      }

      function armReceiveSettings() {
        if (peerState !== 'connected') return;
        receivedThisWindow = false;
        receiveArmedUntil = Date.now() + 10000;
      }

      function clearReceiveArm() {
        receiveArmedUntil = 0;
        receivedThisWindow = false;
      }

      function createBtn(label, cls, onClick) {
        const btn = document.createElement('button');
        btn.className = cls;
        btn.type = 'button';
        btn.textContent = label;
        btn.addEventListener('click', onClick);
        return btn;
      }

      function createTextarea(value, readonly) {
        const ta = document.createElement('textarea');
        ta.className = 'peer-box';
        ta.value = value || '';
        if (readonly) ta.readOnly = true;
        return ta;
      }

      function renderPeerUi() {
        peerPanelBody.innerHTML = '';

        if (peerUiMode === 'menu') {
          peerPanelTitle.textContent = 'ローカル通信';
          const wrap = document.createElement('div');
          wrap.className = 'peer-section';

          const text = document.createElement('div');
          text.className = 'peer-text';
          text.textContent = peerState === 'searching'
            ? '今は通信中です。ボタンを押すとキャンセルして戻ります。'
            : peerState === 'connected'
              ? 'つながっています。送信/受信/切断を選べます。'
              : '通信方法を選んでください。';
          wrap.appendChild(text);

          const list = document.createElement('div');
          list.className = 'peer-list';

          if (peerState === 'connected') {
            list.appendChild(createBtn('設定を送信', 'peer-action-btn', () => {
              startSettingsShare();
              closePeerOverlay();
            }));
            list.appendChild(createBtn('設定を受信', 'peer-action-btn', () => {
              armReceiveSettings();
              closePeerOverlay();
            }));
            list.appendChild(createBtn('接続を切断', 'peer-action-btn danger', () => {
              disconnectPeer(true);
              closePeerOverlay();
            }));
          } else {
            list.appendChild(createBtn('Wi-Fiで通信', 'peer-action-btn', () => {
              closePeerOverlay();
              startWifiSearch();
            }));
            list.appendChild(createBtn('QRコードを表示', 'peer-action-btn', () => {
              rtcCreateHost().catch(() => {
                alert('QRコードの表示を開始できませんでした。');
              });
            }));
            list.appendChild(createBtn('QRコードを読み取り', 'peer-action-btn', () => {
              peerUiMode = 'rtc-join';
              renderPeerUi();
              openPeerOverlay();
            }));
            list.appendChild(createBtn('キャンセル', 'peer-action-btn', () => {
              closePeerOverlay();
            }));
          }

          wrap.appendChild(list);
          peerPanelBody.appendChild(wrap);
          return;
        }

        if (peerUiMode === 'rtc-host') {
          peerPanelTitle.textContent = 'QRコードを表示';
          const wrap = document.createElement('div');
          wrap.className = 'peer-section';

          const text = document.createElement('div');
          text.className = 'peer-text';
          text.textContent = '相手側にこのコードを読み取ってもらってください。読み取り後、返ってきたコードを下に貼り付けます。';
          wrap.appendChild(text);

          const label1 = document.createElement('div');
          label1.className = 'setting-label';
          label1.innerHTML = '<div class="main">表示コード</div><div class="sub">相手に渡す用</div>';
          wrap.appendChild(label1);

          const out = createTextarea(rtcOfferCode, true);
          out.style.minHeight = '120px';
          wrap.appendChild(out);

          const btnCopy = createBtn('コードをコピー', 'peer-action-btn', async () => {
            try {
              await navigator.clipboard.writeText(rtcOfferCode);
            } catch (_) {}
          });
          wrap.appendChild(btnCopy);

          const label2 = document.createElement('div');
          label2.className = 'setting-label';
          label2.style.marginTop = '8px';
          label2.innerHTML = '<div class="main">相手の返答</div><div class="sub">読み取り側から返ってきたコード</div>';
          wrap.appendChild(label2);

          const input = createTextarea(peerUiData.answerText || '', false);
          input.placeholder = '返答コードをここに貼り付け';
          input.style.minHeight = '120px';
          wrap.appendChild(input);

          const row = document.createElement('div');
          row.className = 'peer-list';
          row.appendChild(createBtn('接続する', 'peer-action-btn', async () => {
            try {
              await rtcSetRemoteAnswer(input.value);
              peerUiData.answerText = input.value;
              closePeerOverlay();
            } catch (_) {
              alert('返答コードが読み取れませんでした。');
            }
          }));
          row.appendChild(createBtn('キャンセル', 'peer-action-btn', () => {
            disconnectPeer(false);
            closePeerOverlay();
          }));
          wrap.appendChild(row);

          peerPanelBody.appendChild(wrap);
          return;
        }

        if (peerUiMode === 'rtc-join') {
          peerPanelTitle.textContent = 'QRコードを読み取り';
          const wrap = document.createElement('div');
          wrap.className = 'peer-section';

          const text = document.createElement('div');
          text.className = 'peer-text';

      function addTapEffect(x, y, broadcast = true) {
        effects.push({
          type: 'tap',
          x,
          y,
          start: nowMs(),
          duration: 650
        });

        if (broadcast && peerState === 'connected' && remotePeerId && settings.peerButtonVisible) {
          transportSend({
            type: 'effect',
            kind: 'tap',
            target: remotePeerId,
            payload: { x, y }
          });
        }
      }

      function createSwipeEffect(startX, startY, dirX, dirY, broadcast = true, forced = null) {
        const len = Math.hypot(dirX, dirY) || 1;
        dirX /= len;
        dirY /= len;

        const pad = 90;
        const minX = -pad;
        const minY = -pad;
        const maxX = w + pad;
        const maxY = h + pad;

        const hits = [];

        function pushCandidate(t, x, y) {
          if (x >= minX - 0.5 && x <= maxX + 0.5 && y >= minY - 0.5 && y <= maxY + 0.5) {
            hits.push({ t, x, y });
          }
        }

        if (forced && forced.forceFrom && forced.forceTo) {
          hits.push(
            { t: 0, x: forced.forceFrom.x, y: forced.forceFrom.y },
            { t: 1, x: forced.forceTo.x, y: forced.forceTo.y }
          );
        } else {
          if (Math.abs(dirX) > 1e-6) {
            let t = (minX - startX) / dirX;
            pushCandidate(t, minX, startY + dirY * t);
            t = (maxX - startX) / dirX;
            pushCandidate(t, maxX, startY + dirY * t);
          }

          if (Math.abs(dirY) > 1e-6) {
            let t = (minY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, minY);
            t = (maxY - startY) / dirY;
            pushCandidate(t, startX + dirX * t, maxY);
          }

          if (hits.length < 2) {
            hits.push(
              { t: -400, x: startX - dirX * 400, y: startY - dirY * 400 },
              { t: 400, x: startX + dirX * 400, y: startY + dirY * 400 }
            );
          } else {
            hits.sort((a, b) => a.t - b.t);
          }
        }

        const first = forced && forced.forceFrom ? forced.forceFrom : hits[0];
        const last = forced && forced.forceTo ? forced.forceTo : hits[hits.length - 1];
        const travel = distance(first.x, first.y, last.x, last.y);
        const duration = clamp(460 + travel * 0.12, 520, 900);

        const radius = typeof (forced && forced.forceRadius) === 'number'
          ? forced.forceRadius
          : clamp(Math.min(w, h) * 0.045, 18, 38);

        effects.push({
          type: 'swipe',
          start: nowMs(),
          duration,
          from: { x: first.x, y: first.y },
          to: { x: last.x, y: last.y },
          dir: { x: dirX, y: dirY },
          radius
        });

        if (broadcast && peerState === 'connected' && remotePeerId && settings.peerButtonVisible) {
          transportSend({
            type: 'effect',
            kind: 'swipe',
            target: remotePeerId,
            payload: {
              from: { x: first.x, y: first.y },
              to: { x: last.x, y: last.y },
              dir: { x: dirX, y: dirY },
              radius
            }
          });
        }
      }

      function createLoopEffect(points, broadcast = true) {
        if (points.length < 3) return;

        const copy = points.map(p => ({ x: p.x, y: p.y }));
        effects.push({
          type: 'loop',
          start: nowMs(),
          duration: 420,
          points: copy
        });

        if (broadcast && peerState === 'connected' && remotePeerId && settings.peerButtonVisible) {
          transportSend({
            type: 'effect',
            kind: 'loop',
            target: remotePeerId,
            payload: { points: copy }
          });
        }
      }

      function detectLoop(points, currentX, currentY) {
        if (points.length < LASSO_MIN_POINTS) return false;

        const n = points.length;
        const safeEnd = Math.max(0, n - 1 - LASSO_IGNORE_RECENT_SEGMENTS);

        for (let i = 0; i < safeEnd - 1; i++) {
          const a = points[i];
          const b = points[i + 1];
          const d = pointToSegmentDistance(currentX, currentY, a.x, a.y, b.x, b.y);
          if (d <= LASSO_HIT_RADIUS) {
            let traveled = 0;
            for (let k = i; k < n - 1; k++) {
              traveled += distance(points[k].x, points[k].y, points[k + 1].x, points[k + 1].y);
              if (traveled > 40) break;
            }
            if (traveled > 40) return true;
          }
        }

        return false;
      }

      function drawGrid() {
        if (!settings.gridEnabled) return;

        const baseColor = getGridBaseColor();
        const lineLow = hexToRgba(baseColor, 0.40) || (darkMode ? 'rgba(34,34,34,0.40)' : 'rgba(232,232,232,0.40)');
        const lineHigh = hexToRgba(baseColor, 0.56) || (darkMode ? 'rgba(58,58,58,0.56)' : 'rgba(210,210,210,0.56)');

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.lineWidth = 1;

        for (let x = 0; x <= w + settings.gridSpacing; x += settings.gridSpacing) {
          const isAccent = Math.round(x / settings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(Math.floor(x) + 0.5, 0);
          ctx.lineTo(Math.floor(x) + 0.5, h);
          ctx.stroke();
        }

        for (let y = 0; y <= h + settings.gridSpacing; y += settings.gridSpacing) {
          const isAccent = Math.round(y / settings.gridSpacing) % 4 === 0;
          ctx.strokeStyle = isAccent ? lineHigh : lineLow;
          ctx.beginPath();
          ctx.moveTo(0, Math.floor(y) + 0.5);
          ctx.lineTo(w, Math.floor(y) + 0.5);
          ctx.stroke();
        }

        ctx.restore();
      }

      function drawTap(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = easeOutCubic(p);
        const radius = lerp(10, Math.max(w, h) * 0.22, e);
        const alpha = 0.34 * Math.pow(1 - p, 1.7);
        const baseColor = getTapBaseColor();

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = radius * 0.22;
        ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(70, 255, 120, 0.55)';

        const g = ctx.createRadialGradient(effect.x, effect.y, 0, effect.x, effect.y, radius);
        g.addColorStop(0.00, hexToRgba(baseColor, 0.92) || 'rgba(70, 255, 120, 0.92)');
        g.addColorStop(0.28, hexToRgba(baseColor, 0.60) || 'rgba(60, 235, 110, 0.60)');
        g.addColorStop(0.68, hexToRgba(baseColor, 0.25) || 'rgba(50, 220, 100, 0.25)');
        g.addColorStop(1.00, hexToRgba(baseColor, 0.00) || 'rgba(50, 220, 100, 0)');

        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(effect.x, effect.y, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawSwipe(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;

        const e = easeOutCubic(p);
        const x = lerp(effect.from.x, effect.to.x, e);
        const y = lerp(effect.from.y, effect.to.y, e);

        const trailSteps = 16;
        const trailSpacing = effect.radius * 0.82;
        const baseColor = getSwipeBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';

        for (let i = trailSteps; i >= 0; i--) {
          const back = i * trailSpacing;
          const px = x - effect.dir.x * back;
          const py = y - effect.dir.y * back;
          const a = 0.24 * Math.pow(1 - i / (trailSteps + 1), 2.2) * Math.pow(1 - p, 0.35);
          if (a <= 0.001) continue;

          const r = effect.radius * (1 + (trailSteps - i) * 0.02);

          ctx.globalAlpha = a;
          ctx.shadowBlur = r * 0.35;
          ctx.shadowColor = hexToRgba(baseColor, 0.55) || 'rgba(90, 150, 255, 0.55)';
          ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 0.45 * Math.pow(1 - p, 0.7);
        ctx.shadowBlur = effect.radius * 0.6;
        ctx.shadowColor = hexToRgba(baseColor, 0.45) || 'rgba(110, 165, 255, 0.45)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(110, 165, 255, 1)';
        ctx.beginPath();
        ctx.arc(x, y, effect.radius * 1.02, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function drawLoop(effect, t) {
        const p = clamp((t - effect.start) / effect.duration, 0, 1);
        if (p >= 1) return;
        if (effect.points.length < 3) return;

        const alpha = 0.36 * Math.pow(1 - p, 2.0);
        const blur = 8 * Math.pow(1 - p, 0.55);
        const baseColor = getLoopBaseColor();

        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = blur;
        ctx.shadowColor = hexToRgba(baseColor, 0.40) || 'rgba(255, 60, 60, 0.40)';
        ctx.fillStyle = hexToRgba(baseColor, 1) || 'rgba(255, 78, 78, 1)';

        ctx.beginPath();
        ctx.moveTo(effect.points[0].x, effect.points[0].y);
        for (let i = 1; i < effect.points.length; i++) {
          ctx.lineTo(effect.points[i].x, effect.points[i].y);
        }
        ctx.closePath();
        ctx.fill('evenodd');

        ctx.restore();
      }

      function render() {
        const t = nowMs();

        ctx.fillStyle = getBgColor();
        ctx.fillRect(0, 0, w, h);

        drawGrid();

        for (let i = 0; i < effects.length; i++) {
          const effect = effects[i];
          if (effect.type === 'tap') drawTap(effect, t);
          else if (effect.type === 'swipe') drawSwipe(effect, t);
          else if (effect.type === 'loop') drawLoop(effect, t);
        }

        for (let i = effects.length - 1; i >= 0; i--) {
          if (t - effects[i].start >= effects[i].duration) effects.splice(i, 1);
        }

        requestAnimationFrame(render);
      }

      function getPoint(e) {
        return { x: e.clientX, y: e.clientY };

      canvas.addEventListener('pointerdown', (e) => {
        if (overlay.classList.contains('open') || peerOverlay.classList.contains('open')) return;
        if (activePointerId !== null) return;

        activePointerId = e.pointerId;
        canvas.setPointerCapture(activePointerId);

        const p = getPoint(e);
        pointerDownTime = nowMs();
        pointerDownPos = { x: p.x, y: p.y };
        lastPos = { x: p.x, y: p.y };
        strokePoints = [p];
        pointerHadLoop = false;

        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const t = nowMs();

        if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
          strokePoints.push(p);
          lastPos = p;
        }

        if (t - lastLoopAt >= LASSO_COOLDOWN) {
          if (detectLoop(strokePoints, p.x, p.y)) {
            createLoopEffect(strokePoints);
            lastLoopAt = t;
            pointerHadLoop = true;
            strokePoints = [p];
          }
        }

        e.preventDefault();
      }, { passive: false });

      function finishPointer(e) {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const elapsed = nowMs() - pointerDownTime;
        const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

        if (!pointerHadLoop) {
          if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
            addTapEffect(p.x, p.y);
          } else if (totalMove >= SWIPE_MIN_DISTANCE) {
            const dx = p.x - pointerDownPos.x;
            const dy = p.y - pointerDownPos.y;
            createSwipeEffect(p.x, p.y, dx, dy);
          }
        }

        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;

        e.preventDefault();
      }

      canvas.addEventListener('pointerup', finishPointer, { passive: false });
      canvas.addEventListener('pointercancel', finishPointer, { passive: false });
      canvas.addEventListener('lostpointercapture', () => {
        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;
      });

          section.appendChild(label2);

          const out = createTextarea(rtcAnswerCode, true);
          out.style.minHeight = '120px';
          section.appendChild(out);

          section.appendChild(createBtn('コードをコピー', 'peer-action-btn', async () => {
            try {
              await navigator.clipboard.writeText(rtcAnswerCode);
            } catch (_) {}
          }));
        }

        peerPanelBody.appendChild(section);
      }

      function renderPeerUi() {
        peerPanelBody.innerHTML = '';
        if (peerUiMode === 'rtc-host') renderRtcHost();
        else if (peerUiMode === 'rtc-join') renderRtcJoin();
        else renderPeerMenu();
      }

      function openPeerChooserIfNeeded() {
        if (!settings.peerButtonVisible) return;
        if (peerState === 'searching') {
          if (peerMode === 'rtc') {
            disconnectPeer(false);
          } else {
            disconnectPeer(true);
          }
          closePeerOverlay();
          return;
        }
        if (peerState === 'connected') {
          peerUiMode = 'menu';
          renderPeerUi();
          openPeerOverlay();
          return;
        }
        peerUiMode = 'menu';
        renderPeerUi();
        openPeerOverlay();
      }

      function getBgColor() {
        return resolveModeColor(settings.bgMode, settings.bgCustom, '#ffffff', '#000000');
      }

      function getGridBaseColor() {
        return resolveModeColor(
          settings.gridMode,
          settings.gridCustom,
          darkMode ? '#262626' : '#e8e8e8',
          darkMode ? '#262626' : '#e8e8e8'
        );
      }

      function getTapBaseColor() {
        return normalizeHexColor(settings.tapColor) || defaults.tapColor;
      }

      function getSwipeBaseColor() {
        return normalizeHexColor(settings.swipeColor) || defaults.swipeColor;
      }

      function getLoopBaseColor() {
        return normalizeHexColor(settings.loopColor) || defaults.loopColor;
      }

      function startWifiSearch() {
        if (!settings.peerButtonVisible) return;
        disconnectRtc();
        peerMode = 'broadcast';
        peerLastSeenAt = Date.now();
        setPeerState('searching', null);
        startPeerTimers();
        transportSend({ type: 'search' });
        updatePeerButtonUi();
      }

      function connectOverRtc() {
        peerMode = 'rtc';
        peerLastSeenAt = Date.now();
        setPeerState('searching', null);
        startPeerTimers();
        updatePeerButtonUi();
      }

      function waitIceComplete(pc) {
        return new Promise((resolve) => {
          if (pc.iceGatheringState === 'complete') {
            resolve();
            return;
          }
          const onState = () => {
            if (pc.iceGatheringState === 'complete') {
              pc.removeEventListener('icegatheringstatechange', onState);
              resolve();
            }
          };
          pc.addEventListener('icegatheringstatechange', onState);
          setTimeout(() => {
            try { pc.removeEventListener('icegatheringstatechange', onState); } catch (_) {}
            resolve();
          }, 2200);
        });
      }

      async function rtcCreateHost() {
        disconnectRtc();
        connectOverRtc();
        rtcKind = 'host';
        rtcPc = new RTCPeerConnection({ iceServers: [] });

        rtcDc = rtcPc.createDataChannel('touch');

        rtcDc.onopen = () => {
          connectPeer(remotePeerId || 'rtc', 'rtc');
          closePeerOverlay();
        };

        rtcDc.onmessage = (ev) => {
          try {
            handlePeerPacket(JSON.parse(ev.data));
          } catch (_) {}
        };

        rtcDc.onclose = () => {
          if (peerState !== 'off') disconnectPeer(false);
        };

        rtcPc.onconnectionstatechange = () => {
          if (rtcPc && (rtcPc.connectionState === 'disconnected' || rtcPc.connectionState === 'failed' || rtcPc.connectionState === 'closed')) {
            if (peerState !== 'off') disconnectPeer(false);
          }
        };

        const offer = await rtcPc.createOffer();
        await rtcPc.setLocalDescription(offer);
        await waitIceComplete(rtcPc);

        rtcOfferCode = encodePacket(rtcPc.localDescription);
        rtcAnswerCode = '';
        peerUiMode = 'rtc-host';
        renderPeerUi();
        openPeerOverlay();
      }

      async function rtcApplyHostOffer(text) {
        disconnectRtc();
        connectOverRtc();
        rtcKind = 'join';
        rtcPc = new RTCPeerConnection({ iceServers: [] });

        rtcPc.ondatachannel = (ev) => {
          rtcDc = ev.channel;

          rtcDc.onopen = () => {
            connectPeer(remotePeerId || 'rtc', 'rtc');
            closePeerOverlay();
          };

          rtcDc.onmessage = (msg) => {
            try {
              handlePeerPacket(JSON.parse(msg.data));
            } catch (_) {}
          };

          rtcDc.onclose = () => {
            if (peerState !== 'off') disconnectPeer(false);
          };
        };

        rtcPc.onconnectionstatechange = () => {
          if (rtcPc && (rtcPc.connectionState === 'disconnected' || rtcPc.connectionState === 'failed' || rtcPc.connectionState === 'closed')) {
            if (peerState !== 'off') disconnectPeer(false);
          }
        };

        const offerDesc = decodePacket(text);
        await rtcPc.setRemoteDescription(offerDesc);
        const answer = await rtcPc.createAnswer();
        await rtcPc.setLocalDescription(answer);
        await waitIceComplete(rtcPc);

        rtcAnswerCode = encodePacket(rtcPc.localDescription);
        rtcOfferCode = String(text).trim();
        peerUiMode = 'rtc-join';
        renderPeerUi();
        openPeerOverlay();
      }

      async function rtcSetRemoteAnswer(text) {
        if (!rtcPc) return;
        const answerDesc = decodePacket(text);
        await rtcPc.setRemoteDescription(answerDesc);
      }

      function clearSettingsShare() {
        if (settingsShareTimer) {
          clearInterval(settingsShareTimer);
          settingsShareTimer = null;
        }
        settingsShareUntil = 0;
      }

      function startSettingsShare() {
        if (peerState !== 'connected') return;
        receivedThisWindow = false;
        settingsShareUntil = Date.now() + 10000;

        const sendOnce = () => {
          if (Date.now() > settingsShareUntil) {
            clearSettingsShare();
            return;
          }
          transportSend({
            type: 'settings-sync',
            target: remotePeerId,
            payload: {
              settings: {
                bgMode: settings.bgMode,
                bgCustom: settings.bgCustom,
                tapColor: settings.tapColor,
                swipeColor: settings.swipeColor,
                loopColor: settings.loopColor,
                gridEnabled: settings.gridEnabled,
                gridMode: settings.gridMode,
                gridCustom: settings.gridCustom,
                gridSpacing: settings.gridSpacing,
                peerButtonVisible: settings.peerButtonVisible
              }
            }
          });
        };

        sendOnce();
        clearSettingsShare();
        settingsShareTimer = setInterval(sendOnce, 1000);
      }

      function armReceiveSettings() {
        if (peerState !== 'connected') return;
        receivedThisWindow = false;
        receiveArmedUntil = Date.now() + 10000;
      }

      function clearReceiveArm() {
        receiveArmedUntil = 0;
        receivedThisWindow = false;
      }

      function createBtn(label, cls, onClick) {
        const btn = document.createElement('button');
        btn.className = cls;
        btn.type = 'button';
        btn.textContent = label;
        btn.addEventListener('click', onClick);
        return btn;
      }

      function createTextarea(value, readonly) {
        const ta = document.createElement('textarea');
        ta.className = 'peer-box';
        ta.value = value || '';
        if (readonly) ta.readOnly = true;
        return ta;
      }

      function updatePeerModalFromState() {
        if (!peerOverlay.classList.contains('open')) return;
        renderPeerUi();
      }

      bgMode.addEventListener('change', () => {
        settings.bgMode = bgMode.value;
        bgCustomWrap.classList.toggle('hidden', settings.bgMode !== 'custom');
        applyAndSave();
      });

      bgCustomInput.addEventListener('input', () => {
        settings.bgCustom = bgCustomInput.value.trim();
        applyAndSave();
      });

      tapColorInput.addEventListener('input', () => {
        settings.tapColor = tapColorInput.value.trim();
        saveSettings();
      });

      swipeColorInput.addEventListener('input', () => {
        settings.swipeColor = swipeColorInput.value.trim();
        saveSettings();
      });

      loopColorInput.addEventListener('input', () => {
        settings.loopColor = loopColorInput.value.trim();
        saveSettings();
      });

      gridToggle.addEventListener('change', () => {
        settings.gridEnabled = gridToggle.checked;
        gridDetails.classList.toggle('disabled', !settings.gridEnabled);
        saveSettings();
      });

      gridMode.addEventListener('change', () => {
        settings.gridMode = gridMode.value;
        gridCustomWrap.classList.toggle('hidden', settings.gridMode !== 'custom');
        saveSettings();
      });

      gridCustomInput.addEventListener('input', () => {
        settings.gridCustom = gridCustomInput.value.trim();
        saveSettings();
      });

      spacingRange.addEventListener('input', () => {
        settings.gridSpacing = clamp(Number(spacingRange.value) || 36, 18, 100);
        spacingValue.textContent = String(settings.gridSpacing);
        saveSettings();
      });

      peerButtonToggle.addEventListener('change', () => {
        settings.peerButtonVisible = peerButtonToggle.checked;
        if (!settings.peerButtonVisible) disconnectPeer(false);
        updatePeerButtonUi();
        saveSettings();
      });

      resetSettings.addEventListener('click', () => {
        resetAllSettings();
      });

      openSettings.addEventListener('click', () => {
        openOverlay();
      });

      closeSettings.addEventListener('click', () => {
        closeOverlay();
      });

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeOverlay();
      });

      closePeerPanel.addEventListener('click', () => {
        closePeerOverlay();
      });

      peerOverlay.addEventListener('click', (e) => {
        if (e.target === peerOverlay) closePeerOverlay();
      });

      peerButton.addEventListener('click', () => {
        if (!settings.peerButtonVisible) return;
        if (peerState === 'searching') {
          if (peerMode === 'rtc') {
            disconnectPeer(false);
          } else {
            disconnectPeer(true);
          }
          closePeerOverlay();
          return;
        }
        openPeerChooserIfNeeded();
      });

      canvas.addEventListener('pointerdown', (e) => {
        if (overlay.classList.contains('open') || peerOverlay.classList.contains('open')) return;
        if (activePointerId !== null) return;

        activePointerId = e.pointerId;
        canvas.setPointerCapture(activePointerId);

        const p = getPoint(e);
        pointerDownTime = nowMs();
        pointerDownPos = { x: p.x, y: p.y };
        lastPos = { x: p.x, y: p.y };
        strokePoints = [p];
        pointerHadLoop = false;

        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('pointermove', (e) => {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const t = nowMs();

        if (distance(p.x, p.y, lastPos.x, lastPos.y) >= 2.2) {
          strokePoints.push(p);
          lastPos = p;
        }

        if (t - lastLoopAt >= LASSO_COOLDOWN) {
          if (detectLoop(strokePoints, p.x, p.y)) {
            createLoopEffect(strokePoints);
            lastLoopAt = t;
            pointerHadLoop = true;
            strokePoints = [p];
          }
        }

        e.preventDefault();
      }, { passive: false });

      function finishPointer(e) {
        if (activePointerId !== e.pointerId) return;

        const p = getPoint(e);
        const elapsed = nowMs() - pointerDownTime;
        const totalMove = distance(pointerDownPos.x, pointerDownPos.y, p.x, p.y);

        if (!pointerHadLoop) {
          if (totalMove <= TAP_MAX_DISTANCE && elapsed <= TAP_MAX_TIME) {
            addTapEffect(p.x, p.y);
          } else if (totalMove >= SWIPE_MIN_DISTANCE) {
            const dx = p.x - pointerDownPos.x;
            const dy = p.y - pointerDownPos.y;
            createSwipeEffect(p.x, p.y, dx, dy);
          }
        }

        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;

        e.preventDefault();
      }

      canvas.addEventListener('pointerup', finishPointer, { passive: false });
      canvas.addEventListener('pointercancel', finishPointer, { passive: false });
      canvas.addEventListener('lostpointercapture', () => {
        activePointerId = null;
        strokePoints = [];
        pointerHadLoop = false;
      });

      const darkMql = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

      loadSettings();
      updateTheme();
      resize();
      syncSettingsUi();
      document.body.style.background = getBgColor();
      updatePeerButtonUi();
      setupBroadcastTransport();

      if (darkMql) {
        if (typeof darkMql.addEventListener === 'function') {
          darkMql.addEventListener('change', updateTheme);
        } else if (typeof darkMql.addListener === 'function') {
          darkMql.addListener(updateTheme);
        }
      }

      window.addEventListener('resize', () => {
        resize();
      });

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
