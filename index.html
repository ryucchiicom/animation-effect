<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Touch Effects</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      background: #fff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #000;
      }
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    (() => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');

      let dpr = Math.max(1, window.devicePixelRatio || 1);
      let w = 0;
      let h = 0;

      function resize() {
        dpr = Math.max(1, window.devicePixelRatio || 1);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();

      const bgColor = () => matchMedia('(prefers-color-scheme: dark)').matches ? '#000000' : '#ffffff';

      const pulses = [];
      const swipes = [];
      const fills = [];
      const gestures = new Map();

      function now() {
        return performance.now();
      }

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function dist(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function segmentIntersection(p1, p2, p3, p4) {
        const x1 = p1.x, y1 = p1.y;
        const x2 = p2.x, y2 = p2.y;
        const x3 = p3.x, y3 = p3.y;
        const x4 = p4.x, y4 = p4.y;

        const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
        if (den === 0) return null;

        const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / den;
        const u = ((x1 - x3) * (y1 - y2) - (y1 - y3) * (x1 - x2)) / den;

        if (t < 0 || t > 1 || u < 0 || u > 1) return null;

        return {
          x: x1 + t * (x2 - x1),
          y: y1 + t * (y2 - y1)
        };
      }

      function pointInPolygon(point, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
          const xi = polygon[i].x, yi = polygon[i].y;
          const xj = polygon[j].x, yj = polygon[j].y;
          const intersect = ((yi > point.y) !== (yj > point.y)) &&
            (point.x < (xj - xi) * (point.y - yi) / ((yj - yi) || 1e-9) + xi);
          if (intersect) inside = !inside;
        }
        return inside;
      }

      function centroid(points) {
        let x = 0;
        let y = 0;
        for (const p of points) {
          x += p.x;
          y += p.y;
        }
        return { x: x / points.length, y: y / points.length };
      }

      function closeLoop(points) {
        if (points.length < 4) return null;

        const clean = [];
        for (const p of points) {
          if (!clean.length || dist(clean[clean.length - 1], p) > 2) clean.push({ x: p.x, y: p.y });
        }

        if (clean.length < 4) return null;

        const last = clean[clean.length - 1];
        for (let i = 0; i < clean.length - 3; i++) {
          const a = clean[i];
          const b = clean[i + 1];
          const hit = segmentIntersection(clean[clean.length - 2], last, a, b);
          if (hit) {
            const loop = clean.slice(i + 1);
            loop.push({ x: hit.x, y: hit.y });
            if (loop.length >= 3) return loop;
          }
        }

        const first = clean[0];
        if (dist(last, first) < 22) {
          return clean.slice();
        }

        return null;
      }

      function addPulse(x, y) {
        pulses.push({
          x, y,
          start: now(),
          duration: 750
        });
      }

      function addSwipe(startX, startY, endX, endY) {
        const dx = endX - startX;
        const dy = endY - startY;
        const len = Math.hypot(dx, dy);
        if (len < 16) return;

        const ux = dx / len;
        const uy = dy / len;

        const radius = Math.max(18, Math.min(40, Math.min(w, h) * 0.03));
        const fromLeft = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? -radius * 2 : w + radius * 2) : startX;
        const fromTop = Math.abs(dx) > Math.abs(dy) ? startY : (dy > 0 ? -radius * 2 : h + radius * 2);

        const toLeft = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? w + radius * 2 : -radius * 2) : endX;
        const toTop = Math.abs(dx) > Math.abs(dy) ? endY : (dy > 0 ? h + radius * 2 : -radius * 2);

        const travel = Math.hypot(toLeft - fromLeft, toTop - fromTop);
        const speed = 0.9; // px per ms

        swipes.push({
          x: fromLeft,
          y: fromTop,
          vx: (toLeft - fromLeft) / (travel / speed || 1),
          vy: (toTop - fromTop) / (travel / speed || 1),
          radius,
          start: now(),
          duration: Math.max(500, travel / speed),
          trail: [],
          hue: 210
        });
      }

      function addFill(loopPoints) {
        fills.push({
          points: loopPoints.map(p => ({ x: p.x, y: p.y })),
          start: now(),
          duration: 520
        });
      }

      function handlePointerDown(e) {
        canvas.setPointerCapture?.(e.pointerId);
        gestures.set(e.pointerId, {
          id: e.pointerId,
          downX: e.clientX,
          downY: e.clientY,
          lastX: e.clientX,
          lastY: e.clientY,
          points: [{ x: e.clientX, y: e.clientY }],
          moved: false,
          closed: false,
          downTime: now()
        });
      }

      function handlePointerMove(e) {
        const g = gestures.get(e.pointerId);
        if (!g) return;

        const x = e.clientX;
        const y = e.clientY;
        const moved = Math.hypot(x - g.downX, y - g.downY);

        if (moved > 6) g.moved = true;

        if (g.moved) {
          const last = g.points[g.points.length - 1];
          if (!last || Math.hypot(x - last.x, y - last.y) >= 3) {
            const prev = g.points[g.points.length - 1];
            g.points.push({ x, y });

            if (g.points.length >= 4 && !g.closed) {
              const loop = closeLoop(g.points);
              if (loop) {
                g.closed = true;
                addFill(loop);
              }
            }
          }
        }

        g.lastX = x;
        g.lastY = y;
      }

      function handlePointerUp(e) {
        const g = gestures.get(e.pointerId);
        if (!g) return;

        const upX = e.clientX;
        const upY = e.clientY;
        const moved = Math.hypot(upX - g.downX, upY - g.downY);

        if (!g.moved && moved < 8) {
          addPulse(upX, upY);
        } else {
          addSwipe(g.downX, g.downY, upX, upY);
          if (!g.closed) {
            const loop = closeLoop(g.points);
            if (loop) addFill(loop);
          }
        }

        gestures.delete(e.pointerId);
      }

      canvas.addEventListener('pointerdown', handlePointerDown, { passive: false });
      canvas.addEventListener('pointermove', handlePointerMove, { passive: false });
      canvas.addEventListener('pointerup', handlePointerUp, { passive: false });
      canvas.addEventListener('pointercancel', handlePointerUp, { passive: false });

      function drawBackground() {
        ctx.fillStyle = bgColor();
        ctx.fillRect(0, 0, w, h);
      }

      function drawPulses(t) {
        for (let i = pulses.length - 1; i >= 0; i--) {
          const p = pulses[i];
          const u = (t - p.start) / p.duration;
          if (u >= 1) {
            pulses.splice(i, 1);
            continue;
          }
          const ease = 1 - Math.pow(1 - u, 3);
          const r = lerp(6, Math.max(w, h) * 0.16, ease);
          const a = 0.28 * (1 - u);
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 255, 0, ${a})`;
          ctx.fill();
          ctx.restore();
        }
      }

      function drawSwipes(t) {
        for (let i = swipes.length - 1; i >= 0; i--) {
          const s = swipes[i];
          const u = (t - s.start) / s.duration;
          if (u >= 1.05) {
            swipes.splice(i, 1);
            continue;
          }

          const dt = Math.min(24, Math.max(0, t - (s._lastT || s.start)));
          s._lastT = t;
          s.x += s.vx * dt;
          s.y += s.vy * dt;

          s.trail.push({ x: s.x, y: s.y, a: 1 });
          if (s.trail.length > 28) s.trail.shift();

          for (let j = 0; j < s.trail.length; j++) {
            const tr = s.trail[j];
            tr.a *= 0.94;
          }

          ctx.save();
          for (let j = 0; j < s.trail.length; j++) {
            const tr = s.trail[j];
            const alpha = 0.24 * (j / s.trail.length) * tr.a;
            const rr = s.radius * (0.88 + 0.16 * (j / s.trail.length));
            ctx.beginPath();
            ctx.arc(tr.x, tr.y, rr, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 150, 255, ${alpha})`;
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 150, 255, ${0.45 * (1 - u)})`;
          ctx.fill();
          ctx.restore();
        }
      }

      function drawFills(t) {
        for (let i = fills.length - 1; i >= 0; i--) {
          const f = fills[i];
          const u = (t - f.start) / f.duration;
          if (u >= 1) {
            fills.splice(i, 1);
            continue;
          }

          const alpha = 0.34 * (1 - Math.pow(u, 0.65));
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(f.points[0].x, f.points[0].y);
          for (let j = 1; j < f.points.length; j++) {
            ctx.lineTo(f.points[j].x, f.points[j].y);
          }
          ctx.closePath();
          ctx.fillStyle = `rgba(255, 0, 0, ${alpha})`;
          ctx.fill();
          ctx.restore();
        }
      }

      function drawActiveGestures() {
        ctx.save();
        ctx.lineWidth = 14;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.0)';
        for (const g of gestures.values()) {
          if (g.points.length < 2) continue;
          ctx.beginPath();
          ctx.moveTo(g.points[0].x, g.points[0].y);
          for (let i = 1; i < g.points.length; i++) {
            ctx.lineTo(g.points[i].x, g.points[i].y);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function frame() {
        const t = now();
        drawBackground();
        drawFills(t);
        drawPulses(t);
        drawSwipes(t);
        drawActiveGestures();
        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
